<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F4F6">
<title>요트면허 항해일지</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="항해일지">
<style>
:root{
  --bg:#F2F4F6; --card:#FFFFFF; --ink:#191F28; --ink2:#4E5968; --ink3:#8B95A1;
  --line:#EAEDF0; --blue:#1C6FF3; --blue-soft:#E8F1FE;
  --ok:#00B050; --ok-soft:#E6F7EE; --no:#F04452; --no-soft:#FDECEE;
  --gold:#F5A623; --gold-soft:#FFF4E0;
  --font:"Pretendard","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;
  letter-spacing:-.02em;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:20;background:rgba(242,244,246,.93);backdrop-filter:blur(10px)}
.top .wrap{display:flex;align-items:center;gap:8px;height:56px}
.top .t{font-size:17px;font-weight:700}
.top .spacer{flex:1}
.pill{background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink2)}
.card{background:var(--card);border-radius:20px;padding:20px;margin:12px 0}
.card.tight{padding:16px}
h2{margin:0 0 2px;font-size:17px;font-weight:700}
.sub{color:var(--ink3);font-size:13px;margin:0}
.big{font-size:34px;font-weight:800;letter-spacing:-.04em;line-height:1.1;font-variant-numeric:tabular-nums}
.big em{font-style:normal;font-size:17px;font-weight:700;color:var(--ink3);margin-left:4px}
.btn{display:block;width:100%;border-radius:16px;padding:16px;font-size:16px;font-weight:700;background:var(--blue);color:#fff;text-align:center}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.soft{background:var(--blue-soft);color:var(--blue)}
.btn.sm{padding:12px;font-size:14px;border-radius:13px}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px}
.row>*{flex:1}
.stats{display:flex;gap:8px;margin:12px 0}
.stats .s{flex:1;background:var(--card);border-radius:16px;padding:14px}
.stats .s b{display:block;font-size:20px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stats .s span{font-size:12px;color:var(--ink3)}
.xpbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:12px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#1C6FF3,#5AA9FF);border-radius:99px;transition:width .5s}
.goalring{display:flex;align-items:center;gap:16px}
.goalring .txt{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{background:var(--bg);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chap{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:13px 0;border-top:1px solid var(--line)}
.chap:first-child{border-top:0}
.chap .ic{flex:none;width:42px;height:42px;border-radius:14px;background:var(--bg);display:grid;place-items:center;font-size:20px}
.chap .nm{flex:1;min-width:0}
.chap .nm b{display:block;font-size:15px;font-weight:700}
.chap .nm span{font-size:12px;color:var(--ink3)}
.chap .st{font-size:12px;color:var(--ink3);text-align:right;font-variant-numeric:tabular-nums}
.bar{display:block;height:5px;border-radius:99px;background:var(--line);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.bar.done i{background:var(--ok)}
.qmeta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3);margin-bottom:12px;flex-wrap:wrap}
.qno{font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.tag{background:var(--bg);border-radius:7px;padding:3px 8px;font-weight:600}
.tag.new{background:var(--blue-soft);color:var(--blue)}
.tag.chg{background:var(--gold-soft);color:#B8770E}
.qtext{font-size:18px;font-weight:700;line-height:1.5;white-space:pre-wrap;margin:0 0 16px;letter-spacing:-.03em}
.opt{display:flex;gap:11px;width:100%;text-align:left;background:var(--card);border-radius:16px;padding:15px;margin-bottom:9px;
  line-height:1.5;box-shadow:inset 0 0 0 1.5px var(--line);transition:transform .12s,box-shadow .12s}
.opt:active{transform:scale(.99)}
.opt .mk{flex:none;width:26px;height:26px;border-radius:9px;background:var(--bg);color:var(--ink2);font-size:13px;
  font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.opt .tx{flex:1;white-space:pre-wrap}
.opt[data-s="sel"]{box-shadow:inset 0 0 0 2px var(--blue)}
.opt[data-s="sel"] .mk{background:var(--blue);color:#fff}
.opt[data-s="ok"]{box-shadow:inset 0 0 0 2px var(--ok);background:var(--ok-soft)}
.opt[data-s="ok"] .mk{background:var(--ok);color:#fff}
.opt[data-s="no"]{box-shadow:inset 0 0 0 2px var(--no);background:var(--no-soft)}
.opt[data-s="no"] .mk{background:var(--no);color:#fff}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.03)}100%{transform:scale(1)}}
.pop{animation:pop .32s ease}
.verdict{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;margin:16px 0 8px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--no)}
.verdict .xp{margin-left:auto;font-size:13px;font-weight:700;color:var(--blue);background:var(--blue-soft);border-radius:99px;padding:3px 10px}
.expl{background:var(--bg);border-radius:14px;padding:14px;font-size:14px;color:var(--ink2);white-space:pre-wrap}
.aihead{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink3);margin:14px 0 7px;font-weight:600}
.spin{width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sbar{position:sticky;top:56px;z-index:15;background:var(--bg);padding:6px 0 10px}
.sbar .line{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);font-weight:600}
.sbar .prog{height:6px;background:var(--line);border-radius:99px;margin-top:8px;overflow:hidden}
.sbar .prog i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .3s}
.combo{background:var(--gold-soft);color:#B8770E;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800}
.clock{font-variant-numeric:tabular-nums;font-weight:700}
.clock.warn{color:var(--no)}
.omr{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:12px}
.omr button{aspect-ratio:1;background:var(--bg);border-radius:9px;font-size:12px;font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums}
.omr button.done{background:var(--ink);color:#fff}
.omr button.cur{box-shadow:0 0 0 2px var(--blue)}
.score{text-align:center;padding:26px 16px}
.score .n{font-size:56px;font-weight:800;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.score .st{display:inline-block;margin-top:12px;padding:7px 16px;border-radius:999px;font-weight:800;font-size:15px}
.pass{background:var(--ok-soft);color:var(--ok)} .fail{background:var(--no-soft);color:var(--no)}
.rev{border-top:1px solid var(--line);padding:15px 0}
.rev:first-child{border-top:0}
.rev .h{display:flex;gap:7px;font-size:12px;color:var(--ink3);margin-bottom:5px;font-weight:600}
.rev .q{font-weight:700;font-size:14px;white-space:pre-wrap}
.rev .a{font-size:13px;color:var(--ink2);margin-top:7px}
.rev .a b{color:var(--ok);font-weight:700}
.rev .a s{color:var(--no)}
.days{display:flex;align-items:flex-end;gap:7px;height:92px;margin-top:14px}
.days .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.days .d i{display:block;width:100%;background:var(--blue);border-radius:7px}
.days .d i.zero{background:var(--line)}
.days .d span{font-size:11px;color:var(--ink3)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.badge{background:var(--bg);border-radius:16px;padding:14px 8px;text-align:center}
.badge .e{font-size:24px;filter:grayscale(1);opacity:.35}
.badge.on{background:var(--gold-soft)}
.badge.on .e{filter:none;opacity:1}
.badge b{display:block;font-size:12px;font-weight:700;margin-top:5px}
.badge span{font-size:11px;color:var(--ink3)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:flex;padding:0 4px}
.nav button{flex:1;padding:9px 0 11px;color:var(--ink3);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="true"]{color:var(--blue)}
.empty{text-align:center;color:var(--ink3);font-size:14px;padding:40px 10px}
input[type=search],textarea{width:100%;font:inherit;padding:13px;border:0;border-radius:14px;background:var(--bg);color:var(--ink);resize:vertical}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);z-index:50;background:var(--ink);color:#fff;
  padding:12px 18px;border-radius:14px;font-size:14px;font-weight:700;opacity:0;transition:.28s;pointer-events:none;max-width:90%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="t" id="topTitle">항해일지</div><div class="spacer"></div>
  <div class="pill" id="topPill"></div>
  <button class="pill" id="quitBtn" hidden>나가기</button>
</div></header>
<main id="main" class="wrap"></main>
<div class="toast" id="toast"></div>
<nav class="nav"><div class="wrap">
  <button data-tab="home" aria-current="true"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v9h14v-9"/></svg>홈</button>
  <button data-tab="chap"><svg viewBox="0 0 24 24"><path d="M4 4h7v16H4z"/><path d="M13 4h7v16h-7z"/></svg>챕터</button>
  <button data-tab="exam"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>모의고사</button>
  <button data-tab="note"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>오답</button>
  <button data-tab="log"><svg viewBox="0 0 24 24"><path d="M4 19V9"/><path d="M10 19V5"/><path d="M16 19v-7"/><path d="M21 19H3"/></svg>기록</button>
</div></nav>

<script>
const Q = [{"i":1,"q":"해양에서 ‘해류’의 방향은 어떤 요소에 가장 크게 영향을 받는가?","o":["해저 지형","바람","수심","해양 생물"],"a":1,"e":"해저 지형이나 수심은 해류에 영향을 줄 수 있지만, 방향을 결정하는데 가장 큰 영향은 주는 것은 바람이다.","c":"항해·해도","t":"new","x":"해류는 바다 표면을 지속적으로 스치는 바람이 물을 끌고 가면서 생기는 흐름이 대부분이라, 방향을 결정하는 가장 큰 요인은 바람입니다. 무역풍과 편서풍 같은 대기 대순환이 대양의 순환 방향을 정하는 것도 같은 이유입니다. 해저 지형과 수심은 흐름의 세기와 국지적인 방향을 바꿀 수는 있지만 큰 틀의 방향을 정하지는 못합니다."},{"i":2,"q":"해양기상에서 ‘기압계’는 무엇을 측정하는 기기인가?","o":["대기풍향","대기기온","대기압력","대기습도"],"a":2,"e":"기압계는 기압(대기의 압력)을 측정하는 기본 기상 장비이다.","c":"기상·해양","t":"new","x":"기압계는 공기가 누르는 힘, 즉 대기압을 재는 장비로 단위는 헥토파스칼(hPa)을 씁니다. 표준 대기압은 1013hPa이며, 이 값보다 낮으면 저기압, 높으면 고기압으로 봅니다. 기압이 빠르게 떨어지면 저기압이 다가오고 있다는 뜻이라 날씨가 나빠질 신호로 읽습니다. 그래서 요트에서는 기압계 눈금 자체보다 '변화 추세'를 보는 것이 중요합니다."},{"i":3,"q":"조고와 간출암의 높이는 어느 것을 기준으로 측정하는가?","o":["평균해면","평균저조면","약최저저조면","약최고고조면"],"a":2,"e":"약최저저조면은 연중 해면이 그 이상으로 낮아지는 일이 거의 없다고 생각되는 수면, 해도의 수심은 이 수면을 기준으로 한 것이며 조고와 간출암의 높이도 이 수면을 기준으로 측정한 것이다.","c":"항해·해도","x":"약최저저조면은 연중 해면이 그보다 더 낮아지는 일이 거의 없다고 보는 면으로, 우리나라 해도의 수심 기준면입니다. 조고와 간출암의 높이도 같은 면을 기준으로 재기 때문에, 조석표의 조고를 해도 수심에 더하면 그 시각의 실제 수심이 나옵니다. 반대로 등대나 다리의 높이는 약최고고조면을 기준으로 잰다는 점이 대비 포인트입니다."},{"i":4,"q":"해양기상에서 ‘습도’가 높을수록 나타나기 쉬운 현상은?","o":["맑은 날씨","안개 발생","기온 상승","바람 강화"],"a":1,"e":"습도가 높으면 공기가 포화되어 안개가 발생하기 쉽다.","c":"기상·해양","t":"new","x":"습도가 높다는 것은 공기가 이미 수증기를 많이 머금어 포화에 가까워졌다는 뜻입니다. 이 상태에서 기온이 조금만 내려가 이슬점에 닿으면 수증기가 물방울로 맺혀 안개가 생깁니다. 해상에서는 따뜻하고 습한 공기가 찬 해면 위로 흘러들 때 이류무(해무)가 잘 발생합니다. 습도 상승은 맑음이나 기온 상승이 아니라 시정 악화의 신호로 읽어야 합니다."},{"i":5,"q":"기상이 나빠질 것을 미리 알 수 있는 방법으로 가장 옳지 않는 것은?","o":["뭉게구름이 나타날 때","기온이 낮아질 때","기압 내려갈 때","급작스럽게 소나기가 때때로 닥쳐올 때"],"a":0,"e":"뭉게구름(적운)은 날씨가 좋을 때 생기는 구름이다.","c":"기상·해양","x":"뭉게구름(적운)은 대기가 안정된 맑은 날 상승기류로 생기는 구름이라 날씨가 좋다는 표시입니다. 반대로 날씨가 나빠지는 징후는 기압이 뚜렷하게 내려갈 때, 기온이 갑자기 변할 때, 소나기가 간헐적으로 닥칠 때입니다. 다만 적운이 수직으로 크게 발달해 적란운이 되면 돌풍과 뇌우를 동반하므로, 구름이 '부풀어 오르는지'까지 보아야 합니다."},{"i":6,"q":"다음 중 해양의 ‘표층수’가 일반적으로 갖는 특징으로 가장 적절한 것은?","o":["태양 복사로 인해 수온이 높고, 강수로 인해 염분이 낮다.","태양 복사로 인해 수온이 낮고, 증발로 인해 염분이 높다.","대기와의 접촉이 적어 산소 농도가 낮고, 밀도가 높다.","심층수와 비교해 수온이 낮고 염분이 높다."],"a":0,"e":"표층수는 태양 복사에 의해 가열되어 수온이 높고, 강수와 담수 유입으로 인해 염분이 낮은 경향이 있다. 또한 대기와 접촉이 활발하여 산소 농도는 높은 편이며, 수온과 염분의 영향으로 밀도는 낮다.","c":"기상·해양","t":"new","x":"표층수는 햇빛을 직접 받아 데워지므로 수온이 높고, 비와 강물이 담수를 보태 주기 때문에 염분은 낮은 편입니다. 또 대기와 맞닿아 있어 산소가 잘 녹아들고, 따뜻하고 덜 짠 만큼 밀도는 낮습니다. 그래서 무겁고 차가운 심층수 위에 안정적으로 떠 있게 되며, 이 밀도 차이가 수온약층을 만듭니다."},{"i":7,"q":"조석현상에 대한 설명으로 가장 옳은 것은?","o":["달에 의한 기조력이 태양보다 크다.","서해안, 남해안보다 동해안의 조차가 크다.","간만의 차가 가장 커지는 시기가 소조이다.","달의 인력에 의한 조석간만의 차는 얕은 바다일수록 적다."],"a":0,"e":"","c":"기상·해양","x":"기조력은 천체의 인력과 지구 공전에 따른 원심력의 차이로 생기며, 거리의 세제곱에 반비례합니다. 태양은 달보다 훨씬 무겁지만 거리가 약 390배 멀기 때문에, 실제 조석을 일으키는 힘은 달이 태양의 약 2배로 더 큽니다. 그래서 조석 주기는 태양이 아니라 달의 운동(음력)에 맞춰 움직입니다. 시험에서는 '태양의 기조력이 더 크다', '동해안 조차가 가장 크다'처럼 주체를 바꿔 놓는 방식으로 자주 나옵니다."},{"i":8,"q":"해양에서 ‘해수면 온도(SST)’는 어떤 기상 현상에 직접 영향을 주는가?","o":["태풍의 강도","해류의 방향","기압의 변화","파도의 주기"],"a":0,"e":"SST가 높을수록 태풍의 에너지원이 되어 강도가 증가함","c":"기상·해양","t":"new","x":"태풍은 따뜻한 바닷물에서 증발한 수증기가 응결하며 내놓는 열을 에너지원으로 삼습니다. 그래서 해수면 온도가 높을수록 공급되는 에너지가 커져 태풍이 강해지고, 보통 26~27도 이상의 해역에서 발생하고 발달합니다. 반대로 상륙하거나 찬 해역으로 들어가면 에너지원이 끊겨 급격히 약해집니다. 해수면 온도와 태풍 강도의 연결고리를 기억하세요."},{"i":9,"q":"조석현상에 대한 설명으로 가장 옳지 않은 것은?","o":["소조와 조금은 같은 의미이다.","대조란 간만의 차가 가장 커지는 시기이다.","일반적으로 간만조의 영향은 6시간 단위로 반복된다.","백중사리란 음력 7월 15일경 밀물수위가 가장 높아질 때로 저조시에도 해수면은 항상 높다."],"a":3,"e":"","c":"기상·해양","x":"백중사리는 음력 7월 15일 무렵 지구·달·태양이 일직선에 놓이고 달이 가장 가까워져 밀물 수위가 연중 가장 높아지는 때입니다. 그러나 조석은 오르내림이 반복되는 현상이므로 만조가 높은 만큼 간조도 낮아집니다. '저조 때에도 해수면이 항상 높다'는 서술은 조석의 기본 성질과 어긋나므로 틀린 설명입니다. 백중사리는 만조 시각의 침수 피해로 자주 출제됩니다."},{"i":10,"q":"국지적인 좁은 범위의 안개이며, 밤에 지표면의 강한 복사냉각으로 발생되는 안개는?","o":["이류무","복사무","전선무","활승무"],"a":1,"e":"복사무는 육상 안개의 대부분을 차지하며, 지표면에 접한 공기가 점차 냉각되어 노점온도에 이르러 안개가 발생한다.","c":"기관·전기","x":"복사무는 맑고 바람이 약한 밤에 지표면이 열을 잃고 급격히 식으면서, 지면에 닿은 공기가 이슬점까지 냉각되어 생기는 안개입니다. 육상 안개의 대부분이 여기에 해당하고, 좁은 지역에 생겼다가 해가 뜨면 곧 걷힙니다. 이류무가 넓고 오래가는 것과 정반대라, 범위와 지속시간으로 두 안개를 구분하면 됩니다."},{"i":11,"q":"풍랑경보 발효 시 파고의 높이로서 가장 옳은 것은?","o":["5m 초과","4m 초과","3m 초과","2m 초과"],"a":0,"e":"해상에서 10분 동안의 평균 풍속이 21m/s 이상인 상태가 3시간 이상 지속되거나, 유의 파고가 5m 초과 할 것으로 예상될 때 풍랑경보를 발표한다.","c":"기상·해양","x":"풍랑경보는 10분 평균 풍속이 21m/s 이상인 상태가 3시간 이상 이어지거나, 유의파고가 5미터를 넘을 것으로 예상될 때 발표합니다. 주의보 기준인 14m/s와 3미터보다 한 단계 높은 수치입니다. 풍속과 파고 중 하나만 넘어도 발표된다는 점, 주의보와 경보의 숫자를 짝지어 외우는 것이 요령입니다."},{"i":12,"q":"따뜻하고 습윤한 공기가 따뜻한 표면에서 찬 표면으로 이동 중 접촉으로 냉각되어 발생 되는 안개는?","o":["이류무","복사무","전선무","활승무"],"a":0,"e":"해무(이류무)는 2가지 원인에 의해 발생되는데, 따뜻하고 습윤한 공기가 따뜻한 표면에서 찬 표면으로 이동 중 접촉으로 냉각되어 발생되는 경우와 건조하고 찬 공기가 따뜻하고 습한 표면으로 이동하는 동안 표면으로 부터 증발에 의한 수증기 포화로도 발생된다.","c":"기관·전기","x":"이류무는 따뜻하고 습한 공기가 찬 해면 위로 흘러가면서 아래부터 냉각되어 생기는 안개입니다. 우리나라 서해와 남해에서 늦봄부터 여름까지 자주 나타나며, 넓은 해역에 걸쳐 며칠씩 이어지기도 합니다. 반대로 건조하고 찬 공기가 따뜻한 해면 위로 지날 때 증발한 수증기가 포화되어 생기는 증기무도 있으니 원인 방향을 구분해 두세요."},{"i":13,"q":"해양에서 ‘혼합층’은 어떤 물리적 작용으로 형성되는가?","o":["해류의 정체","바람과 파도","태양 복사","해저 지형"],"a":1,"e":"바람과 파도에 의해 표층이 균일하게 혼합되어 형성된다.","c":"기상·해양","t":"new","x":"혼합층은 바다 표면에서 수온과 염분이 거의 균일한 층으로, 바람이 해면을 흔들고 파도가 물을 뒤섞으면서 만들어집니다. 즉 기계적인 교반이 원인이라 바람이 강할수록 두꺼워집니다. 그 아래에는 수온이 급격히 떨어지는 수온약층이 놓입니다. 태양 복사는 표층을 데워 성층을 만드는 쪽이라 오히려 혼합을 방해한다는 점이 대비 포인트입니다."},{"i":14,"q":"해양 기상 및 항해에서 가장 표준적으로 사용하는 ‘풍속’의 단위는?","o":["m/s","km/h","knot","ft/s"],"a":2,"e":"knot(노트)는 해양 기상 및 항해 전문가들 사이에서 가장 표준적으로 널리 사용되는 단위이다. 항해 거리(해리)와의 일관성 때문에 선호된다.","c":"항해·해도","t":"new","x":"항해에서는 거리를 해리로 재기 때문에, 속력도 1시간에 몇 해리를 가는가를 뜻하는 노트로 표시하는 것이 자연스럽습니다. 해양 기상의 풍속도 같은 이유로 노트를 표준으로 씁니다. 우리나라 기상청 예보는 m/s를 함께 쓰므로 두 단위를 오가야 할 때가 있는데, 1노트는 약 0.51m/s라는 관계를 알아 두면 편합니다."},{"i":15,"q":"우리나라 해도의 수심 기준면에 대한 설명으로 가장 옳지 않은 것은?","o":["표시된 수심은 약최저저조면이다.","해도상 표기된 수심보다 해면이 낮아질 수 없다.","약최저저조면은 조석표의 조고 높이의 기준면이기도 하다.","약최저저조면은 해면이 대체로 그보다 아래로 내려가는 일이 거의 없는 수면을 뜻한다."],"a":1,"e":"","c":"항해·해도","x":"약최저저조면은 '연중 해면이 그보다 더 낮아지는 일이 거의 없다'고 보는 면이지 절대 하한선은 아닙니다. 이상 기압이나 강한 북서풍 같은 기상 조건에서는 실제 해면이 해도 수심보다 더 내려갈 수 있습니다. 그래서 해도 수심은 가장 안전한 쪽으로 잡아 둔 값일 뿐, 절대 얕아지지 않는다고 믿으면 안 됩니다. '해도 수심보다 낮아질 수 없다'는 단정적 표현이 나오면 오답으로 보면 됩니다."},{"i":16,"q":"최대 해상 풍속(3시간 이상 지속)이 어느 정도로 예상될 때 풍랑경보가 발효되는가?","o":["14m/s 이상","21m/s 이상","26m/s 이상","30m/s 이상"],"a":1,"e":"해상에서 10분 동안의 평균 풍속이 21m/s 이상인 상태가 3시간 이상 지속되거나, 유의 파고가 5m 초과 할 것으로 예상될 때 풍랑경보를 발표한다.","c":"기상·해양","x":"풍랑경보의 풍속 기준은 10분 평균 21m/s 이상이 3시간 이상 지속될 것으로 예상되는 경우입니다. 주의보는 14m/s가 기준입니다. 여기에 파고 기준(주의보 3미터 초과, 경보 5미터 초과)이 더해지며, 둘 중 하나만 충족해도 발표됩니다. 14와 21, 3과 5라는 네 숫자를 표로 만들어 외우면 관련 문제를 모두 처리할 수 있습니다."},{"i":17,"q":"해양에서 ‘염분’은 주로 어떤 이온으로 구성되는가?","o":["Na⁺와 Cl⁻","Ca²⁺와 CO₃²⁻","Mg²⁺와 SO₄²⁻","K⁺와 NO₃⁻"],"a":0,"e":"해수 염분의 대부분은 염소이온(Cl⁻) 염분의 약 55%, 나트륨이온(Na) 약 30.6%로 구성된다.","c":"기상·해양","t":"new","x":"바닷물에 녹아 있는 염분은 대부분 소금 성분이어서, 질량 기준으로 염소이온이 약 55퍼센트, 나트륨이온이 약 30퍼센트를 차지합니다. 두 이온만으로 전체의 85퍼센트가 넘습니다. 그다음이 황산이온과 마그네슘이온입니다. 평균 염분이 약 35퍼밀(1킬로그램당 35그램)이라는 값도 함께 알아 두면 좋습니다."},{"i":18,"q":"해양 기상에서 ‘기온 역전’이 발생하면 어떤 현상이 나타날 수 있는가?","o":["바람이 강해진다.","안개가 발생한다.","파도가 높아진다.","해류가 정체된다."],"a":1,"e":"기온 역전은 대기 안정으로 안개 발생 가능성이 높아진다.","c":"기상·해양","t":"new","x":"기온 역전은 위쪽 공기가 아래쪽보다 따뜻해지는 상태로, 무거운 찬 공기가 아래에 깔려 대기가 매우 안정됩니다. 상승기류가 억제되므로 수증기와 오염물질이 지표 부근에 갇히고, 냉각된 하층 공기가 이슬점에 도달해 안개가 잘 생깁니다. 바람이 강해지거나 파도가 높아지는 것은 대기가 불안정할 때 나타나는 현상이라 반대 방향입니다."},{"i":19,"q":"백중사리에 대한 설명으로 가장 옳지 않은 것은?","o":["백중사리는 음력 7월 15일(백중) 전후 3~4일간이다.","간만의 차가 가장 작아 높은 해수면을 주의해야 한다.","해수면이 가장 낮아져 육지와 도서가 연결되기도 한다.","해수면이 가장 높아져 연안의 제방을 무너뜨리기도 한다."],"a":1,"e":"간만의 차가 큰 시기이다.","c":"기상·해양","x":"백중사리는 음력 7월 15일 전후로 달과 태양이 일직선에 놓이고 달이 지구에 가까워져 기조력이 최대가 되는 시기입니다. 따라서 간만의 차가 가장 커지며, 만조 때 해수면이 크게 올라 제방을 넘기도 하고 간조 때는 크게 빠져 갯벌이 넓게 드러납니다. '간만의 차가 가장 작다'는 서술은 소조(조금)에 해당하므로 틀립니다."},{"i":20,"q":"우리나라 기상청 특보 중 ‘해양기상특보’에 해당하는 것을 고르시오.","o":["지진해일, 강풍, 태풍 (주의보․경보)","지진해일, 풍랑, 태풍 (주의보․경보)","폭풍해일, 강풍, 태풍 (주의보․경보)","폭풍해일, 풍랑, 태풍 (주의보․경보)"],"a":3,"e":"‘해양기상상특보’의 종류는 태풍, 풍랑, 폭풍해일 3종이다.","c":"기상·해양","t":"chg","x":"해양기상특보는 바다에서 항해와 조업을 위협하는 현상에 대해 발표하며 태풍, 풍랑, 폭풍해일 세 가지입니다. 강풍특보는 육상을 대상으로 하고, 지진해일특보는 지진에 따른 별도 체계라 해양기상특보 세 종류에 들어가지 않습니다. 풍랑주의보와 경보의 기준 풍속·파고까지 함께 정리해 두면 관련 문제를 한 번에 처리할 수 있습니다."},{"i":21,"q":"열대저기압인 태풍 발생의 특성으로 가장 옳지 않은 것은?","o":["수온 27도 이상의 해면에서 발생한다.","태풍의 중심 부근에 바람이 약하다.","온대저기압과 달리 태풍은 전선을 동반하지 않는다.","태풍의 눈의 바깥 주변에서 바람이 가장 약하다."],"a":3,"e":"태풍의 눈 바깥 주변에서 바람이 가장 강하며, 태풍의 눈 중심부분이 바람이 약하다.","c":"기상·해양","t":"chg","x":"태풍은 눈 주변의 벽구름에서 상승기류가 가장 강해 바람도 그곳에서 가장 세게 붑니다. 반대로 태풍의 눈 안쪽은 하강기류가 있어 바람이 약하고 하늘이 트이기도 합니다. 따라서 '눈의 바깥 주변에서 바람이 가장 약하다'는 서술이 틀렸습니다. 수온 27도 이상의 해면에서 발생하고 전선을 동반하지 않는다는 나머지 설명은 옳습니다."},{"i":22,"q":"해양에서 ‘용승(upwelling)’은 어떤 생태학적 효과를 유도하는가?","o":["해수면 상승","염분 농도 증가","영양염 공급","해류 속도 감소"],"a":2,"e":"수심 200-300m의 중층의 찬 바닷물이 해면으로 솟아오르는 용승은 심층의 영양염을 표층으로 공급하여 생물의 생산력을 증가시키는 효과가 있다.","c":"항해·해도","t":"new","x":"용승은 바람이 표층수를 밀어내면서 그 자리를 메우려고 수심 수백 미터의 찬물이 올라오는 현상입니다. 심층에는 가라앉은 유기물이 분해되며 쌓인 질소·인 같은 영양염이 풍부하기 때문에, 이 물이 올라오면 식물성 플랑크톤이 급증하고 좋은 어장이 형성됩니다. 용승 해역이 세계적인 어장과 겹치는 이유가 여기에 있습니다."},{"i":23,"q":"해양 기상에서 ‘기압 경도력’은 어떤 방향으로 작용하는가?","o":["고기압에서 저기압 방향으로","바람 방향과 수직","저기압에서 고기압 방향으로","해류 방향과 평행"],"a":0,"e":"기압 경도력(압력의 기울기 때문에 발생하는 힘)은 대기에서 고기압에서 저기압 방향으로 공기를 이동시키는 작용을 한다.","c":"항해·해도","t":"new","x":"기압 경도력은 기압이 높은 곳에서 낮은 곳으로 공기를 밀어내는 힘으로, 바람을 만드는 근본 원인입니다. 등압선 간격이 좁을수록 경도력이 커져 바람이 강해집니다. 다만 지구가 자전하기 때문에 코리올리 힘이 더해져, 실제 바람은 고기압에서 저기압으로 곧장 불지 않고 등압선에 비스듬히 나란한 방향으로 붑니다."},{"i":24,"q":"다음은 바람에 대한 설명이다. 옳은 것을 모두 고르시오.\n① 우리나라 계절풍은 동계에 북서풍, 하계에는 남동풍이 분다.\n② 우리나라 계절풍은 반년 주기로 하계와 동계의 풍향이 바뀌는 바람이다.\n③ 해륙풍은 낮에 해상에서 육지로 해풍이 불고, 밤에는 육지에서 해상을 향해 육풍이 분다.\n④ 하루 동안에 낮과 밤에 바람의 방향이 거의 반대가 되는 바람의 종류를 해륙풍이라 한다.\n⑤ 북서풍이란 북서쪽으로 불어 나가는 바람, 남동풍은 남동쪽으로 불어나가는 바람을 뜻한다.","o":["①, ②, ④, ⑤","①, ③, ④, ⑤","①, ②, ③, ④","①, ②, ③, ④, ⑤"],"a":2,"e":"①부터\n④는 계절풍(겨울 북서풍, 여름 남동풍)과 해륙풍(낮 해풍, 밤 육풍)에 대한 바른 설명이며, 바람의 풍향을 표현할 때에는 불어나가는 방향이 아닌, 불어오는 방향으로 표기한다.","c":"기상·해양","x":"우리나라 계절풍은 겨울에 북서풍, 여름에 남동풍이 불며 반년 주기로 바뀝니다. 해륙풍은 낮에 바다에서 육지로, 밤에 육지에서 바다로 불어 하루 사이에 방향이 거의 반대가 됩니다. 여기까지가 옳은 설명이고, 마지막 ⑤는 풍향을 '불어 나가는 방향'이라고 해 틀렸습니다. 풍향은 언제나 불어오는 방향으로 표시합니다."},{"i":25,"q":"해양에서 ‘수온약층’은 어떤 현상을 유도하는가?","o":["수층 혼합 억제","해류 강화","염분 증가","산소 농도 상승"],"a":0,"e":"수온약층은 바다나 호수에서 수심이 깊어질수록 수온이 급격하게 낮아지는 층으로 따듯하고 가벼운 표층과 차갑고 무거운 심층 사이의 경계 역할을 하며, 수층의 혼합을 억제한다.","c":"항해·해도","t":"new","x":"수온약층은 따뜻하고 가벼운 표층과 차갑고 무거운 심층 사이에서 수온이 급격히 떨어지는 층입니다. 위아래 물의 밀도 차이가 크기 때문에 벽처럼 작용해 수층이 섞이는 것을 막습니다. 그 결과 표층의 산소가 아래로 내려가지 못하고, 심층의 영양염도 위로 올라오지 못합니다. 이 층이 약해지거나 용승이 일어나야 물질 교환이 이루어집니다."},{"i":26,"q":"한랭전선이 통과한 후면에서 기온은 (\n① )하고, 기압은 (\n② )한다.","o":["① 하강, ② 상승","① 상승, ② 하강","① 상승, ② 상승","① 하강, ② 하강"],"a":0,"e":"","c":"기상·해양","x":"한랭전선은 찬 공기가 따뜻한 공기를 밀어 올리며 지나가는 전선입니다. 전선이 통과하고 나면 그 자리를 찬 공기가 차지하므로 기온은 떨어집니다. 반대로 공기가 차가워지면 밀도가 커져 무거워지므로 기압은 올라갑니다. 통과 직후 풍향이 남서풍에서 북서풍으로 바뀌고 소나기성 강수가 그치는 것도 같은 이유입니다. 온난전선은 정확히 반대(기온 상승·기압 하강)로 출제됩니다."},{"i":27,"q":"바다에서 파도를 일으키는 가장 큰 원인은 무엇인가?","o":["달과 태양의 인력","조류와 해류","바람","구름의 높이"],"a":2,"e":"","c":"기상·해양","x":"파도는 바람이 해면을 스치며 마찰로 에너지를 전달해 생기는 풍랑입니다. 바람이 세게, 오래, 넓은 거리(취송거리)에 걸쳐 불수록 파고가 높아집니다. 달과 태양의 인력은 조석을, 밀도차나 바람은 해류를 만드는 요인이라 파도의 직접 원인이 아닙니다. 바람이 멎은 뒤 멀리까지 전해지는 완만한 파도가 너울이라는 점도 함께 외워 두면 좋습니다."},{"i":28,"q":"해상에서의 보퍼트(Beaufort) 풍력 계급은 보통 몇 계급으로 구분되는가?","o":["0 ~ 10 (11계급)","1 ~ 10 (10계급)","0 ~ 12 (13계급)","1 ~ 12 (12계급)"],"a":2,"e":"해상에서의 보퍼트(Beaufort) 풍력 계급은 계급 0에서 12까지의 계급으로 구분한다.","c":"기상·해양","x":"보퍼트 풍력 계급은 0계급(고요)부터 12계급(태풍)까지 모두 13단계로 나뉩니다. 계기 없이도 해면의 상태와 주변 사물의 움직임을 보고 바람 세기를 가늠할 수 있도록 만든 표입니다. 시작이 1이 아니라 0이라는 점 때문에 계급 수와 최대 계급이 헷갈리기 쉬우니 '0~12, 13단계'로 함께 외우세요."},{"i":29,"q":"중형 태풍의 크기는 반경 몇 km인가?","o":["300km 미만","500km ~ 800km 미만","300km ~ 500km 미만","800km 이상"],"a":2,"e":"갑 : 소형 태풍, 을 : 대형 태풍, 정 : 초대형 태풍","c":"기상·해양","x":"태풍의 크기는 강풍(초속 15m 이상) 반경으로 나누며, 300km 미만이 소형, 300~500km가 중형, 500~800km가 대형, 800km 이상이 초대형입니다. 이는 바람의 세기가 아니라 영향을 미치는 범위를 나타내는 구분입니다. 강도(중·강·매우강·초강력)와 헷갈리기 쉬우니 '크기는 반경, 강도는 최대풍속'으로 구분해 두세요."},{"i":30,"q":"풍랑과 너울에 관한 설명으로 가장 옳지 않은 것은?","o":["풍랑은 파장이 짧고 봉우리가 뾰쪽하며 불규칙한 모양을 이루고 있다.","풍랑은 파형, 크기, 파고 등이 불규칙하다.","너울은 파장이 길고 봉우리가 둥글며 규칙성이 크다.","풍랑은 주기가 10~30초에 이른다."],"a":3,"e":"너울은 풍랑보다 주기가 훨씬 길어 10초 정도는 보통이고, 때로는 30초에 이른 것도 있다.","c":"기상·해양","x":"풍랑은 바람이 부는 자리에서 막 생긴 파도라 파장이 짧고 봉우리가 뾰족하며 모양과 주기가 불규칙합니다. 주기는 대체로 몇 초 수준입니다. 반면 너울은 발생 해역을 떠나 멀리 전파되면서 정리된 파도라 파장이 길고 봉우리가 둥글며 규칙적이고, 주기가 10초에서 30초에 이르기도 합니다. 긴 주기는 너울의 특징입니다."},{"i":31,"q":"다음 설명 중 가장 옳지 않은 것은?","o":["바람에 의해 선박이 밀려 선박의 실제 항적과 선수미선이 일치하지 않고 교각을 이루는데 이 교각을 풍압차라고 한다.","해류나 조류에 밀리는 경우의 교각을 유압차라고 한다.","풍향은 바람이 불어오는 방향을 말한다.","유향은 흘러오는 방향을 뜻한다."],"a":3,"e":"풍향은 바람이 불어오는 방향을 말하고, 유향은 흘러가는 방향을 뜻한다.","c":"기상·해양","x":"풍향은 바람이 불어오는 방향으로, 유향은 물이 흘러가는 방향으로 표시합니다. 기준이 서로 반대이므로 '유향은 흘러오는 방향'이라는 서술은 틀립니다. 또 바람에 밀려 항적과 선수미선이 어긋나는 각을 풍압차, 조류에 밀려 생기는 각을 유압차라고 하며, 실제 항해에서는 이 두 편차를 미리 예상해 침로를 수정해야 목적지에 닿습니다."},{"i":32,"q":"고조에서 저조로 되기까지 해면이 점차 낮아지는 상태를 무엇이라 하는가?","o":["낙조(Ebb tide)","정조(Stand of tide)","창조(Flood tide)","게류(Slack water)"],"a":0,"e":"정조는 고조에서 저조로 되었을 때 순간적으로 해면의 승강이 중지된다고 볼 수 있는 상태, 창조는 저조 부터 고조까지 조석으로 인하여 해면이 점차 상승하는 사이","c":"기상·해양","x":"낙조는 고조에서 저조로 가는 동안 해면이 점점 낮아지는 상태를 말하며, 이때 흐르는 조류가 낙조류입니다. 반대로 저조에서 고조로 올라가는 동안은 창조입니다. 정조는 고조나 저조에서 해면의 승강이 잠시 멈춘 상태, 게류는 조류의 수평 흐름이 멈춘 상태이므로 오르내림과 흐름을 구분해서 기억해야 합니다."},{"i":33,"q":"17시(오후 5시)경 출항했을 때가 만조였다면 어느 시간대에 입항하여야만 만조 시 입항이 가능한가?","o":["당일 20시경(오후 8시경)","당일 23시경(오후 11시경)","다음날 02시경(오전 2시경)","다음날 05시경(오전 5시경)"],"a":3,"e":"","c":"기상·해양","x":"조석은 하루에 두 번 고조와 저조가 반복되며 만조에서 다음 만조까지는 약 12시간 25분이 걸립니다. 17시에 만조였다면 다음 만조는 약 12시간 뒤인 다음날 새벽 5시경입니다. 6시간 뒤인 23시경은 물이 다 빠진 간조 시각이 됩니다. 시험에서는 출항 시각만 바꿔 같은 계산을 요구하므로, '만조 간격 약 12시간, 만조·간조 간격 약 6시간'만 기억하면 풀립니다."},{"i":34,"q":"해양 기상에서 ‘기단’이란 무엇인가?","o":["바람의 방향","일정한 성질의 공기 덩어리","기압의 변화","해류의 흐름"],"a":1,"e":"기단이란 넓은 지역에 걸쳐 온도와 습도 등 성질이 일정한 공기 덩어리이다.","c":"기상·해양","t":"new","x":"기단은 넓은 지역에 걸쳐 온도와 습도 같은 성질이 거의 같은 거대한 공기 덩어리입니다. 시베리아 기단처럼 발원지의 성질을 그대로 지니며, 성질이 다른 기단이 만나는 경계면이 전선이 됩니다. 우리나라 날씨가 계절마다 달라지는 것도 어느 기단이 세력을 넓히느냐에 따라 결정됩니다. 기단-전선-저기압으로 이어지는 흐름을 함께 기억하세요."},{"i":35,"q":"해도나 수로서지 간행 후 수심의 변화, 항로 장애물의 발생 등 항해 안전에 영향을 줄 수 있는 변화가 생길 수 있다. 이러한 변경 사항을 선박의 선원에게 알리는 것을 무엇이라 하는가?","o":["등대표","항로지","조석표","항행통보"],"a":3,"e":"항행통보 : 해도 및 수로서지의 정정, 항해에 필요한 경고, 기타 해상교통안전과 관련된 사항을 항해자에게 제공","c":"항해·해도","x":"항행통보는 해도와 수로서지가 발행된 뒤에 생긴 변화, 즉 수심 변화, 장애물 발생, 항로표지의 신설과 폐지 등을 항해자에게 알리는 정기 간행물입니다. 이를 받아 해도를 직접 고치는 작업이 소개정입니다. 등대표·항로지·조석표는 각각 등화 정보, 연안 항해 정보, 조석 시각을 담은 수로서지라 성격이 다릅니다."},{"i":36,"q":"파도를 일으키는 원인에 대한 설명으로 가장 옳지 않은 것은?","o":["바람이 해면 위에서 불 때 생기는 파도가 풍랑이다.","조류와 해류는 물의 흐름으로 파도의 원인과는 무관하다.","실제 조류는 조석과 항상 일정방향으로 흐르는 해류 영향이 섞여있다.","너울은 풍랑에서 전파되어 온 파도로 바람의 직접적인 영향을 받지 않는다."],"a":1,"e":"실제 조류에는 조석에 의한 흐름과 해류의 영향이 포함되어 있어 해역의 조류를 정확히 예측하기 곤란한 특성을 지닌다.","c":"기상·해양","x":"실제 바다의 흐름에는 조석에 따라 주기적으로 방향이 바뀌는 조류와, 늘 일정한 방향으로 흐르는 해류가 섞여 있습니다. 그래서 조류표만으로는 실제 흐름을 정확히 맞히기 어렵습니다. 다만 파도의 주된 원인은 바람이며 조류·해류가 파도를 직접 만들지는 않지만, 조류와 파도가 맞부딪히면 파도가 급격히 서고 거칠어지므로 '전혀 무관하다'고 단정할 수 없습니다."},{"i":37,"q":"다음 중 해수면 상승의 주요 원인이 아닌 것은?","o":["빙하 융해","해수 열팽창","해류 변화","육지 침강"],"a":2,"e":"해류 변화는 지역적 차이만 유도하며 전 지구적으로 해수면 상승 원인으로 볼 수 없다.","c":"기상·해양","t":"new","x":"전 지구적인 해수면 상승의 주된 원인은 빙하와 빙상이 녹아 물이 늘어나는 것, 바닷물이 데워져 부피가 커지는 열팽창입니다. 여기에 지반이 내려앉는 육지 침강이 더해지면 그 지역의 상대적 해수면은 더 높아집니다. 반면 해류 변화는 물을 지역적으로 재배치할 뿐 전체 물의 양이나 부피를 늘리지 않으므로 상승 원인이 아닙니다."},{"i":38,"q":"보기에 있는 총 4개의 ( ) 안에 적합한 것으로만 짝지어진 것을 고르시오. • (\n① )은/는 흘러가는 방향을 유향으로 하며 속도는 노트로 표시한다. • (\n② )은/는 조석에 의하여 생기는 해수의 주기적인 수평방향의 유동이다. • (\n③ ) 때문에 해면이 높아지고 있는 상태로서 저조에서 만조까지의 사이가 창조이다. • (\n④ )은/는 지형, 해저 상태에 영향을 받으며 대양에서 약하고 만구, 좁은 수로에서 강하다.","o":["① 조류, ② 조차, ③ 조석, ④ 해류","① 조류, ② 조차, ③ 해류, ④ 조류","① 조류, ② 조류, ③ 해류, ④ 조류","① 조류, ② 조류, ③ 조석, ④ 조류"],"a":3,"e":"","c":"기상·해양","x":"조류는 조석에 의해 생기는 해수의 주기적인 수평 운동으로, 흘러가는 방향을 유향이라 하고 속도는 노트로 나타냅니다. 해면이 높아지는 상태를 만드는 현상 자체는 조석이며, 저조에서 만조까지 올라가는 동안을 창조라 합니다. 또 조류는 지형과 수심의 영향을 크게 받아 넓은 대양에서는 약하고 만 입구나 좁은 수로에서는 강해집니다. 그래서 ①조류 ②조류 ③조석 ④조류가 맞습니다."},{"i":39,"q":"풍랑과 너울에 대한 설명으로 가장 옳은 것은?","o":["풍랑은 너울에서 전파되어 온 파도","바람이 해면 위에서 불 때 생기는 파도가 너울이다.","너울은 현재의 해역에 바람이 불지 않더라도 생길 수 있다.","풍랑은 바람의 직접적인 영향 없이 바람 없는 해역에서도 발생한다."],"a":2,"e":"파도를 뜻하는 용어 중 ‘파랑’은 바람에 의해 생기는 파도, ‘너울’은 풍랑이 전파되어 나타나는 파도로, 바람의 직접적 영향이 없더라도 너울은 발생된다.","c":"기상·해양","x":"너울은 바람이 불던 해역에서 만들어진 풍랑이 그 해역을 벗어나 멀리까지 전파되어 온 파도입니다. 따라서 지금 있는 바다에 바람이 전혀 없어도 먼 곳의 저기압이나 태풍이 만든 너울이 밀려올 수 있습니다. 맑은 날 갑자기 큰 너울이 들어오는 것이 태풍 접근의 전조가 되기도 하므로 실제 항해에서 중요한 신호입니다."},{"i":40,"q":"이동성 고기압이 주로 나타나는 계절을 나타낸 것으로 가장 옳은 것은?","o":["여름, 가을","봄, 가을","겨울, 봄","가을, 겨울"],"a":1,"e":"이동성 고기압은 봄, 가을에 주로 나타난다.","c":"기상·해양","x":"이동성 고기압은 대륙에서 떨어져 나와 편서풍을 타고 동쪽으로 이동하는 고기압으로, 대륙 고기압이 약해지고 여름 기단이 아직 자리 잡지 않은 봄과 가을에 주로 나타납니다. 이 고기압과 저기압이 번갈아 지나가기 때문에 봄가을 날씨가 며칠 주기로 바뀝니다. 겨울은 시베리아 고기압, 여름은 북태평양 고기압이 정체한다는 점과 대비됩니다."},{"i":41,"q":"해도에 표기된 수심에 대한 주의사항으로 가장 적합한 것은?","o":["해저의 높낮이가 불규칙한 곳이 안전하다.","수심이 얕고 저질이 암초인 곳을 따라서 항행한다.","등심선이 기재되지 않은 공백지는 수심이 충분한 해역이다.","수심이 상세하고 복잡하게 기재된 해역은 정밀하게 측량된 해역으로 안전하다."],"a":3,"e":"","c":"항해·해도","x":"해도의 수심 숫자가 촘촘하고 복잡하게 찍혀 있다는 것은 그만큼 측량이 조밀하게 이루어진 해역이라는 뜻이므로 신뢰하고 항해할 수 있습니다. 반대로 수심 기재가 없는 공백지는 '깊어서 생략한 곳'이 아니라 측량이 이루어지지 않은 미상 해역이므로 피해야 합니다. 해도는 '표시가 없는 곳이 안전하다'는 식으로 읽으면 안 된다는 점이 핵심 함정입니다."},{"i":42,"q":"조석의 원인에 대한 설명으로 가장 옳지 않은 것은?","o":["달의 인력","태양의 인력","편서풍과 무역풍","원심력"],"a":2,"e":"편서풍과 무역풍은 조석의 원인으로 볼 수 없다.","c":"기상·해양","x":"조석은 달과 태양의 인력, 그리고 지구와 달이 공통 무게중심을 돌면서 생기는 원심력이 합쳐진 기조력 때문에 일어납니다. 반면 편서풍과 무역풍은 대기의 순환으로 해류를 만드는 요인이지 해수면을 주기적으로 오르내리게 하는 힘이 아닙니다. '주기적인 승강은 천체의 힘, 지속적인 흐름은 바람'으로 갈라 두면 됩니다."},{"i":43,"q":"조류가 강하거나 좁은 수로, 수심이 급변하는 지역에서 일어나는 소용돌이를 무엇이라 하는가?","o":["급류","조류","쉰물","와류"],"a":3,"e":"","c":"항해·해도","x":"와류는 물이 소용돌이치며 회전하는 흐름으로, 조류가 강한 좁은 수로나 수심이 갑자기 변하는 곳, 곶 주변에서 잘 생깁니다. 흐름이 장애물을 지나며 방향과 속도가 흐트러지기 때문입니다. 소형 요트는 와류에 들어가면 타효가 급격히 떨어져 조종이 어려워지므로 통과 시각을 정조 무렵으로 잡는 것이 안전합니다. 급류·게류·와류의 정의를 서로 바꿔 놓는 형태로 출제됩니다."},{"i":44,"q":"보기의 ( )안에 공통으로 들어가는 것은? 삭과 망이 지난 뒤 ( ) 만에 조차가 극대인 조석으로 대조라 하고, 상현과 하현이 지난 뒤 ( ) 만에 조차가 극소인 조석을 소조라 한다.","o":["0~1일","1~2일","2~3일","3~4일"],"a":1,"e":"삭망 후 1~2일 만에 조차가 가장 큰 때를 대조라 하며, 상현과 하현 후 1~2일 만에 조차가 가장 작은 때를 소조라 한다.","c":"기상·해양","x":"달과 태양이 일직선에 놓이는 삭(그믐)과 망(보름)에는 기조력이 합쳐져 조차가 커집니다. 다만 바닷물이 움직이는 데 시간이 걸려 실제 최대 조차는 1~2일 뒤에 나타나며 이를 대조(사리)라고 합니다. 마찬가지로 상현과 하현이 지난 뒤 1~2일 만에 조차가 가장 작아지는데 이것이 소조(조금)입니다. 이 시간 지연을 조령이라고 부릅니다."},{"i":45,"q":"해상 현상으로서의 바람의 강도를 설명하기 위해 만든 분류 등급표로 여기에 육상용의 설명이 첨가 되어 현재의 풍급표가 되었는데, 이는 무엇인가?","o":["보퍼트 풍급표","세계기상기구(WMO)","해도","기상등급표"],"a":0,"e":"보퍼트 풍급표에 대한 설명으로 0~12까지의 계급으로 구분한다.","c":"항해·해도","x":"보퍼트 풍급표는 원래 해상에서 배와 파도의 상태를 보고 바람 세기를 가늠하려고 만든 등급표이며, 뒤에 육상의 관측 기준이 더해져 지금의 형태가 되었습니다. 0계급(고요)부터 12계급(태풍)까지 13단계로 나눕니다. 계기가 없어도 눈으로 풍력을 추정할 수 있게 만든 표라는 점이 핵심이며, 계급 수 13(0~12)을 묻는 문제로도 나옵니다."},{"i":46,"q":"해륙풍에 대한 설명으로 가장 옳은 것은?","o":["육풍은 일반적으로 해풍보다 강한 편이다.","주간에는 육지로부터 해상으로 육풍이 분다.","야간에는 해상으로부터 육지로 해풍이 분다.","주·야간에 바람 영향이 거의 반대가 되는 현상이다."],"a":3,"e":"","c":"기상·해양","x":"해륙풍은 육지와 바다의 비열 차이 때문에 생기며, 낮과 밤의 바람 방향이 정반대가 되는 것이 가장 큰 특징입니다. 낮에는 육지가 빨리 데워져 상승기류가 생기므로 바다에서 육지로 해풍이 불고, 밤에는 육지가 빨리 식어 육지에서 바다로 육풍이 붑니다. 세기는 온도차가 큰 낮의 해풍이 더 강합니다. '주간 육풍, 야간 해풍'처럼 뒤집어 놓은 보기가 단골 오답입니다."},{"i":47,"q":"해양에서 ‘산소 최소층(Oxygen Minimum Zones, OMZ)’은 어떤 특징을 가지는가?","o":["산소가 가장 많은 층","광합성이 활발한 층","산소 농도가 가장 낮은 층","해류가 가장 빠른 층"],"a":2,"e":"산소 최소층(Oxygen Minimum Zones, OMZs)은 해양에서 용존 산소(DO) 농도가 극도로 낮은 특정 지역으로 유기물 분해는 활발하지만 광합성이 없어 산소 농도가 낮다.","c":"기상·해양","t":"new","x":"산소 최소층은 수심 수백 미터 부근에서 용존산소가 극도로 낮아지는 층입니다. 빛이 닿지 않아 광합성으로 산소가 공급되지 않는데, 위에서 가라앉은 유기물을 분해하는 미생물이 산소를 계속 소비하기 때문입니다. 표층은 대기와 광합성으로 산소가 풍부하고 심층은 극지에서 가라앉은 찬물이 산소를 실어 오므로, 중간층에서 최소가 됩니다."},{"i":48,"q":"해양 기상에서 ‘전선’이란 무엇인가?","o":["바람의 경계","기압의 경계","서로 다른 기단의 경계","해류의 경계"],"a":2,"e":"전선은 성질(기온, 습도, 밀도 등)이 다른 두 개의 공기 덩어리인 기단이 만나는 경계선을 의미한다.","c":"기상·해양","t":"new","x":"전선은 온도·습도·밀도 같은 성질이 서로 다른 두 기단이 맞닿는 경계입니다. 성질이 다른 공기는 잘 섞이지 않고 한쪽이 다른 쪽을 밀어 올리기 때문에, 전선 부근에서는 구름이 발달하고 비가 내리며 바람이 바뀝니다. 어느 쪽이 밀고 들어오느냐에 따라 한랭전선·온난전선·정체전선·폐색전선으로 나뉩니다."},{"i":49,"q":"연이어 일어난 고조와 저조 때의 해면 높이차는 무엇인가?","o":["조차","고조","저조간격","고조간격"],"a":0,"e":"","c":"기상·해양","x":"조차는 연이어 일어난 고조와 저조 때 해면 높이의 차이를 말합니다. 대조(사리) 때 가장 크고 소조(조금) 때 가장 작으며, 우리나라에서는 수심이 얕고 만이 발달한 서해안에서 특히 큽니다. 고조·저조는 해면이 가장 높거나 낮은 '순간'을, 고조간격은 달이 자오선을 지난 뒤 고조까지 걸리는 '시간'을 뜻하므로 서로 구분해야 합니다."},{"i":50,"q":"돌풍(Gust)에 대한 설명으로 가장 옳지 않은 것은?","o":["고지대의 한기가 해안지방으로 급강하할 때 잘 일어난다.","온난전선이 통과할 때 자주 발생한다.","저기압이 급속히 발달할 때 발생한다.","뇌우 등의 열대류가 있을 때 자주 발생한다."],"a":1,"e":"한랭전선이 통과할 때 자주 발생한다.","c":"기상·해양","x":"돌풍은 대기가 불안정해 강한 상하 대류가 일어날 때 생깁니다. 찬 공기가 따뜻한 공기를 급하게 밀어 올리는 한랭전선 통과 시, 저기압이 급속히 발달할 때, 뇌우가 발달할 때, 고지대의 찬 공기가 해안으로 쏟아져 내릴 때가 대표적입니다. 온난전선은 따뜻한 공기가 완만하게 타고 오르면서 넓은 지역에 약한 비를 뿌리므로 돌풍과는 거리가 멉니다."},{"i":51,"q":"평균 풍속이란 (\n① )분간 풍속의 평균을 말하며, 순간 최대 풍속은 평균 풍속의 대략 (\n② )배 가량 된다.","o":["①10, ②1.5~1.7","①10, ②15~17","①30, ②1.5~1.7","①30, ②15~17"],"a":0,"e":"","c":"기상·해양","x":"기상에서 말하는 평균 풍속은 10분간 관측한 풍속의 평균값이며, 순간적으로 부는 최대 풍속은 대체로 평균 풍속의 1.5~1.7배 수준입니다. 즉 평균 10m/s면 순간적으로 15~17m/s의 돌풍이 불 수 있다는 뜻입니다. 예보에 나온 풍속만 믿고 출항하면 실제 돌풍에 대비하지 못하므로 세일 면적을 미리 줄여야 합니다. 숫자를 15~17배로 부풀린 보기가 함정입니다."},{"i":52,"q":"우리나라에서 풍랑주의보는 해상에서 풍속 ( )m/s 이상이 ( )시간 이상 지속되거나 유의파고가 ( )m를 초과할 것으로 예상될 때 발표된다.’","o":["14, 3, 3","14, 3, 5","21, 3, 3","21, 3, 5"],"a":0,"e":"풍랑주의보는 해상에서 풍속 14m/s 이상이 3시간 이상 지속되거나 유의파고가 3m를 초과할 것으로 예상될 때 발표된다.","c":"기상·해양","x":"풍랑주의보는 10분 평균 풍속 14m/s 이상이 3시간 이상 지속되거나 유의파고가 3미터를 초과할 것으로 예상될 때 발표합니다. 경보는 같은 조건에서 21m/s와 5미터로 기준이 올라갑니다. 지속 시간 3시간은 주의보와 경보가 같다는 점, 풍속과 파고 중 하나만 넘어도 발표된다는 점이 함께 출제됩니다."},{"i":53,"q":"태풍의 중심과 선박과의 위치 관계를 나타낸 것으로 가장 옳지 않은 것은?","o":["풍향이 순전하면 선박은 축선상의 우측, 즉 위험반원에 위치한다.","풍향이 반전하면 선박은 축선상의 좌측, 즉 가항반원에 위치한다.","기압이 하강하고 풍속이 증가하면 태풍 중심의 후방에서 태풍 중심으로 접근 중이다.","풍향이 변하지 않고 폭풍우가 강해지고 기압이 점점 하강하면 선박은 태풍의 진로 상에 위치한다."],"a":2,"e":"기압이 하강하고 풍속이 증가하는 동안은 태풍중심의 전방에서 중심으로 접근하는 중이다.","c":"기상·해양","x":"기압이 계속 떨어지고 풍속이 세지는 동안은 태풍 중심이 아직 다가오고 있다는 뜻이므로, 배는 중심의 전방에 있는 것입니다. 중심을 지나 멀어지기 시작하면 기압이 오르고 바람이 잦아듭니다. 북반구에서 풍향이 시계방향으로 바뀌면(순전) 위험반원, 반시계방향으로 바뀌면(반전) 가항반원, 풍향이 그대로면 진로상에 있다는 판정도 함께 기억하세요."},{"i":54,"q":"계절풍에 대한 설명으로 가장 옳은 것은?","o":["매년 봄에 일 년 주기로 풍향이 바뀌는 바람이다.","여름에 대양에서 육지로 흐르는 강한 기류가 북동풍","겨울과 여름에 대륙과 해양 간 온도차가 발생 원인이다.","겨울에 육지에서 대양으로 흐르는 한랭한 기류가 남서풍"],"a":2,"e":"","c":"기상·해양","x":"계절풍은 대륙과 해양의 비열 차이로 계절마다 풍향이 바뀌는 바람입니다. 겨울에는 차갑게 식은 대륙에 고기압이 발달해 대륙에서 바다로 북서풍이 불고, 여름에는 반대로 바다에서 대륙으로 남동·남서풍이 붑니다. 주기는 반년이며 봄에 바뀌는 것이 아닙니다. 해륙풍이 하루 주기, 계절풍이 반년 주기라는 대비로 기억하면 헷갈리지 않습니다."},{"i":55,"q":"바람과 풍향에 대한 설명으로 가장 옳지 않은 것은?","o":["북서풍이란 북서쪽으로 불어 나가는 바람을 뜻한다.","우리나라 계절풍은 동계에 북서풍, 하계에는 남동풍이다.","해륙풍은 낮에 해상에서 육지로 해풍이, 밤에는 반대로 육풍이 분다.","우리나라 계절풍은 반년 주기로 하계와 동계의 풍향이 바뀌는 바람이다."],"a":0,"e":"","c":"기상·해양","x":"풍향은 바람이 '불어오는' 방향으로 표시합니다. 따라서 북서풍은 북서쪽에서 불어오는 바람이며, 북서쪽으로 불어 나가는 바람이라는 설명은 틀립니다. 반대로 조류의 유향은 '흘러가는' 방향으로 표시하므로 둘의 기준이 서로 다르다는 점이 이 문제의 핵심입니다. 풍향과 유향의 기준을 맞바꿔 놓는 보기가 매우 자주 출제됩니다."},{"i":56,"q":"고조(저조)로부터 다음 고조(저조)까지 걸리는 시간을 조석의 주기라고 하는데 일반적으로 조석의 주기는?","o":["약 6시간 25분","약 9시간 25분","약 12시간 25분","약 15시간 25분"],"a":2,"e":"고조(저조)로부터 다음 고조(저조)까지 걸리는 시간을 조석의 주기라 한다. 조석의 주기는 약 12시간 25분 이다.","c":"기상·해양","x":"고조에서 다음 고조까지, 즉 조석의 한 주기는 약 12시간 25분입니다. 달이 지구를 도는 동안 같은 지점이 다시 달을 마주하기까지 24시간 50분이 걸리고, 그 사이에 고조가 두 번 오기 때문입니다. 그래서 만조 시각이 매일 약 50분씩 늦어지고, 만조와 간조 사이는 약 6시간 12분이 됩니다."},{"i":57,"q":"다음 안개에 대한 설명 중 해상 안개인 이류무의 특성으로 가장 옳은 것은?","o":["안개가 국지적인 좁은 범위의 안개이다.","밤에 지표면의 강한 복사냉각으로 발생된다.","안개의 범위가 넓고 지속시간도 길어서 때로는 며칠씩 계속될 때도 있다.","전선을 경계로 하여 찬 공기와 따뜻한 공기의 온도차가 클 때 발생하기 쉽다."],"a":2,"e":"","c":"기관·전기","x":"이류무(해무)는 따뜻하고 습한 공기가 찬 해면 위로 이동하면서 냉각되어 생기는 안개입니다. 넓은 해역에 걸쳐 발생하고 바람이 불어도 잘 흩어지지 않아 며칠씩 이어지기도 합니다. 국지적이고 밤에 복사냉각으로 생겼다가 해가 뜨면 걷히는 것은 복사무이며, 전선 부근의 온도차로 생기는 것은 전선무입니다. 안개 종류별 발생 원인과 지속시간을 짝지어 외워야 합니다."},{"i":58,"q":"해수의 밀도(주로 염분)차에 의하여 발생하는 해류는?","o":["취송류","경사류","밀도류","대조"],"a":2,"e":"","c":"기상·해양","x":"밀도류는 수온과 염분 차이로 해수의 밀도가 달라지면서 무거운 물은 가라앉고 가벼운 물은 흘러들어 생기는 해류입니다. 취송류는 바람이 해면을 끌어 생기는 흐름, 경사류는 해면 높이차로 생기는 흐름이라 원인이 다릅니다. 대조는 조석 용어여서 해류 분류에 아예 들어가지 않습니다. 해류를 원인별(취송류·밀도류·경사류·보류)로 묶어 정리해 두면 쉽게 풀립니다."},{"i":59,"q":"우리나라 서해안의 조석, 조류 개황에 대한 설명으로 가장 옳은 것은?","o":["일조부등이 현저하여 1일 1회조가 자주 발생한다.","대조차는 서해안 남부에서 북쪽으로 올라감에 따라 감소한다.","평균해면은 2월에 최저, 8월에 최고이다.","조차가 작다."],"a":2,"e":"동해안의 조석은 매우 작아 조차가 0.3m 내외에 불과하고, 남해안의 대조차는 부산에서 1.2m, 여수 3.0m, 완도 3.1m이며, 서해안의 대조차는 남부에서 약 3.0m이며 북쪽으로 갈수록 증가하여 인천 부근에서 약 8.0m에 달한다.","c":"기상·해양","x":"우리나라 서해안은 조차가 매우 커서 남부에서 약 3미터, 북쪽 인천 부근에서는 약 8미터에 이릅니다. 즉 북쪽으로 갈수록 커집니다. 평균해면도 계절에 따라 달라져 수온이 낮은 2월에 가장 낮고 해수가 팽창하는 8월에 가장 높습니다. 동해안의 조차가 0.3미터 내외로 아주 작다는 점과 대비해 기억해 두세요."},{"i":60,"q":"해류의 발생 원인에 따른 구분으로 가장 옳지 않은 것은?","o":["취송류","밀도류","경사류","난류"],"a":3,"e":"난류는 주위의 해수 온도에 비교한 것으로 발생 원인에 따른 구분이 아니다.","c":"기상·해양","x":"해류는 발생 원인에 따라 바람이 끌어 만드는 취송류, 밀도 차이로 생기는 밀도류, 해면 경사로 생기는 경사류, 빠져나간 물을 메우려 흐르는 보류로 나눕니다. 난류와 한류는 주변 해수보다 수온이 높은가 낮은가로 나눈 구분이라 발생 원인에 따른 분류에 끼워 넣을 수 없습니다. 분류의 '기준'이 무엇인지를 묻는 문제입니다."},{"i":61,"q":"다음 중 질소가 가장 중요한 영양염으로 작용하는 생물군은?","o":["산호","어류","식물성 플랑크톤","해조류"],"a":2,"e":"질소는 식물성 플랑크톤의 단백질 합성에 필수적인 영양염이다.","c":"기상·해양","t":"new","x":"식물성 플랑크톤은 광합성을 하면서 단백질과 핵산을 만들기 위해 질소를 반드시 필요로 하며, 바다에서 질소는 대개 가장 먼저 바닥나는 제한 영양염입니다. 그래서 질소가 공급되면 플랑크톤이 급격히 늘고, 지나치면 적조로 이어집니다. 어류와 산호는 먹이로 영양을 얻으므로 영양염을 직접 흡수하는 생물군과는 성격이 다릅니다."},{"i":62,"q":"따뜻한 공기가 찬 해면을 통과할 때 생기는 안개는?","o":["복사무","이류무","전선무","증기무"],"a":1,"e":"이류무는 온난다습한 대기가 대규모적으로 한류 역상을 이류할 때 발생한다. 이러한 안개는 특히 해상에서 빈번히 발생한다. 해상 안개의 대부분은 이류무이므로 이를 해무라고 부르기도 한다.","c":"기상·해양","x":"따뜻한 공기가 찬 해면 위를 지나며 아래부터 식어 이슬점에 도달해 생기는 안개가 이류무입니다. 해상에서 발생하는 안개의 대부분이 이 유형이라 해무라고도 부릅니다. 바람이 어느 정도 불어도 잘 흩어지지 않고 오래 지속되는 것이 특징이라, 시정이 급격히 나빠져 요트 항해에서 특히 위험합니다."},{"i":63,"q":"해양에서 ‘표층 해류’는 어떤 힘에 의해 편향되는가?","o":["중력","원심력","코리올리 효과","기압 경도력"],"a":2,"e":"코리올리 효과는 지구의 자전으로 인해 움직이는 물체의 경로가 휘어지는 현상으로 해류는 북반구에서는 우측, 남반구에서는 좌측으로 작용한다. 해류 및 바람의 흐름에 영향을 주어 대규모 순환을 만듭니다.","c":"항해·해도","t":"new","x":"지구가 자전하기 때문에 움직이는 물체는 진행 방향에서 벗어나는 힘을 받는데 이것이 코리올리 효과입니다. 북반구에서는 오른쪽, 남반구에서는 왼쪽으로 휘어집니다. 그래서 표층 해류는 바람 방향과 정확히 일치하지 않고 비스듬히 흐르며, 대양 규모에서는 시계방향(북반구)의 큰 순환이 만들어집니다."},{"i":64,"q":"간조와 만조 관계없이 항상 수면 위로 드러나 있는 바위를 무엇이라 하는가?","o":["노출암","간출암","돌출암","수몰암"],"a":0,"e":"","c":"기상·해양","x":"노출암은 간조든 만조든 항상 수면 위로 드러나 있는 바위입니다. 이에 비해 간출암은 저조 때는 드러나고 고조 때는 물에 잠기는 바위로, 높이를 약최저저조면 기준으로 표시합니다. 노출암의 높이는 평균 해면을 기준으로 표시한다는 점도 함께 기억해야 합니다. 해도 기호 문제에서 노출암·간출암·세암(암초)의 구분으로 자주 출제됩니다."},{"i":65,"q":"바람이 일정한 방향으로 지속적으로 불면 공기와 해면의 마찰, 즉 바람의 응력으로 인하여 바람이 불어가는 아래 방향으로 해수의 흐름이 생기는데, 이를 무엇이라 하는가?","o":["밀도류","경사류","취송류","급조"],"a":2,"e":"취송류에 대한 설명으로 해류는 대부분 바람 때문에 발생한다.","c":"기상·해양","x":"취송류는 바람이 오래 일정한 방향으로 불 때 공기와 해면의 마찰(바람 응력)로 표층 해수가 끌려가며 생기는 흐름입니다. 바다에서 관측되는 해류의 상당 부분이 이 방식으로 만들어집니다. 다만 지구 자전의 영향으로 표층 흐름은 바람 방향에서 조금 비껴 흐릅니다. 밀도류는 밀도차, 경사류는 해면 경사가 원인이므로 구분해 두세요."},{"i":66,"q":"해양에서 ‘강 하구’는 어떤 특징을 갖는가?","o":["염분 농도가 높다.","염분 농도가 낮다.","수온이 높다.","해류가 빠르다."],"a":1,"e":"민물과 바닷물이 만나는 곳은 하구라고 하며, 강 하구는 담수 유입으로 염분 농도가 낮다. 이곳은 강물과 바닷물이 섞여 염분이 적은 기수 환경을 만듭니다.","c":"기상·해양","t":"new","x":"강 하구는 강물이 흘러들어 바닷물과 섞이는 곳이라 염분이 주변 바다보다 낮은 기수 환경이 됩니다. 담수와 해수의 밀도 차이 때문에 가벼운 민물이 위층, 무거운 바닷물이 아래층으로 나뉘어 흐르기도 합니다. 영양염이 풍부해 생물이 많지만, 조류와 담수 유출이 겹쳐 흐름이 복잡하다는 점도 항해에서 유의할 부분입니다."},{"i":67,"q":"기온의 일교차가 가장 적은 계절은?","o":["봄","여름","가을","겨울"],"a":1,"e":"일교차는 하루의 최고기온과 최저기온의 차를 말하며 연중 7월은 일교차가 가장 적은 달이다.","c":"기상·해양","x":"일교차는 낮 동안 데워지고 밤에 식는 폭의 차이인데, 여름철에는 습도가 높고 구름이 많아 밤에 지표의 열이 잘 빠져나가지 못합니다. 수증기가 담요처럼 복사냉각을 막아 주기 때문입니다. 그래서 연중 7월 무렵의 일교차가 가장 작습니다. 반대로 맑고 건조한 봄가을에는 일교차가 커집니다."},{"i":68,"q":"해양 기상에서 ‘풍향’은 어떻게 정의되는가?","o":["바람이 불어가는 방향","바람이 불어오는 방향","바람의 속도","바람의 세기 변화"],"a":1,"e":"풍향은 바람이 불어오는 방향으로 정의된다.","c":"기상·해양","t":"new","x":"풍향은 바람이 불어오는 방향으로 나타냅니다. 따라서 북풍은 북쪽에서 불어오는 바람이며, 배가 북쪽으로 밀리는 것이 아니라 남쪽으로 밀립니다. 반면 조류의 유향은 흘러가는 방향으로 표시하므로 기준이 정반대라는 점을 늘 함께 확인해야 합니다. 풍향은 보통 16방위나 360도로 표시하며 관측 기준은 10분 평균입니다."},{"i":69,"q":"태풍에 대한 설명으로 가장 옳지 않은 것은?","o":["상륙하면 속도가 빨라지고, 위력이 더 강해진다.","태풍은 진로 전향 후 속도가 급격히 빨라진다.","육상에서는 전혀 발생하지 않는다.","태풍은 주로 여름철에 발생한다."],"a":0,"e":"상륙하면 이동이 느려지고, 급속히 쇠약해진다.","c":"기상·해양","x":"태풍은 따뜻한 바다에서 공급되는 수증기를 에너지원으로 삼기 때문에, 육지에 상륙하면 수증기 공급이 끊기고 지표 마찰까지 더해져 이동이 느려지고 급격히 약해집니다. 따라서 '상륙하면 빨라지고 강해진다'는 서술은 틀립니다. 다만 전향 후 편서풍을 타면 이동 속도가 빨라진다는 점, 육상에서는 발생하지 않는다는 점은 옳은 설명입니다."},{"i":70,"q":"해무(Sea Fog)에 대한 설명 중 가장 옳지 않은 것은?","o":["온난다습한 공기가 찬 해면으로 이류 시 발생한다.","늦은 봄부터 여름에 걸쳐 주로 발생한다.","일반적으로 육무(Land fog)보다 발생 범위가 넓고 지속성이 강하다.","복사무가 대부분이다."],"a":3,"e":"온난한 표면상에서 한랭한 표면상으로 이류하는 습한 공기괴 내에 발생하는 안개를 이류무라고 한다. 이러한 안개는 해상에서 빈번히 발생한다. 해상 안개의 대부분은 이류무이므로 이를 해무(sea fog)라고 부르기도 한다. 육상 안개의 대부분은 야간에 지표면의 강한 복사냉각이 원인이 되어 발생하는 복사무이다.","c":"기관·전기","x":"해상 안개의 대부분은 따뜻하고 습한 공기가 찬 해면 위로 이류하며 생기는 이류무입니다. 복사무는 밤에 지표가 식으며 생기는 육상 안개라 해무의 주된 유형이 아니므로 그 서술이 틀렸습니다. 해무는 늦봄부터 여름에 자주 나타나고, 육무보다 범위가 넓으며 며칠씩 이어질 만큼 지속성이 강합니다."},{"i":71,"q":"요트의 선체가 두 개로 이루어진 형태이고, 수면에 대한 저항이 적어 빠른 속도를 낼 수 있는 것으로 가장 옳은 것은?","o":["캐터마란(Catamaran)","트라이마린(Trimaran)","모노헐(Monohull)","플랫 보텀(Plat Battom)"],"a":0,"e":"","c":"요트·의장","x":"캐터마란은 선체가 두 개인 쌍동선으로, 물에 잠기는 선체가 가늘어 조파저항이 작고 폭이 넓어 복원성이 좋습니다. 그래서 같은 세일 면적으로도 빠른 속도를 낼 수 있습니다. 트라이마란은 선체가 세 개, 모노헐은 하나이며, 플랫 보텀은 선저 형상에 따른 분류라 계열이 다릅니다. 선체 수에 따른 분류는 숫자만 바꿔 출제되므로 하나-둘-셋으로 외우면 됩니다."},{"i":72,"q":"슬루프(Sloop) 요트의 설명이다. ( )에 들어갈 세일 용어로 가장 옳은 것은? 한 개의 돛대에 세일 두 장을 설치하여 운항하는 요트가 가장 일반적인 요트 형태에 해당된다. 선수에 있는 세일은 (\n① )이며, 돛대에서 선미 쪽으로 설치된 세일이 (\n② )이다. (\n② )은 중심을 잡고 (\n① )과 함께 추진력을 발생하게 된다. 속도와 선외성면에서 우수하고 가장 좋은 레이스 감각이 발휘하는 요트 이다.","o":["① 메인세일(Main Sail) ② 스피네커(Spinnaker)","① 메인세일(Main Sail) ② 집 세일(Jib Sail)","① 집 세일(Jib Sail) ② 스피네커(Spinnaker)","① 집 세일(Jib Sail) ② 메인세일(Main Sail)"],"a":3,"e":"","c":"요트·의장","x":"슬루프는 돛대 하나에 세일 두 장을 다는 가장 일반적인 요트입니다. 선수 쪽 삼각돛이 집 세일이고, 돛대에서 선미 쪽으로 펼쳐지는 큰 돛이 메인세일입니다. 메인세일이 배의 중심을 잡아 주고 집 세일과 함께 추진력을 만들어 냅니다. 두 돛 사이 좁은 틈으로 바람이 가속되면서 추진력이 커지는 슬롯 효과도 슬루프의 특징입니다."},{"i":73,"q":"집 세일(Jib sail)을 펴고 감아 들이기 쉽게 한 롤러장치를 말하는 용어는?","o":["집 행크(Jib hank)","펄링 드럼(Furling drum)","집 시트(Jib sheet)","집 리더(Jib leader)"],"a":1,"e":"펄링 드럼(furling drum)은 집 세일을 감고 펼치는 장치이다.","c":"요트·의장","x":"펄링 드럼은 포어스테이 아래쪽에 달린 드럼으로, 줄을 당기면 집 세일이 스테이를 축으로 돌돌 감기고 반대로 풀면 다시 펴집니다. 갑판 위에서 혼자서도 돛 면적을 조절할 수 있어 크루저 요트에 널리 쓰입니다. 집 행크는 돛을 스테이에 거는 고리, 집 시트는 돛을 당기는 줄이라 기능이 다릅니다."},{"i":74,"q":"선체 또는 계류장에 고정되어 있는 줄을 당겨서 매는데 주로 사용되는 것은?","o":["턴버클(turnbuckle)","샤클(shackle)","리드블럭(lead block)","클리트(cleat)"],"a":3,"e":"클리트에는 앵커 로프나 선체를 계류시키는 무어링(mooring) 클리트와 집 시트를 당기고 늦추는데 사용 되는 캠(cam) 클리트 등이 있다.","c":"범주·조종","x":"클리트는 뿔처럼 두 갈래로 벌어진 금구로, 당긴 줄을 여덟 팔자로 감아 고정하는 데 씁니다. 계류줄을 매는 무어링 클리트, 집 시트를 물었다 놓는 캠 클리트 등이 있습니다. 턴버클은 스테이의 장력을 조절하는 부품, 샤클은 고리를 연결하는 금구, 리드블록은 줄의 방향을 바꾸는 도르래라 기능이 다릅니다."},{"i":75,"q":"요트 양현에 라이프 라인(Life Line)을 설치할 수 있도록 세운 기둥을 무엇이라고 하는가?","o":["붐 뱅(Boom vang)","스텐천(Stanchion)","커닝햄(Cunningham)","베튼(Batten)"],"a":1,"e":"","c":"요트·의장","x":"스텐천은 갑판 양현에 수직으로 세워 라이프 라인을 걸어 두는 기둥입니다. 항해 중 승선자가 배 밖으로 떨어지지 않게 막아 주는 안전설비의 일부입니다. 붐 뱅은 붐이 들리는 것을 눌러 주는 장치, 커닝햄은 러프의 장력을 조절하는 장치, 베튼은 돛의 리치를 펴 주는 얇은 판이라 용도가 전혀 다릅니다."},{"i":76,"q":"요트가 좌·우측에서 바람을 받아 진행할 때 옆으로 밀리는 것을 방지하기 위한 장치가 아닌 것은?","o":["서프 보드(Surf board)","리 보드(Lee board)","피벗 보드(Pivot board)","대거 보드(Dagger board)"],"a":0,"e":"‘서프 보드’란 길고 좁고 가벼운 나무로 만든 보드 또는 섬유유리로 덧입혀진 폼으로 파도를 타는데 사용한다.","c":"기상·해양","x":"횡류방지장치는 물속에 잠긴 넓은 면으로 옆으로 밀리는 힘을 받아 내는 장치로, 리 보드·피벗 보드·대거 보드·센터 보드·킬이 여기에 속합니다. 반면 서프 보드는 파도를 타는 데 쓰는 널판이라 요트의 장치가 아닙니다. 이름에 보드가 들어간다고 모두 같은 계열이 아니라는 점을 노린 문제입니다."},{"i":77,"q":"요트의 돛에 작용하는 힘 중 양력(Lift)을 가장 잘 설명한 것은?","o":["바람의 흐름과 평행하게 작용하는 힘","바람의 흐름에 수직으로 작용하며 요트를 앞으로 나아가게 하는 힘","요트의 진행 방향과 반대 방향으로 작용하는 저항","돛의 하단에서 발생하는 마찰력"],"a":1,"e":"양력(Lift)는 돛의 양면에서 속도 차이로 인해 생기는 압력차로 발생하며, 이 힘의 일부가 추진력으로 전환 되어 요트를 전진시킨다.","c":"요트·의장","t":"new","x":"양력은 돛 양면을 지나는 공기의 속도 차이로 생기는 압력차 때문에, 바람의 흐름에 수직인 방향으로 작용하는 힘입니다. 이 힘을 배의 진행 방향과 옆 방향으로 분해하면 각각 전진력과 횡류력이 됩니다. 덕분에 요트는 바람이 옆이나 비스듬히 앞에서 불어도 앞으로 나아갈 수 있습니다. 흐름과 나란히 작용하는 힘은 항력입니다."},{"i":78,"q":"헤드세일에 대한 내용으로 가장 옳지 않은 것은?","o":["선수 쪽에 있는 세일을 칭한다.","제노아, 집, 스톰으로 나뉜다.","일반 집은 선수 쪽에 위치한 삼각돛으로 강풍에서 사용된다.","제노아는 일반 집 세일의 120% 이상 면적이다."],"a":2,"e":"","c":"요트·의장","x":"헤드세일 중 일반 집은 선수 쪽 삼각돛으로 평상시 범주에 쓰는 돛입니다. 강풍에서 쓰는 것은 면적을 크게 줄이고 두꺼운 천으로 만든 스톰 집이므로, 일반 집이 강풍용이라는 설명은 틀립니다. 제노아는 집보다 커서 메인세일과 겹칠 정도의 면적(대개 100% 초과, 120% 이상 등급도 있음)으로 약풍에서 씁니다. 풍속에 따른 돛 선택 순서로 이해하면 쉽습니다."},{"i":79,"q":"요트 외부의 명칭에 대한 설명 중 옳지 않은 것은?","o":["블록(Block) - 활차, 선박용 도르레","로프 클러치(Rope clutch) - 손잡이를 눌러서 내측의 로프가 자유롭게 움직이도록 하는 장치","집 페어리드(Jip fairlead) - 집 세일의 적절한 캠버를 맞추기 위해 시트의 방향을 유도하는 블록","무어링 클리트(Mooring cleat) - 계류용 밧줄걸이"],"a":1,"e":"","c":"범주·조종","x":"로프 클러치는 당긴 로프를 물어 고정해 두었다가 손잡이를 올려 풀어 주는 장치입니다. 즉 손잡이를 눌러 잠그는 쪽이 기본 동작이고, 눌러서 로프가 자유롭게 움직이게 한다는 설명은 기능을 반대로 적은 것입니다. 블록은 도르래, 집 페어리드는 시트의 방향을 잡아 주는 부품, 무어링 클리트는 계류줄 걸이로 나머지 설명은 모두 맞습니다."},{"i":80,"q":"요트의 풍압중심(CE)과 횡저항 중심(CLR)의 위치에 따라 발생하는 것으로, 풍압중심(CE)이 횡저항 중심(CLR)보다 선미쪽에 치우쳐 있을 때 요트의 선수가 바람이 부는 쪽으로 돌려는 성질을 무엇이라 하는가?","o":["웨더헬름(Weather helm)","리헬름(Lee helm)","다운윈드 드리프트(Downwind drift)","빔 리치(Beam reach)"],"a":0,"e":"풍압중심(CE)이 횡저항 중심(CLR)보다 선미쪽에 치우쳐 있어, 선체를 풍하측으로 미는 힘인 횡류력이 횡저항 중심(CLR)을 기점으로 하여 선미를 풍하 측으로 밀게 되므로 선수가 풍상측으로 돌게 된다. 이것을 웨더 헬름이라 한다.","c":"범주·조종","t":"new","x":"웨더헬름은 돛에 작용하는 힘의 중심인 풍압중심(CE)이 물속 저항의 중심인 횡저항중심(CLR)보다 뒤쪽에 있을 때, 선미가 풍하로 밀리면서 선수가 바람 쪽으로 돌려는 성질입니다. 약간의 웨더헬름은 돌풍에서 배가 스스로 바람 쪽으로 향해 힘을 흘리므로 안전하다고 봅니다. 반대 배치가 되면 리헬름이 되어 위험합니다."},{"i":81,"q":"갑판상 가장 중요한 활동 공간이며 휠(Wheel) 또는 키(Tiller)에 의해서 요트를 조종하는 공간을 부르는 명칭으로 가장 옳은 것은?","o":["잭스테이(Jackstay)","트렌섬(Transom)","콕핏(Cockpit)","캐빈(Cabin)"],"a":2,"e":"- 잭스테이(Jackstay) : 단독으로 마스트를 보조하기 위해 앞 갑판에서 마스트까지 연결된 스테이. - 트렌섬(Transom) : 선체의 가장 뒤에 배치되는 횡강력 재로 통상 선미부분. - 캐빈(Cabin) : 선실","c":"요트·의장","x":"콕핏은 조종자가 앉아 휠이나 틸러로 배를 조종하고 시트를 다루는 갑판 위의 공간입니다. 승선자 대부분이 항해 중 머무는 활동 중심 공간이기도 합니다. 캐빈은 선실, 트랜섬은 선미의 끝단 구조, 잭스테이는 갑판에서 안전줄을 걸고 이동하도록 설치한 줄이라 각각 위치와 기능이 다릅니다."},{"i":82,"q":"복원력에 대한 설명으로 옳은 것은?","o":["요트가 횡경사 후 원래 자세로 돌아가려는 힘","요트가 회전할 때의 추진력","요트가 풍상쪽으로 향하려는 성질","요트의 직진 안정성"],"a":0,"e":"복원력(restoring force)은 요트가 기울었을 때 원래 자세로 돌아가려는 힘으로 요트의 무게중심(G)와 부력의 중심(B)에 따라 결정된다.","c":"범주·조종","t":"new","x":"복원력은 요트가 바람이나 파도로 기울었을 때 원래 자세로 돌아오려는 힘입니다. 무게중심과 부력중심의 위치 관계로 결정되며, 킬에 밸러스트를 넣어 무게중심을 낮추면 커집니다. 딩기처럼 밸러스트가 없는 배는 승무원이 풍상 쪽으로 몸을 내미는 하이크 아웃으로 복원력을 보태 균형을 잡습니다."},{"i":83,"q":"요트의 의장 중 캠버(camber)를 바르게 설명한 것은?","o":["돛대에서 선수(船首) 쪽으로 연결된 돛대 지지용 와이어","돛의 텍 부분 위에 짧은 간격으로 있는 구멍","돛을 끌어올리고 내리는데 사용하는 로프","돛의 볼록한 곡률 모양"],"a":3,"e":"","c":"요트·의장","x":"캠버는 돛이 바람을 받았을 때 생기는 볼록한 곡률, 즉 돛의 배부름 정도를 뜻합니다. 캠버가 깊으면 힘은 세지만 저항이 커지고, 얕으면 강풍에서 안정적입니다. 돛대를 앞쪽에서 잡아 주는 와이어는 포스테이, 돛을 올리고 내리는 로프는 핼야드이므로 다른 보기와 혼동하면 안 됩니다. 캠버 조절은 아웃홀·커닝햄·백스테이로 한다는 점까지 묶어 기억하세요."},{"i":84,"q":"요트를 돛대와 돛의 수에 따른 분류 방법에 해당하지 않은 것은?","o":["커터(Cutter)","슬루프(Sloop)","더블 차인(Double chine)","스쿠너(Schooner)"],"a":2,"e":"요트는 돛의 수에 따라 캣, 슬루프, 커터, 욜, 케치, 스쿠너 요트로 분류한다. - 캣(cat) 요트: 1개의 돛대와 세일 1장을 설치한 요트 - 슬루프(sloop) 요트: 1개의 돛대와 세일 2장을 설치한 요트 - 커터(cutter) 요트: 1개의 돛대에 메인 세일 1장, 집 세일 2장을 설치한 요트 - 스쿠너(schooner) 요트: 2개 이상의 돛대를 갖추고 있으며, 작은 돛대가 앞에 위치 - 케치(ketch) 요트: 2개의 돛대가 있으며, 선수 쪽 돛대가 선미 쪽 돛대보다 높음 - 욜(yawl) 요트: 2개의 돛대가 있으며, 선미 쪽 돛대가 요트의 키(rudder)보다 뒤쪽에 위치 *더블 차인(double chine): 요트 선저 형상에 따른 분류 중 하나이다.","c":"요트·의장","t":"chg","x":"돛대와 돛의 수에 따른 분류는 캣, 슬루프, 커터, 욜, 케치, 스쿠너입니다. 더블 차인은 선저 바닥과 옆면이 만나는 모서리가 두 줄인 형상을 뜻하는 선체 형상 분류라 이 계열에 들어가지 않습니다. 분류의 '기준'이 무엇인지 묻는 유형이므로, 돛 기준과 선체 기준을 나눠 정리해 두면 됩니다."},{"i":85,"q":"횡류방지장치를 장착한 요트 중, 복원력이 가장 우수한 것은?","o":["디프 킬(Deep keel)","피벗 보드(Pivot board)","대거 보드(Dagger board)","센터 보드(Center board)"],"a":0,"e":"- 디프 킬(deep keel): 선체 자체의 용골(keel)이 중앙의 물 밑으로 깊게 잠기게 건조한 것으로, 그 부분에 밸러스트(ballast)를 채워서 오뚝이와 같은 형태로 만든 것. 복원성 및 횡류 방지에 우수 - 센터 보드(center board): 선체 중앙 하부에 구멍을 뚫고 물이 스며들지 않도록 케이스를 설치한 한 후, 그 곳에 올렸다, 내렸다 할 수 있 횡류방지 장치(board)를 장착한 것. 비벗 보드, 대거 보드가 센터 보드의 한 종류이다. - 피벗 보드(pivot board): 케이스와 보드에 축을 장착하여 올리고 내림을 편리하게 만든 것 - 대거 보드(dagger board): 칼집에서 칼을 꽂거나 뽑듯이, 케이스에 보드를 필요에 따라 올렸다 내릴 수 있도록 만든 것","c":"범주·조종","t":"chg","x":"디프 킬은 용골 자체를 물속 깊이 잠기게 만들고 그 안에 밸러스트를 채운 구조라, 무게중심이 아주 낮아 오뚝이처럼 잘 일어섭니다. 그래서 횡류 방지와 복원성 모두 가장 우수합니다. 반면 센터 보드·대거 보드·피벗 보드는 필요할 때 올리고 내리는 판이라 횡류는 막아 주지만 무게로 복원력을 만들지는 못합니다."},{"i":86,"q":"선체의 균형에 대한 설명이다. ( )에 알맞은 말은? 선체의 전․후 방향 경사를 (\n㉠ )이라 하며, 좌․우 방향 경사를 (\n㉡ )이라 한다.","o":["㉠ 요(Yaw), ㉡ 피치(Pitch)","㉠ 요(Yaw), ㉡ 서지(Surge)","㉠ 트림(Trim), ㉡ 힐(Heel)","㉠ 히브(Heave), ㉡ 롤(Roll)"],"a":2,"e":"선체의 전․후 방향 경사를 (트림)이라 하며, 좌․우 방향 경사를 (힐)이라고 한다. 요(yaw), 피치(pitch), 롤(roll), 서지(surge), 히브(heave)는 선박의 운동을 나타내는 용어이다.","c":"범주·조종","t":"new","x":"트림은 선수와 선미의 앞뒤 방향 경사, 힐은 좌우 방향으로 기우는 경사를 말합니다. 트림은 승선자와 짐의 전후 배치로, 힐은 승무원의 좌우 이동과 돛의 트림으로 조절합니다. 요·피치·롤·서지·히브는 배가 흔들리는 여섯 가지 운동을 가리키는 말이라 정적인 경사 상태를 나타내는 용어와는 구분됩니다."},{"i":87,"q":"세일의 세 개 꼭지점을 부르는 명칭은?","o":["헤드, 크루, 택","러프, 헤드, 크루","러프, 택, 크루","헤드, 크루, 풋"],"a":0,"e":"","c":"요트·의장","x":"삼각돛의 세 꼭짓점은 맨 위가 헤드, 앞 아래가 택, 뒤 아래가 클루(크루)입니다. 반면 세 변은 앞쪽 러프, 뒤쪽 리치, 아래쪽 풋으로 부릅니다. 즉 러프와 풋은 '변'이므로 꼭짓점 보기에 섞여 있으면 오답입니다. 점과 변을 서로 섞어 놓는 방식으로 반복 출제되니 그림을 떠올리며 구분해 두세요."},{"i":88,"q":"돛대의 선수에 고정되는 와이어를 말하며 헤드스테이라고도 하는 것은 어느 것인가?","o":["포어스테이(fore stay)","슈라우드(shroud)","백스테이(back stay)","사이드스테이(side stay)"],"a":0,"e":"‘포어스테이’는 선수로부터 돛대의 상부까지 이어지는 와이어로 돛대를 세우는데 필요하다.","c":"요트·의장","x":"포어스테이(헤드스테이)는 선수에서 마스트 상부로 이어져 돛대가 뒤로 넘어가지 않게 잡아 주는 와이어이며, 집 세일을 여기에 답니다. 백스테이는 선미에서 마스트를 뒤로 당기고, 슈라우드(사이드스테이)는 좌우에서 지지합니다. 앞·뒤·옆 세 방향에서 마스트를 잡아 주는 구조로 이해하면 이름이 헷갈리지 않습니다."},{"i":89,"q":"( ) 안에 들어갈 알맞은 용어가 순서대로 짝지어진 것은? 세일의 명칭을 크게 보면 메인세일, 집세일, 스피네이커로 구분된다. 집세일과 메인세일은 모두 삼각형의 형태를 가지고 있으며 바람이 들어오는쪽 면을 ( )라고 하고, 바람이 흘러 나가는 쪽을 ( )이라 한다","o":["시트, 캠버","러프, 리치","리치, 풋","피크, 클루(clew)"],"a":1,"e":"바람이 들어오는쪽 면을 러프(luff)라고 하고, 바람이 흘러 나가는 쪽을 리치(leech)이라 한다","c":"요트·의장","x":"삼각돛에서 바람이 먼저 닿는 앞쪽 변이 러프, 바람이 흘러 나가는 뒤쪽 변이 리치, 아래쪽 변이 풋입니다. 러프의 형태와 장력이 돛의 앞부분 모양을, 리치의 장력이 뒷부분 모양을 좌우하므로 트림에서 늘 함께 다루는 개념입니다. 꼭짓점은 헤드·택·클루라는 점과 묶어 외우면 명칭 문제를 한 번에 정리할 수 있습니다."},{"i":90,"q":"돛을 묶어 돛대에 걸어 올리는 밧줄의 명칭은?","o":["헬려드(Halyard)","시트(Sheet)","픽크(Peak)","러프(Luff)"],"a":0,"e":"","c":"요트·의장","t":"chg","x":"핼야드는 돛을 돛대 꼭대기로 끌어올리고 내리는 데 쓰는 밧줄입니다. 시트는 올린 돛의 각도를 조절해 당기는 줄이라 역할이 다릅니다. 러프는 돛의 앞쪽 변, 픽크는 돛 상부의 명칭이므로 밧줄이 아닙니다. '올리는 줄은 핼야드, 당기는 줄은 시트'로 짝지어 외우면 관련 문제를 한 번에 정리할 수 있습니다."},{"i":91,"q":"명칭과 방향에 대한 내용으로 가장 옳지 않은 것은?","o":["ahead : 배가 나아가는 선수방향","starboard bow : 우현의 선미부분","astern : 배의 정 후미부분","port beam : 좌현의 측면부분"],"a":1,"e":"","c":"요트·의장","x":"starboard bow는 우현의 선수 쪽 부분을 뜻하므로, 이를 우현의 선미 부분이라고 한 설명은 틀립니다. 선미 쪽은 starboard quarter라고 부릅니다. ahead는 선수 방향, astern은 정 후방, beam은 정횡(측면)이며 여기에 port(좌현)와 starboard(우현)를 붙여 위치를 나타냅니다. bow-beam-quarter를 앞·옆·뒤 순서로 외워 두면 됩니다."},{"i":92,"q":"단추진기(프로펠러 1개)를 장착한 요트가 정지 상태에서 전진이나 후진 엔진을 사용할 때 선미가 한쪽 으로 돌아가려는 현상을 무엇이라 하는가?","o":["프롭워크(Prop walk)","플로깅(Flogging)","러핑(Luffing)","베어링 어웨이(Bearing away)"],"a":0,"e":"- 프롭워크(Prop walk): 정지 상태에서 전진이나 후진 엔진을 사용할 때 선미가 한쪽으로 돌아가는 현상 - 플로깅(Flogging): 돛이 깃발처럼 펄럭이는 현상 - 러핑(Luffing): 바람이 부는 쪽(풍상측)으로 요트가 돌아가려는 현상 - 베어링 어웨이(Bearing away): 풍하측으로 요트가 돌아가려는 현상","c":"기관·전기","t":"new","x":"프롭워크는 프로펠러가 하나인 배에서 회전하는 날개가 물을 옆으로도 밀어내기 때문에, 정지 상태에서 전진이나 후진을 걸면 선미가 한쪽으로 밀리는 현상입니다. 특히 후진할 때 뚜렷하게 나타납니다. 이 성질을 미리 알고 있으면 좁은 계류장에서 오히려 회두에 이용할 수 있어, 접·이안 조종의 기본 요소로 다뤄집니다."},{"i":93,"q":"요트가 범주하기 위한 준비로 속구, 의장 등을 설치하는 것을 무엇이라 하는가?","o":["범장","범준","범비","해장"],"a":0,"e":"","c":"범주·조종","x":"범장은 요트가 범주할 수 있도록 돛대·돛·삭구 등 속구와 의장을 갖추어 설치하는 것을 말합니다. 출항 전 마스트를 세우고 세일을 달아 시트를 연결하는 일련의 준비 과정이 여기에 해당합니다. 나머지 보기는 실제로 쓰이지 않는 말이라 용어 자체를 알고 있는지 묻는 문제입니다. 범장·범주(세일링)·범주법의 뜻을 함께 정리해 두세요."},{"i":94,"q":"메인세일을 좌우로 움직일 때 위치 조절이 용이하도록 해주는 장치는?","o":["아웃홀(outhaul)","캠클리트(cam cleat)","붐뱅(boom vang)","트레블러(traveller)"],"a":3,"e":"","c":"요트·의장","x":"트레블러는 메인시트의 아래쪽 고정점을 좌우로 옮길 수 있게 만든 레일 장치입니다. 시트를 더 당기지 않고도 붐의 좌우 위치를 바꿀 수 있어, 돛의 트위스트는 유지하면서 받음각만 조절할 수 있습니다. 아웃홀은 풋의 장력, 붐뱅은 붐이 들리는 것, 캠클리트는 로프 고정을 담당하므로 조절 대상이 서로 다릅니다."},{"i":95,"q":"선체가 하나로 된 보편적인 선형이며 선회성능이 좋고 부력이 큰 특성을 갖는 선체를 말하는 것은?","o":["캐터마란(Catamaran)","트라이마란(Trimaran)","모노헐(Monohull)","플랫 보틈(Plat bottom)"],"a":2,"e":"‘캐터마란’은 선체가 두 개로, ‘트라이마란’은 선체가 세 개로 이루어진 형태이다.","c":"요트·의장","x":"모노헐은 선체가 하나인 가장 보편적인 형태로, 물에 잠긴 부피가 한곳에 모여 있어 부력이 크고 선회 성능이 좋습니다. 대신 폭이 좁아 캐터마란보다 옆으로 잘 기울기 때문에, 킬에 밸러스트를 넣어 복원력을 확보합니다. 선체 수에 따른 분류는 모노헐 1개, 캐터마란 2개, 트라이마란 3개로 정리해 두면 됩니다."},{"i":96,"q":"선체가 세 개로 된 형태의 요트를 부르는 명칭은?","o":["캐터마란(Catamaran)","트라이마란(Trimaran)","모노헐(Monohull)","플랫 보텀(Plat bottom)"],"a":1,"e":"","c":"요트·의장","x":"트라이마란은 가운데 주선체 양옆에 작은 보조 선체를 단 삼동선입니다. 선체가 셋이라 복원성이 매우 좋고 속도도 빠릅니다. 캐터마란은 두 개, 모노헐은 하나이며 플랫 보텀은 선저 형상 분류입니다. 숫자만 바꿔 반복 출제되는 유형이므로 모노-캐터-트라이를 1·2·3으로 기억해 두면 실수하지 않습니다."},{"i":97,"q":"미풍용으로 사용되는 큰 집 세일은?","o":["스톰 집(Storm jib)","제노아(Genoa)","레이팅(Rating)","리깅(Rigging)"],"a":1,"e":"집 세일은 크기에 따라 제노아 집, 정규 집, 스톰 집으로 구분한다.","c":"요트·의장","x":"제노아는 집 세일 중 면적이 가장 큰 돛으로, 메인세일과 겹칠 만큼 크게 만들어 약한 바람에서도 충분한 추진력을 얻습니다. 집 세일은 크기 순으로 제노아, 정규 집, 스톰 집으로 나뉘며 바람이 세질수록 작은 돛으로 바꿔 답니다. 레이팅은 요트의 성능 지수, 리깅은 삭구 전체를 뜻하는 말이라 돛 이름이 아닙니다."},{"i":98,"q":"요트를 돛대와 돛의 수에 따라 분류하였다. 돛대가 한 개인 것은 어느 것인가?","o":["욜(Yawl) 요트","캣(Cat) 요트","케치(Ketch) 요트","스쿠너(Schooner) 요트"],"a":1,"e":"‘욜’과 ‘케치’는 돛대가 두 개이고, ‘스쿠너’는 두 개 이상이다.","c":"요트·의장","x":"캣 요트는 돛대 하나에 돛 한 장만 다는 가장 단순한 형태입니다. 욜과 케치는 돛대가 두 개이고, 스쿠너는 두 개 이상이라 모두 캣과 구분됩니다. 참고로 돛대가 하나인 요트에는 돛 두 장을 다는 슬루프, 집 세일을 두 장 다는 커터도 있습니다. '돛대 수'와 '돛 수'를 각각 세어 보는 방식으로 접근하면 됩니다."},{"i":99,"q":"세일링 요트의 항해장치에 속하지 않는 것은?","o":["나침의","경사계","스토퍼","GPS"],"a":2,"e":"스토퍼는 시트를 고정하게 하는 장치로 사용되며, 항해장치가 아니라 세일조절장치에 속한다","c":"범주·조종","x":"항해장치는 배의 위치와 방향, 상태를 파악하는 계기로 나침의, 경사계, GPS, 선속계, 측심기 등이 해당합니다. 스토퍼는 당긴 시트를 물어 고정해 두는 부품이라 세일 조절 장치에 속합니다. '무엇을 알려 주는 장비인가, 무엇을 조작하는 부품인가'로 나누면 이런 유형은 쉽게 걸러집니다."},{"i":100,"q":"요트의 횡류를 방지하기 위한 장치로서, 선체 중앙부에 구멍을 뚫고 거기에 물이 스며들지 않도록 케이스를 설치한 다음, 횡류방지를 위한 보드(board)를 내렸다 올렸다 할 수 있도록 설치한 것을 무엇이라 하는가?","o":["리 보드(lee board)","핀 킬(fin keel)","센터 보드(center board)","디프 킬(deep keel)"],"a":2,"e":"","c":"요트·의장","t":"new","x":"센터 보드는 선체 중앙에 센터보드 케이스를 설치하고 그 안에서 보드를 올리고 내릴 수 있게 만든 횡류방지장치입니다. 수심이 얕은 곳에서는 올리고 범주할 때는 내려 사용할 수 있어 딩기에 많이 쓰입니다. 리 보드는 현측에 다는 방식, 핀 킬과 디프 킬은 고정식 용골이라 올리고 내릴 수 없습니다. '올렸다 내렸다'는 표현이 나오면 센터 보드입니다."},{"i":101,"q":"요트 횡류 방지 장치이면서 요트가 전복되었을 때 사람이 이것을 밟고 올라서 요트를 다시 세울 때 사용할 수 있는 의장품은?","o":["대거보드(Dagger board)","틸러(Tiller)","휠(Wheel)","러더(Rudder)"],"a":0,"e":"대거보드는 칼집에 칼을 꽂듯이 보드를 내렸다 올렸다 할 수 있는 차입식 센터보드로, 요트 전복시 사람이 밟고 올라서 요트를 세울 때도 사용한다.","c":"범주·조종","t":"new","x":"대거 보드는 칼집에 칼을 꽂듯 수직으로 넣고 빼는 차입식 센터보드입니다. 물속으로 내리면 횡류를 막아 주고, 딩기가 전복되었을 때는 물 밖으로 드러난 이 판을 밟고 올라서서 체중으로 배를 다시 일으켜 세울 수 있습니다. 틸러와 휠은 조타 장치, 러더는 방향을 바꾸는 키라 용도가 다릅니다."},{"i":102,"q":"요트의 방향을 전환하는데 사용되는 것은?","o":["가이(guy)","블록(block)","슈라우드(shroud)","키(rudder)"],"a":3,"e":"","c":"범주·조종","x":"요트의 방향 전환은 선미에 달린 러더(키)를 좌우로 꺾어 물의 흐름을 받아 선체를 돌리는 방식으로 이루어집니다. 조종자는 틸러나 휠로 러더를 움직입니다. 가이는 스피네커 폴을 잡아 주는 줄, 블록은 도르래, 슈라우드는 돛대를 좌우에서 지지하는 와이어라 조타와 무관합니다. 다만 요트는 러더뿐 아니라 세일 트림으로도 침로가 변한다는 점을 함께 알아 두세요."},{"i":103,"q":"요트의 범장품 중 배튼(batten)이 하는 역할은?","o":["돛을 평평하게 펴준다.","범주 중 풍속을 알려준다.","횡류를 방지해준다.","돛의 기울기를 조정해준다."],"a":0,"e":"‘배튼’이란 돛의 리치(leech) 부분을 펴기 위해서 사용되는 가늘고 긴 나무나 플라스틱제의 얇은 판","c":"범주·조종","x":"배튼은 돛의 뒤쪽 변인 리치에 만들어진 주머니에 끼워 넣는 가늘고 긴 판입니다. 천만으로는 뒤쪽이 오그라들어 말리기 때문에, 배튼을 넣어 돛을 평평하게 펴 주어야 설계된 곡면이 유지되고 양력이 제대로 발생합니다. 풍속을 알려 주는 것은 텔테일과 풍향풍속계, 횡류를 막는 것은 킬과 센터보드라 기능이 다릅니다."},{"i":104,"q":"마스트에 돛을 끼워 올리는 가느다란 홈을 말하는 용어는?","o":["구즈넥(Goose neck)","아웃홀(Out haul)","리프로프(Reef rope)","그루브(Groove)"],"a":3,"e":"","c":"요트·의장","x":"그루브는 마스트나 붐에 파여 있는 가느다란 홈으로, 돛의 러프에 달린 볼트로프를 끼워 넣어 돛을 올릴 수 있게 해 줍니다. 구즈넥은 붐을 마스트에 연결하는 관절 금구, 아웃홀은 풋을 뒤로 당겨 팽팽하게 하는 장치, 리프로프는 돛을 줄일 때 쓰는 줄입니다. 돛을 '끼워 올리는 홈'이라는 표현이 그루브의 정의입니다."},{"i":105,"q":"요트 명칭에 대한 내용 중 옳지 않은 것은?","o":["러프(ruff) - 세일의 세로변","리치(leech) - 세일의 빗변","클루(clew) - 세일의 러프와 리치가 만나는 맨 위 꼭지점","택(tack) - 세일의 풋과 러프가 직각으로 만나는 꼭지점"],"a":2,"e":"클루는 세일의 리치와 풋이 만나는 꼭지점","c":"요트·의장","x":"클루는 세일의 뒤쪽 변인 리치와 아래쪽 변인 풋이 만나는 아래 꼭짓점입니다. 맨 위 꼭짓점은 헤드이므로 보기 3의 설명이 틀렸습니다. 세일의 세 변은 러프(앞)·리치(뒤)·풋(아래), 세 꼭짓점은 헤드(위)·택(앞 아래)·클루(뒤 아래)로 짝지어 외우면 이런 유형이 한 번에 정리됩니다."},{"i":106,"q":"한 개의 마스트에 메인세일(Main sail)과 집세일(Jib sail)을 각각 한 장씩 의장한 요트를 나타내는 것은?","o":["슬루프(Sloop)","커터(Cutter)","욜(Yawl)","케치(Ketch)"],"a":0,"e":"‘슬루프’는 ‘캣’과 함께 세일보트에서 가장 보편화된 것으로, 한 개의 돛대에 두 장의 돛을 의장한 것이다.","c":"요트·의장","x":"슬루프는 돛대 하나에 메인세일과 집세일을 각각 한 장씩 다는 형태로, 오늘날 세일링 요트에서 가장 보편적인 구성입니다. 두 돛 사이의 슬롯 효과로 추진력이 커지고 조작도 비교적 단순합니다. 커터는 같은 돛대에 집 세일을 두 장, 욜과 케치는 돛대를 두 개 갖추므로 구성이 더 복잡합니다."},{"i":107,"q":"바람이 강할 때 상체를 뱃전으로 내밀어 요트의 균형을 잡는 데 취하는 동작을 무엇이라 하는가?","o":["아웃 홀(Out haul)","자이빙(Gybing)","리핑(Reefing)","하이크 아웃(Hike out)"],"a":3,"e":"하이크 아웃(hike out): 선체의 경사를 줄이기 위해 크루(crew)가 경사 반대 뱃전에서 균형을 잡는 것","c":"범주·조종","t":"new","x":"하이크 아웃은 바람이 강해 배가 기울 때 크루가 경사 반대쪽, 즉 풍상 뱃전으로 상체를 내밀어 체중으로 균형을 잡는 동작입니다. 밸러스트가 없는 딩기에서는 이 동작이 복원력의 핵심이라, 발을 스트랩에 걸고 몸을 최대한 밖으로 눕히기도 합니다. 리핑이 돛을 줄여 힘을 낮추는 방법이라면, 하이크 아웃은 체중으로 맞서는 방법입니다."},{"i":108,"q":"빈칸에 들어갈 순서로 옳은 것은 ? 세일의 주위에 공기가 흐를 때 돛을 경계로 하여 풍상측의 공기 속도는 (\n① ), 풍하측의 공기 속도는 (\n② ). 그러므로 (\n③ )에 의하여 풍하측 으로 흡인력이 발생하게 되는데 이를 (\n④ ) 이라고 한다.","o":["①빠르고, ②느려진다, ③베르누이정리, ④전진력","①느리고, ②빨라진다, ③베르누이정리, ④총합력","①빠르고, ②느려진다, ③보일의 법칙, ④횡류력","①느리고, ②빨라진다. ③보일의법칙, ④총합력"],"a":1,"e":"","c":"범주·조종","x":"돛은 공기 중의 날개와 같아서, 볼록한 풍하측을 지나는 공기는 거리가 길어 속도가 빨라지고 풍상측은 상대적으로 느립니다. 베르누이 정리에 따라 속도가 빠른 풍하측의 압력이 낮아지므로 돛은 풍하 쪽으로 빨려 들어가는 힘을 받습니다. 이렇게 생긴 힘 전체를 총합력이라 하고, 이를 분해하면 전진력과 횡류력이 됩니다. 보일의 법칙으로 바꿔 놓은 보기가 함정입니다."},{"i":109,"q":"다음은 선박 조난신호 용구이다. 가장 멀리서 볼 수 있는 신호는?","o":["로켓 낙하산 화염신호","신호 홍염","신호 거울","호각"],"a":0,"e":"로켓 낙하산 화염신호는 고도 300m 이상 올라가야 하며, 화염신호는 초당 5m 이하의 비율로 낙하하여야 하고, 연소시간은 40초 이상 되어야 하므로 가장 멀리서도 볼 수 있다.","c":"통신","x":"로켓 낙하산 화염신호는 300미터 이상 높이로 쏘아 올려 초당 5미터 이하로 천천히 떨어지면서 40초 이상 타오릅니다. 높이 올라가고 오래 타므로 수십 킬로미터 밖에서도 보여 조난 신호 중 가장 멀리 도달합니다. 신호 홍염은 손에 들고 태우는 근거리용, 신호 거울은 햇빛이 있어야 하고, 호각은 소리라 도달 거리가 짧습니다."},{"i":110,"q":"선저에 두 개로 나누어서 흘수를 낮추고 상가 시 선체를 안전하게 놓을 수 있는 형의 킬은 무엇인가?","o":["터틀 백(Turtle bag)","턴버클(Turnbuckle)","롱킬(Long keel)","트윈 킬(Twin keel)"],"a":3,"e":"‘keel'(용골)은 횡류방지와 복원성을 좋게 하는 장치로 요트의 안정성을 높인다.","c":"범주·조종","x":"트윈 킬은 선저에 킬을 두 개로 나눠 단 형태로, 하나짜리보다 흘수를 얕게 할 수 있고 상가하거나 갯벌에 얹었을 때 두 다리로 선체를 똑바로 세워 놓을 수 있습니다. 조차가 큰 해역에서 유리한 구조입니다. 롱킬은 선저를 따라 길게 이어진 형태이고, 턴버클은 스테이 장력 조절 부품이라 계열이 다릅니다."},{"i":111,"q":"한 개의 돛대에 한 장의 돛을 의장한 요트로 딩기정일 경우 1인승 요트로서 초보자에게 적합한 것은 무엇인가?","o":["욜(Yawl) 요트","커터(Cutter) 요트","캣(Cat) 요트","케치(Ketch) 요트"],"a":2,"e":"","c":"요트·의장","x":"캣 요트는 돛대 하나에 돛 한 장만 다는 가장 단순한 구조입니다. 조작할 줄이 적어 혼자서도 다루기 쉬우므로 1인승 딩기와 입문용으로 널리 쓰입니다. 커터는 돛대 하나에 집 세일 두 장, 케치와 욜은 돛대가 두 개라 초보자용으로는 복잡합니다. 돛대 수와 돛 수 조합으로 요트 종류를 구분하는 문제와 함께 정리해 두세요."},{"i":112,"q":"세일을 유지하기 위한 장치인 붐(boom)과 관계가 없는 것은?","o":["구스넥","배튼","아웃홀","붐뱅"],"a":1,"e":"","c":"요트·의장","x":"배튼은 메인세일의 리치 쪽에 끼워 돛의 뒤쪽 곡선을 펴 주는 얇고 긴 판으로, 붐이 아니라 돛에 붙는 부품입니다. 구스넥은 붐과 마스트를 잇는 금구, 아웃홀은 붐을 따라 돛의 풋을 당기는 장치, 붐뱅은 붐이 위로 들리는 것을 눌러 주는 장치라 모두 붐과 직접 연결됩니다. '붐에 붙는 것'을 묶어 외우면 배튼만 남습니다."},{"i":113,"q":"요트의 횡경사(Heeling) 현상이 심해지면 나타나는 현상으로 옳은 것은?","o":["항속이 빠라진다","양력이 감소하고 조종성이 저하된다.","풍압중심이 낮아져 안정성이 높아진다.","직전성이 좋아진다."],"a":1,"e":"횡경사 각이 커지면 돛의 유효 투영 면적이 줄고, 선체의 수중형상이 변해 키의 효율도 떨어진다. 따라서 속도가 줄고, 조종성이 저하된다.","c":"요트·의장","t":"new","x":"횡경사가 커지면 돛이 바람을 받는 유효 면적이 줄어 양력이 감소하고, 선체의 수중 형상이 비대칭으로 일그러져 러더의 효율까지 떨어집니다. 그 결과 속도와 조종성이 함께 나빠지고 웨더헬름이 강해집니다. 그래서 기울일수록 빨라진다는 생각은 잘못이며, 적정 각도를 넘으면 리핑이나 하이크 아웃으로 경사를 줄여야 합니다."},{"i":114,"q":"요트에서 트림(Trim) 조절의 주된 목적을 가장 잘 설명한 것은?","o":["돛의 마모를 줄이기 위함","양력을 극대화하고 항력을 최소화하기 위함","돛을 항상 바람과 수직으로 유지하기 위함","돛을 선체 중심선에 고정하기 위함"],"a":1,"e":"트림(Trim) 조절의 주된 목적은 풍압중심(CE)와 횡저항 중심(CLR)의 균형을 맞춰 웨더헬름(Weather helm)을 완화하고, 돛 표면의 공기흐름을 매끄럽게 유지하여 충분한 양력(Lift)이 생기게 하기 위함","c":"안전·응급","t":"new","x":"트림 조절의 목적은 돛 표면을 지나는 공기 흐름을 매끄럽게 유지해 양력을 키우고 항력은 줄이는 것입니다. 동시에 풍압중심과 횡저항중심의 균형을 맞춰 과도한 웨더헬름을 완화하는 역할도 합니다. 시트, 아웃홀, 커닝햄, 트레블러가 모두 이 목적을 위한 도구이며, 텔테일이 트림 상태를 확인하는 지표가 됩니다."},{"i":115,"q":"메인 세일(Main sail)과 집 세일(Jib sail) 사이의 틈을 의미하며, 두 세일 사이의 공기흐름을 조절하여 양력을 크게 하는 역할을 하는 현상을 무엇이라 하는가?","o":["슬롯 효과(Slot effect)","댐핑 효과(Damping effect)","스핀 효과(Spin effect)","홀 효과(Hall effect)"],"a":0,"e":"슬롯(slot)은 메인 세일과 집 세일 사이의 틈을 의미하며, 이 틈의 간격에 따라 양력의 크기가 달라진다.","c":"요트·의장","t":"new","x":"슬롯 효과는 메인세일과 집세일 사이의 틈으로 공기가 지나면서 흐름이 가속되고 정리되어, 메인세일 풍하면의 압력이 더 낮아지는 현상입니다. 그 결과 두 돛을 따로 쓸 때보다 전체 양력이 커집니다. 틈이 너무 좁으면 흐름이 막히고 너무 넓으면 효과가 사라지므로, 집 시트와 리드 위치로 간격을 조절합니다."},{"i":116,"q":"요트 항해 용어 중 옳지 않은 것은?","o":["러닝(running) : 뒤에서 바람을 받아 달리는 상태","러핑(luffing) : 보다 풍상으로 코스를 바꾸는 것","빔 리치(beam reach) : 바람 방향과 180도 각도로 범주하는 상태","시버(shiver) : 돛이 바람에 나부끼는 상태"],"a":2,"e":"빔 리치는 바람 방향과 90도 각도로 범주하는 상태를 말한다.","c":"범주·조종","x":"빔 리치는 바람을 배의 옆면, 즉 90도 방향에서 받으며 달리는 상태입니다. 180도로 바람을 받는 것은 뒤에서 바람을 받는 러닝이므로 보기 3이 틀렸습니다. 범주 상태는 바람 각도에 따라 클로스홀드(약 45도), 클로스리치, 빔리치(90도), 브로드리치, 러닝(180도)으로 이어지며, 각도와 이름을 함께 외워야 합니다."},{"i":117,"q":"세일 앞뒤에 부착되어 바람에 날려 바람의 흐름을 판단하며, 세일의 트림상태를 알 수 있는 것은?","o":["텔 테일(telltale)","블록(block)","클리트(cleat)","스프레다(spreader)"],"a":0,"e":"","c":"범주·조종","x":"텔테일은 돛의 앞뒤에 붙여 놓은 가벼운 실이나 리본으로, 돛 표면을 따라 흐르는 공기의 상태를 눈으로 보여 줍니다. 양쪽 텔테일이 나란히 뒤로 흐르면 트림이 맞은 상태이고, 풍상측이 펄럭이면 돛을 당기거나 침로를 내려야 합니다. 블록은 도르래, 클리트는 로프 고정구, 스프레다는 돛대를 지지하는 가로대로 기능이 다릅니다."},{"i":118,"q":"그로밋(grommet)의 용도는 무엇인가?","o":["집세일의 핼야드를 묶는 홀(hole)","집세일의 위쪽을 고정하는 홀(hole)","메인세일의 위쪽을 고정하는 홀(hole)","메인세일의 돛 줄임용 홀(hole)"],"a":3,"e":"","c":"요트·의장","x":"그로밋은 돛에 뚫어 금속 링으로 마감한 구멍으로, 특히 메인세일의 리핑(돛 줄임)을 할 때 리프 로프를 꿰어 줄어든 돛을 묶는 데 씁니다. 강풍에서 돛 면적을 줄여 배를 안정시키는 작업과 직접 연결되는 부품입니다. 핼야드를 묶는 곳이나 돛 상부 고정용 구멍과는 용도가 다르므로 '돛 줄임용'이라는 표현을 기억하세요."},{"i":119,"q":"마그네틱 컴퍼스 자차(deviation)에 대한 설명으로 옳은 것은?","o":["자기자오선과 마그네틱 컴퍼스의 남북선의 교각","자기자오선과 선수미선의 교각","마그네틱 컴퍼스의 남북선과 선수미선의 교각","진자오선과 항적의 교각"],"a":0,"e":"자차(deviation): 자기 자오선과 마그네틱 컴퍼스(자기 컴퍼스)의 남북선의 교각","c":"항해·해도","t":"new","x":"자차는 자기자오선과 그 배의 자기 컴퍼스가 가리키는 남북선 사이의 각으로, 선체의 철재와 전기기기가 만든 자기장 때문에 생깁니다. 배마다 다르고 선수 방위에 따라서도 달라지므로 자차표로 관리합니다. 진자오선과 자기자오선의 각인 편차와 구분해야 하며, 나침로에 자차를 더하면 자침로, 거기에 편차를 더하면 진침로가 됩니다."},{"i":120,"q":"마그네틱 컴퍼스의 자차(deviation)가 변하는 이유가 아닌 것은?","o":["선수 방위가 변할 때","같은 침로를 유지하고 있을 때","적하물의 이동","선체가 경사될 때"],"a":1,"e":"자차는 지구 자기 자오선과 선체, 선내 철기류 등의 영향을 받는다. 선박이 일정한 침로를 유지하고 있을 때는 변하지 않는다. 침로에 변화가 생기면 자차는 변한다.","c":"요트·의장","t":"new","x":"자차는 선체 철재가 만드는 자기장과 지구 자기장의 관계로 정해지므로, 배의 방향이 바뀌거나 화물이 이동하거나 선체가 기울면 달라집니다. 반대로 같은 침로를 그대로 유지하고 있는 동안에는 그 관계가 변하지 않아 자차도 일정합니다. 그래서 '같은 침로 유지'가 자차 변화의 원인이 될 수 없습니다."},{"i":121,"q":"선박의 속력과 항주거리를 측정하는 항해 장비는?","o":["음향 측심기","침로 기록기","선속계","조타기"],"a":2,"e":"선박에서 속력과 항주 거리를 측정하는 계기를 선속계(speed log)라 한다. 선속에 시간을 곱하면 항주거리이다.","c":"범주·조종","t":"new","x":"선속계는 배의 속력을 재는 계기이며, 속력에 시간을 곱하면 항주거리가 나오므로 누적 거리도 함께 표시합니다. 수차식, 전자식, 도플러식 등이 있고 물을 기준으로 재면 대수속력, 해저를 기준으로 재면 대지속력이 됩니다. 음향측심기는 수심, 조타기는 방향을 다루는 장비라 역할이 다릅니다."},{"i":122,"q":"위성항법장치(GPS)와 보정위성항법장치(DGPS)에 관한 설명으로 옳지 않은 것은?","o":["선박에서 사용하는 대표적인 위성항법장치이다.","GPS는 위성으로부터 오는 전파를 사용한다.","GPS의 오차를 줄이기 위해서 위치보정시스템을 이용한다.","GPS와 DGPS는 서로 다른 위성을 사용한다."],"a":3,"e":"DGPS는 GPS의 오차 범위를 줄여주기 위해 개발된 시스템으로, 육상에서 설치된 위치보정 기준국에서 GPS 오차를 측정하여 보정량을 주변 선박에 방송해주는 시스템이다.","c":"항해·해도","t":"new","x":"DGPS는 GPS와 다른 위성을 쓰는 것이 아니라, 같은 GPS 위성 신호를 받되 육상의 기준국이 측정한 오차 보정값을 함께 받아 정밀도를 높이는 방식입니다. 기준국은 자기 위치를 정확히 알고 있으므로 관측값과의 차이를 계산해 주변에 방송합니다. '별도의 위성을 쓴다'는 서술이 틀렸다는 점이 핵심입니다."},{"i":123,"q":"점화시켜 물에 던지면 해면 위에서 오렌지색 연기를 3분 이상 발하는 것은?","o":["신호 홍염","발연부 신호","자기 점화등","로켓 낙하산 신호"],"a":1,"e":"- 신호 홍염 : 손잡이 잡고 불을 붙이면 붉은색의 불꽃을 1분 이상 연소 - 발연부 신호 : 해면 위에서 3분 이상 오렌지 색 연기를 발할 수 있는 것 - 로켓 낙하산 신호 : 공중에 발사하면 300미터 이상 높이에서 5m/s 이하의 속도로 떨어지면서 적색 성화를 40초 이상 발하는 것 - 자기 점화등 : 수면에 투하하면 자동으로 빛을 발하는 것. 전구와 배터리 장착. 2시간 이상 발광","c":"기관·전기","t":"new","x":"발연부 신호는 불을 붙여 물에 던지면 해면 위에서 오렌지색 연기를 3분 이상 피워 조난 위치를 알리는 주간용 신호입니다. 연기는 멀리서도 잘 보이지만 밤에는 보이지 않아 낮에만 효과가 있습니다. 신호 홍염은 손에 들고 붉은 불꽃을 1분 이상 내는 장비, 로켓 낙하산 신호는 공중으로 쏘아 올려 불꽃이 천천히 내려오게 하는 장비이므로 용도가 다릅니다."},{"i":124,"q":"조난 시 체온 유지를 위한 것으로 열전도율이 낮은 방수 물질로 만들어어진 포대기 또는 옷 형태의 구명설비는?","o":["방수복","구명조끼","보온구","구명부환"],"a":2,"e":"보온구는 체온 유지를 위해 만들어진 것으로 열전도율이 낮은 방수 물질로 만들어진 것이다.","c":"안전·응급","t":"new","x":"보온구는 열전도율이 낮은 방수 물질로 만든 포대기나 옷 형태의 구명설비로, 조난자가 찬 물과 바람에 노출되었을 때 체온이 빠져나가는 것을 막아 줍니다. 구명뗏목에 오른 뒤 젖은 몸에서 열을 잃는 것을 늦추는 데 특히 중요합니다. 방수복은 입고 물에 들어가는 옷이고 구명조끼와 구명부환은 부력 장비라 목적이 다릅니다."},{"i":125,"q":"구명줄발사기에 대한 설명으로 옿지 않은 것은?","o":["구명줄을 230미터 이상 보낼 수 있다.","4개 이상의 발사체와 4개 이상의 구명줄로 되어 있다.","각 구명정 또는 각 구명뗏목마다 1개씩 비치되어 있다.","발사체는 수밀통 안에 수납되어 있다."],"a":2,"e":"구명줄발사기는 조난선에서 구조선으로 또는 구조선에서 조난선으로 줄을 보낼 때 사용하는 구명설비로 선박에 1개씩 비치해야 한다.","c":"안전·응급","t":"new","x":"구명줄발사기는 조난선과 구조선 사이에 줄을 건네기 위한 장비로 선박에 1개를 비치합니다. 구명정이나 구명뗏목마다 하나씩 두는 장비가 아니므로 그 서술이 틀립니다. 구명줄을 230미터 이상 보낼 수 있어야 하고, 발사체와 구명줄을 각각 4개 이상 갖추며, 발사체는 물이 스며들지 않도록 수밀통에 넣어 둡니다."},{"i":126,"q":"선박이 침몰 되면 수면 위로 자동 부상하여 위성으로 조난신호를 발사하는 장비는?","o":["레이더 트랜스폰더(SART)","네비텍스(NAVTEX) 수신기","양방향 초단파 무선전화기(Two-way VHF)","비상위치지시용 무선설비(EPIRB)"],"a":3,"e":"EPIRB: 선박 침몰 시 수면 위로 자동 부상하여 조난신호를 위성으로 발사하는 장비이다.","c":"통신","t":"new","x":"EPIRB는 배가 침몰하면 수압으로 자동 이탈해 수면으로 떠오른 뒤 위성을 통해 조난 신호와 위치를 발신하는 장비입니다. 사람이 손을 쓸 수 없는 상황에서도 작동한다는 점이 핵심입니다. SART는 구조선의 레이더 화면에 위치를 표시해 주고, 양방향 VHF는 음성 교신용, NAVTEX는 안전정보 수신 전용이라 역할이 서로 다릅니다."},{"i":127,"q":"구조 호흡 및 심폐소생술을 멈출 수 있는 시기로 가장 옳지 않은 것은?","o":["환자가 죽었다고 생각하거나 느꼈을 때","구급차가 도착하여 환자를 인계할 수 있을 때","환자의 의식과 호흡이 돌아왔을 때","구조자가 너무 지쳐 할 수 없을 때"],"a":0,"e":"사망 판단은 의사, 치과의사, 한의사만 할 수 있다.","c":"안전·응급","t":"chg","x":"구조자는 의학적 사망을 판단할 자격이 없습니다. 사망 판단은 의사·치과의사·한의사만 할 수 있으므로, 구조자가 '죽은 것 같다'고 느꼈다는 이유로 심폐소생술을 멈춰서는 안 됩니다. 중단할 수 있는 경우는 환자의 호흡과 의식이 돌아왔을 때, 구급대에 인계할 때, 구조자가 탈진해 더는 시행할 수 없을 때로 한정됩니다."},{"i":128,"q":"생존수영 이동하기 시 가장 올바른 동작은?","o":["얼굴을 수면으로 하여 손을 힘차게 저어 이동한다.","얼굴을 수면으로 하여 발을 힘차게 차며 이동한다.","얼굴을 하늘로 하여 손을 힘차게 저어 이동한다.","얼굴을 하늘로 하여 손과 발을 저으며 이동한다."],"a":3,"e":"호흡유지를 위해 얼굴을 하늘로 하고 손과 발을 저으며 이동한다.","c":"안전·응급","x":"생존수영에서 이동할 때는 얼굴을 하늘로 향한 배영 자세를 유지하며 손과 발을 천천히 저어 나아갑니다. 코와 입이 계속 물 밖에 있어야 호흡을 유지하고 체력 소모를 줄일 수 있기 때문입니다. 얼굴을 물에 넣고 힘차게 헤엄치면 체온과 체력을 빠르게 잃습니다. 구조를 기다릴 때는 움직임을 최소화한 누워뜨기가 원칙이라는 점도 함께 기억하세요."},{"i":129,"q":"익수자 발견 시 행동요령을 순서대로 나열한 것은?\n㉠ 119에 신속히 신고한다.\n㉡ 로프나 긴 막대기, 튜브 등을 던져서 잡고 나오도록 한다. ㉢ 익수자를 발견했을 때에는 큰 소리로 주위 사람에게 알린다. ㉣ 심폐소생술 등 응급처치를 바로 실시한다.","o":["㉢- ㉠- ㉡-㉣","㉢- ㉡- ㉠-㉣","㉠-㉢- ㉡-㉣","㉠-㉢-㉣- ㉡"],"a":0,"e":"","c":"안전·응급","x":"익수 사고에서는 먼저 큰 소리로 주위에 알려 도움을 확보하는 것이 첫 단계입니다. 혼자 대응하면 구조도 늦고 구조자까지 위험해지기 때문입니다. 이어 119에 신고해 전문 구조를 요청하고, 그동안 로프·막대·튜브 등 물에 들어가지 않는 도구로 구조를 시도합니다. 심폐소생술 같은 응급처치는 익수자를 물에서 건져 낸 다음에 실시하므로 순서상 맨 마지막입니다."},{"i":130,"q":"피부가 하얗고, 손상부위를 눌러도 통증을 느끼지 못하는 정도의 화상은?","o":["1도 화상","2도 화상","3도 화상","답 없음"],"a":2,"e":"3도 화상에 대한 설명이다.","c":"안전·응급","x":"3도 화상은 표피와 진피를 지나 피하조직까지 손상된 상태로, 피부가 하얗거나 검게 변하고 신경 말단이 파괴되어 눌러도 통증을 느끼지 못합니다. 통증이 없다는 점이 오히려 가장 심한 화상이라는 신호입니다. 1도는 붉어지고 따가운 정도, 2도는 물집이 생기며 통증이 심한 단계입니다. 얼음을 직접 대지 말고 흐르는 물로 식힌 뒤 이송해야 합니다."},{"i":131,"q":"성인 심정지 환자에서 가장 흔히 발견되는 부정맥은 심실세동이다. 심실세동의 처치법으로 가장 효과적인 것은?","o":["산소투여","인공호흡","제세동","가슴압박"],"a":2,"e":"성인 심정지 환자에서 가장 흔히 발견되는 부정맥은 심실세동이다. 심실세동의 처치법으로 가장 효과적인 것은 제세동이다.","c":"안전·응급","x":"심실세동은 심장 근육이 제멋대로 떨기만 해 피를 내보내지 못하는 상태입니다. 이때는 전기 충격으로 심장의 전기 활동을 한 번 멈춰 정상 리듬이 돌아오게 하는 제세동이 가장 효과적입니다. 가슴압박과 인공호흡은 제세동기가 도착할 때까지 뇌와 심장에 최소한의 혈류를 유지시켜 주는 역할이므로, 함께 시행하되 제세동은 도착 즉시 적용합니다."},{"i":132,"q":"통상적으로 호흡이 정지되고 나면 뇌가 영구적인 손상을 입는데 걸리는 시간은?","o":["약 5분","약 30분","약 60분","약 120분"],"a":0,"e":"호흡정지 후 4-6분 뇌손상, 6-10분 뇌사상태에 이른다.","c":"안전·응급","x":"호흡이 멈추면 뇌에 산소 공급이 끊겨 대략 4~6분 사이에 영구적인 뇌 손상이 시작되고, 6~10분이 지나면 뇌사에 이릅니다. 그래서 통상 5분 안팎을 한계로 보고, 구급대가 도착하기 전 목격자가 즉시 심폐소생술을 시작해야 한다고 강조합니다. 이 시간 개념이 '골든타임'의 근거이며, 수상 사고에서 신속한 구조가 중요한 이유이기도 합니다."},{"i":133,"q":"현장에서의 저체온증 처치방법은?","o":["출혈을 막는다.","사지를 마사지한다.","뜨거운 음료를 계속 준다.","생체징후를 안정시키고 더 이상의 열손실이 없도록 한다."],"a":3,"e":"현장에서의 저체온증 관리는 생체징후(맥박, 호흡, 혈압, 체온 등), 안정, 열손실 방지 등에 주력한다.","c":"안전·응급","x":"현장에서의 저체온증 처치는 더 이상 열을 빼앗기지 않게 하면서 맥박·호흡·혈압 같은 생체징후를 안정시키는 데 집중합니다. 젖은 옷을 벗기고 마른 담요로 감싸 몸통 중심부터 서서히 데우는 것이 원칙입니다. 사지를 문지르면 차가운 말초 혈액이 심장으로 몰려 위험할 수 있고, 의식이 흐린 사람에게 음료를 계속 주면 흡인 위험이 있습니다."},{"i":134,"q":"야간 또는 황천 항해 때 안전을 확보하기 하기 위하여 고정물에 몸을 묶는 장비는?","o":["하네스(Harness)","하이크아웃(Hike out)","히빙라인(Heaving line)","행크스(Hanks)"],"a":0,"e":"하네스 : 고정장치, 하이크아웃 : 요트가 기울어지는 것을 적게 하기 위해 승원이 몸을 밖으로 젖히는 일","c":"범주·조종","x":"하네스는 상체에 착용하고 안전줄로 배의 고정물이나 라이프라인에 몸을 묶어 두는 장비로, 야간이나 황천 항해에서 갑판 밖으로 추락하는 것을 막아 줍니다. 하이크아웃은 승원이 몸을 바깥으로 젖혀 배의 기울기를 줄이는 동작, 히빙라인은 계류줄을 건네려고 먼저 던지는 가는 줄, 행크스는 돛을 스테이에 거는 고리라 모두 다른 개념입니다."},{"i":135,"q":"인명구조에 있어 구조활동 우선순위 중 틀린 것은?","o":["구조자의 안전을 확보한다.","구조자의 안전이 확보된 상태에서 간접구조 한다.","장비(Rescue Tube 등)를 활용한 장비구조 한다.","최우선의 수단으로 맨몸구조를 한다."],"a":3,"e":"인명구조는 구조자의 안전을 확보하고 최후의 수단으로 맨몸구조를 선택할 수 있다.","c":"안전·응급","t":"chg","x":"인명구조의 원칙은 구조자 자신의 안전 확보가 최우선이며, 그다음이 물에 들어가지 않는 간접구조(던지기·뻗기), 그다음이 구조 튜브 같은 장비를 이용한 구조입니다. 맨몸으로 입수하는 구조는 구조자까지 위험해질 수 있어 다른 방법이 모두 불가능할 때 선택하는 최후의 수단입니다. '최우선의 수단'이라는 표현이 나오면 틀린 보기입니다."},{"i":136,"q":"출혈이 발생한 환자의 지혈 방법 중 가장 효과적이며 우선적으로 사용할 수 있는 방법은?","o":["출혈 부위 직접 압박","지혈대를 이용한 방법","출혈 부위 부목고정","출혈 부위 가까운 쪽 동맥 압박"],"a":0,"e":"출혈이 발생한 환자의 지혈 방법 중 가장 효과적이며 우선적으로 사용할 수 있는 방법은 출혈부위 직접압박이다.","c":"안전·응급","x":"출혈에서 가장 먼저, 가장 효과적으로 쓸 수 있는 방법은 상처 부위를 깨끗한 천으로 직접 누르는 직접압박입니다. 대부분의 출혈은 이것만으로 멎으며 조직 손상 위험도 가장 적습니다. 지혈대는 팔다리의 대량 출혈이 직접압박으로 멈추지 않을 때 쓰는 마지막 수단이고, 부목 고정은 골절을 다룰 때 쓰는 방법입니다."},{"i":137,"q":"물에 빠진 사람을 구하는 방법으로 가장 옳은 것은?","o":["뻗어 돕기 – 다른 방법이 없는 경우 직접 수영을 하고 가서 팔을 뻗어 사람을 구조하는 방법이다.","수영 구조 – 가장 안전한 방법으로 물에 들어가지 않고 줄을 던져서 구조하는 방법이다.","인간사슬 - 첫 번째 사람은 안전한 곳에 자신을 확실히 고정하고 서로 보는 방법은 손목의 위를 잡아 사슬이 끊어지지 않도록 한다.","선박구조 – 물에 들어가지 않고 긴 것을 뻗어서 사람을 구하는 방법이다."],"a":2,"e":"","c":"안전·응급","x":"인간사슬은 여러 사람이 손목 위쪽을 맞잡아 사슬처럼 연결해 얕은 물의 익수자에게 접근하는 방법으로, 맨 앞사람이 안전한 곳에 자신을 확실히 고정해야 사슬이 끊어지지 않습니다. 나머지 보기는 방법과 설명이 서로 뒤바뀌어 있습니다. 구조 원칙은 '던지고, 뻗고, 끌고, 저어 가고, 마지막에 헤엄쳐 간다'로 직접 수영 구조가 가장 위험한 최후 수단입니다."},{"i":138,"q":"응급처치를 하는 동안 전염의 가능성을 감소시킬 수 있는 방법으로 옳지 않은 경우는?","o":["가능하면 신체의 분비액과 접촉하지 않는다.","부상자의 신체 분비액과 구조자 사이에 깨끗하고 젖은 붕대나 신체 보호대를 사용한다.","피로 더럽혀진 물건을 만지지 않는다.","부상자를 처치한 후 즉시 비누나 물로 손을 씻어낸다."],"a":1,"e":"젖은 천이 아닌 깨끗한 마른 붕대를 사용한다.","c":"안전·응급","x":"감염을 막으려면 부상자의 혈액이나 분비액이 구조자 피부에 닿지 않도록 마른 붕대나 장갑 같은 보호구로 차단해야 합니다. 젖은 천은 액체가 그대로 스며들어 오히려 전염 경로가 되므로 부적절합니다. 처치 중에는 피로 더럽혀진 물건을 만지지 않고, 처치가 끝나면 즉시 비누와 물로 손을 씻는 것이 기본입니다."},{"i":139,"q":"물에 빠져 허우적거리는 익수자를 발견하였다. 최후의 수단으로 해야 할 구조는 어떤 것인가?","o":["신속히 직접 입수하여 구조한다.","신속히 물 밖에서 구조한다.","신속히 장대, 로프 등을 활용해 구조한다.","신속히 레스큐 튜브, 캔 등을 이용 구조한다."],"a":0,"e":"인명구조에 있어 구조자가 직접 입수하는 구조는 최후의 수단으로 고려해야만 한다.","c":"안전·응급","x":"구조 방법은 위험이 적은 순서대로 선택합니다. 물 밖에서 던지거나 뻗어서 구조하는 방법이 가장 안전하고, 그다음이 레스큐 튜브나 캔 같은 부력 장비를 활용한 구조입니다. 구조자가 직접 입수하는 것은 익수자가 매달려 함께 빠질 위험이 커 최후의 수단입니다. 부득이 입수할 때도 반드시 부력 장비를 가지고 들어가야 합니다."},{"i":140,"q":"익수자 구조로 가장 적합하지 않은 것은?","o":["익수자 발생 시 조타하는 사람이 볼 수 있도록 손으로 가리키며 크게 외친다.","구명환 등을 던져주고 익수자 위치를 표시하기 위한 발연, 발광부이를 던진다.","범주하여 익수자에게 접근 시 익수자를 풍하 쪽 현에 두고 접근한다.","익수자를 건져 올릴 때 말굽형 라이프 부이를 던져 걸어 올린다."],"a":1,"e":"","c":"안전·응급","x":"구명환은 익수자가 잡을 수 있도록 사람 가까이에 던져야 하지만, 발연·발광 부이는 위치 표시용이므로 익수자에게 직접 던지면 연기와 불꽃으로 오히려 화상과 시야 방해를 일으킵니다. 따라서 익수자에게 함께 던진다는 설명이 가장 부적합합니다. 나머지는 모두 옳은 요령이며, 접근할 때 익수자를 풍하 쪽에 두어 배가 밀려 덮치지 않게 하는 것이 원칙입니다."},{"i":141,"q":"구명뗏목 작동 및 취급 시에 대한 설명으로 가장 옳은 것은?","o":["자동이탈장치에는 무조건 페인트 도색을 하면 안 된다.","기상 악화에 대비하여 별도의 고박장치를 단단히 매어두는 것이 좋다.","구명뗏목 팽창법 중 수동보다는 자동 이탈 때까지 기다린 후 탑승하는 것이 안전하다.","구명뗏목 정비 및 운반을 위한 취급 시 작동줄을 잡아 당겨서 이동시키는 것이 편리하다."],"a":0,"e":"","c":"안전·응급","x":"구명뗏목의 자동이탈장치(수압이탈장치)는 정해진 수심에서 수압을 받아 작동해야 하므로, 페인트를 칠하면 작동부가 굳어 제 기능을 하지 못합니다. 그래서 도색은 절대 금지입니다. 별도 고박을 단단히 매어 두면 침몰 시 함께 가라앉고, 자동 이탈만 기다리면 탈출이 늦으며, 작동줄을 당겨 옮기면 뗏목이 팽창해 버리므로 나머지 보기는 모두 잘못된 취급법입니다."},{"i":142,"q":"구명부환에 줄로 연결하여 야간조난자의 위치를 밝힐 수 있는 것은?","o":["구명볼","자기점화등","낙하산부신호","발연부신호"],"a":1,"e":"발연부신호는 오렌지색 연막으로 조난자의 위치를 알려주는 것으로 위치를 밝히는 기능은 없다.","c":"안전·응급","x":"자기점화등은 구명부환에 줄로 연결해 두었다가 물에 던지면 자동으로 불이 켜져, 야간에 조난자와 구명부환의 위치를 빛으로 알려 주는 장비입니다. 어두운 바다에서 표적을 놓치지 않게 해 줍니다. 발연부신호는 오렌지색 연기로 위치를 알리는 주간용이라 밤에는 효과가 없고, 낙하산 신호는 상공에서 불꽃으로 알리는 장비입니다."},{"i":143,"q":"인명구조 현장에 잠재된 위험 요인 파악에 대한 설명으로 가장 옳지 않은 것은?","o":["구조현장 안전 통제 여부를 파악한다.","구조현장 위험 요소(암초 또는 해초)를 파악한다.","구조자에게 가해지는 환경적 요인(조류, 수온, 바람, 수심 등)을 파악한다.","2차 재해 요인 및 추가적인 위험요소 파악 보다는 구조활동에 집중한다."],"a":3,"e":"인명구조 현장에서 구조자의 안전 확보와 2차 재해 및 추가적 위험요소를 반드시 파악한다.","c":"안전·응급","x":"구조 현장에서는 눈앞의 위험뿐 아니라 2차 재해와 추가 위험 요소까지 반드시 확인해야 합니다. 구조에만 몰두하면 조류 변화나 다른 선박의 접근 같은 새로운 위험을 놓쳐 구조자까지 사고를 당할 수 있기 때문입니다. 현장 통제 여부, 암초나 해초 같은 지형 위험, 조류·수온·바람·수심 같은 환경 요인도 함께 파악해야 합니다."},{"i":144,"q":"저체온증 처치법으로 가장 옳지 않은 것은?","o":["필요시 119에 도움을 요청한다.","신속히 부상자 상태를 파악하여 치명적인 상태(호흡정지, 심장마비)가 동반되었는지 확인한다.","젖은 의복을 입힌 채로 담요를 덮어준다.","따뜻한 장소로 옮겨, 온찜질 등 몸을 따뜻하게 할 수 있는 방법을 사용한다."],"a":2,"e":"","c":"안전·응급","x":"저체온증 처치의 핵심은 체온을 더 빼앗기지 않게 하는 것입니다. 젖은 옷은 물이 증발하며 계속 열을 앗아가므로 반드시 벗기고 마른 옷이나 담요로 감싸야 합니다. 젖은 옷 위에 담요만 덮는 것은 오히려 냉각을 유지시키는 잘못된 처치입니다. 따뜻한 곳으로 옮기고 몸통 중심부터 서서히 데우며, 의식이 없거나 호흡·맥박에 이상이 있으면 즉시 119에 도움을 요청합니다."},{"i":145,"q":"요트에 비치된 소화기 점검 중 내부 압력상태가 표시된 게이지의 바늘이 녹색 영역에 있어야만 정상 작동될 수 있는 소화기로 옳은 것은?","o":["분말소화기","이산화탄소소화기","할론소화기","포말소화기"],"a":0,"e":"","c":"안전·응급","x":"지시압력계(게이지)가 달려 바늘이 녹색 정상 범위에 있어야 사용할 수 있는 것은 축압식 분말소화기입니다. 내부에 소화 분말과 함께 질소를 넣어 압력으로 밀어내는 구조여서 압력이 빠지면 분사되지 않습니다. 이산화탄소·할론 소화기는 액화가스를 채워 넣어 압력계 대신 무게를 재서 점검합니다. 요트에 흔히 비치되는 소화기가 분말식이라는 점도 함께 알아 두세요."},{"i":146,"q":"화재 발생 시에 유의할 사항으로 다음의 설명 중 옳은 것은?","o":["화재 발생원이 풍상측에 있도록 요트를 돌리고 엔진을 정지한다.","엔진룸 화재와 같은 B급 유류 화재에는 포말, 이산화탄소, 분말소화기 사용이 가능하다.","화재 예방을 위해 기름이나 페인트가 묻은 걸레는 공기가 잘 통하지 않는 곳에 보관한다.","C급 화재인 전기화재에 물이나 분말소화기는 부적합하여 포말소화기나 이산화탄소(Co2)소화기를 사용한다."],"a":1,"e":"","c":"기관·전기","x":"B급 화재는 기름이 타는 유류 화재로, 산소를 차단하는 방식인 포말·이산화탄소·분말 소화기를 모두 쓸 수 있습니다. 반면 물은 기름을 퍼뜨려 불을 키우므로 금물입니다. 화재 시에는 발화원이 풍하 쪽에 오도록 배를 돌려 불길이 배 위로 번지지 않게 해야 하고, 기름 묻은 걸레는 자연발화 위험이 있어 밀폐된 곳에 두면 안 되며, 전기화재에는 물과 포말이 부적합합니다."},{"i":147,"q":"고통 받는 사람을 기꺼이 도와주기 위하여 도덕적 의무를 이행하다가 예기치 않은 피해가 발생하더라도 고의나 중대한 과실이 없을 경우에는 민․형사상 책임을 면제하는 것을 무엇이라 하는가?","o":["선한 사마리아인법","형사소송법","행정절차법","인명구조법"],"a":0,"e":"선한 사마리아인법이라고도 하며 「응급의료에 관한 법률(법률 제9124호)」에 포함되어 있다.","c":"안전·응급","x":"선한 사마리아인법은 응급 상황에서 선의로 돕다가 예기치 못한 피해가 생기더라도 고의나 중대한 과실이 없다면 민사·형사 책임을 면제해 주는 제도입니다. 우리나라에서는 응급의료에 관한 법률에 관련 규정이 들어 있습니다. 처벌이 두려워 구조를 주저하는 일을 줄이려는 취지이므로 응급처치 교육에서 함께 다뤄집니다."},{"i":148,"q":"심폐소생술에 대한 설명으로 가장 옳지 않은 것은?","o":["분당 100~120회의 속도로 가슴압박을 한다.","가슴압박과 인공호흡의 비율은 30:2로 한다.","소아에게는 자동제세동기를 절대 사용해서는 안 된다.","제세동기는 도착 즉시 사용한다."],"a":2,"e":"성인과 소아 모두 자동제세동기를 사용할 수 있다.","c":"안전·응급","x":"자동제세동기는 성인뿐 아니라 소아에게도 사용할 수 있습니다. 다만 소아용 패드나 에너지 감쇠 기능이 있으면 그것을 쓰고, 없으면 성인용 패드를 사용하되 패드끼리 닿지 않게 붙입니다. 그래서 '소아에게 절대 사용해서는 안 된다'는 서술이 틀립니다. 가슴압박은 분당 100~120회, 압박과 인공호흡은 30대 2, 제세동기는 도착 즉시 적용하는 것이 원칙입니다."},{"i":149,"q":"저체온증 증상에 대한 설명으로 가장 옳지 않은 것은?","o":["저체온증 부상자는 체온이 35℃ 이하로 떨어진다.","맥박이 불규칙하고 느리다.","무감각해지고 정신이 희미해진다.","혈관이 확장된다."],"a":3,"e":"저체온증은 혈관이 수축되고 체온이 내려간다.","c":"안전·응급","x":"저체온증은 몸이 열을 빼앗기지 않으려고 말초 혈관을 수축시키는 것이 특징입니다. 그 결과 피부가 창백해지고 손발이 차가워지며, 체온이 35도 아래로 떨어지면서 맥박이 느리고 불규칙해지고 의식이 흐려집니다. 따라서 '혈관이 확장된다'는 설명은 반대입니다. 술은 혈관을 확장시켜 열 손실을 키우므로 저체온증 환자에게 주면 안 됩니다."},{"i":150,"q":"수상 사고 시 행동 요령으로 가장 옳지 않은 것은?","o":["성과를 위해 본인이 구조한다.","수상사고 현장을 파악한다.","효율적인 수상구조 방법을 선택한다.","응급처치를 실시한다."],"a":0,"e":"구조자는 사고 현장 목격 시 다른 구조자와 119에 신속하게 알린다.","c":"안전·응급","x":"수상 사고에서는 현장을 먼저 파악하고 119와 주위에 알린 뒤, 상황에 맞는 가장 안전한 구조 방법을 선택하고, 구조 후 응급처치를 실시하는 순서를 따릅니다. 성과나 조급함 때문에 혼자 물에 뛰어들면 구조자까지 조난자가 되어 상황이 더 나빠집니다. 구조의 첫 번째 원칙이 '구조자의 안전'이라는 점을 다시 확인하는 문제입니다."},{"i":151,"q":"부목 사용 시 주의할 사항에 대한 설명으로 가장 옳지 않은 것은?","o":["골절부 상위 관절과 하위 관절을 고정해야 한다.","혈액순환에 장애를 일으키지 않도록 한다.","부목에는 패드를 대어 사지에 상처를 내지 않도록 한다.","부목은 반드시 나무로 만들어진 것만 사용한다."],"a":3,"e":"부목은 나무재질 외에도 금속망, 금속판 등 여러 종류가 있다.","c":"안전·응급","x":"부목은 골절 부위 위아래 관절까지 함께 고정해 뼈가 움직이지 않게 하고, 패드를 대어 피부 손상을 막으며, 너무 조이지 않아 혈액순환을 방해하지 않도록 해야 합니다. 재질은 나무만 쓰는 것이 아니라 금속판, 금속망, 공기주입식, 잡지나 신문 같은 즉석 재료도 상황에 따라 쓸 수 있습니다. 재질보다 고정 원칙이 중요하다는 점이 핵심입니다."},{"i":152,"q":"인명구조 안전사고 예방을 위한 행동 요령으로 가장 옳지 않은 것은?","o":["구조자 자신을 위한 신체 보호 장구 착용 없이 신속히 요구조자에게 접근한다.","현장 활동에 방해되는 각종 장애요인을 제거한다.","요구조자의 구명에 필요한 조치를 한다.","요구조자의 상태 악화 방지에 필요한 조치를 한다."],"a":0,"e":"인명 구조 시 구조자의 안전확보를 최우선 시 한다.","c":"안전·응급","x":"구조 활동의 첫 번째 원칙은 구조자 자신의 안전 확보입니다. 구명조끼 같은 보호 장구 없이 급하게 접근하면 구조자까지 사고를 당해 구조 자체가 불가능해집니다. 장애 요인 제거, 요구조자의 구명 조치, 상태 악화 방지는 모두 옳은 요령입니다. '신속히'라는 말에 끌려 안전 절차를 건너뛰게 만드는 보기가 함정입니다."},{"i":153,"q":"인명구조 현장 유의 사항으로 가장 옳지 않은 것은?","o":["정보 파악 정확히 한다.","의심이 가면 한번 더 추가 확인한다.","자신의 추측에 의한 정보를 공유해 안전을 확보한다.","구조자의 안전을 최우선 시 한다."],"a":2,"e":"구조자의 추측에 의한 정보 공유는 삼가고 의심이 가면 한번 더 추가 확인하여 정확한 정보를 공유한다.","c":"안전·응급","x":"구조 현장에서 추측으로 만든 정보를 공유하면 잘못된 판단이 퍼져 구조 방향이 어긋나고 시간을 잃습니다. 그래서 확인되지 않은 내용은 전달하지 않고, 의심스러우면 한 번 더 확인해 정확한 정보만 공유해야 합니다. 정보의 정확성, 재확인, 구조자 안전 최우선이 현장 유의사항의 핵심입니다."},{"i":154,"q":"일시적인 화끈거림과 부분적으로 쑤시는 듯한 통증을 나타내는 정도의 동상은?","o":["1도 동상","2도 동상","3도 동상","4도 동상"],"a":0,"e":"그 외에도 땀이 많이 발생할 수 있으며, 1도는 부분적으로 피부 손상이 발생한 경우이다.","c":"안전·응급","x":"1도 동상은 피부 표면이 얼었다 녹으면서 화끈거리고 부분적으로 쑤시는 통증이 나타나는 가장 가벼운 단계로, 손상도 피부 표면에 그칩니다. 2도는 물집이 생기고, 3도는 피부 전층이 괴사하며, 4도는 근육과 뼈까지 손상됩니다. 처치할 때는 문지르지 말고 40도 안팎의 따뜻한 물에 서서히 녹이는 것이 원칙입니다."},{"i":155,"q":"내연기관 기본 용어에 대한 설명으로 가장 옳은 것은?","o":["사점(dead center) - 피스톤이 실린더 내를 왕복 운동할 때에 그 시작점을 말한다.","행정(stroke) - 상사점과 하사점 사이의 직선거리를 말한다.","매분 회전수(RPM) - 캠축이 1분 동안에 회전하는 수를 말한다.","실린더 부피(cylinder volume) - 피스톤이 상사점에 있을 때 실린더 내의 전 부피를 말한다."],"a":1,"e":"","c":"기관·전기","t":"new","x":"행정(stroke)은 피스톤이 상사점에서 하사점까지 움직이는 직선 거리를 말하며, 이 거리와 실린더 단면적을 곱한 값이 배기량이 됩니다. 사점은 피스톤이 방향을 바꾸는 상·하 두 지점이지 시작점이 아니고, RPM은 캠축이 아니라 크랭크축의 분당 회전수이며, 실린더 부피는 피스톤이 하사점에 있을 때의 전 부피를 뜻하므로 나머지 설명은 모두 틀립니다."},{"i":156,"q":"가솔린 기관(엔진)이 과열되는 원인에 대한 설명으로 가장 옳지 않은 것은?","o":["냉각수 취입구 막힘","냉각수 펌프 임펠러의 마모","윤활유 부족","점화시기가 너무 빠름"],"a":3,"e":"","c":"기관·전기","x":"점화시기가 너무 빠르면 연소가 압축 도중에 시작되어 노킹과 출력 저하가 생기지만, 과열의 직접 원인으로 보지는 않습니다. 기관 과열은 열을 식히지 못할 때 일어나므로 냉각수 취입구 막힘, 냉각수 펌프 임펠러 마모처럼 냉각계통이 막히거나 약해진 경우, 그리고 윤활유가 부족해 마찰열이 커진 경우가 전형적인 원인입니다. 출항 전 냉각수 배출 확인이 중요한 이유입니다."},{"i":157,"q":"요트 엔진의 엔진오일 점검과 교체에 대한 설명으로 가장 옳지 않은 것은?","o":["운전 종료 후 엔진오일의 양과 질을 점검하고, 오일이 부족하면 보충한다.","엔진 상단부에 위치한 오일게이지를 뽑아 깨끗이 닦은 후 다시 넣었다 빼서 오일 양과 색깔을 확인한다.","오일 게이지에 묻어 나온 엔진 오일이 최대선(MAX)과 최소선(MIN) 사이에 있다면 오일의 양은 정상이다.","엔진 오일의 교체 시기는 제조사의 권장 시기에 따라 교체하는 것이 좋다."],"a":0,"e":"엔진오일의 점검은 엔진 시동(운전) 전에 시행되어야 하며, 점검 결과에 따라 엔진오일을 보충하거나 교체하여야 한다.","c":"기관·전기","t":"new","x":"엔진오일의 양과 상태는 시동을 걸기 전에 점검해야 합니다. 운전 직후에는 오일이 각 부위에 퍼져 있고 열로 팽창해 있어 정확한 양을 읽을 수 없기 때문입니다. 그래서 '운전 종료 후 점검하고 보충한다'는 서술이 틀렸습니다. 게이지를 닦아 다시 넣었다 빼서 최대선과 최소선 사이인지 확인하는 방법과 제조사 권장 주기 교체는 옳습니다."},{"i":158,"q":"선외기 가솔린엔진의 연료유에 해수가 유입되었을 때 엔진에 미치는 영향으로 옳지 않은 것은?","o":["연료유 펌프 고장원인이 된다.","시동이 잘 되지 않는다.","해수 유입 초기에 진동과 엔진 꺼짐 현상이 발생한다.","윤활유가 오손된다."],"a":3,"e":"","c":"기관·전기","x":"연료에 해수가 섞이면 연료펌프와 인젝터를 부식·마모시키고, 시동이 잘 걸리지 않으며, 초기부터 진동과 시동 꺼짐이 나타납니다. 다만 윤활유는 연료계통과 분리된 계통이므로 연료에 들어간 해수 때문에 곧바로 오손되지는 않습니다. 그래서 '윤활유가 오손된다'가 옳지 않은 설명입니다. 연료 탱크의 수분 제거와 연료 여과기 점검이 예방책입니다."},{"i":159,"q":"디젤 기관의 운전 중 움직이지 않는 부분으로 가장 옳지 않은 것은?","o":["실린더 라이너(cylinder liner)","실린더 헤드(cylinder head)","워터 재킷(water jacket)","피스톤(piston)"],"a":3,"e":"피스톤은 왕복 운동을 통해 크랭크축을 회전시키는 역할을 한다.","c":"기관·전기","t":"new","x":"디젤기관에서 피스톤은 실린더 안을 위아래로 왕복하며 커넥팅로드를 통해 크랭크축을 돌리는 대표적인 운동 부분입니다. 반면 실린더 라이너, 실린더 헤드, 워터 재킷은 기관의 뼈대와 냉각 통로를 이루는 고정 부분입니다. 기관 부품을 운동부(피스톤·커넥팅로드·크랭크축)와 고정부(실린더·헤드·프레임)로 나눠 정리해 두면 됩니다."},{"i":160,"q":"윤활유가 변질되는 원인으로 옳은 것은 모두 몇 개인가?\n① 고열에 의한 열분해\n② 함유된 유황분에 의한 산화\n③ 연소가스에 의한 탄화\n④ 저온으로 인한 유동성 불량\n⑤ 먼지, 금속마모의 쇳가루의 혼입","o":["2개","3개","4개","5개"],"a":2,"e":"④ 저온으로 유동성이 떨어지는 것일 뿐 변질되는 것은 아니다.","c":"기관·전기","x":"윤활유는 고열에 의한 열분해, 유황분 등에 의한 산화, 연소가스에 의한 탄화, 먼지나 쇳가루 혼입으로 성질이 변합니다. 반면 저온에서 유동성이 떨어지는 것은 온도가 낮아 점도가 높아진 일시적인 현상일 뿐, 기름 자체가 변질된 것은 아닙니다. 그래서 변질 원인은 네 가지입니다. '성분이 바뀌었는가'를 기준으로 판단하면 구분됩니다."},{"i":161,"q":"요트 엔진의 냉각수 점검과 보충에 대한 설명으로 가장 옳지 않은 것은?","o":["냉각수 점검은 반드시 시동을 끈 후 최소 10분~30분 이상 엔진냉각 후 시행한다.","시동을 켜 놓거나 꺼놓은 직후에 냉각수 통의 마개를 열면 뜨거운 증기로 인해 화상의 위험이 있으니 주의한다.","배관이나 연결 부위의 손상으로 누수가 발견되었다면 제조사 또는 정비소에서 점검을 받아야 한다.","냉각수 보충 시에는 주로 생수나 지하수를 사용하고, 부득이한 상황에서는 해수를 이용한다."],"a":3,"e":"냉각수 보충시에는 미네랄 성분 등 침적될 수 있는 성분이 포함된 생수, 지하수 등은 지양하고, 수돗물이나 증류수를 사용하는 것이 좋다.","c":"기관·전기","t":"new","x":"냉각수를 보충할 때는 수돗물이나 증류수를 씁니다. 생수나 지하수에는 미네랄이 많아 냉각 계통에 침전물이 쌓이고, 해수는 염분 때문에 부식을 일으켜 엔진을 망가뜨리기 때문입니다. 점검은 시동을 끄고 10~30분 이상 식힌 뒤에 해야 하며, 뜨거운 상태에서 마개를 열면 증기가 뿜어져 나와 화상을 입을 수 있습니다."},{"i":162,"q":"기관출력의 감소 원인으로 가장 옳지 않은 것은?","o":["연료분사밸브의 막힘","피스톤 링의 고착","연료분사펌프의 누설","윤활유 온도의 상승"],"a":3,"e":"윤활유의 온도상승으로 기관의 냉각이 어렵게 되나 출력의 감소와는 거리가 멀다.","c":"기관·전기","x":"기관 출력이 떨어지는 것은 연료가 제대로 들어가지 않거나 압축이 새는 경우입니다. 연료분사밸브 막힘, 연료분사펌프 누설, 피스톤 링 고착이 그런 예입니다. 윤활유 온도 상승은 냉각과 윤활 관리에 문제가 있다는 신호이기는 하지만 출력 감소의 직접 원인으로 보기는 어렵습니다. '연료·압축 계통인가'로 걸러 내면 답이 보입니다."},{"i":163,"q":"요트에 장착된 디젤 엔진 운전 중 배기 온도가 낮은 현상이 나타나는 경우, 그 원인으로 가장 옳은 것은?","o":["연료 분사 밸브나 노즐의 결함","과급기의 상태 불량","흡입 공기 온도가 너무 낮음","과부하 운전"],"a":2,"e":"갑 : 특정 실린더의 배기 온도가 높게 나타남, 을 : 모든 실린더의 배기 온도가 높은 나타남, 정 : 배기 가스색이 검은색으로 보임","c":"기관·전기","t":"new","x":"배기 온도가 낮게 나타나는 것은 실린더로 들어가는 공기가 지나치게 차가워 연소 온도 자체가 낮아졌을 때입니다. 반대로 연료분사 밸브나 노즐에 결함이 있으면 특정 실린더의 배기 온도가 높아지고, 과급기 상태가 나쁘거나 과부하로 운전하면 전체 배기 온도가 올라가며 배기색이 검어집니다. 온도가 높은 원인과 낮은 원인을 갈라 정리하면 됩니다."},{"i":164,"q":"추운 지역에서 냉각수 펌프를 장시간 사용하지 않을 때의 일반적인 조치로 가장 옳은 방법은?","o":["펌프 내부의 물을 빼낸다.","펌프 케이싱에 그리스를 발라준다.","펌프 내에 그리스를 넣어둔다.","펌프를 분해하여 둔다."],"a":0,"e":"추운 곳에서 장시간 두면 펌프케이싱 등 동파 위험이 있으므로 물을 배출하는 것이 좋다.","c":"기관·전기","x":"추운 곳에서 펌프를 오래 세워 둘 때는 내부에 남은 물을 모두 빼내야 합니다. 물이 얼면 부피가 늘어 펌프 케이싱이나 배관이 터지는 동파가 생기기 때문입니다. 그리스를 바르거나 채워 넣는 것은 부식을 늦출 수는 있어도 동파를 막지 못하고, 분해해 두는 것은 관리와 재조립 부담만 커집니다."},{"i":165,"q":"4행정 사이클 디젤 기관의 행정에 대한 설명으로 가장 옳지 않은 것은?","o":["흡입 행정 – 공기가 흡입되어 연소에 필요한 산소를 확보하는 행정이다.","압축 행정 – 연료가 자연 발화할 수 있는 온도를 조성하는 행정이다.","작동 행정 – 압축 공기의 높은 압력이 피스톤을 하사점까지 움직이게 하는 행정이다.","배기 행정 – 다음 사이클을 준비하기 위해 실린더 내부를 청소하는 과정으로 볼 수 있다."],"a":2,"e":"작동 행정 : 연소가스의 높은 압력으로 피스톤이 하사점까지 움직이며 동력을 발생하는 행정임","c":"기관·전기","t":"new","x":"작동(폭발) 행정은 압축된 공기에 연료가 분사되어 자연 발화하고, 그 연소가스의 높은 압력이 피스톤을 하사점까지 밀어 동력을 만드는 행정입니다. 단순히 '압축 공기의 압력'이 미는 것이 아니라 연소가스의 압력이라는 점이 차이입니다. 흡입·압축·작동·배기 네 행정 가운데 유일하게 동력을 만들어 내는 구간입니다."},{"i":166,"q":"기관 과부하 시 나타나는 증상으로 가장 옳지 않은 것은?","o":["기관 속도가 상승되지 않음","엔진이 과열됨","청수 온도가 상승됨","배기색이 청색으로 변함"],"a":3,"e":"","c":"기관·전기","x":"과부하 상태에서는 연료를 많이 넣어도 회전수가 오르지 않고, 연소열이 쌓여 엔진과 청수 온도가 함께 올라갑니다. 이때 연료가 충분히 타지 못해 배기색은 검은색(흑색)으로 짙어집니다. 청색 배기는 윤활유가 연소실로 새어 들어가 함께 타는 현상이라 과부하가 아니라 오일 상승의 신호입니다. 흑색은 불완전연소, 백색은 수분 혼입으로 정리해 두세요."},{"i":167,"q":"스크루 프로펠러에서 공동현상(Cavitation)이 발생하는 경우의 손상형태는?","o":["중간 축 베어링의 부식","프로펠러 표면의 탈 아연 부식현상","프로펠러 표면의 침식(erosion) 발생","추진기 축의 부식 발생"],"a":2,"e":"유체의 압력이 급속도로 낮아지면 유체가 기화하고 유체가 기화하면서 생긴 기포가 충격, 침식을 유발한다.","c":"기관
