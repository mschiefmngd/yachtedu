 모두 금지됩니다. 연령 제한은 '보호자 없이 태우는 경우'에 걸린다는 점을 정확히 기억해야 함정에 걸리지 않습니다."},{"i":370,"q":"면허시험 면제교육기관장이 기록하고 비치해야 할 서류로 적절하지 않은 것은?","o":["면제교육기관 지정서","종사자 명부(강사의 자격증 등)","면제교육에 관한 업무 규정","면제교육장 설계도면"],"a":3,"e":"면제교육장 설계도면은 비치 서류에 해당되지 않는다(수상레저안전법 시행규칙 별표4)","c":"수상레저안전법","t":"new","x":"면제교육기관장이 갖춰 두어야 할 서류는 기관의 자격과 운영 실태를 확인할 수 있는 것들, 즉 지정서, 강사 자격을 포함한 종사자 명부, 교육 업무 규정, 교육 실시 기록 등입니다. 면제교육장의 설계도면은 지정을 신청할 때 제출하는 자료일 뿐 상시 비치·기록 대상 서류는 아닙니다."},{"i":371,"q":"수상레저기구등록법률 시행령 상 동력수상레저기구 적용 제외가 아닌 것은?","o":["모터보트 총톤수가 20톤 이상","세일링 요트","고무보트 추진기관이 30마력 미만","고무보트 추진기관이 22킬로와트 미만"],"a":1,"e":"세일링요트는 동력수상레저기구에 적용된다.수상레저기구의등록 및 검사에 관한 법률 시행령 제3조(적용제외)","c":"수상레저안전법","t":"new","x":"세일링요트는 돛으로 움직이지만 일정 출력 이상의 보조기관을 갖추면 동력수상레저기구로 보아 등록과 검사의 대상이 됩니다. 따라서 적용 제외 대상이 아닙니다. 반면 총톤수 20톤 이상의 모터보트, 추진기관 30마력(약 22킬로와트) 미만의 고무보트는 이 법의 적용에서 제외됩니다. 기준선이 되는 숫자를 정확히 기억하세요."},{"i":372,"q":"수상레저기구 중 등록대상이 아닌 것은?","o":["수상오토바이","선내기 또는 선외기인 총톤수 20톤 미만의 모터보트","공기를 넣으면 부풀고 접어서 운반할 수 있는 고무보트","총톤수 20톤 미만인 세일링 요트"],"a":2,"e":"","c":"수상레저안전법","x":"등록 대상인 동력수상레저기구는 수상오토바이, 모터보트, 총톤수 20톤 미만의 세일링요트, 그리고 일정 출력 이상의 고무보트입니다. 공기를 넣어 부풀리고 접어서 들고 다닐 수 있는 고무보트는 구조상 상시 계류·운항하는 배로 보기 어려워 등록 대상에서 제외합니다. 등록은 시장·군수·구청장에게 한다는 점도 함께 출제됩니다."},{"i":373,"q":"서프보드를 이용한 수상레저 활동 시 구명조끼를 대체할 수 있는 장비는?","o":["구명벨트","헬멧","보드 리쉬","구명환"],"a":2,"e":"수상레저안전법 시행규칙 제23조(안전장비의 착용)","c":"수상레저안전법","t":"chg","x":"보드 리쉬는 발목과 보드를 연결해 두는 줄로, 물에 빠져도 부력을 가진 보드를 놓치지 않게 해 줍니다. 서프보드나 패들보드처럼 보드 자체가 부력체 역할을 하는 활동에서는 구명조끼를 대신할 수 있는 안전장비로 인정됩니다. 다만 리쉬가 끊어지거나 벗겨지면 부력을 잃으므로 상태 점검이 중요합니다."},{"i":374,"q":"수상레저안전법 상 조종면허의 결격사유에 해당하지 않는 것은?","o":["14세 미만인 사람(제1급 조종면허의 경우 18세 미만)","마약, 대마 중독자 중 수상레저활동을 할 수 없다고 인정되는 사람","대통령으로 정한 체육관련단체 동력수상레저기구 선수로 등록된 14세 미만인 사람","조종면허 취소된 날부터 1년이 지나지 아니한 사람"],"a":2,"e":"동력수상레저기구 선수로 등록된 사람은 14세 미만이라도 결격사유에 해당되지 않는다(수상레저안전법 제7조_ 조종면허의 결격사유)","c":"수상레저안전법","t":"new","x":"체육 관련 단체에 동력수상레저기구 선수로 등록된 사람은 14세 미만이라도 결격사유에 해당하지 않는 예외가 인정됩니다. 어릴 때부터 훈련하는 선수의 특성을 고려한 규정입니다. 그 밖에 14세 미만(제1급은 18세 미만), 마약·대마 중독으로 활동이 어렵다고 인정되는 사람, 면허가 취소된 날부터 1년이 지나지 않은 사람은 결격사유에 해당합니다."},{"i":375,"q":"동력수상레저기구 조종면허증을 발급 또는 재발급하여야 할 사유가 아닌 것은?","o":["동력수상레저기구 조종면허시험에 합격한 경우","동력수상레저기구 조종면허증을 친구에게 빌려주어 받지 못하게 된 경우","동력수상레저기구 조종면허증을 잃어버린 경우","동력수상레저기구 조종면허증이 헐어 못쓰게 된 경우"],"a":1,"e":"수상레저안전법 제15조(면허증 발급)","c":"수상레저안전법","x":"면허증은 시험에 합격했을 때 처음 발급하고, 잃어버렸거나 헐어서 못 쓰게 되었을 때 재발급합니다. 반면 면허증을 다른 사람에게 빌려주는 것은 그 자체로 금지된 행위이며 벌칙 대상이므로, 빌려주고 돌려받지 못했다는 사정은 재발급 사유가 될 수 없습니다. '정당한 사유로 사용할 수 없게 된 경우'인지가 판단 기준입니다."},{"i":376,"q":"대통령령으로 정하는 체육 관련 단체에 동력수상레저기구의 선수로 등록된 사람의 면제되는 면허 및 시험의 종류에 대한 설명으로 옳은 것은?","o":["제1급 조종면허 및 요트조종면허의 필기시험과 실기시험","제2급 조종면허 및 요트조종면허의 필기시험과 실기시험","제1급 조종면허 및 요트조종면허의 실기시험","제2급 조종면허 및 요트조종면허의 실기시험"],"a":3,"e":"수상레저안전법 제9조(면허시험의 면제)","c":"수상레저안전법","x":"대통령령으로 정하는 체육 관련 단체에 동력수상레저기구 선수로 등록된 사람은 이미 조종 능력을 검증받은 것으로 보아 제2급 조종면허와 요트조종면허의 실기시험을 면제받습니다. 필기시험까지 전부 면제되는 것은 지정 면제교육기관의 교육을 이수한 경우이므로 혼동하면 안 됩니다. 누가, 어떤 시험을, 어느 면허에서 면제받는지 세 가지를 함께 확인하세요."},{"i":377,"q":"안전검사에 대한 설명으로 옳지 않은 것은?","o":["기구를 등록하려는 경우에는 신규검사를 받아야 한다.","개인이 소유하는 경우에는 등록 후 5년마다 정기검사를 받아야 한다.","동력수상레저기구의 구조나 장치를 변경한 경우에는 임시검사를 받아야 한다.","수상레저사업에 이용되는 동력수상레저기구는 2년마다 정기검사를 받아야 한다."],"a":3,"e":"수상레저기구의 등록 및 검사에 관한 법률 제15조(안전검사) 수상레저사업에 이용되는 동력수상레저기구는 1년마다 정기검사를 받아야 한다.","c":"수상레저안전법","x":"수상레저사업에 이용되는 동력수상레저기구는 1년마다 정기검사를 받아야 합니다. 2년이라고 적은 보기가 틀렸습니다. 개인 소유 기구는 5년마다이며, 등록하려면 신규검사를, 구조나 장치를 변경하면 임시검사를 받아야 합니다. 사업용 1년과 개인용 5년이라는 대비가 이 조항의 핵심입니다."},{"i":378,"q":"요트면허 시험대행기관의 시험장별 인적·장비·시설기준에 대한 설명으로 옳지 않은 것은?","o":["수상레저관련 업무에 5년 이상 종사한 경력이 있는 책임운영자 1명","자격 요건을 갖춘 시험관 2명 이상","비상구조선 1대 이상(시속 20노트 이상)","안전교육장 면적이 60제곱미터 이상"],"a":1,"e":"시험 대행기관 인적기준에서 시험관은 4명 이상 확보 되어야 함(수상레저안전법 시행령_별표 9)","c":"수상레저안전법","t":"new","x":"시험대행기관의 시험장은 자격 요건을 갖춘 시험관을 4명 이상 확보해야 하므로, 2명 이상이라고 적은 보기가 기준과 다릅니다. 수상레저 관련 업무에 5년 이상 종사한 책임운영자 1명, 시속 20노트 이상의 비상구조선 1대 이상, 60제곱미터 이상의 안전교육장은 모두 규정된 기준입니다. 인력·장비·시설 기준을 숫자로 정리해 두세요."},{"i":379,"q":"요트조종면허 실기시험 세부 항목에 해당하지 않는 것은?","o":["로프 취급 미숙","침로 기주 불량","조종자세 및 속도조정 불량","크루(crew) 지휘 불량"],"a":2,"e":"조종자세 및 속도조정 불량은 일반조종면허 실기시험 항목이다(수상레저안전법 시행규칙 별표1)","c":"수상레저안전법","t":"new","x":"요트 실기시험은 세일링 능력을 평가하므로 로프 취급, 침로 기주, 크루 지휘, 범주 조작 등이 채점 항목입니다. 반면 조종자세 및 속도조정 불량은 모터보트를 다루는 일반조종면허 실기시험의 항목이라 요트 실기에는 들어가지 않습니다. 두 면허의 채점 항목을 섞어 놓는 방식이 반복 출제됩니다."},{"i":380,"q":"수상레저안전법 상 1년이하의 징역 또는 1,000만원 이하의 벌금에 처하는 경우가 아닌 것은?","o":["면허증을 빌리거나 빌려주거나 이를 알선한 자","술에 취한 상태에서 동력수상레저기구를 조종한 사람","면허증을 휴대 하지 않고, 동력수상레저기구를 조종한 사람","수상레저사업 등록 취소 후 또는 영업정지기간에 수상레저사업을 한 자"],"a":2,"e":"면허증 소지는 수상레저안전법 상 벌칙에 해당하지 않음(수상레저안전법 제61조)","c":"수상레저안전법","t":"new","x":"면허증을 빌리거나 빌려주거나 알선한 행위, 술에 취한 상태에서의 조종, 등록 취소나 영업정지 기간 중의 사업 영위는 모두 1년 이하의 징역 또는 1천만원 이하의 벌금에 해당하는 중한 위반입니다. 반면 면허증을 지니지 않고 조종한 것은 면허 자체는 있는 상태이므로 이 벌칙 조항에 들어가지 않습니다. 무면허와 미휴대를 구분하는 것이 핵심입니다."},{"i":381,"q":"정상 등록된 동력수상레저기구의 말소등록 신청 사항이 아닌 것은?","o":["동력수상레저기구가 멸실되거나 수상사고 등으로 본래의 기능을 상실한 경우","동력수상레저기구의 존재 여부가 30일간 분명하지 아니한 경우","수상레저활동 외의 목적으로 사용하게 된 경우","총톤수·추진기관의 변경 등 사유로 동력수상레저기구에서 제외된 경우"],"a":1,"e":"동력수상레저기구의 존재 여부가 3개월간 분명하지 않을 때 말소등록 신청을 해야 함(수상레저기구의 등록 및 검사에 관한 법률 제10조)","c":"수상레저안전법","t":"new","x":"말소등록은 기구가 더 이상 존재하지 않거나 이 법의 대상에서 벗어났을 때 하는 절차입니다. 멸실이나 기능 상실, 수상레저 외의 용도로 사용, 톤수나 추진기관 변경으로 대상에서 제외된 경우가 그것입니다. 소재 불명은 30일이 아니라 3개월간 존재 여부가 분명하지 않을 때 신청 사유가 되므로 기간이 잘못 적혔습니다."},{"i":382,"q":"요트조종면허 실기시험 시 세부내용에 대해 3회까지 채점할 수 있는 것은?","o":["출발 전 앞·뒤·왼쪽·오른쪽 물표 및 장애물을 확인하지 않은 경우","구명조끼를 착용하지 않았거나 올바르게 착용하지 않은 경우","스키퍼의 자이빙 준비 지시에 따른 필요한 동작을 하지 않은 경우","스키퍼가 크루에게 지시를 하지 않거나 부정확하게 지시한 경우"],"a":2,"e":"갑, 을, 정의 보기는 세부내용에 대해 1회만 채점하는 사항에 해당된다","c":"수상레저안전법","t":"new","x":"실기시험 채점에서 스키퍼의 자이빙 준비 지시에 따른 크루의 동작은 반복적으로 확인해야 하는 항목이라 세부 내용에 대해 3회까지 채점합니다. 반면 출발 전 물표·장애물 확인, 구명조끼 착용 상태, 스키퍼의 지시 정확성은 한 번만 확인하면 되는 항목이라 1회만 채점합니다. 반복 동작인지 여부로 갈린다고 이해하면 쉽습니다."},{"i":383,"q":"조종면허 결격 사유와 결격 기간을 잘못 연결한 것은?","o":["조종면허가 취소된 경우 - 1년","무면허 조종으로 적발된 경우 - 1년","면허소지자가 술에 취한 상태에서 조종한 경우 - 1년","조종면허 없이 사람을 사상한 후 구호 등 필요한 조치를 하지 않고 도주한 경우 – 3년"],"a":3,"e":"‘정’의 경우 위반한 날부터 4년","c":"수상레저안전법","t":"chg","x":"무면허 상태에서 사람을 다치게 하거나 사망하게 한 뒤 구호 조치 없이 달아난 경우는 가장 무겁게 다루어 위반한 날부터 4년간 면허를 받을 수 없습니다. 나머지 조종면허 취소, 무면허 조종, 음주 조종은 각각 1년의 결격기간이 적용됩니다. 도주 사안만 기간이 크게 늘어난다는 점을 기준으로 기억하면 됩니다."},{"i":384,"q":"요트조종면허 실기시험 시 접안불량 세부내용의 설명으로 옳은 것은?","o":["지정 계류석으로부터 50미터의 거리에서 3노트 이하로 속도를 낮추지 않은 경우","지정 계류석으로부터 20미터의 거리에서 3노트 이하로 속도를 낮추지 않은 경우","시험선과 계류장이 3미터 이내의 거리로 평행이 되게 접안하지 못한 경우","계류줄을 묶는 방법이 틀리거나 풀리기 쉽게 묶은 경우"],"a":0,"e":"지정 계류석으로부터 50미터의 거리에서 3노트 이하로 속도를 낮추어야 한다(수상레저안전법 시행규칙 별표 1_ 실기시험의 채점기준과 운항코스)","c":"수상레저안전법","t":"new","x":"접안 채점에서는 지정 계류석으로부터 50미터 거리에서 3노트 이하로 속도를 낮추었는지를 봅니다. 충분히 미리 감속해야 계류장에 안전하게 붙일 수 있기 때문입니다. 거리와 속도 숫자를 바꿔 놓은 보기, 그리고 계류줄 묶는 방법이나 평행 접안 여부를 접안불량 항목으로 옮겨 놓은 보기가 함정입니다."},{"i":385,"q":"동력수상레저기구 시험운항과 관련된 내용 중 잘못된 내용은?","o":["시험운항허가 관서의 장은 해양경찰서장 또는 시장·군수·구청장이다.","시험운항허가관서의 장은 시험운항허가의 신청을 받은 경우에는 시험운항의 목적, 기간 및 운항 구역을 정하여 시험운항을 허가할 수 있다.","시험운항허가를 받은 자는 시험운항허가증에 기재된 기간이 만료된 경우 시험운항허가증은 즉시 폐기하여야 한다.","시험운항허가의 신청 및 반납 등에 필요한 사항은 대통령령으로 정한다."],"a":2,"e":"시험운항허가를 받은 자는 시험운항허가증에 기재된 기간이 만료된 경우 시험운항허가증을 반납하여야 한다","c":"수상레저안전법","x":"시험운항허가증은 기재된 기간이 만료되면 스스로 폐기하는 것이 아니라 허가관서에 반납해야 합니다. 허가 상태를 행정청이 정확히 관리하기 위한 절차입니다. 허가 관서의 장이 해양경찰서장 또는 시장·군수·구청장이라는 점, 목적·기간·운항구역을 정해 허가한다는 점, 세부 사항은 대통령령으로 정한다는 점은 모두 옳습니다."},{"i":386,"q":"수상안전교육 실시에 대한 설명으로 옳지 않은 것은?","o":["수상안전교육 위탁기관은 해양경찰청장이 감수한 교재를 사용하여 수상안전교육을 실시해야 한다.","신규 면허시험 응시를 위한 수상안전교육은 집합교육 및 온라인 교육으로 구분 받을 수 있다","면허증 갱신을 위한 수상안전교육은 집합교육 및 온라인 교육으로 구분 받을 수 있다.","수상안전교육 과목은 수상레저안전 관계 법령, 수상레저기구의 사용ㆍ관리, 수상상식, 수상구조가 해당한다."],"a":1,"e":"수상레저안전법 시행규칙 제13조(수상안전교육의 실시) 신규 면허시험 응시를 위한 수상안전교육: 집합교육","c":"수상레저안전법","x":"신규 면허시험 응시를 위한 수상안전교육은 집합교육으로만 실시합니다. 처음 배우는 사람에게는 실습과 대면 확인이 필요하다고 보기 때문입니다. 반면 이미 면허가 있는 사람의 갱신 교육은 집합교육과 온라인 교육 중에 선택할 수 있습니다. 신규는 집합, 갱신은 선택이라는 대비로 기억하면 됩니다."},{"i":387,"q":"일정한 거리 이상에서 수상레저활동을 하고자 하는 자는 해양경찰관서에 신고하여야 한다. 신고 대상 으로 옳은 것은?","o":["해안으로부터 5해리 이상","출발항으로부터 5해리 이상","해안으로부터 10해리 이상","출발항으로부터 10해리 이상"],"a":3,"e":"수상레저안전법 제23조(원거리 수상레저활동의 신고) 출발항으로부터 10해리 이상 떨어진 곳에서 수상레저활동을 하려는 사람은 해양경찰관서나 경찰관서에 신고하여야 한다.","c":"수상레저안전법","x":"원거리 수상레저활동 신고 기준은 '출발항으로부터 10해리 이상'입니다. 해안이 아니라 출발한 항을 기준으로 삼는다는 점, 거리는 10해리라는 점 두 가지를 모두 만족해야 합니다. 신고처는 해양경찰관서나 경찰관서이며, 선박안전 조업규칙에 따른 출입항 신고를 한 경우에는 예외가 인정됩니다."},{"i":388,"q":"등록번호판에 대한 설명으로 옳지 않은 것은?","o":["기구의 종류와 등록순서에 따른 일련번호를 문자 또는 숫자로 표시한다.","등록번호판의 두께는 모두 0.3밀리미터 규격이다.","고무재질의 선체에는 반사 원단을 사용한다.","바탕은 옅은 회색, 숫자와 문자는 검은색으로 한다."],"a":1,"e":"수상레저기구의 등록 및 검사에 관한 법률 시행규칙 별표 2(등록번호판의 규격) 동력수상레저기구의 선체가 고무재질인 경우 등록번호판의 두께는 0.2밀리미터이다.","c":"수상레저안전법","x":"등록번호판의 두께는 재질에 따라 다릅니다. 선체가 고무재질인 경우에는 곡면에 붙여야 하므로 0.2밀리미터로 더 얇게 정해져 있어, 모두 0.3밀리미터라고 한 보기가 틀렸습니다. 기구의 종류와 일련번호를 문자·숫자로 표시하고, 고무재질에는 반사 원단을 쓰며, 바탕은 옅은 회색에 글자는 검은색이라는 나머지 설명은 옳습니다."},{"i":389,"q":"등록대상 동력수상레저기구의 시험운항에 관한 내용 중 옳지 않은 것은?","o":["임시검사를 받기 전에 국내에서 동력수상레저기구로 시험운항 하는 것을 말한다 .","시험운항허가증에 기재된 기간이 만료된 경우에는 시험운항허가증을 반납하여야 한다.","시험운항허가관서의 장은 시험운항허가의 신청을 받은 경우에는 시험운항의 목적, 기간 및 운항 구역을 정하여 허가할 수 있다","시험운항을 허가하는 때에는 허가사항이 기재된 시험운항허가증을 발급하여야 한다."],"a":0,"e":"시험운항은 신규검사를 받기 전에 국내에서 동력수상레저기구로 시험운항 하는 것을 말한다.","c":"수상레저안전법","x":"시험운항은 신규검사를 받기 전에 국내에서 동력수상레저기구를 시험 삼아 운항해 보는 것을 말합니다. 임시검사가 아니라 신규검사가 기준 시점이므로 보기 1이 틀렸습니다. 허가 시 목적·기간·운항구역을 정하고 허가증을 발급하며, 기간이 만료되면 허가증을 반납해야 한다는 나머지 설명은 규정 그대로입니다."},{"i":390,"q":"동력수상레저기구 조종면허의 효력발생 시기는?","o":["수상 안전교육을 이수한 때","필기시험 합격일로부터 14일 이후","면허시험에 최종 합격한 날","조종면허증을 본인 또는 대리인에게 발급한 때부터"],"a":3,"e":"수상레저안전법 제15조(면허증 발급) 조종면허의 효력은 면허증을 본인이나 그 대리인에게 발급한 때부터 발생한다.","c":"수상레저안전법","x":"조종면허의 효력은 면허증을 본인이나 그 대리인에게 발급한 때부터 생깁니다. 시험에 최종 합격했더라도 면허증을 받기 전에 조종하면 무면허가 되므로 주의해야 합니다. 합격일부터 14일 이내에 면허증을 발급한다는 규정과 함께 묶어 두면, 합격 시점과 효력 발생 시점이 다르다는 점이 분명해집니다."},{"i":391,"q":"해양경찰청 수상레저종합정보시스템 운영 및 업무처리에 대한 내용으로 옳지 않은 것은?","o":["수상레저활동 신고 및 관리에 관한 업무","조종면허에 관한 업무","시험대행기관 종사자교육에 관한 업무","수상레저기구 등록에 관한 업무"],"a":3,"e":"수상레저종합정보 시스템 운영에는 “수상레저기구등록법” 제2장에 따른 동력수상레저기구의 등록 현황 관리에 관한 업무만 해당함(수상레저안전법 시행규칙 제31조_수상레저종합정보시스템의 운영 및 이용)","c":"수상레저안전법","t":"new","x":"수상레저종합정보시스템이 다루는 등록 관련 업무는 동력수상레저기구의 '등록 현황 관리'에 한정됩니다. 실제 등록 사무 자체는 시장·군수·구청장이 처리하기 때문입니다. 반면 수상레저활동 신고와 관리, 조종면허, 시험대행기관 종사자 교육에 관한 업무는 이 시스템에서 처리합니다. 현황 관리와 등록 처리를 구분하는 것이 요점입니다."},{"i":392,"q":"수상레저안전법에서 수상레저활동 중 의무적으로 착용해야 하는 안전장비가 아닌 것은?","o":["구명조끼","보드리쉬","안전모","래쉬가드"],"a":3,"e":"래쉬가드는 안전장비에 속하지 않음(수상레저안전법 시행규칙 제23조_안전장비의 착용)","c":"수상레저안전법","t":"new","x":"래쉬가드는 자외선과 찰과상을 막아 주는 의류일 뿐 부력이나 충격 보호 기능이 없어 안전장비로 규정되어 있지 않습니다. 반면 구명조끼는 부력을, 안전모는 머리 충격을, 보드 리쉬는 보드와 사람을 연결해 부력을 유지시켜 주므로 활동 종류에 따라 착용이 의무화된 안전장비입니다."},{"i":393,"q":"조종면허를 가진 자와 동승하여 무면허로 조종할 경우 면허를 소지한 사람의 요건으로 옳지 않은 것은?","o":["제1급 일반조종면허를 소지할 것","술에 취한 상태가 아닐 것","약물을 복용한 상태가 아닐 것","면허 취득 후 2년이 경과한 사람일 것"],"a":3,"e":"수상레저안전법 시행규칙 제28조(무면허조종이 허용되는 경우)","c":"수상레저안전법","x":"면허 소지자와 동승해 무면허자가 조종할 수 있으려면, 동승한 사람이 제1급 일반조종면허를 가지고 있어야 하고 술이나 약물의 영향을 받지 않은 상태여야 합니다. 면허 취득 후 몇 년이 지나야 한다는 경력 요건은 규정에 없습니다. 이 특례는 어디까지나 감독 가능한 사람이 옆에 있는 상황을 전제로 한 예외라는 점을 기억하세요."},{"i":394,"q":"수상레저안전법상 조종면허 효력정지 기간에 조종을 한 경우 처분 기준은?","o":["과태료","면허취소","징역","경고"],"a":1,"e":"","c":"수상레저안전법","x":"효력정지 처분을 받고도 조종했다는 것은 처분 자체를 무력화하는 행위이므로, 재량의 여지 없이 조종면허를 취소하도록 정하고 있습니다. 이처럼 반드시 취소해야 하는 사유에는 거짓이나 부정한 방법으로 면허를 받은 경우, 술에 취한 상태에서 조종한 경우 등도 함께 들어갑니다. 필요적 취소 사유와 임의적 처분 사유를 나누어 외우는 것이 핵심입니다."},{"i":395,"q":"동력수상레저기구의 안전검사와 관련된 내용 중 잘못된 것은?","o":["안전검사의 종류는 신규검사, 정기검사, 임시검사로 나누어진다.","임시검사를 받는 시기가 정기검사 시기와 중복되는 경우에는 임시검사로 대체할 수 있다.","수상레저사업에 이용되는 동력수상레저기구의 안전검사는 1년마다, 그 밖의 동력수상레저기구는 5년마다 정기검사를 받아야 한다.","등록대상 수상레저기구의 정원기준은 안전검사증에 기재된 정원을 말한다."],"a":1,"e":"임시검사를 받는 시기가 정기검사 시기와 중복되는 경우에는 정기검사로 대체할 수 있다.","c":"수상레저안전법","x":"임시검사 시기와 정기검사 시기가 겹치면 더 포괄적인 검사인 정기검사로 대체합니다. 임시검사로 대체한다고 적은 보기가 반대로 서술되어 틀렸습니다. 안전검사가 신규·정기·임시 세 가지라는 점, 사업용은 1년·그 밖에는 5년마다 정기검사를 받는다는 점, 정원은 안전검사증에 기재된 인원을 기준으로 한다는 점은 모두 옳습니다."},{"i":396,"q":"( ) 안에 들어갈 알맞은 말은? 신규검사를 받기 전에 국내에서 동력수상레저기구로 시험운항을 하고자 하는 자는 운항구역이 해 수면일 경우 (\n① )에게, 내수면일 경우(\n② )에게 허가를 받아야 한다","o":["① 해양경찰서장 ② 시·도지사","① 해양경찰서장 ② 시장·군수·구청장","① 해양경찰청장 ② 시·도지사","① 해양수산부장관 ② 시장·군수·구청장"],"a":1,"e":"","c":"수상레저안전법","x":"시험운항 허가는 그 수면을 관할하는 기관이 담당합니다. 바다(해수면)는 해양경찰이 관할하므로 해양경찰서장에게, 하천·호수 같은 내수면은 기초자치단체가 관할하므로 시장·군수·구청장에게 허가를 받습니다. 등록·안전검사 등 다른 절차에서도 '해수면은 해양경찰, 내수면은 시장·군수·구청장'이라는 구도가 반복되므로 이 틀로 기억하면 편합니다."},{"i":397,"q":"동력수상레저기구의 소유자는 성능 및 안전기준에 적합한 무선설비를 동력수상레저기구에 갖추어야 한다. 무선설비의 설치가 제외되는 경우로 옳은 것은?","o":["평수구역을 운항구역으로 지정받은 경우","연안으로부터 10해리까지를 운항구역으로 지정받은 경우","연해구역을 운항구역으로 지정받은 경우","근해구역을 운항구역으로 지정받은 경우"],"a":0,"e":"수상레저기구등록법 시행규칙 제23조(무선설비의 설치가 제외되는 동력수상레저기구)","c":"수상레저안전법","x":"무선설비는 육지에서 멀어져 연락이 끊길 위험에 대비하기 위한 장비이므로, 항상 육지와 가깝고 파도가 잔잔한 평수구역만을 운항구역으로 지정받은 경우에는 설치가 면제됩니다. 반대로 연해구역이나 근해구역처럼 먼바다까지 나가는 경우에는 반드시 갖춰야 합니다. 운항구역이 넓을수록 요구되는 안전장비가 늘어난다는 원리로 접근하면 됩니다."},{"i":398,"q":"요트조종면허 필기시험 과목으로 옳지 않은 것은?","o":["요트 활동의 개요","항해 및 범주","수상레저기구 운항 및 운용","법규"],"a":2,"e":"수상레저기구 운항 및 운용은 일반조종면허 과목에 해당 됨(수상레저안전법 시행령 별표2_필기시험 과목))","c":"수상레저안전법","t":"new","x":"요트조종면허 필기시험 과목은 요트 활동의 개요, 요트, 항해 및 범주, 법규입니다. '수상레저기구 운항 및 운용'은 모터보트를 다루는 일반조종면허의 과목이라 요트조종면허 과목에 들어가지 않습니다. 두 면허의 시험 과목을 섞어 놓는 유형이므로, 요트 쪽 과목 이름을 그대로 외워 두는 것이 안전합니다."},{"i":399,"q":"조종면허증의 갱신에 대한 설명으로 옳지 않은 것은?","o":["최초의 면허증 갱신기간은 면허증 발급일부터 7년이 되는 날부터 6개월 이내이다.","면허증 갱신 기간은 직전의 갱신 기간이 시작되는 날부터 7년이 되는 날부터 6개월 이내이다.","면허증을 갱신하지 아니한 경우 갱신기간이 만료한 다음 날부터 조종면허의 효력은 정지된다.","군복무 중인 경우 면허증 갱신 기간을 연기하거나 갱신을 미리 할 수 없다."],"a":3,"e":"면허증을 갱신하려는 사람이 군복무 등 대통령령으로 정하는 사유로 인하여 그 기간 이내 면허증을 갱신할 수 없는 경우에는 갱신을 미리 하거나 연기할 수 있다.(수상레저안전법 제12조_조종면허증의 갱신 등)","c":"수상레저안전법","t":"new","x":"군복무처럼 대통령령으로 정하는 사유가 있어 기간 안에 갱신할 수 없는 경우에는 갱신을 미리 하거나 연기할 수 있습니다. 따라서 '연기하거나 미리 할 수 없다'는 서술이 틀렸습니다. 갱신 기간은 최초 발급일 또는 직전 갱신 기간 시작일부터 7년이 되는 날부터 6개월 이내이고, 갱신하지 않으면 만료 다음 날부터 면허 효력이 정지됩니다."},{"i":400,"q":"수상레저사업장에 인명구조 업무를 담당하는 자의 자격기준 및 설명으로 옳지 않은 것은?","o":["수상구조사 사전교육을 이수한 사람","래프팅가이드 자격을 취득한 사람","래프팅가이드는 래프팅 기구마다 1명이상 탑승하여 탑승객의 안전을 확인해야 함","인명구조 업무를 담당하는 자는 수상레저사업 영업구역에 배치해야 함"],"a":0,"e":"인명구조 업무는 수상구조사 자격을 취득한 사람이여야 함(수상레저안전법 시행령 제26조_인명구조요원· 래프팅가이드의 자격기준 등)","c":"수상레저안전법","t":"new","x":"인명구조 업무를 맡으려면 사전교육 이수만으로는 부족하고 수상구조사 자격을 취득해야 합니다. 실제 구조 능력을 자격으로 검증하도록 한 것입니다. 래프팅가이드 자격을 가진 사람도 인명구조 업무를 담당할 수 있고, 래프팅 기구마다 1명 이상 탑승해 안전을 확인해야 하며, 인명구조 담당자는 영업구역에 배치해야 합니다."},{"i":401,"q":"수상안전교육 내용 중 관계 법령 과목에 해당하지 않는 법은?","o":["해상교통안전법","수상레저안전법","해양환경관리법","전파법"],"a":3,"e":"전파법은 수상안전교육 관계 법령 과목에 해당되지 않는다(수상레저안전법 시행규칙 별표5_수상안전교육의 과목 및 내용 등)","c":"수상레저안전법","t":"new","x":"수상안전교육의 관계 법령 과목은 수상 활동에서 직접 지켜야 할 법으로 구성됩니다. 수상레저안전법, 해상교통안전법, 해양환경관리법 등이 그것입니다. 전파법은 무선설비와 주파수 사용에 관한 법이라 필기시험 법규 과목에는 들어가지만 수상안전교육의 관계 법령 과목으로는 규정되어 있지 않습니다."},{"i":402,"q":"과태료 부과권자가 위반행위에 대해 과태료 금액을 줄일 수 있는 경우가 아닌 것은?","o":["위반행위가 사소한 부주의나 오류로 인한 것으로 인정되는 경우","법 위반상태를 시정하거나 해소하기 위해 노력한 사실이 인정되는 경우","위반행위의 동기와 그 결과 등을 고려하여 과태료 금액을 줄일 필요가 있다고 인정되는 경우","법 위반상태의 기간이 6개월 이상인 경우"],"a":3,"e":"법 위반상태의 기간이 6개월 이상이면 과태료 금액을 늘려 부과할 수 있다(수상레저안전법 시행령 별표14_ 과태료의 부과기준)","c":"수상레저안전법","t":"new","x":"과태료를 줄여 부과할 수 있는 사유는 위반의 정도가 가볍거나 시정하려 노력한 정황이 있는 경우입니다. 사소한 부주의나 오류, 시정·해소 노력, 동기와 결과를 고려한 감경이 그것입니다. 반면 위반 상태가 6개월 이상 이어진 경우는 오히려 금액을 늘려 부과할 수 있는 가중 사유이므로 감경 사유가 될 수 없습니다."},{"i":403,"q":"수상레저안전법상 수상레저기구의 정원에 관한 사항으로 옳지 않은 것은?","o":["수상레저기구의 정원은 안전검사에 따라 결정되는 정원으로 한다.","등록대상 동력수상레저기구가 아닌 수상레저기구의 정원은 해당 수상레저기구의 좌석 수 또는 형태 등을 고려하여 해양경찰청장이 정하여 고시하는 정원 산출 기준에 따라 산출한다.","정원을 산출할 때에는 해난구조의 사유로 승선한 인원은 정원으로 보지 아니한다.","조종면허 시험장에서의 시험을 보기 위한 승선정원은 정원으로 보지 아니한다."],"a":3,"e":"수상레저안전법 시행령 제22조(수상레저기구의 정원 산출기준)","c":"수상레저안전법","x":"정원 산출에서 예외로 인정되는 것은 해난구조처럼 부득이한 사유로 사람을 태운 경우입니다. 조종면허 시험을 치르기 위해 승선하는 인원은 그런 부득이한 사유에 해당하지 않으므로 정원에서 빼 주지 않습니다. 등록 대상 기구의 정원은 안전검사로 정해지고, 그 밖의 기구는 해양경찰청장이 고시하는 산출기준에 따른다는 나머지 설명은 옳습니다."},{"i":404,"q":"원거리 수상레저활동 관련 설명이다. 옳지 않은 것은?","o":["출발항으로부터 10해리 이상 떨어진 곳에서 활동할 경우 신고하여야 한다.","선박안전조업규칙에 의한 신고를 별도로 한 경우에는 원거리 수상레저활동 신고의무의 예외로 본다.","신고방법은 방문, 인터넷, 팩스, 전화 모두 가능하다.","원거리 수상레저활동은 해양경찰관서 또는 경찰관서에 신고한다."],"a":2,"e":"수상레저안전법 시행규칙 제26조(원거리 수상레저활동의 신고) 원거리 수상레저활동을 하려는 사람은 원거리 수상레저활동 신고서를 팩스나 정보통신망을 이용한 전자문서로 제출해야 한다.","c":"수상레저안전법","x":"원거리 수상레저활동 신고서는 방문, 인터넷(전자문서), 팩스로 제출할 수 있지만 전화 신고는 규정되어 있지 않습니다. 신고 내용이 문서로 남아야 사고 시 수색 자료로 쓸 수 있기 때문입니다. 출발항에서 10해리 이상 떨어진 활동이 대상이고, 해양경찰관서나 경찰관서에 하며, 선박안전 조업규칙에 따른 신고를 한 경우는 예외입니다."},{"i":405,"q":"위치발신장치의 설치가 제외되는 동력수상레저기구의 운항구역이 아닌 것은?","o":["평수구역","한정연해구역","근해구역","내수면"],"a":2,"e":"근해구역은 위치발신장치 설치가 제외되는 운항구역에 속하지 않는다.","c":"수상레저안전법","t":"new","x":"위치발신장치는 사고가 났을 때 배의 위치를 알려 주는 장비이므로, 육지와 가깝거나 수색이 비교적 쉬운 평수구역·한정연해구역·내수면에서는 설치가 면제됩니다. 반면 근해구역은 육지에서 멀리 떨어져 사고 시 위치 파악이 어렵기 때문에 면제 대상이 아니며 반드시 갖춰야 합니다. 운항구역이 멀수록 장비 요구가 강해진다는 원칙 그대로입니다."},{"i":406,"q":"수상레저기구에 등록번호판을 부착하여야 할 곳으로 가장 적당한 것은?","o":["선수 양현","선미 양현","선체 중앙","옆면 또는 뒷면의 잘 보이는 곳"],"a":3,"e":"수상레저기구의 등록 및 검사에 관한 법률 시행규칙 제9조(등록번호판의 부착)","c":"수상레저안전법","x":"등록번호판은 다른 배나 단속 기관이 어느 방향에서 보더라도 확인할 수 있도록 옆면 또는 뒷면의 잘 보이는 곳에 붙입니다. 해상에서는 옆에서 마주치거나 뒤에서 따라붙는 경우가 많다는 점이 반영된 규정입니다. 번호판을 가리거나 훼손해 알아보기 어렵게 하는 행위도 함께 금지된다는 점을 기억해 두세요."},{"i":407,"q":"수상레저사업장에 비치하는 비상구조선에 대한 설명으로 옳지 않은 것은?","o":["비상구조선임을 표시하는 주황색 깃발을 달아야 한다.","망원경 1개 이상, 구명튜브 5개 이상 등 인명구조장비를 비치한다.","지정된 비상구조선은 영업을 병행할 수 있다.","수상레저사업에 이용되는 기구 중에서 비상구조선을 정한다."],"a":2,"e":"수상레저안전법 시행규칙 별표8(수상레저사업의 등록기준) 비상구조선은 영업 중에는 항상 사용할 수 있도록 할 것","c":"수상레저안전법","x":"비상구조선은 영업 중 사고가 나면 즉시 출동할 수 있도록 항상 대기 상태를 유지해야 하므로, 손님을 태우는 영업에 함께 쓸 수 없습니다. 사업에 이용되는 기구 중에서 지정하되 주황색 깃발로 표시하고, 망원경 1개 이상과 구명튜브 5개 이상 등 인명구조 장비를 갖추어야 한다는 나머지 설명은 옳습니다."},{"i":408,"q":"수상레저사업의 등록을 취소하거나 3개월 범위에서 영업의 전부 또는 일부 정지할 수 있는 사항이 아닌 것은?","o":["거짓이나 그 밖의 부정한 방법으로 등록을 한 경우","수상레저사업자가 사망한 경우","사업자 또는 종사자의 고의, 과실로 사람을 사상한 경우","공유수면의 점·사용 허가기간 만료 이후 사업을 계속하는 경우"],"a":1,"e":"사업자 사망은 등록취소 및 영업제한 사항에 속하지 않는다.(수상레저안전법 제48조_수상레저사업의 등록 취소 등)","c":"수상레저안전법","t":"new","x":"등록 취소나 영업정지는 사업자의 위법이나 자격 미비를 이유로 하는 제재 처분입니다. 부정한 방법의 등록, 사업자나 종사자의 고의·과실로 인한 인명 사상, 공유수면 점·사용 허가기간이 끝난 뒤의 영업이 그런 사유입니다. 반면 사업자의 사망은 위법 행위가 아니라 상속이나 지위 승계로 처리할 문제라 제재 사유가 아닙니다."},{"i":409,"q":"수상레저사업자는 사업장 내 보험 가입 정보를 게시해야 한다. 그 내용으로 옳지 않은 것은?","o":["보험등의 가입기간","가입한 보험업체","보험등의 가입금액","가입한 보험등의 피보험자 또는 피공제자"],"a":1,"e":"가입한 보험업체는 보험등의 가입 여부에 대한 정보 제공 게시에 해당되지 않는다(수상레저안전법 시행령 제32조_보험등의 가입 여부에 대한 정보제공)","c":"수상레저안전법","t":"new","x":"게시해야 하는 보험 정보는 이용자가 사고 시 자기 피해가 보전되는지를 판단할 수 있는 내용, 즉 가입 기간, 가입 금액, 피보험자 또는 피공제자 범위입니다. 어느 보험회사에 들었는지는 이용자의 보상 여부를 좌우하는 정보가 아니어서 게시 항목에 포함되지 않습니다."},{"i":410,"q":"면허시험을 응시하거나 수상안전교육을 받기 위해 납부한 수수료의 반환 기준이 아닌 것은?","o":["수수료를 과오납 한 경우","응시자의 개인사정으로 면허시험에 응시하지 못한 경우","필기시험 시행일 하루 전까지 응시원서 접수를 취소한 경우","실기시험 시행일 2일 전까지 응시원서 접수를 취소한 경우"],"a":1,"e":"해양경찰청 또는 시험대행기관의 귀책사유로 면허시험에 응시하지 못한 경우 납부한 수수료의 전부를 반환 받을 수 있다(수상레저안전법 시행규칙 제41조_수수료의 반환기준)","c":"수상레저안전법","t":"new","x":"수수료를 돌려받을 수 있는 것은 과오납한 경우, 정해진 기한 안에 접수를 취소한 경우, 그리고 해양경찰청이나 시험대행기관의 잘못으로 응시하지 못한 경우입니다. 반면 응시자 개인 사정으로 시험에 오지 못한 것은 본인의 사유이므로 반환 대상이 아닙니다. 귀책이 어느 쪽에 있는가로 갈린다고 이해하면 됩니다."},{"i":411,"q":"수상레저 동승자 사고 발생 시 신고사항이 아닌 것은?","o":["사고발생 일시 및 장소","사고가 발생한 수상레저기구의 종류","사고자 및 조종자의 인적사항","출발장소 및 도착예정시간"],"a":3,"e":"","c":"수상레저안전법","x":"사고 신고에는 사고를 파악하고 구조하는 데 필요한 정보, 즉 사고 발생 일시와 장소, 기구의 종류, 사고자와 조종자의 인적사항, 피해 상황과 조치 내용 등이 들어갑니다. 출발 장소와 도착 예정 시간은 사고가 아니라 원거리 수상레저활동을 사전에 신고할 때 적는 항목이라 성격이 다릅니다. '사고 후 신고'와 '사전 신고'를 구분하는 문제입니다."},{"i":412,"q":"수상레저안전법상 용어에 대한 설명으로 가장 옳지 않은 것은?","o":["“수상레저활동”이란 수상에서 수상레저기구를 사용하여 이루어지는 활동이다.","“수상레저기구”란 수상레저활동에 사용되는 동력수상레저기구만 해당된다.","“동력수상레저기구”란 수상오토바이, 모터보트, 고무보트, 세일링 요트 등이 있다.","내수면이랑 하천, 댐, 호수, 늪, 저수지 등 기수의 수류 또는 수면을 말한다."],"a":1,"e":"수상레저기구란 수상레저활동에 사용되는 무동력수상레저기구도 포함한다.(수상레저안전법 제2조 3항)","c":"수상레저안전법","t":"new","x":"수상레저기구에는 동력수상레저기구뿐 아니라 무동력수상레저기구도 포함됩니다. 따라서 '동력수상레저기구만 해당된다'는 서술이 틀렸습니다. 조종면허가 필요한 것은 동력 쪽이지만, 법의 적용 대상인 기구의 범위는 더 넓습니다. 면허 대상과 법 적용 대상을 혼동하게 만드는 문제이므로 두 범위를 구분해 두어야 합니다."},{"i":413,"q":"해양경찰청장 또는 시장·군수·구청장에게 수수료를 납부해야 하는 사유가 아닌 경우는?","o":["말소등록을 신청하려는 경우","등록원부 사본의 발급을 신청하려는 경우","검사대행자가 안전검사 업무를 대행하는 경우","등록증 및 등록번호판의 재발급을 신청하려는 경우"],"a":2,"e":"수상레저기구등록법 제26조(수수료)","c":"수상레저안전법","x":"수수료는 행정청에 무엇인가를 신청하는 사람이 냅니다. 말소등록 신청, 등록원부 사본 발급 신청, 등록증·번호판 재발급 신청이 모두 그런 경우입니다. 반면 검사대행자가 안전검사 업무를 대행하는 것은 행정청의 업무를 대신 수행하는 것이지 신청 행위가 아니므로, 대행자가 수수료를 내야 하는 사유가 아닙니다."},{"i":414,"q":"정원을 초과하여 사람을 태우고 수상레저기구를 조종한 경우 과태료 부과금액은 얼마인가?","o":["10만원","20만원","60만원","100만원"],"a":2,"e":"","c":"수상레저안전법","x":"정원 초과는 전복이나 침수로 곧바로 인명 피해로 이어질 수 있는 위반이라 과태료가 무겁게 매겨지며, 개정된 문제은행은 그 금액을 60만원으로 제시하고 있습니다. 정원은 등록 대상 기구의 경우 안전검사증에 적힌 인원을 기준으로 하고, 등록 대상이 아닌 기구는 고시된 산출기준을 따릅니다. 해난구조 등 부득이한 사유로 태운 경우는 예외입니다."},{"i":415,"q":"요트조종면허 필기·실기시험 과목의 전부 또는 일부를 면제할 수 있는 대상이 아닌 자는?","o":["제1급 조종면허 필기시험을 합격한 사람","대통령령으로 정하는 동력수상레저기구 관련 학과 졸업과 관련 과목을 이수한 사람","대통령령으로 정하는 체육 관련 단체에 동력수상레저기구의 선수로 등록된 사람","면허시험 면제교육기관에서 실시하는 교육을 이수한 사람"],"a":0,"e":"제1급 조종면허 필기시험 합격자는 2급조종면허 필기시험을 면제 받을 수 있다(수상레저안전법 제9조_면 허시험의 면제)","c":"수상레저안전법","t":"new","x":"제1급 조종면허 필기시험 합격자는 같은 계열인 제2급 조종면허의 필기시험을 면제받을 수 있을 뿐, 요트조종면허 시험의 면제 대상은 아닙니다. 요트 쪽 면제는 관련 학과에서 정해진 과목을 이수한 사람, 체육 관련 단체의 선수로 등록된 사람, 면제교육기관 교육을 이수한 사람에게 적용됩니다. 면허 계열이 다르다는 점이 핵심입니다."},{"i":416,"q":"수상레저안전법상 동력수상레저기구는 모두 몇 개인가?\n㉠ 모터보트\n㉡ 스쿠터 ㉢ 딩기요트 ㉣ 노보트 ㉤ 호버크라프트 ㉥ 세일링요트","o":["2개","3개","4개","5개"],"a":2,"e":"수상레저안전법 시행령 제2조(수상레저기구의 종류)","c":"수상레저안전법","x":"동력수상레저기구는 추진기관을 달아 스스로 움직이는 기구를 말합니다. 보기에서는 모터보트, 스쿠터, 호버크라프트, 세일링요트 네 가지가 여기에 해당합니다. 딩기요트는 돛과 노만으로 움직이고 노보트도 사람의 힘으로 젓는 배라 무동력수상레저기구로 분류됩니다. '추진기관이 달렸는가'만 따져 세면 정확히 넷이 됩니다."},{"i":417,"q":"안전교육 위탁기관의 업무정지 6개월 및 지정취소 사유에 해당되지 않는 것은?","o":["부정한 방법으로 안전교육 위탁기관 지정을 받은 경우","부정한 방법으로 안전교육 수료에 관한 증서를 발급한 경우","안전교육 위탁기관 지정기준에 미치지 못하게 된 경우","안전교육 대상자 관리를 소홀히 한 경우"],"a":3,"e":"안전교육 대상자 관리 소홀은 업무지정 및 지정취소에 사유에 해당되지 않음(수상레저안전법 제14조_안전 교육 위탁기관의 지정취소 등)","c":"수상레저안전법","t":"new","x":"지정 취소나 6개월 업무정지 사유는 기관의 자격과 신뢰성에 직접 관계되는 중대한 사항입니다. 부정한 방법의 지정, 부정한 수료증 발급, 지정기준 미달이 그것입니다. 반면 안전교육 대상자 관리를 소홀히 한 것은 운영상의 미흡함이라 별도의 시정 조치 대상일 뿐 지정취소나 6개월 업무정지 사유로 규정되어 있지 않습니다."},{"i":418,"q":"해양경찰청장이 지정ㆍ고시하는 기관이나 단체에서 실시하는 교육을 이수한 사람의 요트 조종면허 시험 과목의 면제 기준으로 옳은 것은?","o":["실기시험 과목의 전부","필기시험 과목의 전부","필기시험 및 실기시험 과목의 전부","필기시험 및 실기시험 과목의 일부"],"a":2,"e":"해양경찰청장이 지정ㆍ고시하는 기관이나 단체에서 실시하는 교육을 이수한 사람은 제2급 조종면허와 요트 조종면허에 한정하여 필기시험 및 실기시험 과목의 전부 받을 수 있다","c":"수상레저안전법","x":"해양경찰청장이 지정·고시한 기관이나 단체의 교육을 이수하면 제2급 조종면허와 요트조종면허에 한해 필기시험과 실기시험 과목의 전부를 면제받습니다. 이것이 흔히 말하는 면제교육 과정입니다. 일부만 면제되는 다른 사유들과 달리 전부 면제라는 점, 대상 면허가 2급과 요트로 한정된다는 점을 함께 기억하세요."},{"i":419,"q":"수상레저안전법상 ( )에 들어갈 내용으로 적합한 것은? 기상특보 중 풍랑·폭풍해일·호우·대설·강풍 ( ) 가 발효된 구역에서 파도 또는 바람만을 이용 하여 활동이 가능한 수상레저기구를 운항할 경우 관할 해양경찰서장 또는 시장·군수·구청장에게 ( ) 를 제출해야 한다.","o":["주의보, 운항신고서","경보, 기상특보활동신고서","경보, 운항신고서","주의보, 기상특보활동 신고서"],"a":3,"e":"수상레저안전법 시행령 제21조(수상레저활동 제한의 예외)","c":"수상레저안전법","x":"기상특보가 내려진 구역에서는 원칙적으로 수상레저활동이 제한되지만, 파도나 바람만을 이용해 활동하는 기구는 예외를 인정받을 수 있습니다. 이때 대상은 주의보 단계이며, 관할 해양경찰서장이나 시장·군수·구청장에게 기상특보활동 신고서를 제출해야 합니다. 경보 단계까지 허용되는 것이 아니라는 점, 신고서 이름이 '운항신고서'가 아니라는 점이 함정입니다."},{"i":420,"q":"조종면허 시험 중 부정행위자에 대한 제재조치로서 옳지 않은 것은?","o":["당해 시험을 중지시킬 수 있다.","당해 시험을 무효로 할 수 있다.","공무집행방해가 인정될 경우 형사처벌을 받을 수 있다.","1년간 조종면허시험에 응시할 수 없다."],"a":3,"e":"수상레저안전법 제11조(부정행위자에 대한 제재) 2년간 면허시험에 응시할 수 없다.","c":"수상레저안전법","x":"부정행위를 한 사람은 그 시험이 중지되거나 무효로 처리되고, 그 시험 시행일부터 2년간 면허시험에 응시할 수 없습니다. 1년이라고 적은 보기가 틀렸습니다. 부정행위 과정에서 공무집행방해가 인정되면 별도로 형사처벌을 받을 수도 있습니다. 결격기간이 대체로 1년인 다른 사유들과 달리 2년이라는 점이 함정입니다."},{"i":421,"q":"조종면허시험 면제를 위해 동력수상레저기구 관련 학과에서 이수하여야 할 동력수상레저기구에 관한 과목은 몇 학점인가?","o":["2학점 이상","6학점 이상","10학점 이상","15학점 이상"],"a":1,"e":"수상레저안전법 시행령 제10조(면허시험의 면제 등) 제2항","c":"수상레저안전법","x":"동력수상레저기구 관련 학과에서 조종면허시험 면제를 받으려면 동력수상레저기구에 관한 과목을 6학점 이상 이수해야 합니다. 일정 수준 이상의 전공 교육을 받았을 때만 시험을 대신할 수 있다고 본 것입니다. 학점 수를 2·10·15로 바꿔 놓는 방식으로 출제되므로 숫자 자체를 정확히 외워야 합니다."},{"i":422,"q":"조종면허를 받을 수 없는 경우로 옳지 않은 것은?","o":["무면허 조종으로 단속된 날부터 1년이 지난 자","조종면허가 취소된 날부터 1년이 지나지 아니한 자","정신질환자 중 수상레저활동을 수행할 수 없다고 정하는 자","마약중독자 중 수상레저활동을 수행할 수 없다고 정하는 자"],"a":0,"e":"수상레저안전법 제7조(조종면허의 결격사유 등) 무면허 조종한 사람으로서 그 위반한 날부터 1년이 지나지 아니한 자","c":"수상레저안전법","x":"무면허 조종으로 단속된 사람은 위반한 날부터 1년간 면허를 받을 수 없으므로, 1년이 이미 지났다면 결격사유가 해소되어 면허를 받을 수 있습니다. 반면 면허가 취소된 날부터 1년이 지나지 않은 사람, 정신질환이나 마약 중독으로 활동이 어렵다고 인정되는 사람은 결격사유에 해당합니다. '지났다'와 '지나지 않았다'를 정확히 읽어야 합니다."},{"i":423,"q":"요트조종면허 면제교육 내용으로 옳지 않은 것은?","o":["수상레저관계 법령","조종술","항해 및 기관","범주법"],"a":1,"e":"조종술은 일반조종면허 교육 내용이다","c":"수상레저안전법","t":"new","x":"요트조종면허 면제교육은 돛으로 항해하는 데 필요한 내용으로 짜여 있어 수상레저 관계 법령, 항해 및 기관, 범주법 등을 다룹니다. 조종술은 모터보트를 다루는 일반조종면허 교육의 내용이라 요트 면제교육 과목에 들어가지 않습니다. 두 면허의 교육 과목을 서로 섞어 놓는 형태로 반복 출제됩니다."},{"i":424,"q":"수상레저기구의 정원초과금지와 관련된 사항이다. 옳지 않은 것은?","o":["당해 기구의 정원을 초과하여 사람이 탑승하면 과태료 200만원이 부과된다.","등록대상 수상레저기구의 정원기준은 안전검사증에 기재된 정원을 말한다.","해난구조 등 기타 부득이한 사유로 인하여 승선한 경우는 예외로 한다.","등록대상이 아닌 레저기구는 별도의 고시에 따른 정원 산출 계산 기준에 의해 정원을 산출한다."],"a":0,"e":"수상레저안전법 시행령 별표14(과태료의 부과기준) 정원을 초과하여 사람이 탑승한 경우 과태료 60만원이 부과된다.","c":"수상레저안전법","x":"정원을 초과해 사람을 태운 경우의 과태료는 60만원입니다. 200만원이라고 적은 보기가 틀렸습니다. 정원은 등록대상 기구의 경우 안전검사증에 적힌 인원을 기준으로 하고, 등록대상이 아닌 기구는 고시된 산출기준에 따라 계산하며, 해난구조 등 부득이한 사유로 태운 인원은 예외로 본다는 나머지 설명은 옳습니다."},{"i":425,"q":"수상레저안전법 적용이 제외되지 않는 행위는?","o":["낚시관리 및 육성법에 따른 낚시어선의 영업행위","국민체육진흥법에 의한 경기단체의 주관으로 실시되는 요트대회","체육시설의 설치․이용에 관한 법률에 의해 등록된 요트의 영업행위","유선 및 도선사업법에 의해 신고된 모터보트의 유선행위"],"a":1,"e":"수상레저안전법 제3조(적용 배제)","c":"수상레저안전법","x":"수상레저안전법은 다른 법률로 이미 안전관리가 이루어지는 영업행위에는 적용을 배제합니다. 낚시어선업, 체육시설법에 따라 등록된 요트 영업, 유선 및 도선 사업법에 따른 유선행위가 그런 경우입니다. 반면 경기단체가 주관하는 요트대회는 별도의 영업 규제 체계가 아니므로 수상레저안전법이 그대로 적용됩니다."},{"i":426,"q":"수상레저사업 시설 및 기구에 대한 안전점검 대상과 항목으로 옳지 않은 것은?","o":["응급구조사 배치기준 및 준수 의무","수상레저사업자와 그 종사자의 조치 의무","수상레저사업자와 그 종사자의 행위 제한 등의 준수 의무","사업장 시설․장비 등이 등록기준에 적합한지 여부"],"a":0,"e":"응급구조사 배치기준 및 준수 의무는 점검 대상과 항목에 속하지 않는다(수상레저안전법 시행령 제25조)","c":"수상레저안전법","t":"new","x":"안전점검의 대상과 항목은 사업자와 종사자가 지켜야 할 조치 의무와 행위 제한, 그리고 사업장 시설·장비가 등록기준에 맞는지 여부입니다. 응급구조사 배치는 수상레저사업의 등록기준으로 요구되는 사항이 아니어서 점검 항목에 들어가지 않습니다. 인명구조 업무는 수상구조사나 래프팅가이드 자격자가 담당한다는 점과 구분해 두세요."},{"i":427,"q":"수상레저안전법상 요트조종면허를 받을 수 있는 나이의 기준으로 옳은 것은?","o":["14세 미만","14세 이상","16세 이상","18세 이상"],"a":1,"e":"14세 이상부터 요트조종면허 취득이 가능함(수상레저안전법 제7조_조종면허의 결격사유 등)","c":"수상레저안전법","t":"chg","x":"요트조종면허는 14세 이상이면 받을 수 있습니다. 14세 미만인 사람이 결격사유에 해당하기 때문에 그 반대로 14세 이상이 기준이 되는 것이며, 18세 이상이 요구되는 것은 제1급 조종면허뿐입니다. 개정 전 문제은행에서는 이 문항이 제1급 면허의 나이를 묻는 형태였으므로, 예전 답(18세)을 외웠다면 그대로 틀리게 됩니다."},{"i":428,"q":"수상레저안전법상 면허시험 부정행위자의 제재에 대한 설명으로 가장 옳은 것은?","o":["해양경찰청장은 부정행위를 한 자에 대하여 1차 경고 후 시험의 중지 또는 무효 처분을 할 수 있다.","시험의 중지 또는 무효의 처분을 받은 자는 그 시험 시행일부터 2년간 면허시험에 응시할 수 없다.","부정행위자는 소정의 과태료 납부 후 면허시험에 응시할 수 있다.","부정행위자는 소정의 안전교육 이수 후 면허시험에 응시할 수 있다."],"a":1,"e":"부정행위자는 그 시험 시행일부터 2년간 면허시험에 응시 할 수 없다(수상레저안전법 제11조_부정행위자에 대한 제재)","c":"수상레저안전법","t":"new","x":"부정행위를 하면 경고 절차 없이 곧바로 시험을 중지시키거나 무효로 처리할 수 있고, 그 처분을 받은 사람은 시험 시행일부터 2년간 면허시험에 응시할 수 없습니다. 과태료를 내거나 안전교육을 이수한다고 해서 이 제한이 풀리지도 않습니다. 제재의 강도가 높은 이유는 시험의 공정성이 면허 제도의 근간이기 때문입니다."},{"i":429,"q":"동력수상레저기구의 검사대행자가갖추어야 하는 일반장비가 아닌 것을 모두 고르시오.\n① 마이크로미터\n② 절연저항 측정기\n③ 반사경\n④ 육각렌치\n⑤ 청음기\n⑥ 나침반","o":["①, ⑥","②, ③","②, ⑤","④, ⑥"],"a":3,"e":"","c":"수상레저안전법","x":"검사대행자의 일반장비는 기구의 상태를 재고 확인하는 계측·검사용 장비를 말합니다. 마이크로미터(치수 측정), 절연저항 측정기(전기 안전 확인), 반사경(가려진 곳 관찰), 청음기(이상음 청취)가 그런 장비입니다. 반면 육각렌치는 조립에 쓰는 일반 공구이고 나침반은 항해 장비라, 검사 능력을 갖추었는지 따지는 일반장비 목록에는 들어가지 않습니다."},{"i":430,"q":"면허시험 응시원서의 제출 및 접수 등에 대한 설명으로 옳지 않은 것은?","o":["응시원서에는 최근 6개월 이내 사진 1장을 제출해야 함","해양경찰청장은 행정정보의 공동이용을 통하여 외국인 등록사실 증명을 확인해야 함","해양경찰청장은 응시원서를 제출받은 경우 접수대장에 기록해야 함","응시표의 유효기간은 해당 응시원서의 접수일부터 6개월까지로 한다"],"a":3,"e":"응시표의 유효기간은 해당 응시원서의 접수일부터 1년까지로 하며, 면허시험의 필기시험에 합격한 경우에는 그 필기시험 합격일부터 1년까지로 한다.(수상레저안전법 시행규칙 제6조_면허시험 응시원서의 제출 및 접수 등)","c":"수상레저안전법","t":"new","x":"응시표의 유효기간은 접수일부터 1년이며, 필기시험에 합격한 경우에는 그 합격일부터 1년입니다. 6개월이라고 적은 보기가 틀렸습니다. 응시원서에는 최근 6개월 이내에 촬영한 사진을 제출하고, 행정정보 공동이용으로 외국인등록사실증명 등을 확인하며, 접수 시 접수대장에 기록한다는 나머지 설명은 옳습니다."},{"i":431,"q":"수상레저안전법상 해양경찰청장이 조종면허를 취소해야 하는 사유가 아닌 것은?","o":["거짓이나 그 밖의 부정한 방법으로 조종면허를 받은 경우","조종면허 효력정지 기간에 조종을 한 경우","조종 중 고의 또는 과실로 사람을 사상한 경우","조종면허를 받을 수 없는 사람이 조종면허를 받은 경우"],"a":2,"e":"수상레저안전법 제17조(조종면허의 취소·정지) “병”의 경우 조종면허 효력정지 사유","c":"수상레저안전법","x":"조종 중 고의나 과실로 사람을 사상한 경우는 사안의 경중에 따라 취소 또는 효력정지로 나뉘는 사유라 반드시 취소해야 하는 항목이 아닙니다. 반면 거짓이나 부정한 방법으로 면허를 받은 경우, 효력정지 기간에 조종한 경우, 결격사유가 있어 면허를 받을 수 없는 사람이 면허를 받은 경우는 반드시 취소해야 합니다."},{"i":432,"q":"수상레저사업자의 안전점검에 대한 내용으로 옳지 않은 것은?","o":["수상레저기구와 시설의 안전점검","영업구역의 기상․수상의 상태의 확인","종사자에 대한 안전교육","비상구조선의 배치"],"a":2,"e":"","c":"수상레저안전법","x":"사업자가 영업 시작 전후로 하는 안전점검은 '지금 이 영업구역에서 안전하게 운항할 수 있는가'를 확인하는 활동입니다. 기구와 시설의 상태 점검, 기상과 수상 상태 확인, 비상구조선 배치가 여기에 해당합니다. 종사자 안전교육은 사람을 대상으로 미리 실시하는 별도의 의무여서 현장 안전점검 항목으로 묶지 않습니다."},{"i":433,"q":"수상레저기구가 방파제·다이빙대·계류장·교량 등 위험발생요소가 많은 지역을 근접하여 운항하는 때에 지켜야 할 제한속력은 얼마인가?","o":["10knot 이하의 속력","15knot 이하의 속력","20knot 이하의 속력","25knot 이하의 속력"],"a":0,"e":"수상레저안전법 시행령 별표11(운항방법 및 기구의 속도 등에 관한 준수사항)","c":"수상레저안전법","t":"chg","x":"방파제·다이빙대·계류장·교량처럼 사람과 시설이 밀집해 위험이 큰 지역에 근접해 운항할 때는 10노트 이하로 속력을 줄여야 합니다. 속력을 줄여야 갑작스러운 상황에서 정지하거나 피할 여유가 생기고, 항주파로 인한 피해도 줄어듭니다. 구역별 거리와 제한속력을 짝지어 정리해 두면 관련 문제를 함께 처리할 수 있습니다."},{"i":434,"q":"등록대상 동력수상레저기구에 대한 안전검사의 종류로 옳지 않은 것은?","o":["신규검사","정기검사","임시검사","중간검사"],"a":3,"e":"수상레저기구의 등록 및 검사에 관한 법률 제15조(안전검사)","c":"수상레저안전법","x":"등록대상 동력수상레저기구의 안전검사는 신규검사, 정기검사, 임시검사 세 가지입니다. 처음 등록할 때, 일정 주기마다, 그리고 개조나 사고 등으로 필요할 때 받는 구조입니다. 중간검사는 선박안전법상 대형 선박에 적용되는 검사 종류라 수상레저기구의 안전검사에는 들어가지 않습니다."},{"i":435,"q":"( ) 안에 들어갈 순서대로 적합한 것은? 면허증을 다른 사람에게 빌려주어 조종하게 한 경우에는 조종면허를 취소하거나 (\n① )의 범위에서 기간을 정하여 그 조종면허 효력을 정지할 수 있고, 조종면허가 취소되거나 그 효력이 정지된 날 부터 (\n② ) 이내 해양경찰청장에게 면허증을 반납하여야 한다.","o":["① 3월 ② 5일","① 6월 ② 6일","① 1년 ② 7일","① 2년 ② 10일"],"a":2,"e":"수상레저안전법 제17조(조종면허의 취소·정지)제2항","c":"수상레저안전법","x":"면허증을 빌려주어 조종하게 한 경우는 면허를 취소하거나 1년의 범위에서 기간을 정해 효력을 정지할 수 있습니다. 그리고 면허가 취소되거나 정지되면 그날부터 7일 이내에 면허증을 반납해야 합니다. 처분의 상한 기간(1년)과 반납 기한(7일)이라는 두 숫자를 함께 묶어 외우는 것이 핵심입니다."},{"i":436,"q":"안전검사대행기관으로 지정받으려는 자가 해양경찰청장에게 제출해야 하는 서류가 아닌 것은?","o":["인적기준·시설기준 및 장비기준을 갖추었음을 증명하는 서류","조종면허증 보유현황","수상안전교육 내용이 포함된 교육 실시계획서","시설기준에 관한 도면"],"a":1,"e":"수상레저안전법 시행규칙 제14조(안전교육 위탁기관의 지정신청 등)","c":"수상레저안전법","x":"지정 신청 서류는 그 기관이 검사나 교육 업무를 수행할 능력이 있는지를 보여 주는 자료로 한정됩니다. 인력·시설·장비 기준을 갖추었다는 증명 서류, 시설 도면, 교육 실시계획서가 그것입니다. 소속 직원의 조종면허증 보유현황은 별도로 제출하도록 정해진 서류가 아니어서 답이 됩니다."},{"i":437,"q":"다음은 수상레저기구 속도등에 관한 준수사항이다. ( )에 순서대로 적합한 것은? 계류장, 공기주입형 고정식 튜브 등 수상에 띄우는 수상레저기구 및 설비가 설치된 곳으로부터 ( ) 이내의 구역에서는 인위적으로 파도를 발생시키는 특수장치가 설치된 동력수상레저기구를 운항해서는 안 된다. 다만, 동력수상레저기구에 설치된 특수장치를 이용하여 인위적으로 파도를 발생시키지 않고 ( ) 이하의 속력 으로 운항하는 경우에는 그렇지 않다.","o":["250미터, 10노트","200미터, 10노트","150미터, 5노트","100미터, 5노트"],"a":2,"e":"수상레저안전법 시행령 [별표11] 운항방법 및 기구의 속도 등에 관한 준수사항","c":"수상레저안전법","x":"계류장이나 공기주입형 고정식 튜브처럼 수상에 띄운 시설로부터 150미터 이내에서는 인위적으로 파도를 만드는 특수장치를 갖춘 동력수상레저기구를 운항할 수 없습니다. 인공 파도가 시설과 이용자에게 직접 위험이 되기 때문입니다. 다만 파도를 만들지 않고 5노트 이하로 천천히 지나가는 경우는 허용됩니다. 150미터와 5노트를 함께 외우세요."},{"i":438,"q":"수상레저안전법상 금지사항에 대한 설명으로 가장 옳지 않은 것은?","o":["누구든지 조종면허를 받아야 조종할 수 있는 동력수상레저기구를 조종면허를 받지 아니하고 조종 하여서는 아니 된다.","누구든지 해진 후 30분부터 해뜨기 전 30분까지는 수상레저 활동을 하여서는 아니 된다.","누구든지 술에 취한 상태에서 동력수상레저기구를 조종 하여서는 아니 된다.","누구든지 수상레저기구의 준공검사에서 결정되는 정원을 초과하여 사람을 태우고 운항하여서는 아니 된다."],"a":3,"e":"수상레저기구의정원은 안전검사에 따라 결정되는 정원으로 한다.","c":"수상레저안전법","x":"수상레저기구의 정원은 준공검사가 아니라 안전검사에서 결정됩니다. 등록 대상이 아닌 기구는 해양경찰청장이 고시하는 산출기준에 따라 정원을 계산합니다. 따라서 '준공검사에서 결정되는 정원'이라는 표현이 틀렸습니다. 무면허 조종 금지, 해진 후 30분부터 해뜨기 전 30분까지의 야간 활동 제한, 음주 조종 금지는 모두 옳은 내용입니다."},{"i":439,"q":"수상레저안전법상 ( )에 들어갈 내용으로 적합한 것은? 동력수상레저기구 조종면허를 받아야 조종할 수 있는 동력수상레저기구로서 추진기관의 최대 출력이 5마력 이상[출력 단위가 킬로와트인 경우에는 ( )킬로와트 이상을 말한다]인 동력수상레저기구로 한다.","o":["2","3","2.75","3.75"],"a":3,"e":"수상레저안전법 시행령 제4조(조종면허 대상 및 기준)","c":"수상레저안전법","x":"조종면허가 필요한 기준은 추진기관 최대출력 5마력 이상이며, 이를 킬로와트로 환산하면 3.75킬로와트입니다. 1마력이 약 0.75킬로와트이므로 5마력 × 0.75 = 3.75가 되는 셈입니다. 요트도 이 기준에 따라 보조기관 출력이 5마력(3.75kW) 이상이면 요트조종면허가 필요합니다. 환산값을 그대로 묻는 문제이므로 숫자를 정확히 기억하세요."},{"i":440,"q":"수상레저기구의 변경등록 대상이 아닌 것은?","o":["매매․증여 등으로 소유권의 변경이 있는 때","소유자의 성명이나 수상레저기구의 명칭에 변경이 있을 때","수상레저기구가 말소되었을 때","용도의 변경이 있을 때"],"a":2,"e":"","c":"수상레저안전법","x":"변경등록은 이미 등록된 기구의 등록 내용이 달라졌을 때 그 사항을 고치는 절차입니다. 소유권 이전, 소유자 성명이나 기구 명칭의 변경, 용도 변경이 대표적입니다. 반면 기구가 말소된 경우는 등록 자체를 없애는 말소등록의 문제라 변경등록 대상이 될 수 없습니다. 신규등록-변경등록-말소등록의 적용 국면을 구분하는 문제입니다."},{"i":441,"q":"수상레저기구의 등록 신청시 해양경찰서장 또는 시장·군수·구청장이 행정정보의 공동이용을 통해 확인 해야 할 서류가 아닌 것은?","o":["면허증","법인등기사항증명서","주민등록표 초본","외국인등록사실증명"],"a":0,"e":"면허증은 행정정보의 공동이용을 통하여 확인해야 할 서류가 아님(수상레저기구등록법 시행령 제4조제2항)","c":"수상레저안전법","t":"new","x":"행정정보 공동이용으로 확인하는 서류는 행정기관이 이미 보유하고 있어 신청인이 따로 낼 필요가 없는 자료입니다. 법인등기사항증명서, 주민등록표 초본, 외국인등록사실증명이 그것입니다. 면허증은 기구의 등록 요건과 직접 관련이 없을뿐더러 공동이용으로 확인해야 할 서류로 규정되어 있지도 않습니다."},{"i":442,"q":"빈칸에 들어갈 알맞은 것을 순서대로 고르시오. 다른 수상레저기구 등과 정면으로 충돌할 위험이 있을 때에는 ( )쪽으로 진로를 피해야 한다. 진로를 횡단하는 경우에는 ( )에 두고 있는 수상레저기구가 진로를 피해야 한다. 같은 방향으로 운항하는 경우에는 ( )미터 이내로 접근하여 운항하여서는 아니 된다.","o":["우현, 오른쪽, 2","우현, 왼쪽, 2","좌현, 오른쪽, 5","좌현, 왼쪽, 5"],"a":0,"e":"수상레저안전법 시행령 별표11(운항방법 및 기구의 속도 등에 관한 준수사항)","c":"수상레저안전법","x":"정면으로 충돌할 위험이 있으면 서로 우현 쪽으로 진로를 바꿔 좌현끼리 지나가도록 합니다. 진로가 교차할 때는 상대를 자기 오른쪽에 두고 있는 쪽이 피해야 하며, 같은 방향으로 나란히 갈 때는 2미터 이내로 접근하면 안 됩니다. 해상교통안전법의 마주침·횡단 항법과 같은 원리가 수상레저기구에도 적용된다고 이해하면 쉽습니다."},{"i":443,"q":"조종면허증의 갱신기간으로 가장 적당한 것은?","o":["면허증 발급일로부터 5년이 되는 날부터 3월 이내","면허증 발급일로부터 5년이 되는 날부터 6월 이내","면허증 발급일로부터 7년이 되는 날부터 3월 이내","면허증 발급일로부터 7년이 되는 날부터 6월 이내"],"a":3,"e":"수상레저안전법 제12조(조종면허증의 갱신 등) 면허증 발급일부터 기산하여 7년이 되는 날부터 6개월 이내","c":"수상레저안전법","x":"조종면허증의 갱신 기간은 면허증 발급일부터 7년이 되는 날부터 6개월 이내입니다. 이후에는 직전 갱신 기간이 시작된 날부터 다시 7년이 되는 날을 기준으로 삼습니다. 기간 안에 갱신하지 않으면 만료 다음 날부터 면허 효력이 정지되므로, '7년 + 6개월'이라는 숫자를 정확히 기억해야 합니다."},{"i":444,"q":"국내에서 건조되는 수상레저기구의 신규검사 대상으로 옳지 않은 것은?","o":["선체 길이가 5미터 이상인 모터보트 또는 세일링요트","운항구역이 연해구역 이상인 모터보트 또는 세일링요트","승선 정원이 13명 이상인 모터보트 또는 세일링요트","총톤수가 5톤 이상인 모터보트 또는 세일링요트"],"a":0,"e":"선체길이는 신규검사 대상에 포함되지 않는다.","c":"수상레저안전법","t":"new","x":"신규검사 대상은 배의 크기와 활동 범위, 태우는 인원을 기준으로 정해집니다. 총톤수 5톤 이상, 승선정원 13명 이상, 운항구역이 연해구역 이상인 모터보트나 세일링요트가 그것입니다. 반면 '선체 길이 5미터 이상'은 규정된 기준이 아니므로 답이 됩니다. 길이가 아니라 톤수·정원·운항구역이라는 세 축으로 기억하세요."},{"i":445,"q":"수상레저기구의 정원초과금지와 관련된 사항이다. 옳지 않은 것은?","o":["등록대상 수상레저기구의 정원기준은 안전검사증에 기재된 정원을 말한다.","당해 기구의 정원을 초과하여 사람을 탑승하면 과태료 100만원이 부과된다.","등록대상이 아닌 레저기구는 별도의 고시에 따른 정원 산출기준에 따른다.","해난구조 등 기타 부득이한 사유로 인하여 승선한 경우는 예외로 한다."],"a":1,"e":"수상레저안전법 시행령 별표14(과태료의 부과기준) 정원을 초과하여 사람이 탑승한 경우 과태료 60만원이 부과된다.","c":"수상레저안전법","x":"정원 초과 시 과태료는 60만원이므로 100만원이라고 적은 보기가 틀렸습니다. 개정 문제은행에서는 같은 취지의 문항이 여러 번 나오면서 금액만 200만원, 100만원 등으로 바꿔 출제되므로 숫자 자체를 정확히 외워 두어야 합니다. 정원 기준과 예외(해난구조 등 부득이한 승선)는 다른 문항과 동일합니다."},{"i":446,"q":"수상레저안전법의 목적으로 가장 알맞은 것은?","o":["수상레저 제도 마련을 통해 수상레저사업의 건전한 발전과 복리 증진","마리나산업의 건전한 발전과 요트시설을 확충하여 공공의 복리 증진 도모","수상레저활동의 안전·질서 유지 및 수상레저사업의 건전한 발전 도모","수상레저시설의 확충과 수상레저사업장 질서유지와 진흥 도모"],"a":2,"e":"수상레저안전법 제1조(목적)","c":"수상레저안전법","x":"수상레저안전법은 수상레저활동의 안전과 질서를 확보하고 수상레저사업이 건전하게 발전하도록 하는 것을 목적으로 합니다. 즉 이용자의 안전과 사업의 건전한 발전이라는 두 축입니다. 마리나 시설 확충은 마리나항만법, 체육시설 진흥은 체육시설법의 목적이므로 다른 법의 목적 조항과 섞어 놓은 보기에 주의해야 합니다."},{"i":447,"q":"요트조종면허의 필기시험을 면제받을 수 있는 사람은?","o":["대통령령이 정하는 체육관련 단체에 동력수상레저기구의 선수로 등록된 사람","한국해양소년단연맹육성법상 동력수상레저기구의 교육업무에 1년 이상 종사한자로써 단체장의 추천을 받은 사람","면허시험 면제교육기관에서 실시하는 교육을 이수한 사람","조종면허 1급 필기시험을 합격한 후 요트면허 실기시험으로 변경하여 응시하고자 하는 사람"],"a":2,"e":"","c":"수상레저안전법","x":"해양경찰청장이 지정·고시한 기관에서 실시하는 면허시험 면제교육을 이수하면 요트조종면허의 필기시험과 실기시험을 모두 면제받습니다. 이른바 면제교육 과정이며, 실무에서 요트면허를 취득하는 흔한 경로이기도 합니다. 체육 관련 단체의 선수 등록자나 관련 업무 종사자는 면제 범위가 실기 등으로 한정되므로, 어떤 시험이 면제되는지까지 함께 확인해야 합니다."},{"i":448,"q":"수상레저활동자가 착용하는 인명안전장비인 구명조끼와 안전모를 착용해야 하는 경우로 가장 옳지 않은 것은?","o":["워터슬레이드를 사용하여 수상레저활동을 하는 경우","래프팅 수상레저활동을 하는 경우","관할 해양경찰서장, 시장, 군수, 구청장이 수상레저활동 형태 등을 고려하여 인명안전장비 종류를 특정하여 착용 지시한 경우","서프보드 또는 패들보드를 사용하여 수상레저활동을 하는 경우"],"a":3,"e":"수상레저안전법 시행규칙 제23조 서프보드 또는 패들보드를 사용하여 수상레저활동을 하는 경우에는 보드 리쉬(board leash)를 착용해야 한다.","c":"수상레저안전법","x":"서프보드나 패들보드를 사용할 때는 구명조끼와 안전모 대신 보드 리쉬를 착용하도록 정하고 있습니다. 보드 자체가 부력체 역할을 하므로 몸과 보드를 연결해 두는 것이 더 실효적이기 때문입니다. 반면 워터슬레이드나 래프팅은 구명조끼와 안전모를 착용해야 하고, 관할 기관장이 장비를 특정해 지시한 경우에도 그에 따라야 합니다."},{"i":449,"q":"수상레저안전법상 해양경찰서장 또는 시장·군수·구청장이 수상레저활동의 안전을 위하여 수상레저 활동을 하는 자에게 명할 수 있는 사항으로 옳지 않은 것은?","o":["수상레저기구의 탑승 인원의 제한","수상레저활동의 일시정지","수상레저기구의 압류","수상레저 조종자의 교체"],"a":2,"e":"수상레저안전법 제31조(시정명령)","c":"수상레저안전법","x":"시정명령으로 할 수 있는 것은 활동을 안전하게 되돌리기 위한 조치들, 즉 탑승 인원 제한, 활동의 일시정지, 조종자 교체 등입니다. 반면 수상레저기구를 압류하는 것은 재산권을 직접 빼앗는 강제처분이라 시정명령의 범위를 넘어서며, 별도의 법적 근거와 절차가 필요합니다. '현장에서 위험을 줄이는 조치인가'로 판단하면 됩니다."},{"i":450,"q":"동력수상레저기구의 안전교육 대행기관이 갖추어야 하는 기준에 대한 설명으로 틀린 것은?","o":["인적기준 : 수상레저관련 업무에 3년이상 종사한 경력 강사 2명 이상 둘 것","시설기준 : 교육장 면적(50제곱미터), 행정실 면적(10제곱미터)","시설기준 : 승용차 10대 이상이 주차할 수 있는 공간","장비기준 : 구명조끼 20개이상, 구명부환 5개이상"],"a":3,"e":"장비기준 : 마이크, 컴퓨터, 빔 프로젝트 또는 스크린 등 시청각 교육을 위한 장비(수상레저안전법 시행령 별표7_안전교육 위탁기관의 인적기준·시설기준 및 장비기준)","c":"수상레저안전법","t":"new","x":"안전교육 위탁기관의 장비기준은 마이크, 컴퓨터, 빔프로젝터나 스크린 같은 시청각 교육 장비입니다. 이론 교육을 하는 기관이기 때문입니다. 구명조끼나 구명부환 같은 인명구조 장비는 실기 교육이나 영업을 하는 기관에 요구되는 기준이라 여기에 해당하지 않습니다. 기관의 성격에 맞는 장비인지로 판단하면 됩니다."},{"i":451,"q":"부과권자는 과징금 개별기준에 따라 그 금액을 늘려 부과할 수 있다. 해당사항이 아닌 것은 ?","o":["법 위반상태의 기간이 6개월 이상","법 위반행위가 부주의나 오류로 인정되는 경우","위반행위로 피해가 크다고 인정되는 경우","과태료 금액을 늘릴 필요가 인정되는 경우"],"a":1,"e":"위반행위가 부주의나 오류로 인정되는 경우 금액을 줄여 부과할 수 있다(수상레저안전법 시행령 별표13_과징금 부과 기준)","c":"수상레저안전법","t":"new","x":"부주의나 오류로 인한 위반은 정상을 참작해 금액을 줄여 주는 감경 사유입니다. 반대로 위반 상태가 6개월 이상 이어진 경우, 위반으로 인한 피해가 크다고 인정되는 경우, 그 밖에 금액을 늘릴 필요가 인정되는 경우는 가중 사유입니다. 감경과 가중 사유를 섞어 놓고 하나를 골라내게 하는 유형입니다."},{"i":452,"q":"수상레저사업의 등록기준에 관한 설명 중 가장 옳지 않은 것은?","o":["영업구역 : 수상레저활동의 안전 및 질서를 확보할 수 있다고 인정되는 구역","시설기준 : 계류장, 매표소, 화장실 등 수상레저활동을 하는 사람을 위한 대기시설을 갖출 것","장비기준 : 구명조끼, 안전모, 구명부환 등 인명구조용 장비는 모두 갖출 것","인력기준 : 동력수상레저기구를 사용하는 사업은 2급 조종면허 소지자를 2명 이상 배치 할 것"],"a":3,"e":"동력수상레저기구 사업은 1급 조종면허 종사자가 필요함(수상레저안전법 시행규칙 별표8_수상레저사업의 등록기준)","c":"수상레저안전법","t":"new","x":"동력수상레저기구를 사용하는 사업장은 제1급 조종면허 소지자를 확보해야 하므로, 2급 소지자 2명이면 된다고 적은 보기가 기준과 다릅니다. 영업구역은 안전과 질서를 확보할 수 있는 구역이어야 하고, 계류장·매표소·화장실 등 대기시설을 갖춰야 하며, 인명구조용 장비를 모두 구비해야 한다는 나머지 설명은 옳습니다."},{"i":453,"q":"수상레저사업장의 인명구조용 장비 세부기준 설명으로 가장 적합하지 않은 것은?","o":["구명조끼 : 탑승정원의 110%에 해당하는 구명조끼를 갖추 것","안전모 : 래프팅을 하는 경우 탑승정원의 110%에 해당하는 안전모를 갖추 것","구명부환 : 탑승정원이 4명 이상인 수상레저기구는 정원의 30%에 해당하는 구명부환을 갖출 것","소화기 : 탑승정원과 무관하게 모든 동력수상레저기구에는 1개 이상의 소화기를 갖출 것"],"a":3,"e":"탑승정원 4명 이상 인 동력수상레저기구에는 1개이상 소화기를 갖추어야 함(수상레저안전법 시행규칙 별표8_ 수상레저사업의 등록기준)","c":"수상레저안전법","t":"new","x":"소화기는 탑승정원 4명 이상인 동력수상레저기구에 1개 이상 갖추도록 되어 있어, 정원과 무관하게 모든 기구에 필요하다고 한 보기가 기준과 다릅니다. 구명조끼는 탑승정원의 110퍼센트, 래프팅용 안전모도 110퍼센트, 구명부환은 정원 4명 이상인 기구에 정원의 30퍼센트를 갖춰야 한다는 나머지 기준은 옳습니다."},{"i":454,"q":"수상레저기구등록법상 등록의 대상이 되는 수상레저기구에 해당하지 않은 것은?","o":["수상오토바이","총톤수 20톤 이상의 모터보트","추진기관 30마력 이상의 고무보트","총톤수 20톤 미만으로 대통령령으로 정하는 요트o"],"a":1,"e":"수상레저기구의 등록 및 검사에 관한 법률 제3조(적용 범위)","c":"수상레저안전법","t":"chg","x":"등록 대상은 수상오토바이, 총톤수 20톤 미만의 모터보트, 추진기관 30마력 이상의 고무보트, 총톤수 20톤 미만으로 대통령령이 정하는 요트입니다. 총톤수 20톤 이상의 모터보트는 수상레저기구가 아니라 선박법 등 다른 제도의 적용을 받으므로 이 법의 등록 대상이 아닙니다. 기준선이 20톤이라는 점을 정확히 기억하세요."},{"i":455,"q":"수상레저안전법상 동력수상레저기구에 포함되지 않는 것을 모두 고르면?\n① 수상오토바이\n② 스쿠터\n③ 워터슬레이드\n④ 파라세일\n⑤ 세일링요트","o":["①, ②","②, ③","③, ④","④, ⑤"],"a":2,"e":"","c":"수상레저안전법","x":"동력수상레저기구는 추진기관이 달려 스스로 움직이는 기구를 말하며, 수상오토바이·모터보트·고무보트·스쿠터·세일링요트 등이 해당합니다. 워터슬레이드와 파라세일은 자체 추진기관이 없어 다른 배가 끌어 주어야 움직이는 무동력 기구이므로 여기에 포함되지 않습니다. '스스로 추진할 수 있는가'가 판단 기준입니다."},{"i":456,"q":"수상에서의 행위 중 수상레저안전법 적용 배제에 해당되지 않는 법은?","o":["유선 및 도선사업법","체육시설의 설치·이용에 관한 법률","연안사고 예방에 관한 법률","낚시 관리 및 육성법"],"a":2,"e":"연안사고 예방에 관한 법률에 따른 수상에서의 행위는 수상레저안전법 적용 배제에 해당되지 않는다.","c":"수상레저안전법","t":"new","x":"수상레저안전법의 적용이 배제되는 것은 다른 법률이 이미 그 영업과 안전을 규율하고 있는 경우입니다. 유선 및 도선 사업법, 체육시설의 설치·이용에 관한 법률, 낚시 관리 및 육성법에 따른 행위가 그것입니다. 연안사고 예방에 관한 법률은 연안에서의 사고 예방을 위한 별도의 법일 뿐 영업 규율 체계가 아니어서 적용 배제 사유가 아닙니다."},{"i":457,"q":"1급 조종면허가 있는 자의 감독 하에 면허 없는 사람이 동력수상레저기구를 조종할 수 있는 장소로 옳지 않은 것은?","o":["수상레저사업장","조종면허시험장","경정 경기장","관련 학교"],"a":2,"e":"수상레저안전법 시행규칙 제28조(무면허조종이 허용되는 경우)","c":"수상레저안전법","x":"1급 조종면허 소지자의 감독 아래 무면허자가 조종할 수 있는 곳은 수상레저사업장, 조종면허시험장, 관련 학교처럼 교육이나 시험이 이루어지고 안전관리가 되는 장소입니다. 경정 경기장은 경륜·경정법에 따라 별도로 운영되는 곳이라 이 특례의 적용 장소에 들어가지 않습니다. '교육·시험 목적의 통제된 장소인가'가 기준입니다."},{"i":458,"q":"수상레저안전법에 명시된 수상레저사업 등록의 결격사유에 해당하지 않는 사람은?","o":["미성년자","외국인","피성년후견인","피한정후견인"],"a":1,"e":"외국인은 수상레저사업 등록의 결격사유에 해당되지 않는다(수상레저안전법 제39조_등록의 결격사유)","c":"수상레저안전법","t":"new","x":"등록 결격사유는 사업을 정상적으로 수행할 능력이나 신뢰성에 문제가 있는 경우로 한정됩니다. 미성년자, 피성년후견인, 피한정후견인, 일정한 형을 받은 사람 등이 그것입니다. 국적은 사업 수행 능력과 무관하므로 외국인이라는 이유만으로는 결격사유가 되지 않습니다."},{"i":459,"q":"수상레저안전법상 수상레저사업에 이용되는 동력수상레저기구는 (\n㉠ ) 마다, 그 외 동력 수상레저 기구는 (\n㉡ ) 마다 정기검사를 받아야 한다. ( )안에 들어갈 단어로 가장 옳은 것은?","o":["㉠ 6개월 ㉡ 1년","㉠ 1년 ㉡ 2년","㉠ 6개월 ㉡ 3년","㉠ 1년 ㉡ 5년"],"a":3,"e":"수상레저기구의 등록 및 검사에 관한 법률 제15조(안전검사)","c":"수상레저안전법","x":"사업에 쓰이는 동력수상레저기구는 하루에도 여러 사람이 반복해서 타므로 마모와 위험이 크다고 보아 1년마다 정기검사를 받습니다. 반면 개인이 쓰는 그 밖의 동력수상레저기구는 5년마다 받습니다. 사용 강도에 따라 주기를 달리한 것이며, 1년과 5년이라는 두 숫자를 짝지어 외우면 됩니다."},{"i":460,"q":"풍랑주의보가 발효된 구역에서 관할 해양경찰관서에 기상특보활동신고서를 제출 후 활동 가능한 수상레저기구는?","o":["워터슬래드","고무보트","딩기요트","모터보트"],"a":2,"e":"","c":"수상레저안전법","x":"풍랑주의보 등 기상특보가 내려진 구역에서는 원칙적으로 수상레저활동이 금지되지만, 관할 해양경찰관서에 기상특보활동 신고서를 내면 예외적으로 활동할 수 있는 기구가 있습니다. 돛과 노만으로 움직이는 딩기요트처럼 바람과 파도를 이용하도록 만들어져 강풍에서도 조종이 가능한 기구가 그 대상입니다. 엔진으로 움직이는 모터보트나 고무보트는 해당하지 않습니다."},{"i":461,"q":"수상레저사업 등록의 결격사유로 옳지 않은 것은?","o":["수상레저사업 등록이 취소되고 2년이 경과되지 않은 자","금고이상의 형의 집행유예 선고를 받고 그 기간 중에 있는 자","미성년자, 피성년후견인, 피한정후견인","금고이상의 형 집행이 종료 후 3년이 경과되지 않은 자"],"a":3,"e":"수상레저안전법 제39조(수상레저사업 등록의 결격사유) 형 집행이 종료 후 2년이 경과되지 않은 자","c":"수상레저안전법","x":"금고 이상의 형의 집행이 끝난 뒤 2년이 지나지 않은 사람이 결격사유에 해당하므로, 3년이라고 적은 보기가 기준과 다릅니다. 등록이 취소되고 2년이 지나지 않은 사람, 집행유예 기간 중인 사람, 미성년자와 피성년·피한정후견인은 모두 결격사유에 해당합니다. 기간이 모두 2년으로 통일되어 있다는 점을 기억하면 편합니다."},{"i":462,"q":"요트조종면허 관련한 설명으로 옳은 것은?","o":["요트를 조종하는 사람들은 모두 요트조종면허가 필요하다.","면허 없이 요트에 탑승해서 조종하는 사람들은 모두 요트조종면허가 필요하다.","바람만을 이용하여 활동이 가능한 딩기요트를 조종하는 사람들은 요트조종면허가 필요하다","요트는 추진기관의 최대출력 5마력 이상인 세일링요트로 조종하고자 하는 경우 요트조종면허가 필요하다."],"a":3,"e":"","c":"수상레저안전법","x":"요트조종면허가 필요한 것은 추진기관의 최대출력이 5마력 이상인 세일링요트를 조종할 때입니다. 즉 돛과 함께 일정 출력 이상의 보조기관을 갖춘 요트가 대상입니다. 따라서 엔진 없이 바람만으로 움직이는 딩기요트나, 5마력 미만의 보조기관만 있는 요트는 면허 없이도 조종할 수 있습니다. '모든 요트'라고 단정한 보기는 오답입니다."},{"i":463,"q":"요트면허 시험대행기관의 시험장별 장비기준에 대한 설명으로 가장 옳지 않은 것은?","o":["비상구조선 1대 이상, 속력은 시속 20노트 이상, 승선정원은 4명 이상","구명조끼 20개 이상","구명부환 10개 이상","인명구조교육용 상반신형 마네킹 1개 이상"],"a":2,"e":"구명부환 5개 이상","c":"수상레저안전법","x":"요트면허 시험대행기관의 시험장은 비상구조선 1대 이상(시속 20노트 이상, 승선정원 4명 이상), 구명조끼 20개 이상, 구명부환 5개 이상, 인명구조 교육용 상반신형 마네킹 1개 이상을 갖춰야 합니다. 따라서 구명부환을 10개 이상이라고 적은 보기가 기준과 다릅니다. 장비별 수량을 숫자로 정리해 두어야 풀 수 있는 문제입니다."},{"i":464,"q":"수상레저안전법상 외국인에 대한 조종면허 특례에 대한 설명으로 옳지 않은 것은?","o":["수상레저활동을 하려는 외국인은 국내에서 개최되는 국제경기대회에 참가하여 수상레저기구를 조종 하는 경우에는 조종면허를 받지 않아도 된다.","국제경기대회 개최일 10일 전부터 국제경기대회 종료 후 10일까지 특례가 적용된다.","국내 수역에 특례가 적용된다.","3개국 이상이 참여하는 국제경기대회에 특례가 적용된다."],"a":3,"e":"수상레저안전법 시행규칙 제3조(외국인에 대한 조종면허의 특례) 2개국 이상이 참여하는 국제경기대회에 특례가 적용된다.","c":"수상레저안전법","x":"외국인에 대한 조종면허 특례는 2개국 이상이 참여하는 국제경기대회에 적용됩니다. 3개국 이상이라고 적은 보기가 기준과 다릅니다. 국내에서 열리는 대회에 참가해 기구를 조종하는 경우 면허 없이도 가능하며, 적용 수역은 국내 수역으로, 기간은 대회 개최일 전후의 정해진 범위로 한정됩니다."},{"i":465,"q":"수상레저안전법상 수수료 납부 대상자가 아닌 것은?","o":["필기 및 실기시험에 응시자","수상레저사업의 휴업 또는 폐업 신청자","수상레저사업의 신규등록 신청자","면허증의 신규 발급 신청자"],"a":1,"e":"수상레저사업의 휴업 또는 폐업 신청자는 수수료가 없음(수상레저안전법 시행규칙_별표 11)","c":"수상레저안전법","t":"new","x":"수수료는 행정청이 신청을 심사하거나 자격·등록을 부여하는 데 드는 비용을 청구하는 것이므로, 시험 응시, 신규 등록, 면허증 발급처럼 새로운 권리나 자격을 얻는 신청에 부과됩니다. 반면 휴업이나 폐업 신고는 사업을 접겠다는 사실을 알리는 절차라 수수료를 받지 않습니다."},{"i":466,"q":"조종면허를 취소하거나 효력을 정지하여야 하는 경우에 해당하지 않는 것은?","o":["부정한 방법으로 면허를 받은 경우","혈중 알코올농도 0.03이상의 술에 취한 상태에서 조종한 경우","조종 중 고의 또는 과실로 사람을 사상한 때","수상레저사업이 취소된 때"],"a":3,"e":"수상레저안전법 제17조(조종면허의 취소·정지)","c":"수상레저안전법","x":"면허의 취소·정지는 면허를 받은 사람의 잘못을 대상으로 합니다. 부정한 방법으로 면허를 받은 경우, 혈중알코올농도 0.03퍼센트 이상의 음주 조종, 조종 중 고의나 과실로 사람을 사상한 경우가 그것입니다. 반면 수상레저사업의 등록 취소는 사업자에 대한 처분이므로 그 자체로 개인의 조종면허를 취소·정지할 사유가 되지 않습니다."},{"i":467,"q":"수상레저기구에 동승한 사람이 사망하거나 실종된 경우, 해양경찰관서에 신고할 내용으로 적당하지 않은 것은?","o":["사고발생 장소","수상레저기구 종류","사고자 인적사항","레저기구의 엔진상태"],"a":3,"e":"수상레저안전법 시행규칙 제27조(사고의 신고)","c":"수상레저안전법","x":"사고 신고는 구조와 사후 처리를 위한 정보를 알리는 절차이므로, 사고 발생 일시와 장소, 관련 기구의 종류, 사고자와 조종자의 인적사항, 피해 상황과 조치 내용이 신고 사항입니다. 레저기구의 엔진 상태는 사고 원인 조사 과정에서 확인할 사항이지 신고 시점에 반드시 알려야 하는 항목이 아닙니다."},{"i":468,"q":"조종면허 결격사유에 대한 설명으로 가장 옳지 않은 것은?","o":["14세 미만(제1급 조종면허의 경우에는 19세 미만)인 사람","정신질환자 중 수상레저활동을 할 수 없다고 인정되어 대통령령으로 정하는 사람","마약ㆍ향정신성의약품 또는 대마 중독자 중 수상레저활동을 할 수 없다고 인정되어 대통령령으로 정하는 사람","조종면허가 취소된 날부터 1년이 지나지 아니한 사람"],"a":0,"e":"조종면허 결격사유 중 1급 조종면허의 경우에는 18세 미만인 사람은 조종면허를 받을 수 없다.","c":"수상레저안전법","x":"제1급 조종면허의 연령 기준은 18세 이상이므로 결격사유는 18세 미만인 사람입니다. 19세 미만이라고 적은 보기가 틀렸습니다. 그 밖의 면허는 14세 미만이 결격이며, 정신질환이나 마약·향정신성의약품·대마 중독으로 활동이 어렵다고 인정되는 사람, 면허가 취소된 날부터 1년이 지나지 않은 사람도 결격사유에 해당합니다."},{"i":469,"q":"조종면허증 갱신이 연기된 사람이 갱신하여야 하는 시기로 옳은 것은?","o":["그 사유가 없어진 날부터 7일 이내","그 사유가 없어진 날부터 14일 이내","그 사유가 없어진 날부터 3개월 이내","그 사유가 없어진 날부터 6개월 이내"],"a":2,"e":"수상레저안전법 시행령 제13조(조종면허증의 갱신 연기 등)4항","c":"수상레저안전법","x":"질병이나 해외 체류처럼 부득이한 사유로 면허증 갱신이 연기된 경우에는, 그 사유가 없어진 날부터 3개월 이내에 갱신해야 합니다. 사유가 해소된 뒤 정리할 시간을 주되 무한정 미룰 수는 없도록 한 것입니다. 7일·14일·6개월로 바꿔 놓은 보기가 함정이므로 '3개월'을 정확히 기억하세요."},{"i":470,"q":"수상레저기구의 안전검사를 받아야 하는 기간으로 바른 것은?","o":["검사유효기간 만료일을 기준으로 하여 전후 각각 10일 이내로 한다.","검사유효기간 만료일을 기준으로 하여 전후 각각 30일 이내로 한다.","검사유효기간 만료일을 기준으로 하여 전후 각각 60일 이내로 한다.","검사유효기간 만료일을 기준으로 하여 전후 각각 90일 이내로 한다."],"a":1,"e":"수상레저기구의 등록 및 검사에 관한 법률 시행규칙 제11조(안전검사의 대상 및 실시 시기 등) 2항","c":"수상레저안전법","x":"정기검사는 검사 유효기간 만료일을 기준으로 앞뒤 각각 30일 이내에 받아야 합니다. 만료일에 딱 맞추기 어려운 현실을 고려해 앞뒤로 여유를 둔 것이며, 이 기간 안에 받으면 유효기간이 이어집니다. 30일이라는 숫자를 10·60·90일로 바꿔 놓는 방식으로 출제되므로 정확히 기억해 두세요."},{"i":471,"q":"부유물질 등 장애물이 발생한 경우 영업의 제한 대상이 되는 수상레저기구가 아닌 것은?","o":["스쿠터","수상스키","세일링요트","파라세일"],"a":2,"e":"세일링요트는 부유물질 등 장애물이 발생한 경우 영업의 제한 대상이 되는 수상레저기구에 해당되지 않는다 (수상레저안전법 시행령 제28조_영업의 제한 대상이 되는 수상레저기구)","c":"수상레저안전법","t":"new","x":"부유물질 등 장애물이 생겼을 때 영업이 제한되는 기구는 물 위를 빠르게 달리거나 끌려다녀 장애물과 부딪히면 큰 사고로 이어지는 것들입니다. 스쿠터, 수상스키, 파라세일이 그런 예입니다. 세일링요트는 속도가 상대적으로 낮고 조종 방식이 달라 제한 대상 기구로 규정되어 있지 않습니다."},{"i":472,"q":"수상레저안전법상 요트조종면허 필기시험 및 실기시험 합격 기준으로 옳은 것은?","o":["필기(80점), 실기(70점)","필기(70점), 실기(80점)","필기(70점), 실기(60점)","필기(60점), 실기(70점)"],"a":2,"e":"합격기준은 필기시험 70점, 실기시험 60점(수상레저안전법 시행령 제8조, 제9조)","c":"수상레저안전법","t":"new","x":"요트조종면허의 합격 기준은 필기시험 70점 이상, 실기시험 60점 이상입니다. 일반조종면허 제2급이 필기 60점인 것과 달리 요트는 필기 기준이 70점으로 더 높다는 점이 특징입니다. 필기와 실기의 숫자를 서로 바꿔 놓는 방식으로 출제되므로 '필기 70, 실기 60'을 순서까지 정확히 기억해야 합니다."},{"i":473,"q":"수상레저사업의 휴업 또는 폐업 시 며칠 전까지 등록관청에 신고하여야 하는가?","o":["1일","3일","5일","10일"],"a":1,"e":"수상레저안전법 시행규칙 제35조(휴업 등의 신고)","c":"수상레저안전법","x":"수상레저사업을 쉬거나 그만두려면 휴업·폐업 3일 전까지 등록관청에 신고해야 합니다. 이용자가 예약해 둔 영업이 갑자기 중단되는 것을 막고, 관청이 안전관리와 보험 관계를 정리할 수 있도록 하려는 취지입니다. 짧은 기간이지만 사전 신고라는 점이 핵심이며, 기간을 늘려 놓은 보기가 오답입니다."},{"i":474,"q":"수상레저기구의 직권말소에 대한 설명으로 옳지 않은 것은?","o":["직권말소 시 소유자가 동의한 경우, 통지하지 않을 수 있다.","직권말소 시 소유자에게 사유를 통지하여야 한다.","직권말소 시 소유자는 등록증을 파기하여야 한다.","직권말소 전 1개월간 소유자에게 말소등록을 권하여야 한다."],"a":2,"e":"수상레저기구의 등록 및 검사에 관한 법률 제10조(말소등록) 시장·군수·구청장은 등록번호판을 반납받은 경우에는 다시 사용할 수 없는 상태로 폐기하여야 한다.","c":"수상레저안전법","x":"말소된 기구의 등록번호판은 소유자가 임의로 처리하는 것이 아니라 반납받은 시장·군수·구청장이 다시 쓸 수 없는 상태로 폐기합니다. 따라서 소유자가 등록증을 파기한다고 한 보기가 틀렸습니다. 직권말소 전 1개월간 말소등록을 권고하고, 말소 시 사유를 통지하되 소유자가 동의한 경우에는 통지를 생략할 수 있습니다."},{"i":475,"q":"수상레저사업 취소사유로 옳은 것은?","o":["종사자의 과실로 사람이 사망하게 한 때","거짓이나 그 밖의 부정한 방법으로 수상레저사업을 등록한 때","보험에 가입하지 않고 영업 중인 때","이용요금 변경 신고를 하지 아니하고 영업을 계속한 때"],"a":1,"e":"수상레저안전법 제48조(수상레저사업의 등록 취소 등)","c":"수상레저안전법","x":"거짓이나 그 밖의 부정한 방법으로 사업 등록을 한 경우는 등록 자체가 처음부터 잘못된 것이므로 반드시 등록을 취소합니다. 반면 종사자의 과실로 인한 사고, 보험 미가입, 요금 변경 미신고 등은 위반의 정도에 따라 영업정지 등으로 처분할 수 있는 사유입니다. 필요적 취소와 임의적 처분을 나누는 문제입니다."},{"i":476,"q":"영업구역이 내수면인 경우 수상레저사업 등록기관으로 옳은 것은?","o":["해양경찰서장","해양경찰청장","소방서장","시장·군수·구청장"],"a":3,"e":"수상레저안전법 제37조(수상레저사업의 등록 등)","c":"수상레저안전법","x":"수상레저사업의 등록관청은 영업구역이 어디인가에 따라 갈립니다. 바다(해수면)는 해양경찰서장, 하천·호수 같은 내수면은 시장·군수·구청장입니다. 이 구도는 시험운항 허가, 야간 활동시간 조정 등 다른 조항에서도 똑같이 반복되므로 '해수면=해양경찰, 내수면=기초자치단체'라는 틀로 외워 두면 여러 문제를 한 번에 풀 수 있습니다."},{"i":477,"q":"등록대상 동력수상레저기구를 취득한 자는 취득한 날부터 몇 개월 이내에 주소지를 관할하는 시장· 군수·구청장에게 등록신청을 하여야 하는가?","o":["1개월","2개월","3개월","6개월"],"a":0,"e":"수상레저기구등록법 제6조(등록)","c":"수상레저안전법","x":"등록대상 동력수상레저기구를 취득한 사람은 취득한 날부터 1개월 이내에 주소지를 관할하는 시장·군수·구청장에게 등록을 신청해야 합니다. 등록이 되어야 번호판이 부여되고 안전검사와 보험 관계가 정리되기 때문에 기한을 짧게 정한 것입니다. 기간을 2·3·6개월로 바꿔 놓는 방식으로 출제되니 1개월을 정확히 기억하세요."},{"i":478,"q":"누구든지 조종면허를 받지 아니하고 동력수상레저기구를 조종하여서는 아니 되나, 이에 대한 예외로서 ( )와 함께 탑승하여 조종하는 경우는 그러하지 아니한다. ( )안에 들어갈 알맞은 말은?","o":["수상레저사업자","3년 이상의 경력이 있는 조종면허 소지자","제1급조종면허 소지자 또는 제2급조종면허 소지자","제1급조종면허 소지자 또는 요트조종면허 소지자"],"a":3,"e":"수상레저안전법 제25조(무면허조종의 금지)","c":"수상레저안전법","x":"무면허 조종 금지의 예외는 제1급 조종면허 소지자 또는 요트조종면허 소지자와 함께 탑승해 조종하는 경우입니다. 즉 상급 면허를 가진 사람이 옆에서 감독할 수 있어야 예외가 인정됩니다. 제2급 면허 소지자와의 동승은 여기에 해당하지 않으며, 경력 연수를 요건으로 정하고 있지도 않습니다."},{"i":479,"q":"수상레저사업장 안에서 탑승 정원 ( )명 이상인 동력수상레저기구에는 선실, 조타실, 기관실에 각각 1개 이상의 소화기를 갖추어야 한다. ( ) 안에 알맞은 숫자는?","o":["3","5","10","13"],"a":3,"e":"수상레저안전법 시행규칙 별표8(수상레저사업의 등록기준)","c":"수상레저안전법","x":"탑승 정원이 13명 이상인 동력수상레저기구는 선실·조타실·기관실에 각각 1개 이상의 소화기를 갖춰야 합니다. 사람이 많고 공간이 나뉘어 있어 한곳에만 소화기를 두면 초기 진화가 어렵기 때문입니다. 정원 13명이라는 기준은 신규검사 대상 기준과도 같은 숫자이므로 함께 묶어 기억하면 좋습니다."},{"i":480,"q":"조종면허를 받은 사람이 지켜야 할 의무로 옳지 않은 것은?","o":["타인에게 면허증을 빌려 주어서는 아니 된다.","주소가 변경된 때에는 면허증상의 주소도 즉시 변경하여야 한다.","동력수상레저기구를 조종할 때에는 항시 지니고 있어야 한다.","관계 공무원이 면허증의 제시를 요구하면 면허증을 내보여야 한다."],"a":1,"e":"수상레저안전법 제16조(면허증 휴대 등 의무)","c":"수상레저안전법","x":"면허증 관련 의무는 다른 사람에게 빌려주지 않을 것, 조종할 때 지니고 있을 것, 관계 공무원이 요구하면 제시할 것입니다. 주소가 바뀌었다고 해서 면허증에 적힌 주소를 즉시 고쳐야 하는 의무는 규정되어 있지 않습니다. 법이 실제로 요구하는 행위인지, 그럴듯하게 만들어 낸 의무인지 가려내는 문제입니다."},{"i":481,"q":"수상레저안전법 시행규칙 제28조 규정에 의해 일정한 조건하에 무면허 조종이 허용되는 수상레저활동 관련 단체와 거리가 먼 것은?","o":["청소년기본법에 의한 한국청소년단체협의회 가맹단체","사단법인 한국수상레저협회","정부 및 지방자치단체의 청소년 수련원","국민체육진흥법에 의한 대한체육회 가맹단체"],"a":1,"e":"수상레저안전법 시행규칙 제28조(무면허조종이 허용되는 경우)","c":"수상레저안전법","x":"무면허 조종이 허용되는 단체는 청소년기본법에 따른 한국청소년단체협의회 가맹단체, 정부나 지방자치단체의 청소년 수련원, 국민체육진흥법에 따른 대한체육회 가맹단체처럼 공적인 성격을 가진 곳으로 한정됩니다. 사단법인 한국수상레저협회는 그 목록에 포함되어 있지 않습니다. 특례 대상은 좁게 정해진다는 원칙으로 접근하세요."},{"i":482,"q":"영업구역이 ( )해리 이상인 경우에는 수상레저기구에 사업장 또는 가까운 무선국과 연락할 수 있는 통신장비를 갖추어야 한다. ( ) 안에 알맞은 숫자는?","o":["1","2","3","4"],"a":1,"e":"수상레저안전법 시행규칙 별표8(수상레저사업의 등록기준)","c":"수상레저안전법","x":"영업구역이 2해리 이상으로 넓어지면 사고가 났을 때 육안으로 확인하거나 곧바로 달려가기 어렵기 때문에, 수상레저기구에 사업장이나 가까운 무선국과 연락할 수 있는 통신장비를 갖추도록 하고 있습니다. 거리 기준이 2해리라는 점이 핵심이며, 1해리나 3해리로 바꿔 놓는 방식으로 출제됩니다."},{"i":483,"q":"수상레저안전법상 야간 수상레저활동을 하려는 사람이 갖추어야 하는 운항장비에 해당하지 않은 것은?","o":["항해등","호루라기","통신기기","야간 조난신호장비"],"a":1,"e":"수상레저안전법 시행규칙 제29조(야간 운항장비)","c":"수상레저안전법","x":"야간 운항장비는 어두운 바다에서 위치를 알리고 방향을 잡으며 연락과 구조 요청을 할 수 있게 하는 장비로, 항해등·나침반·통신기기·야간 조난신호장비·전등·자기점화등·구명튜브·소화기 등이 규정되어 있습니다. 호루라기는 주간에도 쓰는 일반적인 신호 도구여서 야간 운항장비 목록에는 들어가 있지 않습니다."},{"i":484,"q":"동력수상레저기구 조종면허시험의 합격자에게 합격일로부터 며칠 이내에 조종면허증을 발급해야 하는가?","o":["7일","14일","20일","30일"],"a":1,"e":"수상레저안전법 시행규칙 제16조(면허증의 발급 등)","c":"수상레저안전법","x":"조종면허시험에 합격하면 합격일부터 14일 이내에 면허증을 발급해야 합니다. 면허의 효력은 면허증을 본인이나 대리인에게 발급한 때부터 생기므로, 발급 전에 조종하면 무면허가 된다는 점과 함께 기억해야 합니다. 기간을 7일이나 30일로 바꿔 놓는 방식으로 자주 출제됩니다."},{"i":485,"q":"수상레저사업의 등록기준 중 인력기준에 대한 설명으로 옳지 않은 것은?","o":["동력수상레저기구 사업장에는 1급 조종면허 소지자가 필요하다","무동력수상레저기구 사업장에는 2급 이상의 조종면허 소지자가 필요하다.","세일링요트만을 사용하는 사업장은 요트조종면허 소지자가 필요하다.","래프팅용 수상레저기구만 사용하는 사업장은 2급 이상의 조종면허 소지자가 필요하다."],"a":3,"e":"래프팅용 수상레저기구만 사용하는 사업장은 2급 이상의 조종면허 소지자 조건이 제외된다(수상레저안전법 시행규칙_별표8 인력기준)","c":"수상레저안전법","t":"new","x":"래프팅용 수상레저기구만 사용하는 사업장은 조종면허 소지자 확보 요건에서 제외됩니다. 노를 저어 움직이는 무동력 기구여서 조종면허의 대상이 아니기 때문이며, 대신 래프팅가이드를 두도록 하고 있습니다. 동력 사업장은 1급, 무동력 사업장은 2급 이상, 세일링요트 전용 사업장은 요트조종면허 소지자가 필요하다는 나머지 설명은 옳습니다."},{"i":486,"q":"수상레저안전법상 수상레저활동 시 필히 구명조끼를 착용하지 않아도 되는 경우는?","o":["일반수상레저 활동자","서프보드, 패들보드 활동자","워터슬래이드 활동자","래프팅 강사"],"a":1,"e":"서프보드, 패들보드는 보드리쉬를 착용함(조종면허시험 면제교육교재_2025년 3월 최신개정판 P21)","c":"수상레저안전법","t":"new","x":"서프보드와 패들보드는 보드 자체가 부력을 제공하므로 구명조끼 대신 보드 리쉬를 착용하도록 정하고 있습니다. 몸과 보드를 줄로 연결해 두면 물에 빠져도 보드를 붙잡을 수 있기 때문입니다. 반면 일반 수상레저활동자, 워터슬레이드 이용자, 래프팅 강사는 구명조끼를 착용해야 합니다."},{"i":487,"q":"수상레저안전법상 등록대상 동력수상레저기구의 정기검사 대한 설명으로 옳지 않은 것은?","o":["개인소유 동력수상레저기구는 등록 후 5년마다 정기적으로 한다.","영업구역이 해수면인 경우 해양경찰청장에게 받는다.","수상레저사업에 이용되는 동력수상레저기구는 매 2년마다 검사한다.","검사를 하지 아니거나 검사에 합격하지 못한 동력수상레저기구는 수상레저활동에 사용하여서는 아니 된다."],"a":2,"e":"수상레저기구의 등록 및 검사에 관한 법률 제15조(안전검사) 수상레저사업에 이용되는 동력수상레저기구는 1년 마다 정기검사를 받아야 한다.","c":"수상레저안전법","x":"수상레저사업에 이용되는 동력수상레저기구는 1년마다 정기검사를 받아야 하므로 2년이라고 적은 보기가 틀렸습니다. 개인 소유 기구는 5년마다이며, 검사를 받지 않았거나 합격하지 못한 기구는 수상레저활동에 사용할 수 없습니다. 사업용은 이용 빈도가 높아 검사 주기가 짧다는 취지로 이해하면 됩니다."},{"i":488,"q":"면허 없는 사람이 면허가 필요한 수상레저기구를 조종할 수 있는 경우로 가장 적당하지 않은 것은?","o":["2급 조종면허 소지자와 동승하여 고무보트 조종","1급 조종면허 소지자 감독하에 시험장에서 시험선 조종","1급 조종면허 소지자 감독하에 수상레저사업장에서 수상 오토바이 조종","1급 조종면허 소지자 감독하에 학교에서 모터보트 조종"],"a":0,"e":"수상레저안전법 시행규칙 제28조(무면허조종이 허용되는 경우)","c":"수상레저안전법","x":"무면허 조종이 허용되려면 제1급 조종면허 소지자 또는 요트조종면허 소지자의 감독이나 동승이 있어야 합니다. 제2급 조종면허 소지자와 동승하는 것만으로는 예외가 인정되지 않으므로 그 보기가 부적당합니다. 나머지 세 가지는 1급 소지자의 감독 아래 시험장·사업장·학교에서 이루어지는 경우라 모두 허용됩니다."},{"i":489,"q":"수상레저활동자가 수상레저기구에 동승한 자의 사고로 인한 사망 또는 실종 시에 사고사실을 신고하여야 할 기관으로 옳지 않은 것은?","o":["해양경찰관서·경찰관서","관계 행정기관","소방관서","시험 대행기관"],"a":3,"e":"수상레저안전법 제24조(사고의 신고 등)","c":"수상레저안전법","x":"동승자가 사망하거나 실종된 사고는 해양경찰관서나 경찰관서, 그 밖의 관계 행정기관, 소방관서에 신고합니다. 모두 구조와 수사에 직접 관여하는 기관입니다. 반면 시험대행기관은 면허시험을 대신 시행하는 곳일 뿐 사고 처리 권한이 없으므로 신고 대상 기관이 아닙니다."},{"i":490,"q":"원거리 수상레저 활동의 신고내용으로 옳은 것은?","o":["출발항으로부터 10해리 이상 떨어진 곳에서 수상레저활동을 하고자 할 경우 해양경찰관서 또는 소방관서에 신고한다.","원거리 수상레저활동 신고방법은 해양경찰관서 또는 경찰관서에 직접 방문하여야 한다.","동승한 자가 사고로 인하여 사망, 실종 또는 중상을 입은 경우에는 해양경찰관서 등 관계 행정기관에 신고한다.","동승한 자가 사고로 인하여 사망, 실종 또는 중상을 입은 경우의 신고사항으로는 사고의 원인, 가해자와 피해자, 가입된 보험회사명이다."],"a":2,"e":"수상레저안전법 제23조(원거리 수상레저활동의 신고), 제24조(사고의 신고 등)","c":"수상레저안전법","x":"동승자가 사고로 사망하거나 실종되거나 중상을 입은 경우에는 해양경찰관서 등 관계 행정기관에 신고해야 합니다. 원거리 활동 신고는 출발항에서 10해리 이상 떨어져 활동할 때 해양경찰관서나 경찰관서에 하며, 방문뿐 아니라 인터넷과 팩스로도 할 수 있습니다. 신고 대상 기관과 방법을 바꿔 놓은 나머지 보기는 모두 틀립니다."},{"i":491,"q":"수상레저기구 안전검사 유효기간 만료일 이후 검사를 받아야 하는 기한으로 옳은 것은?","o":["30일 이내","60일 이내","90일 이내","100일 이내"],"a":0,"e":"수상레저기구의 등록 및 검사에 관한 법률 시행규칙 제11조(안전검사의 대상 및 실시 시기 등) 2항","c":"수상레저안전법","x":"안전검사는 유효기간 만료일을 기준으로 앞뒤 각각 30일 이내에 받아야 하므로, 만료일이 지난 뒤라면 30일 이내에 받아야 합니다. 이 기간을 넘기면 미검사 상태로 운항한 것이 되어 과태료가 부과되고, 기간이 길어질수록 금액이 늘어납니다. 30일이라는 기한을 검사 관련 다른 숫자와 함께 정리해 두세요."},{"i":492,"q":"주취조종자에 대한 단속권이 없는 사람은?","o":["해양경찰청 소속 경찰공무원","시험대행기관장","서울특별시 한강관리사업소의 수상레저업무에 종사하는 자","시·군 또는 자치구의 수상레저업무에 종사하는 자"],"a":1,"e":"수상레저안전법 제27조(주취 중 조종 금지)","c":"수상레저안전법","x":"음주 조종 단속은 해양경찰청 소속 경찰공무원과, 시·군·구 또는 한강관리사업소처럼 수상레저업무를 담당하는 공무원이 할 수 있습니다. 반면 시험대행기관장은 면허시험을 대신 시행하는 민간 기관의 장일 뿐 행정 단속 권한을 가진 공무원이 아니므로 측정을 요구할 수 없습니다. 공권력 행사 주체인지 여부로 판단하면 됩니다."},{"i":493,"q":"수상레저사업 등록관청과 영업구역의 연결이 옳은 것은?","o":["해양경찰서장 – 내수면, 해수면","자치구청장 – 인접 해수면, 내수면","경찰서장 – 내수면","시장·군수·구청장 – 내수면"],"a":3,"e":"수상레저안전법 제37조(수상레저사업의 등록 등)","c":"수상레저안전법","x":"수상레저사업의 등록관청은 영업구역이 해수면이면 관할 해양경찰서장, 내수면이면 시장·군수·구청장입니다. 따라서 '시장·군수·구청장 – 내수면'의 연결이 옳습니다. 해양경찰서장이 내수면까지 맡거나 경찰서장이 등록관청이 되는 조합은 규정에 없습니다. 등록관청 문제는 이 두 줄만 정확히 기억하면 항상 풀립니다."},{"i":494,"q":"다음 수상레저사업장의 시설기준 중 옳지 않은 것은?","o":["노 또는 상앗대가 있는 수상레저기구는 그 수의 10%에 해당하는 수의 예비용 노 또는 상앗대를 갖추어야 한다.","탑승 정원 13인 이상인 동력수상레저기구에는 선실, 조타실, 기관실에 각각 1개 이상의 소화기를 갖추어야 한다.","무동력 수상레저기구에는 구명부환 대신 스로 백을 갖출 수 있다.","탑승정원이 5명 이상인 수상레저기구(수상오토바이 및 워터슬레이드 제외)에는 그 탑승정원의 30%에 해당하는 수의 구명부환을 갖추어야 한다."],"a":3,"e":"수상레저안전법 시행규칙 별표8(수상레저사업의 등록기준) 탑승 정원이 4명 이상인 수상레저기구에는 그 탑승 정원의 30%에 해당하는 수 이상의 구명부환을 갖추어야 한다.","c":"수상레저안전법","x":"구명부환은 탑승정원이 4명 이상인 수상레저기구(수상오토바이와 워터슬레이드 제외)에 정원의 30퍼센트에 해당하는 수 이상을 갖춰야 합니다. 기준 인원이 5명이라고 적은 보기가 틀렸습니다. 예비용 노나 상앗대는 해당 기구 수의 10퍼센트, 정원 13명 이상 동력기구는 선실·조타실·기관실에 각각 소화기 1개 이상이 필요합니다."},{"i":495,"q":"수상레저기구 운항규칙에 대한 설명이 옳은 것은?","o":["방파제, 다이빙대, 계류장 및 교량으로부터 10m 이내의 구역이나 별도 고시된 구역에서는 20노트 이하의 속력으로 운항","방파제, 다이빙대, 계류장 및 교량으로부터 30m 이내의 구역이나 별도 고시된 구역에서는 20노트 이하의 속력으로 운항","방파제, 다이빙대, 계류장 및 교량으로부터 50m 이내의 구역이나 별도 고시된 구역에서는 10노트 이하의 속력으로 운항","방파제, 다이빙대, 계류장 및 교량으로부터 20m 이내의 구역이나 별도 고시된 구역에서는 10노트 이하의 속력으로 운항"],"a":3,"e":"수상레저안전법 시행령 별표11(운항방법 및 기구의 속도 등에 관한 준수사항)","c":"수상레저안전법","t":"chg","x":"방파제·다이빙대·계류장·교량으로부터 20미터 이내의 구역이나 별도로 고시된 구역에서는 10노트 이하로 운항해야 합니다. 사람과 구조물이 가까이 있어 사고 시 피해가 크기 때문입니다. 거리(20미터)와 속력(10노트)이 한 쌍이며, 숫자를 서로 바꿔 놓은 나머지 보기가 함정입니다. 개정본에서 대상에 방파제가 추가되었다는 점도 확인해 두세요."},{"i":496,"q":"수상레저기구 운항규칙에 대한 설명으로 옳지 않은 것은?","o":["안전검사증에 지정된 항해구역 준수","충돌의 위험이 있는 때 다른 수상레저기구를 왼쪽에 두고 있는 수상레저기구가 진로를 피하여야 한다.","정면충돌 위험시 우현 쪽 변침","다른 기구와 같은 방향으로 운항 시 2m 이내 근접 금지"],"a":1,"e":"수상레저안전법 시행령 별표11(운항방법 및 기구의 속도 등에 관한 준수사항)","c":"수상레저안전법","x":"진로가 교차할 때는 상대 기구를 자기 오른쪽에 두고 있는 쪽이 피해야 합니다. 오른쪽에서 오는 배가 우선한다는 원칙이므로 '왼쪽에 두고 있는 기구가 피한다'는 서술은 반대입니다. 안전검사증에 지정된 항해구역 준수, 정면 충돌 위험 시 우현 변침, 같은 방향 운항 시 2미터 이내 접근 금지는 모두 옳습니다."},{"i":497,"q":"수상레저기구에 대한 검사를 받지 않고 운항한 사람에 대한 과태료 부과기준으로 옳은 것은?","o":["10일 이하인 경우 5만원, 10일을 초과한 경우 매 1일마다 1만원","10일 이하인 경우 3만원, 10일을 초과한 경우 매 1일마다 2만원","10일 이하인 경우 10만원, 10일을 초과한 경우 매 1일마다 1만원","10일 이하인 경우 10만원, 10일을 초과한 경우 매 1일마다 2만원"],"a":0,"e":"수상레저기구의 등록 및 검사에 관한 법률 시행령 별표5(과태료의 부과기준)","c":"수상레저안전법","x":"안전검사를 받지 않고 운항한 경우의 과태료는 위반 기간에 따라 늘어납니다. 10일 이하이면 5만원이고, 10일을 넘으면 초과한 날마다 1만원씩 더해집니다. 검사를 오래 미룰수록 부담이 커지도록 설계한 것입니다. 기본 금액과 가산 금액 두 숫자를 짝지어 기억하면 됩니다."},{"i":498,"q":"야간 수상레저활동을 하려는 사람이 갖추어야 하는 야간운항장비가 아닌 것은?\n① 전등\n② 야간 조난신호장비\n③ 등이 부착된 구명조끼\n④ 자기점화등\n⑤ 통신기기\n⑥ 해도\n⑦ 자동심장충격기 ⑧ 위성항법장치","o":["①, ⑥","②, ⑦","⑥ , ⑦","⑤, ⑧"],"a":2,"e":"","c":"수상레저안전법","t":"chg","x":"야간 운항장비는 어두운 해상에서 자기 위치를 알리고 구조 요청과 연락을 할 수 있게 하는 장비들로, 전등·야간 조난신호장비·등이 부착된 구명조끼·자기점화등·통신기기·위성항법장치 등이 포함됩니다. 해도는 주야를 가리지 않는 일반 항해자료이고, 자동심장충격기는 의료 장비여서 야간 운항장비로 규정되어 있지 않습니다."},{"i":499,"q":"요트조종면허 실기시험에서 로프 묶기에 해당하지 않는 매듭은?","o":["8자 묶기","보우라인(bowline) 묶기","클리트(cleat) 묶기","옭매듭 묶기"],"a":3,"e":"","c":"수상레저안전법","x":"요트조종면허 실기시험의 로프 묶기 과제에서는 실제 배에서 쓰는 매듭을 평가합니다. 로프 끝이 빠지지 않게 하는 8자 매듭, 조여들지 않는 고리를 만드는 바우라인, 계선줄을 걸어 고정하는 클리트 매듭이 그것입니다. 옭매듭은 한 번 조이면 풀기 어렵고 로프를 상하게 해 선상에서 쓰지 않으므로 평가 대상이 아닙니다."},{"i":500,"q":"수상레저활동의 안전을 위하여 해양경찰서장, 시장, 군수, 구청장의 시정명령을 이행하지 아니한 자의 과태료 기준은?","o":["1회 20만원","2회 20만원","3회 이상 30만원","3회 이상 40만원"],"a":0,"e":"수상레저안전법 시행령 별표14(과태료의 부과기준), 1회 20, 2회 30, 3회 이상 50","c":"수상레저안전법","x":"시정명령을 이행하지 않은 경우의 과태료는 위반 횟수에 따라 늘어나며, 1회 20만원, 2회 30만원, 3회 이상 50만원입니다. 같은 위반을 반복할수록 제재를 무겁게 해 이행을 유도하는 구조입니다. 보기에서는 2회와 3회 이상의 금액을 바꿔 놓았으므로 1회 20만원만 정확히 기억하면 답을 고를 수 있습니다."},{"i":501,"q":"수상레저활동자가 원거리 수상레저활동 시 신고하여야 할 기관은?","o":["해양경찰관서 또는 경찰관서","소방관서","기초지자체 소속관서","군 소속기관"],"a":0,"e":"수상레저안전법 제23조(원거리 수상레저활동의 신고)","c":"수상레저안전법","x":"원거리 수상레저활동 신고는 해양경찰관서 또는 경찰관서에 합니다. 출발항으로부터 10해리 이상 떨어진 곳에서 활동할 때가 대상이며, 사고가 났을 때 어디서 누구를 찾아야 하는지 미리 알려 두는 제도입니다. 소방관서나 지방자치단체는 이 신고를 받는 기관으로 규정되어 있지 않습니다."},{"i":502,"q":"요트조종면허 실기시험에서 채점기준 중 과제에 해당하지 않는 것은?\n① 출발 전 점검 및 확인\n② 출발 및 기주\n③ 범주\n④ 사행\n⑤ 인명구조\n⑥ 입항","o":["①, ②","③, ④","④, ⑤","⑤, ⑥"],"a":2,"e":"","c":"수상레저안전법","x":"요트조종면허 실기시험은 세일링 능력을 보는 시험이라 출발 전 점검 및 확인, 출발 및 기주, 범주, 입항 등으로 과제가 짜여 있습니다. 사행(지그재그로 부표 사이를 통과하는 조종)과 인명구조는 모터보트를 다루는 일반조종면허 실기시험의 과제라서 요트 실기에는 들어가지 않습니다. 두 면허의 과제를 섞어 놓는 방식으로 출제됩니다."},{"i":503,"q":"요트조종면허 실기시험에서 사용되는 용어의 정의로 옳지 않은 것은?","o":["“크루”란 스키퍼 외에 요트의 운항을 돕는 승조원을 말한다.","“이안”이란 계류줄을 걷고 계류장에서 이탈하여 출발할 수 있도록 준비하는 행위를 말한다.","“브로드 리치”란 바람방향에서 70° ～ 75° 정도로 바람을 거슬러 범주하는 것을 말한다.","“범주”란 돛만을 이용하여 운항하는 것을 말한다."],"a":2,"e":"“브로드 리치”란 바람방향에서 뒤쪽(110° ～ 120°)으로 바람을 받아 범주하는 것을 말한다.","c":"수상레저안전법","x":"브로드 리치는 바람을 뒤쪽 비스듬한 방향(약 110~120도)에서 받으며 달리는 범주 상태입니다. 70~75도로 바람을 거슬러 올라가는 것은 클로스 리치에 가까우므로 정의가 잘못되었습니다. 크루는 스키퍼 외의 승조원, 이안은 계류줄을 걷고 계류장을 떠나는 행위, 범주는 돛만으로 운항하는 것이라는 나머지 정의는 옳습니다."},{"i":504,"q":"주취 중 조종으로 면허가 취소된 사람은 취소된 날부터 얼마간 조종면허를 받을 수 없는가?","o":["1년","2년","3년","4년"],"a":0,"e":"수상레저안전법 제7조(조종면허의 결격사유 등)","c":"수상레저안전법","x":"음주 조종으로 면허가 취소된 사람은 취소된 날부터 1년간 조종면허를 받을 수 없습니다. 무면허 조종으로 적발된 경우, 그 밖의 사유로 면허가 취소된 경우도 같은 1년입니다. 다만 사람을 사상한 뒤 구호 조치 없이 달아난 경우만 4년으로 훨씬 길다는 점이 대비 포인트입니다."},{"i":505,"q":"야간 수상레저활동 시간을 조정할 수 있는 권한을 가진 사람이 아닌 것은?","o":["해양경찰서장","시장·군수","한강 관리기관의 장","경찰서장"],"a":3,"e":"수상레저안전법 시행규칙 제30조(야간 수상레저활동시간의 조정)","c":"수상레저안전법","x":"야간 수상레저활동 시간의 조정 권한은 그 수면을 관리하는 기관의 장에게 있습니다. 해수면은 해양경찰서장, 내수면은 시장·군수, 한강처럼 별도 관리기관이 있는 곳은 그 기관의 장이 조정할 수 있습니다. 경찰서장은 수상레저활동의 관리 주체가 아니므로 조정 권한을 갖지 않습니다."},{"i":506,"q":"수상레저기구에 동승한 사람이 사망하거나 실종된 경우 신고사항으로 적당하지 않은 것은?","o":["사고발생 장소","관련 수상레저기구 종류","사고자 인적사항","운항규칙 준수여부"],"a":3,"e":"수상레저안전법 시행규칙 제27조(사고의 신고)","c":"수상레저안전법","x":"사고 신고 사항은 구조와 사후 처리에 필요한 사실 정보로 한정됩니다. 사고 발생 일시와 장소, 관련 기구의 종류, 사고자와 조종자의 인적사항, 피해 상황 등이 그것입니다. 운항규칙을 지켰는지는 신고자가 판단해 적을 사항이 아니라 이후 조사에서 가려질 문제이므로 신고 사항에 들어가지 않습니다."},{"i":507,"q":"( )안에 들어갈 알맞은 수는? 수상레저안전법상 영업구역이 ( )해리 이상인 경우에는 수상레저기구에 사업장 또는 가까운 무선국과 연락할 수 있는 통신장비를 갖추어야 한다.","o":["1","2","3","4"],"a":1,"e":"수상레저안전법 시행규칙 별표8(수상레저사업의 등록기준)","c":"수상레저안전법","x":"영업구역이 2해리 이상인 경우에는 수상레저기구에 사업장이나 가까운 무선국과 연락할 수 있는 통신장비를 갖춰야 합니다. 육안과 육성으로 상황을 알릴 수 있는 범위를 넘어서면 통신 수단이 있어야 사고에 대응할 수 있기 때문입니다. 이 2해리라는 기준은 사업장 등록기준 문제에서 반복해 출제됩니다."},{"i":508,"q":"원거리 수상레저활동에 대한 설명이다. 옳지 않은 것은?","o":["원거리 수상레저활동의 신고는 출발항으로부터 10해리 이상 떨어진 곳에서 수상레저활동을 할 경우 신고하여야 한다.","원거리 수상레저활동의 신고는 해양경찰관서나 경찰관서 또는 소방관서에 하여야 한다.","「선박안전 조업규칙」에 따른 출․입항 신고를 한 선박은 신고의무 예외이다.","신고는 방문, 인터넷, 팩스 방법으로 제출할 수 있다."],"a":1,"e":"","c":"수상레저안전법","x":"원거리 수상레저활동 신고는 해양경찰관서나 경찰관서에 하도록 정해져 있습니다. 소방관서는 신고를 받는 기관에 포함되지 않으므로 그 서술이 틀렸습니다. 출발항으로부터 10해리 이상 떨어진 곳에서 활동할 때가 대상이고, 선박안전 조업규칙에 따라 출입항 신고를 한 선박은 중복을 피하기 위해 신고 의무에서 제외되며, 방문·인터넷·팩스로 제출할 수 있습니다."},{"i":509,"q":"시험운항허가 신청 시 운항구역과 그 설명으로 틀린 것은?","o":["시험운항의 운항구역이 해수면인 경우 해당구역의 해양경찰서장에게 허가신청을 해야한다.","시험운항의 운항구역이 내수면인 경우 해당구역의 시장·군수·구청장에게 허가신청을 해야한다.","시험운항 허가 기간은 3일 이내이다.","시험운항의 운항구역은 출발지로부터 직선거리로 10해리 이내이다."],"a":2,"e":"시험운항 허가기간은 7일 이내이다(수상레저기구등록법 시행령 제11조_시험운항의 허가)","c":"수상레저안전법","t":"new","x":"시험운항 허가 기간은 7일 이내입니다. 3일이라고 적은 보기가 틀렸습니다. 운항구역은 출발지로부터 직선거리 10해리 이내로 제한되고, 허가 신청은 해수면이면 해양경찰서장, 내수면이면 시장·군수·구청장에게 합니다. 기간 7일, 거리 10해리, 그리고 해뜨기 전 30분부터 해진 후 30분까지라는 시간 제한을 함께 묶어 외우세요."},{"i":510,"q":"사람을 사상한 후 구호조치 등 필요한 조치를 하지 아니하고 도주한 자는 그 위반한 날부터 ( )년 간 조종면허를 받을 수 없다. ( ) 안에 적당한 것은?","o":["1년","2년","3년","4년"],"a":3,"e":"수상레저안전법 제7조(조종면허의 결격사유 등)","c":"수상레저안전법","x":"사람을 사상한 뒤 구호 등 필요한 조치를 하지 않고 달아난 경우에는 위반한 날부터 4년간 조종면허를 받을 수 없습니다. 사고 자체보다 구호 의무를 저버린 점을 무겁게 본 것입니다. 다른 결격 사유가 대체로 1년인 것과 비교하면 유독 길기 때문에, '도주는 4년'이라는 한 줄로 기억해 두면 됩니다."},{"i":511,"q":"해양경찰서장이 수상레저활동의 안전을 위하여 필요하다고 인정하면 명할 수 있는 사항으로 옳지 않은 것은?","o":["수상레저기구의 탑승인원의 제한 또는 조종자의 교체","수상레저활동의 일시정지","수상레저기구의 개선 및 교체","수상레저활동 구역 변경"],"a":3,"e":"수상레저안전법 제31조(시정명령)","c":"수상레저안전법","x":"시정명령으로 할 수 있는 것은 지금의 위험을 즉시 줄이기 위한 조치들, 즉 탑승 인원 제한, 조종자 교체, 활동의 일시정지, 기구의 개선·교체입니다. 반면 활동 구역 자체를 바꾸라고 명하는 것은 개별 시정명령의 범위를 넘어서며, 구역 제한은 별도의 금지구역 지정 절차로 다룹니다. '눈앞의 위험을 없애는 조치인가'로 판단하면 됩니다."},{"i":512,"q":"수상레저안전법상 조종면허를 받은 사람이 지켜야 할 의무로 옳지 않은 것은?","o":["동력수상레저기구를 조종할 때에는 면허증을 항상 지니고 있어야 한다.","조종면허가 취소된 사람은 취소된 날부터 10일 이내에 해양경찰청장에게 면허증을 반납해야 한다.","타인에게 면허증을 빌려주어서는 아니 된다.","관계 공무원이 면허증의 제시를 요구하면 면허증을 내보여야 한다."],"a":1,"e":"수상레저안전법 제16조(면허증 휴대 등 의무), 제17조(조종면허의 취소·정지)","c":"수상레저안전법","x":"면허가 취소되거나 효력이 정지되면 그날부터 7일 이내에 면허증을 반납해야 합니다. 따라서 10일이라고 적은 보기가 틀렸습니다. 면허증을 조종 시 항상 지닐 것, 다른 사람에게 빌려주지 말 것, 관계 공무원이 요구하면 제시할 것은 모두 규정된 의무입니다. 처분 관련 기한은 7일이라는 숫자로 기억해 두세요."},{"i":513,"q":"전문의가 정상적으로 수상레저활동을 할 수 없다고 인정하는 경우 조종면허의 결격사유에 해당되는 질환으로 옳지 않은 것은?","o":["조현병","정서불안","조현 정동장애","치매"],"a":1,"e":"수상레저안전법 시행령 제5조(조종면허의 결격사유)","c":"수상레저안전법","x":"조종면허의 결격사유가 되는 질환은 전문의가 정상적인 수상레저활동이 어렵다고 인정하는 조현병, 조현정동장애, 치매 등 판단력과 인지 기능에 중대한 영향을 주는 질환입니다. 정서불안은 의학적으로 확립된 진단명이 아니고 그 자체로 조종 능력을 잃게 한다고 보기 어려워 결격사유에 들어가지 않습니다."},{"i":514,"q":"수상레저사업장 인명구조용 장비에 속하지 않는 것은?","o":["구명부환 및 안전모","통신장비 및 소화기","예비용 노 또는 상앗대","구명줄 및 나침반"],"a":3,"e":"나침반은 인명구조용 장비에 속하지 않는다(수상레저안전법 시행규칙_별표8)","c":"수상레저안전법","t":"new","x":"사업장이 갖춰야 하는 인명구조용 장비는 사람을 구조하거나 사고를 수습하는 데 직접 쓰이는 것들입니다. 구명부환과 안전모, 구명줄, 통신장비, 소화기, 예비용 노나 상앗대가 여기에 해당합니다. 나침반은 항해에 쓰는 계기일 뿐 인명구조와 직접 관련이 없어 인명구조용 장비 목록에 포함되지 않습니다."},{"i":515,"q":"수상레저사업자에게 영업구역 제한 또는 일시정지를 명할 수 있는 사항이 아닌 것은?","o":["수상사고가 발생한 경우","유류·화학물질 등의 유출","녹조·적조 등의 발생이 우려될 경우","생명에 피해를 줄 유해생물이 발생한 경우"],"a":2,"e":"녹조·적조 등의 발생으로 수질이 오염된 경우 영업의 제한을 명할 수 있다(수상레저안전법 제46조_영업의 제한 등)","c":"수상레저안전법","t":"new","x":"영업 제한이나 일시정지를 명할 수 있는 것은 이미 위험이 현실화된 상황입니다. 수상사고 발생, 유류나 화학물질 유출, 인명에 피해를 줄 유해생물 발생이 그것입니다. 녹조나 적조는 '발생이 우려될 경우'가 아니라 실제로 발생해 수질이 오염된 경우에 제한을 명할 수 있으므로, 우려 단계로 적은 보기가 기준과 다릅니다."},{"i":516,"q":"수상레저사업 등록에 따른 수상레저사업자의 권리 및 의무 승계 대상이 아닌 것은?","o":["사업자가 사망한 경우 그 상속인","사업자가 그 사업을 양도한 경우 그 양수인","사업자의 직계존비속","사업자가 합병한 경우 합병 후 존속하는 법인"],"a":2,"e":"사업자의 직계존비속은 권리 및 의무를 승계 할 수 있는 사항이 아님(수상레저안전법 제40조_권리·의무의 승계)","c":"수상레저안전법","t":"new","x":"권리·의무의 승계는 사업의 지위가 법적으로 넘어가는 경우에 인정됩니다. 사업자가 사망했을 때의 상속인, 사업을 양도했을 때의 양수인, 합병 후 존속하거나 신설된 법인이 그것입니다. 직계존비속이라는 신분만으로는 사업 지위가 자동으로 넘어가지 않으므로 승계 대상이 아닙니다."},{"i":517,"q":"수상레저안전법상 동력수상레저기구에 포함되지 않는 것은?","o":["수상오토바이","스쿠터","호버크라프트","워터슬레이드"],"a":3,"e":"수상레저안전법 시행령 제2조(수상레저기구의 종류)","c":"수상레저안전법","x":"동력수상레저기구는 추진기관을 달아 스스로 움직이는 기구를 말하며 수상오토바이, 스쿠터, 호버크라프트 등이 여기에 속합니다. 워터슬레이드는 다른 배가 끌어 주어야 움직이는 무동력 기구여서 동력수상레저기구에 포함되지 않습니다. 파라세일, 노보트, 딩기요트도 같은 이유로 무동력으로 분류됩니다."},{"i":518,"q":"수상레저기구 변경등록 시 필요한 서류로 옳지 않은 것은?","o":["안전검사증 사본","보험이나 공제에 가입한 사실을 증명하는 서류","동력수상레저기구 조종면허증","변경내용을 증명할 수 있는 서류"],"a":2,"e":"수상레저기구의 등록 및 검사에 관한 법률 시행규칙 제5조(변경등록의 신청 등)","c":"수상레저안전법","x":"변경등록 신청에는 무엇이 어떻게 달라졌는지와 그 기구가 안전하게 운항될 수 있는지를 보여 주는 서류가 필요합니다. 변경 내용을 증명하는 서류, 안전검사증 사본, 보험 가입 사실을 증명하는 서류가 그것입니다. 조종면허증은 사람의 자격에 관한 것이지 기구의 등록 사항과는 관계가 없어 제출 서류에 들어가지 않습니다."},{"i":519,"q":"동력수상레저기구 등록원부를 열람하거나 사본을 발급받으려는 자는 누구에게 등록원부 열람·발급 신청서를 제출해야 하는가?","o":["시·도지사","시장·군수·구청장","해양경찰서장","소방서장"],"a":1,"e":"동력수상레저기구 등록원부를 열람하거나 사본을 발급받으려는 자는 등록원부 열람·발급신청서를 시장·군수· 구청장에게 제출해야 한다","c":"수상레저안전법","x":"동력수상레저기구의 등록 사무는 시장·군수·구청장이 처리하므로, 등록원부를 열람하거나 사본을 발급받으려는 사람도 시장·군수·구청장에게 신청서를 제출합니다. 등록·변경등록·말소등록·등록원부 열람이 모두 같은 기관에서 이루어진다고 기억하면 됩니다. 안전검사와 면허 업무는 해양경찰 쪽이라는 점과 구분하세요."},{"i":520,"q":"수상레저사업장에서 갖추어야 할 인명구조용 장비에 대한 설명으로 옳지 않은 것은?","o":["탑승 정원의 110퍼센트 이상에 해당하는 수의 구명조끼를 갖추어야 한다.","수상레저기구가 30대 이하인 경우에는 1대 이상의 비상구조선을 갖추어야 한다.","영업구역이 1마일 이상인 경우에는 수상레저기구에 사업장 또는 무선국과 연락할 수 있는 통신장비를 갖추어야 한다.","탑승 정원이 13명 이상인 동력수상레저기구에는 선실, 조타실, 및 기관실에 각각 1개 이상의 소화기를 갖추어야 한다."],"a":2,"e":"","c":"수상레저안전법","x":"통신장비를 갖춰야 하는 기준은 영업구역이 2해리 이상인 경우이므로, '1마일 이상'이라고 적은 보기가 규정과 다릅니다. 나머지는 모두 규정대로입니다. 구명조끼는 탑승 정원의 110퍼센트 이상, 비상구조선은 기구 30대 이하일 때 1대 이상, 정원 13명 이상 동력수상레저기구에는 선실·조타실·기관실에 각각 1개 이상의 소화기를 갖추어야 합니다."},{"i":521,"q":"해양경찰서장과 기초지방자치단체의 장이 양자 모두 처벌을 결정할 수 있는 수상레저안전법 위반 행위로 옳지 않은 것은?","o":["안전장비 미착용","무면허 조종","수상레저활동시간 위반","운항규칙 미준수"],"a":1,"e":"‘갑’,‘병’,‘정’ 은 해수면의 경우에는 해양경찰청장, 지방해양경찰청장 또는 해양경찰서장이, 내수면의 경우 에는 시장·군수·구청장이 부과·징수한다.","c":"수상레저안전법","x":"안전장비 미착용, 활동시간 위반, 운항규칙 미준수는 과태료 사항이라 해수면이면 해양경찰, 내수면이면 시장·군수·구청장이 부과·징수할 수 있습니다. 반면 무면허 조종은 과태료가 아니라 형벌 대상이라 행정청이 처벌을 결정하는 것이 아니라 수사와 재판을 거칩니다. 과태료와 벌칙의 처리 주체가 다르다는 점이 핵심입니다."},{"i":522,"q":"시험대행기관에서 시험업무에 종사하는 책임운영자 및 시험관은 해양경찰청장이 실시하는 정기교육을 연간 몇 시간 이상 받아야 하는가?","o":["12시간","21시간","24시간","36시간"],"a":1,"e":"수상레저안전법 시행규칙 제22조(종사자에 대한 교육)","c":"수상레저안전법","x":"시험대행기관의 책임운영자와 시험관은 해양경찰청장이 실시하는 정기교육을 연간 21시간 이상 받아야 합니다. 면허시험을 대신 시행하는 만큼 채점 기준과 안전관리 수준을 일정하게 유지하도록 요구하는 것입니다. 12·24·36시간으로 바꿔 놓는 방식으로 출제되므로 21시간을 정확히 기억해야 합니다."},{"i":523,"q":"수상레저안전법을 위반한 사람에 대한 과태료 처분권한이 없는 사람은 누구인가?","o":["서울시장","강동소방서장","연수구청장","인천해양경찰서장"],"a":1,"e":"수상레저안전법 제64조(과태료) 해수면인 경우 해양경찰청장·지방해경청장·해경서장, 내수면인 경우 시장·군수·구청장","c":"수상레저안전법","x":"과태료 부과·징수 권한은 해수면의 경우 해양경찰청장·지방해양경찰청장·해양경찰서장에게, 내수면의 경우 시장·군수·구청장에게 있습니다. 서울시장, 연수구청장, 인천해양경찰서장은 각각 여기에 해당하지만 소방서장은 수상레저안전법상 부과권자로 규정되어 있지 않습니다. 소방은 구조 기관이지 이 법의 단속·부과 기관이 아닙니다."},{"i":524,"q":"조종면허를 반드시 취소하여야 하는 경우가 아닌 것은?","o":["거짓이나 그 밖의 부정한 방법으로 조종면허를 받은 경우","조종면허 효력정지 기간에 조종을 한 경우","면허증을 다른 사람에게 빌려주어 조종하게 한 경우","술에 취한 상태에서 조종을 한 경우"],"a":2,"e":"","c":"수상레저안전법","x":"면허증을 다른 사람에게 빌려주어 조종하게 한 경우는 위반의 경중을 따져 취소하거나 정지할 수 있는 사유로, 반드시 취소해야 하는 항목은 아닙니다. 반면 거짓이나 부정한 방법으로 면허를 받은 경우, 효력정지 기간에 조종한 경우, 술에 취한 상태에서 조종한 경우는 면허 제도의 근간을 흔드는 행위라 반드시 취소하도록 정하고 있습니다."},{"i":525,"q":"신규검사를 받기 전에 국내에서 동력수상레저기구로 시험운항을 하고자 하는 경우 시험운항허가의 기간 및 운항구역에 대한 설명으로 옳은 것은?","o":["기간: 7일 이내 (해뜨기 전 30분부터 해진 후 30분까지로 한정한다)","기간: 5일 이내 (해뜨기 전 30분부터 해진 후 30분까지로 한정한다)","운항구역: 출발지로부터 직선거리로 10km 이내","운항구역: 해안으로부터 직선거리로 10해리 이내."],"a":0,"e":"운항구역: 출발지로부터 직선거리로 10해리 이내","c":"수상레저안전법","x":"시험운항 허가는 검사를 받기 전 상태의 기구를 임시로 띄우는 것이라 범위를 좁게 정합니다. 기간은 7일 이내이고, 시간은 해뜨기 전 30분부터 해진 후 30분까지로 한정하며, 운항구역은 출발지로부터 직선거리 10해리 이내입니다. 밝을 때, 짧은 기간, 가까운 거리라는 세 가지 제한으로 묶어 기억하면 됩니다."},{"i":526,"q":"안전검사필증의 색상에 대한 설명으로 옳지 않은 것은?","o":["동력수상레저기구의 소유자가 개인일 경우 안전검사필증의 바탕색은 파란색으로 한다.","동력수상레저기구의 소유자가 수상레저사업자일 경우 안전검사필증의 바탕색은 녹색으로 한다.","테두리 색상은 검은색으로 한다.","숫자 및 문자 색상은 흰색으로 한다."],"a":1,"e":"안전검사필증의 바탕색은 동력수상레저기구의 소유자가 개인일 경우 파란색, 수상레저사업자일 경우 주황색으로 한다.","c":"수상레저안전법","x":"안전검사필증의 바탕색은 소유자가 개인이면 파란색, 수상레저사업자면 주황색입니다. 녹색이라고 적은 보기가 틀렸습니다. 테두리는 검은색, 숫자와 문자는 흰색으로 하며, 색만 보고도 영업용인지 개인용인지 구분할 수 있게 한 것입니다. 색 구분을 묻는 문제이므로 파란색과 주황색을 짝지어 외우세요."},{"i":527,"q":"수상레저사업자와 그 종사자가 영업구역에서 해서는 아니 되는 행위에 해당하지 않는 것은?","o":["보호자를 동반한 14세 이상인 자를 수상레저기구에 태우는 행위","술에 취한 자를 수상레저기구에 태우거나 빌려주는 행위","수상레저기구의 정원을 초과하여 태우는 행위","영업구역을 벗어나 영업을 하는 행위"],"a":0,"e":"","c":"수상레저안전법","x":"수상레저사업자와 종사자에게 금지된 행위는 안전을 직접 위협하는 것들입니다. 술에 취한 사람을 태우거나 빌려주는 행위, 정원 초과 탑승, 영업구역 이탈 영업이 여기에 해당합니다. 반면 보호자를 동반한 14세 이상인 사람을 태우는 것은 아무런 문제가 없습니다. 연령 제한은 14세 미만인 사람을 보호자 없이 태우는 경우에 걸린다는 점을 함께 기억하세요."},{"i":528,"q":"동력수상레저기구를 등록하려는 사람은 누구에게 등록신청서를 제출하여야 하는가?","o":["주소지를 관할하는 해양경찰서장","본적지를 관할하는 해양경찰서장","주소지를 관할하는 시장·군수·구청장","본적지를 관할하는 시장·군수·구청장"],"a":2,"e":"동력수상레저기구를 등록하려는 자는 주소지를 관할하는 시장·군수·구청장에게 등록신청서를 제출해야 한다.","c":"수상레저안전법","x":"동력수상레저기구의 등록은 소유자의 주소지를 관할하는 시장·군수·구청장에게 신청합니다. 기구가 있는 곳이나 본적지가 아니라 주소지가 기준이라는 점이 핵심입니다. 취득한 날부터 1개월 이내에 신청해야 하고, 등록이 끝나면 등록증과 등록번호판을 받게 됩니다."},{"i":529,"q":"1년 이하의 징역 또는 1,000만원 이하의 벌금에 해당하는 것은?","o":["등록 또는 변경등록을 하지 아니하고 수상레저사업을 한 자","등록되지 아니하고 동력수상레저기구를 운항한 자","검사를 받지 아니하거나 검사에 합격하지 못한 수상레저기구를 수상레저활동에 사용한 자","정비·원상복구의 명령을 위반한 수상레저사업자"],"a":0,"e":"","c":"수상레저안전법","x":"등록이나 변경등록을 하지 않고 수상레저사업을 한 경우는 사업 자체를 무단으로 벌인 것이라 벌칙 중에서도 무겁게 다루어, 1년 이하의 징역 또는 1천만원 이하의 벌금에 해당합니다. 반면 미등록 기구 운항, 미검사 기구 사용, 정비·원상복구 명령 위반은 과태료 또는 그보다 가벼운 벌칙이 적용됩니다. 사업자 위반이 이용자 위반보다 무겁게 다뤄진다는 감각으로 접근하면 됩니다."},{"i":530,"q":"6개월 이하의 징역 또는 500만원 이하의 벌금에 해당하지 않는 것은?","o":["약물복용 등으로 인하여 정상적으로 조종하지 못할 우려가 있는 상태에서 동력수상레저기구를 조종한 자","등록되지 아니하고 동력수상레저기구를 운항한 자","정비·원상복구의 명령을 위반한 수상레저사업자","검사를 받지 아니하거나 검사에 합격하지 못한 수상레저기구를 수상레저활동에 사용한 자"],"a":0,"e":"수상레저안전법 제61조(벌칙) 누구든지 술에 취한 상태에서 동력수상레저기구를 조종하여서는 아니 된다는 주취 중 조종 금지를 위반한 경우 1년 이하의 징역 또는 1천만원 이하의 벌금에 처한다.","c":"수상레저안전법","x":"약물의 영향으로 정상적인 조종이 어려운 상태에서 조종한 경우는 음주 조종과 같은 수준으로 다루어 1년 이하의 징역 또는 1천만원 이하의 벌금에 해당합니다. 반면 미등록 기구 운항, 정비·원상복구 명령 위반, 미검사 기구 사용은 6개월 이하의 징역 또는 500만원 이하의 벌금 구간입니다. 사람의 상태에 관한 위반이 더 무겁습니다."},{"i":531,"q":"수상레저안전법상 주취 중 조종으로 면허가 취소된 사람은 취소된 날부터 얼마간 조종면허를 받을 수 없는가?","o":["1년","2년","3년","4년"],"a":0,"e":"수상레저안전법 제7조(조종면허의 결격사유 등)","c":"수상레저안전법","x":"음주 조종으로 조종면허가 취소된 사람은 취소된 날부터 1년간 새로 면허를 받을 수 없습니다. 무면허 조종으로 적발된 경우나 그 밖의 사유로 취소된 경우도 같은 1년입니다. 예외적으로 사람을 사상한 뒤 구호 조치 없이 달아난 경우만 4년으로 훨씬 길게 정해져 있어, 이 대비만 기억하면 결격기간 문제는 대부분 해결됩니다."},{"i":532,"q":"수상레저사업자가 등록취소 후 또는 영업정지기간에 영업을 하였다면 해당하는 벌칙으로 옳은 것은?","o":["3년 이하의 징역 또는 3천만원 이하의 벌금","2년 이하의 징역 또는 2천만원 이하의 벌금","1년 이하의 징역 또는 1천만원 이하의 벌금","6개원 이하의 징역 또는 500만원 이하의 벌금"],"a":2,"e":"수상레저안전법 제61조(벌칙)","c":"수상레저안전법","x":"등록이 취소되었거나 영업정지 기간인데도 영업을 계속하는 것은 행정처분 자체를 무력화하는 행위라 벌칙 중에서도 무겁게 다루어 1년 이하의 징역 또는 1천만원 이하의 벌금에 처합니다. 무등록 사업, 면허증 대여, 음주 조종도 같은 구간에 놓입니다. 이 조항에 들어가는 위반 유형을 한 묶음으로 정리해 두면 벌칙 문제를 빠르게 풀 수 있습니다."},{"i":533,"q":"과태료 금액이 다른 하나는?","o":["등록번호판을 부착하지 아니한 동력수상레저기구를 운항한 자","거짓이나 그 밖의 부정한 방법으로 검사대행자로 지정을 받은 자","정당한 사유없이 위치발신장치를 작동하지 아니한 자","고의 또는 중대한 과실로 사실과 다르게 안전검사를 한 자"],"a":2,"e":"“병”은 과태료 50만원 이하, 나머지는 100만원 이하의 과태료 부과 대상자임","c":"수상레저안전법","x":"정당한 사유 없이 위치발신장치를 작동하지 않은 경우는 50만원 이하의 과태료 대상입니다. 반면 등록번호판을 붙이지 않고 운항한 경우, 부정한 방법으로 검사대행자 지정을 받은 경우, 고의나 중대한 과실로 사실과 다르게 안전검사를 한 경우는 100만원 이하의 과태료 대상입니다. 금액대별로 항목을 묶어 두어야 '다른 하나'를 골라낼 수 있습니다."},{"i":534,"q":"50만원 이하의 과태료에 해당하는 사항으로 옳지 않은 것은?","o":["인명안전장비를 착용하지 아니한 자","사고의 신고를 하지 아니한 자","일시정지나 면허증ㆍ신분증의 제시명령을 거부한 자","수상레저활동 시간 외에 수상레저활동을 한 자"],"a":3,"e":"","c":"수상레저안전법","x":"인명안전장비 미착용, 사고 미신고, 일시정지나 면허증·신분증 제시명령 거부는 모두 50만원 이하의 과태료 항목입니다. 그러나 정해진 활동 시간 외에 수상레저활동을 한 경우는 야간 활동 제한을 어긴 것이라 다른 과태료 조항이 적용되므로 이 목록에 들어가지 않습니다. 과태료 문제는 금액대별로 항목을 묶어 정리해 두어야 풀립니다."},{"i":535,"q":"수상레저활동 인구 증가와 급변하는 환경에서 법의 미비점을 보완하고 탄력적 대응을 위해 개정된 수상레저안전법을 설명한 것이다. 가장 옳지 않은 것은?","o":["제1급 조종면허에 한정하여 연령에 따른 조종면허 결격사유 18세 미만으로 한다.","해양경찰청장은 수상레저활동의 체계적인 안전관리를 위하여 수상레저종합정보시스템을 구축ㆍ 운영할 수 있다.","인명안전장비의 미착용하거나 사고의 신고의무를 위반한 자는 50만원 이하의 과태료를 부과한다.","누구든지 면허증을 빌리거나 빌려주거나 이를 알선하는 행위를 한 자는 6개월 이하의 징역 또는 500만원 이하의 벌금에 처한다."],"a":3,"e":"누구든지 면허증을 빌리거나 빌려주거나 이를 알선하는 행위를 금지하고, 이를 위반하는 경우 1년 이하의 징역 또는 1천만원 이하의 벌금에 처하도록 함","c":"수상레저안전법","x":"면허증을 빌리거나 빌려주거나 알선하는 행위는 1년 이하의 징역 또는 1천만원 이하의 벌금에 처합니다. 6개월 이하의 징역이라고 적은 보기가 틀렸습니다. 제1급 조종면허의 연령 결격이 18세 미만이라는 점, 수상레저종합정보시스템 구축·운영 근거, 인명안전장비 미착용과 사고 미신고에 50만원 이하 과태료를 부과한다는 점은 모두 옳습니다."},{"i":536,"q":"면허시험 면제교육기관의 장비기준에 대한 설명으로 가장 옳지 않은 것은?","o":["실기시험용 동력수상레저기구 1대 이상","비상구조선 1대 이상이며 속력은 시속 30노트 이상","구명조끼 20개 이상","구명부환 5개 이상"],"a":1,"e":"비상구조선 1대 이상. 이 경우 비상구조선의 시속은 20노트 이상","c":"수상레저안전법","x":"면제교육기관의 비상구조선은 1대 이상이면서 시속 20노트 이상이어야 합니다. 사고가 났을 때 교육생에게 빠르게 접근할 수 있어야 하기 때문이며, 시험대행기관의 기준과 같은 수치입니다. 따라서 30노트라고 적은 보기가 기준과 다릅니다. 실기시험용 기구 1대 이상, 구명조끼 20개 이상, 구명부환 5개 이상은 옳습니다."},{"i":537,"q":"수상레저사업의 등록기준 중 인력 기준에 대한 설명으로 가장 옳지 않은 것은?","o":["수상레저사업자와 그 종사자 중에서 2명 이상 해당 조종면허를 소지해야 한다.","동력수상레저기구를 사용하여 수상레저사업을 하는 경우 1급 조종면허가 필요하다","무동력수상레저기구만을 사용하여 수상레저사업을 하는 경우 2급 이상의 조종면허가 필요하다.","세일링요트만을 사용하여 수상레저사업을 하는 경우 요트조종면허가 필요하다."],"a":0,"e":"수상레저안전법 시행규칙 제32조(수상레저사업의 등록 신청 등) 수상레저사업자와 그 종사자 중에서 1명 이상은 다음의 구분에 따른 면허를 소지할 것.","c":"수상레저안전법","x":"인력기준은 수상레저사업자와 그 종사자 중에서 1명 이상이 해당 면허를 소지하면 충족됩니다. 2명 이상이라고 적은 보기가 기준과 다릅니다. 동력기구 사업은 제1급 조종면허, 무동력기구만 사용하는 사업은 제2급 이상, 세일링요트만 사용하는 사업은 요트조종면허가 필요하다는 나머지 설명은 옳습니다."},{"i":538,"q":"과태료 부과권자가 2분 1 범위에서 그 금액을 늘려 부과할 수 있는 사항으로 가장 옳지 않은 것은?","o":["위반의 내용ㆍ정도가 중대하여 이용자 등에게 미치는 피해가 크다고 인정되는 경우","법 위반상태의 기간이 3개월 이상인 경우","법 위반상태의 기간이 6개월 이상인 경우","위반행위의 정도, 위반행위의 동기와 그 결과 등을 고려하여 과태료 금액을 늘릴 필요가 있다고 인정 되는 경우"],"a":1,"e":"수상레저안전법 시행령 제39조(과태료 부과기준) 법 위반상태의 기간이 6개월 이상인 경우","c":"수상레저안전법","x":"과태료를 2분의 1 범위에서 늘려 부과할 수 있는 사유는 위반의 내용과 정도가 중대해 이용자 피해가 큰 경우, 위반 상태가 6개월 이상 이어진 경우, 동기와 결과를 고려해 가중이 필요하다고 인정되는 경우입니다. 기간 기준이 3개월이라고 적은 보기는 숫자를 바꿔 놓은 것이라 틀립니다."},{"i":539,"q":"시장·군수·구청장이 동력수상레저기구 등록을 한 후 그 등록에 착오나 빠진 부분이 있는 것을 발견한 경우 조치사항으로 옳은 것은?","o":["해당 등록에 착오나 빠진 부분이 시장·군수·구청장의 잘못으로 인한 것인 경우 그 등록을 직권으로 경정하고 그 사실을 지체 없이 소유자 및 이해관계자에게 통지 한다","해당 등록에 착오나 빠진 부분이 시장·군수·구청장의 잘못으로 인한 것인 경우 그 등록을 직권으로 경정하고 그 사실을 3일 이내에 소유자 및 이해관계자에게 통지 한다","해당 등록에 착오나 빠진 부분이 시장·군수·구청장의 잘못으로 인한 것이 아닌 경우 그 등록을 직 권으로 경정하고 그 사실을 지체 없이 소유자 및 이해관계자에게 통지 한다","해당 등록에 착오나 빠진 부분이 시장·군수·구청장의 잘못으로 인한 것이 아닌 경우 그 사실을 3일 이내에 소유자 및 이해관계자에게 통지 한다"],"a":0,"e":"","c":"수상레저안전법","x":"등록 사항에 착오나 누락이 있고 그것이 행정청의 잘못으로 생긴 경우에는, 소유자가 신청하지 않아도 시장·군수·구청장이 직권으로 바로잡고 그 사실을 지체 없이 소유자와 이해관계인에게 알려야 합니다. 행정청의 실수로 생긴 불이익을 국민에게 떠넘기지 않으려는 취지입니다. '며칠 이내'로 기간을 바꾸거나, 행정청의 잘못이 아닌 경우로 조건을 바꾼 보기가 함정입니다."},{"i":540,"q":"수상레저안전법상 수상레저기구 말소등록을 신청하여야 하는 사유로 가장 옳지 않은 것은?","o":["동력수상레저기구가 멸실된 경우","동력수상레저기구의 존재여부가 6개월간 분명하지 아니한 경우","수상레저활동 외의 목적으로 사용하게 된 경우","수상레저기구를 수출하는 경우"],"a":1,"e":"수상레저기구의 등록 및 검사에 관한 법률 제10조(말소등록) 동력수상레저기구의 존재여부가 3개월간 분명하지 아니한 경우","c":"수상레저안전법","x":"소재 불명을 이유로 한 말소등록은 존재 여부가 3개월간 분명하지 않을 때 신청합니다. 6개월이라고 적은 보기가 틀렸습니다. 멸실된 경우, 수상레저활동 외의 목적으로 사용하게 된 경우, 수출하는 경우도 말소등록 사유입니다. 30일이나 6개월로 기간을 바꿔 놓는 방식이 반복되므로 3개월을 정확히 기억하세요."},{"i":541,"q":"안전검사증 및 안전검사필증에 관한 설명으로 옳지 않은 것은?","o":["해양경찰청장은 안전검사증에 해당 동력수상레저기구의 정원은 지정하나, 운항구역은 소유자의 의사에 따른다.","동력수상레저기구의 소유자는 안전검사증이 알아보기 곤란하게 된 경우에는 재발급 받을 수 있다","안 전 검 사 필 증 을 발 급 받 은 동 력 수 상 레 저 기 구 소 유 자 는 잘 보 이 는 곳 에 안 전 검 사 필 증 을 부착하여야 한다.","동력수상레저기구의 소유자가 개인일 경우 안전검사필증의 바탕색은 파란색이다."],"a":0,"e":"해양경찰청장은 안전검사증에 해당 동력수상레저기구의 정원·운항구역 등을 지정하고, 그 내용을 기재하여야 한다.","c":"수상레저안전법","x":"안전검사증에는 그 기구의 정원과 운항구역 등을 행정청이 지정해 기재합니다. 운항구역을 소유자의 의사에 맡긴다는 서술은 안전검사 제도의 취지에 어긋나 틀립니다. 검사증이 훼손되어 알아보기 어려우면 재발급받을 수 있고, 검사필증은 잘 보이는 곳에 부착하며, 개인 소유는 파란색 바탕이라는 나머지 설명은 옳습니다."},{"i":542,"q":"수상레저안전법상 동력수상레저기구를 이용한 범죄의 종류로 옳지 않은 것은?","o":["살인·사체유기 또는 방화","강도·강간 또는 강제추행","약취·유인 또는 감금","방수방해 또는 수리방해"],"a":3,"e":"수상레저안전법 시행규칙 제19조(동력수상레저기구를 사용한 범죄의 종류)","c":"수상레저안전법","x":"동력수상레저기구를 사용한 범죄로 규정된 것은 배를 이동 수단이나 범행 도구로 삼아 사람에게 직접 해를 끼치는 유형입니다. 살인·사체유기·방화, 강도·강간·강제추행, 약취·유인·감금이 그것입니다. 방수방해나 수리방해는 물길과 시설에 관한 범죄라 이 목록에 들어가지 않습니다."},{"i":543,"q":"수상레저안전법상 조종면허의 효력 발생 시기는?","o":["본인이나 그 대리인에게 발급한 때부터","실기시험에 합격하고 면허증 발급을 신청한 때부터","면허증을 형제·자매에게 발급한 때부터","실기시험 합격 후 안전교육을 이수한 경우"],"a":0,"e":"","c":"수상레저안전법","x":"조종면허의 효력은 시험에 합격한 때가 아니라 면허증을 본인이나 그 대리인에게 발급한 때부터 생깁니다. 따라서 합격만 하고 면허증을 받기 전에 조종하면 무면허 조종이 됩니다. 발급 신청 시점이나 안전교육 이수 시점으로 바꿔 놓은 보기가 오답이며, 형제·자매는 위임을 받지 않는 한 당연히 대리인이 되지 않습니다."},{"i":544,"q":"동력수상레저기구에 대한 압류등록의 촉탁이 있는 경우 해당 등록원부에 기재해야 하는 내용이 아닌 것은?","o":["촉탁기관","압류원인","압류등록","압류등록기관의 연락처"],"a":3,"e":"수상레저기구등록법 시행령 제9조(압류등록 등)","c":"수상레저안전법","x":"압류등록의 촉탁이 있으면 등록원부에는 압류등록이라는 사실, 촉탁기관, 압류 원인을 적습니다. 소유권 행사에 제한이 생겼다는 사실과 그 근거를 공시하기 위한 것입니다. 압류등록기관의 연락처는 공시에 필요한 사항이 아니어서 기재 항목에 들어가지 않습니다."},{"i":545,"q":"수상레저사업 등록을 갱신하려는 자는 등록의 유효기간 종료일 며칠 전까지 수상레저사업 등록․갱신 신청서를 제출하여야 하는가?","o":["5일","3일","7일","10일"],"a":0,"e":"수상레저안전법 시행규칙 제34조(수상레저사업 등록의 갱신)","c":"수상레저안전법","x":"수상레저사업 등록을 갱신하려는 사람은 유효기간 종료일 5일 전까지 등록·갱신 신청서를 제출해야 합니다. 유효기간이 10년으로 길기 때문에 갱신 신청 기한 자체는 짧게 정해 두었습니다. 3·7·10일로 바꿔 놓는 방식으로 출제되므로 '유효기간 10년, 갱신 신청 5일 전'을 한 쌍으로 외우면 됩니다."},{"i":546,"q":"주취 중 조종 금지에 대한 내용으로 옳지 않은 것은?","o":["술에 취하였는지 여부를 측정한 결과에 불복하는 사람에 대하여는 해당 본인의 동의 없이 혈액채취 등의 방법으로 다시 측정할 수 있다.","수상레저활동을 하는 자는 술에 취한 상태에서는 동력수상레저기구를 조종해서는 안 된다.","수상레저안전법에서 말하는 술에 취한 상태는 해상교통안전법을 준용하고 있다.","시·군·구 소속 공무원 중 수상레저안전업무에 종사하는 자는 수상레저활동을 하는 자가 술에 취하여 조종을 하였다고 인정할 만한 상당한 이유가 있는 경우에는 술에 취하였는지를 측정할 수 있다."],"a":0,"e":"","c":"수상레저안전법","x":"음주 측정 결과에 불복하는 사람에 대해서는 본인의 동의를 받아 혈액 채취 등의 방법으로 다시 측정할 수 있습니다. 신체에서 혈액을 얻는 것은 기본권 제한이 크기 때문에 동의 없이는 할 수 없습니다. 그래서 '동의 없이 다시 측정할 수 있다'는 서술이 틀립니다. 술에 취한 상태의 기준은 해상교통안전법을 준용하며, 시·군·구의 수상레저안전 담당 공무원도 측정할 수 있습니다."},{"i":547,"q":"동력수상레저기구의 등록사항 중 소유권의 변경 또는 용도의 변경 등과 같이 변경사항이 발생할 경우 몇 일 이내에 변경등록을 신청해야 하는가?","o":["7일 이내","15일 이내","30일 이내","45일 이내"],"a":2,"e":"수상레저기구등록법 시행령 제7조(변경등록의 신청 등)","c":"수상레저안전법","x":"소유권 변경이나 용도 변경처럼 등록 사항이 달라지면 그날부터 30일 이내에 변경등록을 신청해야 합니다. 처음 취득했을 때의 등록 기한이 1개월인 것과 비슷한 수준으로, 등록부의 내용이 실제와 어긋난 채로 오래 남지 않도록 한 것입니다. 7·15·45일로 바꿔 놓는 보기에 주의하세요."},{"i":548,"q":"1년 이하의 징역 또는 1,000만원
