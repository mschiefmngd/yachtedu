·전기","x":"공동현상은 프로펠러 날개 뒷면의 압력이 급격히 낮아져 물이 기화하며 기포가 생겼다가, 압력이 회복되는 순간 그 기포가 터지며 금속 표면을 두드리는 현상입니다. 이 충격이 반복되면 날개 표면이 파이는 침식이 일어나고 진동과 추진 효율에도 나쁜 영향을 줍니다. 부식은 전기화학적 반응이라 원인이 다르다는 점에서 구분됩니다."},{"i":168,"q":"윤활유 압력이 저하되는 원인으로 가장 옳지 않은 것은?","o":["유량 부족","윤활유 펌프의 고장","윤활유의 냉각","여과기의 막힘"],"a":2,"e":"","c":"기관·전기","x":"윤활유가 냉각되면 점도가 오히려 높아져 유압은 떨어지지 않습니다. 압력이 낮아지는 원인은 유량 부족, 윤활유 펌프 고장, 여과기 막힘처럼 기름이 제대로 공급되지 못하는 경우와, 유온이 지나치게 올라 점도가 묽어진 경우입니다. 따라서 '윤활유의 냉각'이 옳지 않은 항목입니다. 유압 경보가 울리면 즉시 기관을 정지하고 유량부터 확인해야 합니다."},{"i":169,"q":"운전 중인 디젤기관의 회전수가 저하하거나 주기관이 자연 정지한 경우의 원인으로 옳지 않은 것은?","o":["연료계통의 고장","조속기의 고장","윤활유 압력저하","시동공기계통의 고장"],"a":3,"e":"","c":"기관·전기","x":"시동공기계통은 기관을 처음 돌릴 때만 쓰이는 계통이므로, 운전 중 회전수 저하나 자연 정지의 원인이 되지 않습니다. 운전 중 갑자기 멈추는 전형적인 원인은 연료가 끊기는 연료계통 고장, 회전수를 조절하는 조속기 고장, 그리고 윤활유 압력 저하로 인한 보호 정지입니다. '시동에만 관여하는가, 운전 중에도 관여하는가'로 갈라 보면 답이 보입니다."},{"i":170,"q":"요트에 설치된 디젤 엔진의 시동 전 점검 시 윤활유 섬프(sump) 탱크 레벨이 비정상적으로 상승한 경우, 그 원인으로 가장 옳지 않은 것은?","o":["공기 냉각기를 통한 물의 유입","실린더 내부를 통한 물의 유입","실린더 헤드를 통한 물의 유입","배기 밸브의 냉각수 연결 부위로부터의 누수"],"a":0,"e":"공기 냉각기를 통한 물의 유입이 의심되는 현상은 터닝 시 인디케이터 밸브로부터 물이 나오는 경우","c":"기관·전기","t":"new","x":"윤활유 섬프 탱크의 레벨이 비정상적으로 올라갔다면 어딘가에서 물이 윤활유 계통으로 새어 들어온 것입니다. 실린더 내부나 실린더 헤드를 통한 유입, 배기 밸브의 냉각수 연결 부위 누수가 대표적입니다. 반면 공기 냉각기를 통한 물의 유입은 터닝할 때 인디케이터 밸브에서 물이 나오는 형태로 나타나므로 섬프 레벨 상승의 원인으로 보지 않습니다."},{"i":171,"q":"요트에 설치된 원심펌프를 운전 중일 때 송출 유량을 조절하는 방법으로 가장 옳지 않은 것은?","o":["펌프의 회전속도를 조절하는 방법","펌프의 흡입 밸브 개도를 조절하는 방법","펌프의 송출 밸브 개도를 조절하는 방법","펌프의 임펠러 날개 각도를 조절하는 방법"],"a":3,"e":"갑, 을, 병은 모두 원심펌프의 송출 유량을 조절하는 방법이며, 임팰러 날개 각도는 제작 시 고정됨으로 조절이 어렵다.","c":"기관·전기","t":"new","x":"원심펌프의 송출 유량은 회전속도를 바꾸거나 흡입·송출 밸브의 열림 정도를 조절해 바꿉니다. 반면 임펠러 날개의 각도는 제작할 때 고정되어 운전 중에는 조절할 수 없습니다. 실무에서는 송출 밸브로 조절하는 방식이 가장 흔하며, 흡입 쪽을 지나치게 조이면 공동현상이 생길 수 있다는 점도 함께 알아 두면 좋습니다."},{"i":172,"q":"디젤기관이 과부하로 운전될 때 배기의 색깔은?","o":["백색","황색","무색","흑색"],"a":3,"e":"","c":"기관·전기","x":"과부하가 걸리면 실린더에 들어간 연료량에 비해 공기가 모자라 완전연소가 되지 않고, 타다 남은 탄소 입자가 그대로 배출되어 배기가 검게 나옵니다. 그래서 흑색 배기는 과부하·연료 과다·공기 부족의 신호입니다. 백색은 냉각수나 수분이 섞여 탈 때, 청색은 윤활유가 연소실로 새어 들어가 함께 탈 때 나타나므로 원인이 다릅니다. 배기색-원인 짝짓기로 자주 출제됩니다."},{"i":173,"q":"선미측 프로펠러 부근에 아연판(Zinc)를 붙이는 이유로 가장 옳은 것은?","o":["배의 속력을 증가시킨다.","추진기와 엔진의 침식을 방지한다.","프로펠러의 진동을 방지한다.","프로펠러 및 프로펠러축의 부식을 방지한다."],"a":3,"e":"전위차를 이용하여 프로펠러가 아닌 아연판이 먼저 부식하도록 한다.","c":"기관·전기","x":"아연은 철이나 청동보다 이온화 경향이 커서 먼저 부식되는 성질이 있습니다. 이 성질을 이용해 프로펠러와 프로펠러축 가까이에 아연판을 붙여 두면, 전기화학적 부식이 아연판에서 일어나고 정작 보호하려는 부품은 부식을 면합니다. 그래서 희생양극이라고 부르며, 닳으면 주기적으로 교체해야 제 역할을 합니다."},{"i":174,"q":"엔진 시동 시 시동모터가 작동하지 않을 때 가장 먼저 점검해야 할 사항은?","o":["윤활유 오손상태","연료상태","빌지의 양","축전지 충전상태"],"a":3,"e":"","c":"기관·전기","x":"시동모터는 축전지 전기로 돌아가므로, 키를 돌려도 아무 반응이 없다면 가장 먼저 축전지 충전 상태와 단자 연결을 확인해야 합니다. 연료나 윤활유 문제는 모터가 돌아가는데도 시동이 걸리지 않을 때 따져 볼 사항이고, 빌지 양은 시동과 직접 관련이 없습니다. '모터가 안 도는가, 돌기는 하는데 안 걸리는가'로 원인을 나누는 것이 요령입니다."},{"i":175,"q":"디젤엔진을 시동하기 전에 확인해야 할 사항으로 가장 옳지 않은 것은?","o":["윤활계통과 연료계통을 확인한다.","시동계통과 냉각계통을 확인한다.","실린더헤드 안전밸브의 개폐상태를 확인한다.","터닝을 해서 방해물 유무를 확인한다."],"a":2,"e":"안전밸브 개폐상태는 정기적(6개월 또는 1년 등)으로 작동테스트를 하여 이상 유무를 확인하는 것이지, 시동 전에 확인하는 것은 아님.","c":"기관·전기","x":"시동 전 점검은 기관이 정상적으로 돌기 시작할 수 있는지를 확인하는 절차라 윤활계통과 연료계통, 시동계통과 냉각계통을 살피고 터닝으로 내부에 걸리는 것이 없는지 확인합니다. 반면 실린더 헤드 안전밸브의 개폐 상태는 6개월이나 1년 주기로 작동 시험을 통해 확인하는 정기 점검 항목이라 매번 시동 전에 보는 사항이 아닙니다."},{"i":176,"q":"요트 엔진의 필터(filter)에 대한 설명으로 가장 옳지 않은 것은?","o":["연료 필터는 연료 중에 혼입된 먼지나 수분 등의 불순물을 제거하기 위한 부품이다.","선내기 또는 선외기 엔진을 운전한 후에는 반드시 크랭크 케이스 오일 레벨을 점검하여 오일 필터 상태를 확인해야 한다.","디젤엔진에서 연료에 수분이 포함되었을 경우 연료 필터의 연료 라인에 물을 분리하는 필터가 있으면 1년에 1회 교체한다.","오일 필터는 윤활유 속의 카본이나 슬러지 등과 같은 이물질을 걸러내어 오일을 깨끗하게 유지하기 위한 부품이다."],"a":1,"e":"크랭크 케이스 오일 레벨 점검은 반드시 엔진 운전(사용)전에 시행해야 한다.","c":"기관·전기","t":"new","x":"크랭크 케이스의 오일 레벨은 엔진을 돌리기 전에 확인해야 합니다. 운전 직후에는 오일이 각 부위에 퍼져 있고 열로 팽창해 있어 정확한 양을 읽을 수 없기 때문입니다. 그래서 '운전한 후에 반드시 점검한다'는 서술이 틀렸습니다. 연료 필터는 먼지와 수분을, 오일 필터는 카본과 슬러지를 걸러 낸다는 나머지 설명은 옳습니다."},{"i":177,"q":"전류의 작용으로 가장 옳지 않은 것은?","o":["발열작용","자기작용","자화작용","화학작용"],"a":2,"e":"","c":"기관·전기","x":"전류의 3대 작용은 도체에 열을 내는 발열작용, 주위에 자기장을 만드는 자기작용, 전해질을 분해하는 화학작용입니다. 자화작용은 자기작용의 결과로 쇠붙이가 자석의 성질을 띠게 되는 현상을 가리키는 말이라 전류의 기본 작용으로 따로 세지 않습니다. 세 가지를 발열·자기·화학으로 묶어 외우면 나머지가 오답으로 걸러집니다."},{"i":178,"q":"전기적 입력의 유무에 따라 다른 전기회로의 개폐를 제어하는 기기는?","o":["콘덴서","나이프 스위치","퓨즈","릴레이"],"a":3,"e":"입력이 어떤 값에 도달하였을 때 작동하여 다른 회로를 개폐하는 장치로서, 점접이 있는 릴레이, 서멀 (thermal) 릴레이, 압력 릴레이, 광 릴레이 등이 있다.","c":"기관·전기","x":"릴레이는 작은 전기적 입력이 들어오면 내부 전자석이 접점을 움직여 다른 회로를 여닫는 기기입니다. 약한 신호로 큰 전류의 회로를 제어할 수 있어 시동 회로와 각종 제어 회로에 널리 쓰입니다. 콘덴서는 전하를 저장하고, 퓨즈는 과전류를 끊으며, 나이프 스위치는 사람이 직접 여닫는 개폐기라 기능이 다릅니다."},{"i":179,"q":"퓨즈에 대한 설명으로 가장 옳지 않은 것은?","o":["전원을 과부하로부터 보호한다.","부하를 과전류로부터 보호한다.","과전류가 흐를 때 고온에서 녹아 회로를 차단한다.","허용 용량 이상의 크기로 사용할 수 있다."],"a":3,"e":"퓨즈의 허용 용량 이상의 크기로 전류가 흐를 경우, 발열로 인해 퓨즈 내부가 녹아 회로를 차단한다.","c":"기관·전기","x":"퓨즈는 허용 용량을 넘는 전류가 흐르면 내부 금속이 녹아 회로를 끊어 기기와 배선을 보호하는 부품입니다. 따라서 허용 용량보다 큰 것을 끼워 쓰면 정작 끊어져야 할 때 끊어지지 않아 과열과 화재로 이어질 수 있습니다. 반드시 규정 용량에 맞는 퓨즈로 교체해야 한다는 것이 이 문제의 요지입니다."},{"i":180,"q":"선박에서 축전지의 용도에 대한 설명으로 가장 옳지 않은 것은?","o":["비상전등이나 비상통신을 위한 전원용","선내 통신용 전원","비상용 발전기 기동 시 까지 임시 전원용","주기관 연료 펌프 구동용 전원"],"a":3,"e":"주기관 연료 펌프 구동용 전원으로는 사용되지 않는다.","c":"기관·전기","x":"선박의 축전지는 주로 시동, 비상등, 비상통신, 선내 통신, 비상발전기가 가동될 때까지의 임시 전원처럼 소용량·비상용 전력을 담당합니다. 주기관의 연료 펌프는 기관 자체나 발전기에서 나오는 동력·전력으로 구동하며, 축전지 용량으로는 지속적으로 감당할 수 없습니다. 축전지는 '비상과 시동'이라는 성격으로 기억하면 됩니다."},{"i":181,"q":"다음 중 납축전지의 수명(lifespan)에 영향을 미치는 요인에 대한 설명으로 가장 옳지 않은 것은?","o":["방전 전류의 크기와 관계없이 일정한 수명을 유지함으로 충·방전 횟수와 무관하게 안정적으로 작동한다.","반복적인 대전류 방전은 전극의 황산염화를 촉진하여 수명을 단축시킬 수 있다.","보관 장소의 온도가 낮거나, 사용하지 않는 시간이 길 경우 또는 완전 방전하는 경우, 수명이 짧아진다.","고온 환경에서 사용하는 경우, 전해액의 증발과 전극의 부식을 유발하여 수명 저하의 원인이 될 수 있다."],"a":0,"e":"납축전지의 수명은 사용(운용) 상황에 따라 다르나, 방전 전류가 크거나 보관 장소의 온도가 낮은 경우, 사용하지 않는 시간이 긴 경우, 완전 방전하는 경우에는 수명이 짧아진다.","c":"기관·전기","t":"new","x":"납축전지의 수명은 사용 방식에 크게 좌우됩니다. 큰 전류로 반복해 방전하면 전극에 황산염이 쌓여 수명이 줄고, 보관 온도가 낮거나 오래 방치하거나 완전 방전시켜도 짧아지며, 고온에서는 전해액이 증발하고 전극이 부식됩니다. 따라서 '충·방전 횟수와 무관하게 일정한 수명을 유지한다'는 서술은 사실과 다릅니다."},{"i":182,"q":"다음 중 “전원 회로”에 대한 설명으로 가장 옳은 것은?","o":["항상 일정한 전원을 공급할 수 있도록 하는 회로","콘덴서를 이용하여 직류 전원을 교류 전원으로 바꾸는 회로","다이오드를 이용하여 교류 전원을 직류 전원으로 바꾸는 회로","교류 전원을 일정한 전압을 갖는 직류 전원으로 변환시키는 회로"],"a":3,"e":"“전원 회로”는 교류 전원을 일정한 전압을 갖는 직류 전원으로 변환시키는 회로","c":"기관·전기","t":"new","x":"전원 회로는 교류로 들어온 전기를 다이오드로 정류하고 평활 회로와 정전압 회로를 거쳐, 일정한 전압의 직류로 바꿔 기기에 공급하는 회로 전체를 말합니다. 다이오드로 교류를 직류로 바꾸는 것은 그 안의 정류 회로 하나만을 가리키므로 설명 범위가 좁고, 직류를 교류로 바꾸는 것은 인버터의 역할이라 방향이 반대입니다."},{"i":183,"q":"요트용 디젤엔진이 운전 중 급정지하는 현상이 발생하는 원인으로 가장 옳지 않은 것은?","o":["피스톤 링의 과대 마멸","과속도 정지 장치의 작동","연료에 물이 혼입","연료유의 압력 저하"],"a":0,"e":"피스톤 링의 과대 마멸로 인한 운전 중인 디젤 엔진에서 유증기 배출관으로부터 대량의 가스가 배출되는 현상 유발","c":"기관·전기","t":"new","x":"운전 중 급정지의 원인은 연료가 끊기거나 보호장치가 작동한 경우입니다. 연료에 물이 섞이거나 연료유 압력이 떨어지면 연소가 이어지지 못하고, 과속도 정지 장치가 작동하면 기관이 스스로 멈춥니다. 반면 피스톤 링이 심하게 마멸되면 압축이 새면서 유증기 배출관으로 가스가 많이 나오는 현상이 나타날 뿐 갑작스러운 정지로 이어지지는 않습니다."},{"i":184,"q":"엔진 시동 중 회전수가 급격하게 높아 질 때 점검할 사항으로 가장 옳지 않은 것은?","o":["거버너 위치 등을 점검","한꺼번에 많은 연료가 공급되는지를 확인","시동 전 가연성 가스를 배제했는지를 확인","냉각수 펌프의 정상 작동하는지 점검"],"a":3,"e":"냉각수와 엔진회전수 증가와 관련이 없다. 엔진의 급속한 회전은 연료 분사량과 관련 있다.","c":"기관·전기","x":"회전수가 갑자기 치솟는 것은 연료가 한꺼번에 많이 들어가거나 조속기(거버너)가 제대로 제어하지 못할 때, 또는 연소실에 가연성 가스가 남아 있을 때 일어납니다. 냉각수 펌프는 열을 식히는 역할이라 회전수 상승과 직접 관련이 없습니다. '연료 공급량과 회전수 제어'라는 축으로 점검 항목을 묶으면 됩니다."},{"i":185,"q":"출발지에서 도착지까지의 항정선 상의 거리 또는 양 지점을 잇는 대권 상의 호의 길이를 마일로 표시한 것은?","o":["동서거","변위","항정","변경"],"a":2,"e":"항정은 출발지에서 도착지까지의 항정선 상의 거리 또는 양 지점을 잇는 대권 상의 호의 길이를 마일로 표시한 것 항정선은 각 자오선과 같은 각도로 만나는 선","c":"기관·전기","x":"항정은 출발지에서 도착지까지 항정선을 따라간 거리, 또는 두 지점을 잇는 대권상 호의 길이를 마일로 나타낸 값으로 실제 항해한 거리를 뜻합니다. 동서거는 동서 방향으로 이동한 거리, 변위는 위도의 차, 변경은 경도의 차이므로 각각 다른 요소입니다. 항해계산에서 네 가지가 함께 쓰이므로 구분해 두어야 합니다."},{"i":186,"q":"요트 항해계획에서 가장 먼저 고려해야 할 요소는?","o":["선원의 숙련도","기상 조건","요트의 청결","출발 시간"],"a":1,"e":"항해계획의 첫 단계는 기상 조건 확인으로, 안전과 일정에 직접적인 영향을 미친다.","c":"기관·전기","t":"new","x":"항해계획은 기상 확인에서 출발합니다. 바람과 파고, 시정에 따라 출항 여부와 항로, 소요 시간, 필요한 인원과 장비가 모두 달라지기 때문입니다. 아무리 준비가 잘 되어 있어도 기상이 나쁘면 출항 자체를 미뤄야 합니다. 기상 확인 다음에 항로 선정, 조석과 조류 확인, 인원과 물자 준비로 이어지는 순서를 기억하세요."},{"i":187,"q":"건식 마그네틱 컴퍼스와 비교하여 액체식의 장점은?","o":["안정성이 있다","예민하다","불안정하다","떨림이 크다"],"a":0,"e":"","c":"항해·해도","x":"액체식(습식) 마그네틱 컴퍼스는 카드가 액체 속에 잠겨 있어 파도나 엔진 진동에도 카드의 흔들림이 빨리 가라앉습니다. 즉 지시가 안정적이라 선박에서 실제로 널리 쓰입니다. 건식은 마찰이 적어 예민하게 반응하지만 그만큼 흔들림이 오래가 요동이 심한 소형선에는 불리합니다. '예민함은 건식, 안정성은 액체식'으로 대비해 두세요."},{"i":188,"q":"보기의 설명에서 말하는 것을 측정하기 위한 세일링 요트의 항해장비는? 요트에서 대단히 중요한 정보로 이를 측정하기 위해 주 돛 머리(Mast head)에 이것을 감지하는 장비가 달려있다.","o":["풍향풍속계","경사계","GPS","레이다"],"a":0,"e":"정확도가 요구되는 풍상범주 때 돛의 영향을 받지 않기 위하여 주 돛대 앞쪽으로 돌출된 보(Arm) 끝부분에 풍향풍속계가 부착된다.","c":"범주·조종","x":"풍향풍속계는 요트에서 가장 중요한 정보인 바람의 방향과 세기를 재는 장비로, 돛의 영향을 받지 않도록 마스트 꼭대기에 설치합니다. 특히 정확도가 필요한 풍상 범주에서는 주 돛대 앞쪽으로 뻗은 팔 끝에 달아 흐트러지지 않은 바람을 측정합니다. 여기서 얻은 겉보기 바람 값에 배의 속도를 반영해 참바람을 계산합니다."},{"i":189,"q":"요트가 바람을 정면으로 받을 때 범주가 불가능한 구역을 무엇이라 하는가?","o":["데드존","블랭킷존","노고존","리웨이존"],"a":2,"e":"‘노고존(No-go zone)’은 바람을 정면으로 받아 범주가 불가능한 영역을 의미한다.","c":"범주·조종","t":"new","x":"노고존은 바람을 정면으로 받는 좌우 약 45도씩, 합쳐 90도가량의 범위로 돛이 힘을 받지 못해 나아갈 수 없는 구역입니다. 이 안에 들어가면 돛이 펄럭이며 속도를 잃으므로, 풍상으로 가려면 노고존 바깥 각도를 유지하며 태킹을 반복해야 합니다. 데드존이라고도 부르지만 시험에서는 노고존이라는 이름으로 출제됩니다."},{"i":190,"q":"항해구역에 대한 설명으로 옳지 않은 것은?","o":["평수구역이란 바다를 제외한 호수·하천·댐·저수지 등을 말한다.","연해구역이란 한반도와 제주도의 해안에서 20해리 이내의 수역을 말한다.","근해구역이란 동쪽은 동경 175도, 서쪽은 동경 94도, 남쪽은 남위 11도, 북쪽은 북위 63도의 선으로 둘러싸인 수역을 말한다.","한정연해구역이란 평수구역으로부터 해당 수상레저기구의 최고 속력으로 왕복 2시간 이내 연해구역을 말한다."],"a":0,"e":"평수구역이란 호수·하천, 항내의 수역 등 파도가 약해 비교적 안전하고 평온한 수역등을 말한다.","c":"항해·해도","t":"new","x":"평수구역은 호수와 하천, 항내의 수역처럼 파도가 약하고 비교적 평온한 수역을 말하며 항만 안쪽 바다도 포함됩니다. 따라서 '바다를 제외한다'는 서술이 틀렸습니다. 연해구역은 해안에서 20해리 이내, 근해구역은 동경 175도·동경 94도·남위 11도·북위 63도로 둘러싸인 수역, 한정연해구역은 평수구역에서 왕복 2시간 이내의 연해구역입니다."},{"i":191,"q":"요트에서 식량 저장 시 가장 중요한 고려 사항은?","o":["식품의 종류","포장 상태","부패 가능성","선원의 기호"],"a":2,"e":"요트 항해 중 식량은 온도, 습도, 진동에 노출되므로 부패 가능성이 가장 중요하다.","c":"기상·해양","t":"new","x":"요트 안은 온도와 습도가 높고 진동이 심해 식품이 상하기 쉽습니다. 그래서 식량을 실을 때는 무엇보다 상하지 않고 버틸 수 있는지, 즉 부패 가능성을 먼저 따집니다. 통조림과 건조식품, 진공포장 식품을 중심으로 꾸리고 신선식품은 항해 초반에 소비하는 식으로 계획합니다. 종류나 개인 기호는 그다음 고려 사항입니다."},{"i":192,"q":"항해 중 GPS가 고장 났을 때 대체 가능한 항해 장비는?","o":["풍향풍속계","나침반","레이더","AIS"],"a":1,"e":"GPS 고장 시 기본적인 방위 확인은 나침반으로 가능하며, 침로 유지에 필수적이다.","c":"항해·해도","t":"new","x":"GPS가 고장 나도 나침반이 있으면 방위를 알 수 있어 침로를 유지하고 목적지 방향으로 항해할 수 있습니다. 전원과 위성 신호가 필요 없다는 점에서 가장 확실한 대체 수단입니다. 풍향풍속계는 바람 정보만, 레이더는 주변 물표만, AIS는 다른 배의 정보만 알려 주므로 스스로 방향을 유지하는 데는 부족합니다."},{"i":193,"q":"다음 설명 중 옳지 않은 것은?","o":["대수속력이란 선박이 항해 중 수면과 이루는 속력이다.","대지속력이란 선박이 항해 중 지면과 이루는 속력이다.","노트(Knot)란 선박의 속력 단위며, 1노트는 1시간에 1해리 항주한 속력이다.","해리(Nautical Mile)란 해상에서 거리 단위며, 1해리는 1,609m이다."],"a":3,"e":"해리(Nautical Mile)란 해상에서 거리 단위며, 1해리는 1,862m이다.","c":"항해·해도","t":"new","x":"해리는 지구 위도 1분에 해당하는 거리로 국제적으로 1,852미터로 정해져 있습니다. 1,609미터는 육상에서 쓰는 마일이므로 보기 4가 틀렸습니다. 참고로 문제은행의 공식 해설에는 1,862미터로 적혀 있으나 이는 오기이며 정답을 고르는 데에는 영향이 없습니다. 1노트가 시간당 1해리라는 정의와 함께 외워 두세요."},{"i":194,"q":"요트의 추진 원리에 관한 설명으로 가장 옳은 것은?","o":["요트의 추진력은 돛이 바람을 받을 때 생기는 풍압과 양력에 의해 생긴다.","요트의 추진력은 틸러를 좌우로 밀면 추진력이 생긴다.","요트의 추진력은 모터보트로 견인할 때만 추진력을 얻을 수 있다.","요트의 추진력은 반드시 보조 엔진을 사용해야만 추진할 수 있다."],"a":0,"e":"","c":"기관·전기","x":"요트의 돛은 비행기 날개와 같은 역할을 합니다. 뒤에서 바람을 받을 때는 돛을 미는 풍압이, 옆에서 바람을 받을 때는 돛 앞뒤의 압력차로 생기는 양력이 추진력을 만듭니다. 그래서 바람만으로 앞으로 나갈 수 있고, 보조엔진이나 예인은 필수 조건이 아닙니다. 틸러는 방향을 바꾸는 장치이지 추진력을 만들어 내지 못한다는 점도 함께 확인하세요."},{"i":195,"q":"풍하 쪽으로 항해하면서 변침하는 것을 말하는 용어는?","o":["태킹(Tacking)","자이빙(Gybing)","러핑(Luffing)","리핑(Reefing)"],"a":1,"e":"자이빙은 풍하 범주이며 바람을 선미 쪽으로부터 바람을 받아 방향 전환하는 방법이다.","c":"범주·조종","t":"new","x":"자이빙은 뒤에서 바람을 받으며 풍하 쪽으로 방향을 바꾸는 조작으로, 선미가 바람을 가로지르는 순간 붐이 반대편으로 넘어갑니다. 이때 붐이 강한 힘으로 급하게 넘어가 사람이 맞거나 리깅이 손상될 수 있어 강풍에서는 특히 조심해야 합니다. 반대로 태킹은 선수가 바람을 가로지르는 풍상 쪽 방향 전환입니다."},{"i":196,"q":"풍상 쪽으로 항해하면서 풍상 쪽으로 변침하는 것을 말하는 용어는?","o":["자이빙(Gybing)","고어링어바웃(Goring about)","태킹(Tacking)","풀세일링(Full sailing)"],"a":2,"e":"","c":"범주·조종","x":"태킹은 선수가 바람을 가로지르며 풍상 쪽으로 방향을 바꾸는 조작입니다. 풍상으로 거슬러 올라갈 때 지그재그로 반복하는 그 동작이 태킹입니다. 반대로 선미가 바람을 가로지르며 풍하 쪽으로 도는 것은 자이빙입니다. '풍상으로 돌면 태킹, 풍하로 돌면 자이빙'이라는 한 줄로 정리해 두면 관련 문제를 모두 처리할 수 있습니다."},{"i":197,"q":"요트에서 식수 저장 시 가장 적절한 용기는?","o":["유리병","알루미늄 캔","플라스틱 통","스테인리스 용기"],"a":3,"e":"스테인리스 용기는 부식에 강하고 위생적이며, 장기 항해에 적합하다.","c":"범주·조종","t":"new","x":"스테인리스 용기는 부식에 강하고 냄새나 성분이 배어나지 않으며 세척과 살균이 쉬워 장기 항해의 식수 보관에 적합합니다. 유리병은 흔들리는 배에서 깨질 위험이 크고, 알루미늄 캔은 재사용이 어려우며, 플라스틱 통은 햇빛과 고온에 오래 노출되면 변형되거나 냄새가 밸 수 있습니다. 흔들림과 위생을 함께 고려하는 것이 선상 보관의 기준입니다."},{"i":198,"q":"참바람의 방향 계산, 바람의 미세 변화의 기록 등에 사용되며 지상에 있는 목표물의 방위를 계측하여 자기의 위치를 찾아내는 지문항법에도 사용되는 장비는?","o":["GPS","풍향풍속계","경사계","나침반"],"a":3,"e":"항해의 기본이자 범주 시 바람의 미세한 변화를 감지하기 위한 중요한 항해장비인 나침반은 수평유지장치 (Gimbals)가 설치되어 나침반의 반면(Compass rose)이 항상 수평을 유지하도록 되어있다.","c":"범주·조종","x":"나침반은 침로 유지뿐 아니라 참바람의 방향을 계산하고 바람의 미세한 변화를 기록하는 데도 쓰이며, 육상 목표물의 방위를 재어 자기 위치를 구하는 지문항법의 기본 도구이기도 합니다. 요트의 나침반은 짐벌(수평유지장치) 위에 놓여 배가 기울어도 컴퍼스 로즈가 수평을 유지하도록 되어 있습니다."},{"i":199,"q":"교차방위법에 의하여 선위를 구하는 경우 물표 선정에 관한 주의사항으로 옳지 않은 것은?","o":["위치가 정확하고 뚜렷한 목표를 선정할 것","위치선의 교각이 90°에 가까운 것을 선정할 것","가까운 목표보다는 먼 것을 선정할 것","세 목표가 같은 원둘레 위에 있지 않을 것"],"a":2,"e":"방위를 측정하거나 방위선을 기입할 때 목표까지 거리가 멀수록 같은 오차에 대한 선위의 오차가 커진다.","c":"항해·해도","x":"교차방위법에서는 가까운 물표를 고르는 것이 좋습니다. 같은 각도의 측정 오차라도 물표가 멀수록 방위선이 크게 벌어져 위치 오차가 커지기 때문입니다. 그 밖에 위치가 정확하고 뚜렷한 물표를 고를 것, 위치선의 교각이 90도에 가깝도록 할 것, 세 물표가 한 원둘레 위에 놓이지 않도록 할 것이 주의사항입니다."},{"i":200,"q":"위치를 알고 있는 여러 개의 중거리에 있는 인공위성에서 발사하는 전파를 수신하고, 그 도달시간 으로부터 관측자까지의 거리를 구하여 정확한 위치를 결정하는 전파항법 장치는?","o":["Loran C","GPS","Radar","Decca"],"a":1,"e":"GPS는 21개의 기본 위성과 3개의 예비 위성으로 구성되는 24개의 위성에서 발사되는 전파를 수신하고, 그 도달시간으로부터 관측자까지의 거리를 구하여 위치를 구하는 항해계기다.","c":"항해·해도","x":"GPS는 궤도를 도는 위성이 보내는 전파의 도달 시간으로 위성까지의 거리를 구하고, 여러 위성과의 거리를 조합해 위치를 결정하는 전파항법 장치입니다. 3차원 위치를 얻으려면 시계 오차까지 고려해 최소 4개 위성의 신호가 필요합니다. 로란C와 데카는 지상국 전파를 쓰는 옛 방식이고, 레이더는 물표까지의 거리와 방위를 재는 장비입니다."},{"i":201,"q":"항해 중 침로를 유지하기 위해 사용하는 기본 장비는?","o":["풍향풍속계","나침반","레이더","GPS"],"a":1,"e":"나침반은 침로를 유지하기 위한 가장 기본적인 항해 장비이다.","c":"항해·해도","t":"new","x":"나침반은 전원이나 위성 신호 없이도 방위를 알려 주기 때문에 침로 유지의 가장 기본이 되는 장비입니다. GPS나 레이더는 위치와 물표를 알려 주지만 전원이 끊기면 쓸 수 없으므로, 자기 컴퍼스는 최후까지 남는 항해 수단으로 취급됩니다. 다만 선체의 철재와 전기기기 때문에 자차가 생기므로 자차 수정과 확인이 필요합니다."},{"i":202,"q":"돛이 좌현에서 바람을 받아 우현에 펴진 상태를 (\n① )이라 하고, 그 반대 상태를 (\n② )이라 한다.","o":["① 제네커(Gennaker), ② 거스(Girth)","① 스타보드택(Starboard deck),\n② 포트택(port deck)","① 포트택(Port tack),\n② 스타보드택(Starboard tack)","① 구스넥(Gooseneck), ② 붐(Boom)"],"a":2,"e":"‘포트택’은 메인 세일이 우현에 있는 경우로 좌현으로부터 바람을 받고 있는 상태를 말하며, ‘스타보드택’은 그 반대이다.","c":"요트·의장","x":"택은 바람을 어느 현에서 받고 있는가로 부릅니다. 좌현에서 바람을 받아 돛이 우현으로 펴진 상태가 포트택, 우현에서 바람을 받아 돛이 좌현으로 펴진 상태가 스타보드택입니다. 요트 경기 규칙에서 스타보드택 배가 우선권을 갖기 때문에, 실제 항해에서도 상대 배가 어느 택인지 판단하는 것이 중요합니다."},{"i":203,"q":"항해 중 조류의 영향을 가장 크게 받는 구간은?","o":["협수로","항만 내","외해","연안지"],"a":0,"e":"협수로는 조류의 흐름이 집중되기 때문에 항해 시 영향이 크다.","c":"요트·의장","t":"new","x":"협수로는 넓은 바다에서 밀려온 물이 좁은 단면으로 몰려 지나가는 곳이라 유속이 크게 빨라집니다. 그래서 조류의 영향을 가장 크게 받고 와류도 잘 생깁니다. 외해는 단면이 넓어 조류가 약하고, 항만 안은 방파제로 보호되어 흐름이 완만합니다. 협수로는 조류가 약해지는 게류나 정조 시각에 맞춰 통과하는 것이 원칙입니다."},{"i":204,"q":"바람의 영향으로 요트가 옆으로 밀리는 현상을 무엇이라 하는가?","o":["드리프트(Drift)","리웨이(Leeway)","요잉(Yawing)","스웨이(Sway)"],"a":1,"e":"리웨이(횡류 Leeway)는 바람에 의해 요트가 옆으로 밀리는 현상이다.","c":"기상·해양","t":"new","x":"리웨이는 바람에 밀려 배가 옆으로 흘러가는 현상으로, 실제 진행 방향이 뱃머리가 향한 방향보다 풍하 쪽으로 치우치게 됩니다. 요트는 킬이나 센터보드로 이 횡류를 줄이며, 그래도 남는 편차는 침로를 계산할 때 반영해야 합니다. 요잉은 선수가 좌우로 흔들리는 운동, 드리프트는 조류 등에 따른 표류를 뜻해 원인이 다릅니다."},{"i":205,"q":"요트에서 식품 보관 시 가장 피해야 할 환경은?","o":["건조하고 서늘한 곳","직사광선이 드는 곳","통풍이 잘 되는 곳","냉장 보관 가능한 곳"],"a":1,"e":"직사광선은 온도상승과 부패를 유발하므로 식품 보관에 부적합하다.","c":"기상·해양","t":"new","x":"직사광선은 보관 공간의 온도를 급격히 올려 식품의 부패와 변질을 촉진하고, 통조림이나 밀폐 용기 내부의 압력을 높이기도 합니다. 그래서 식품은 건조하고 서늘하며 통풍이 잘 되는 곳, 가능하면 냉장이 되는 곳에 보관해야 합니다. 좁은 요트에서는 선실 아래 바닥 가까운 곳이 상대적으로 온도가 낮아 보관에 유리합니다."},{"i":206,"q":"요트 추진원리에 대한 설명으로 옳지 않은 것은?","o":["세일링 요트는 양력과 바람에 의한 풍압으로 추진한다.","세일링 요트는 세일의 바깥 부분의 공기 흐름이 늦고, 안쪽 부분은 공기의 흐름이 빠른 두 압력의 차이로 추진한다.","세일링 요트의 추진력은 양력으로부터 발생한 전진력과 옆으로 밀리게 되는 횡류력을 총합력으로 추진한다.","요트 선체 하부의 킬(Keel)의 저항력으로 횡류력을 잡아주어 전진력으로 전환하여 추진한다."],"a":1,"e":"세일링 요트는 세일 바깥 부분은 공기의 흐름이 빨라 기압이 낮아지고, 안쪽 부분은 공기의 흐름이 늦어 지고 기압이 높아지는 두 압력의 차이로 양력이 발생하여 추진한다.","c":"범주·조종","t":"new","x":"돛의 바깥쪽(볼록한 풍하측)은 공기가 지나는 거리가 길어 흐름이 빨라지고 압력이 낮아지며, 안쪽은 흐름이 느려 압력이 높아집니다. 이 압력 차이가 양력을 만들어 배를 끌어당깁니다. 따라서 바깥쪽이 느리고 안쪽이 빠르다고 적은 보기는 방향이 반대입니다. 양력에서 나온 힘은 전진력과 횡류력으로 나뉘고 횡류력은 킬이 잡아 줍니다."},{"i":207,"q":"2개의 물표와 관측자가 일직선 상에 있는 선은?","o":["수평선","위치선","중시선","방위선"],"a":2,"e":"중시선은 위치선 중에서 아주 정확하므로 마그네틱 컴퍼스의 자차 측정 시에 많이 이용된다.","c":"항해·해도","x":"중시선은 두 물표와 관측자가 한 직선 위에 놓였을 때 그 두 물표를 잇는 선입니다. 배가 그 선 위에 있다는 사실을 각도 측정 없이 눈으로 확인할 수 있어 위치선 가운데 가장 정확하며, 자기 컴퍼스의 자차를 측정할 때 기준선으로 많이 씁니다. 좁은 수로를 지날 때 피험선으로도 활용됩니다."},{"i":208,"q":"두 물표를 교차방위법으로 측정할 때 가장 좋은 교각은?","o":["90°","120°","140°","150°"],"a":0,"e":"","c":"항해·해도","x":"교차방위법은 두 물표의 방위선이 만나는 점을 선위로 잡는 방법이므로, 두 방위선이 이루는 교각이 직각(90°)에 가까울수록 오차가 가장 작아집니다. 교각이 너무 작거나 180°에 가까워지면 방위 오차가 조금만 있어도 교점이 크게 흔들립니다. 물표가 세 개일 때는 서로 약 60°씩 벌어지는 것이 가장 좋다는 점도 함께 기억해 두세요."},{"i":209,"q":"항해 중 예상치 못한 강풍으로 인해 기상이 악화된 경우, 가장 먼저 해야 할 조치는?","o":["항해하여 기상 악화 지역을 벗어난다.","돛을 모두 펼쳐 가속한다.","리핑(Reefing)하여 돛 면적을 줄인다.","정박장소를 찾는다."],"a":2,"e":"강풍 시 돛 면적을 줄이는 리핑은 요트의 안정성과 조종성을 높이는 데 중요하다.","c":"범주·조종","t":"new","x":"강풍이 닥쳤을 때 가장 먼저 할 일은 리핑으로 돛 면적을 줄이는 것입니다. 돛을 그대로 두면 과도한 힘이 걸려 배가 크게 기울고 조타가 듣지 않아 전복이나 장비 파손으로 이어지기 때문입니다. 면적을 줄이면 속도는 조금 떨어지지만 복원성과 조종성이 살아나 대피 항해가 가능해집니다. 리핑은 늦기 전에 미리 하는 것이 원칙입니다."},{"i":210,"q":"컴퍼스의 용도는 무엇인가?","o":["물표방위 측정, 선박침로 결정","선속 측정","지형지물 확인","수심 측정"],"a":0,"e":"컴퍼스는 물표의 방위와 침로를 결정하는 항해계기이다.","c":"항해·해도","x":"컴퍼스는 자침이 가리키는 남북선을 기준으로 물표의 방위를 재고, 그 방위를 바탕으로 배가 나아갈 침로를 정하고 유지하는 데 쓰는 항해계기입니다. 즉 '방향'을 다루는 장비입니다. 속력은 선속계, 수심은 측심의, 지형지물 확인은 레이더나 육안 관측이 담당하므로 역할이 겹치지 않습니다. 방위 두 개를 재어 교차시키면 선위도 구할 수 있습니다."},{"i":211,"q":"항해 중 항로를 이탈했을 때 가장 먼저 확인해야 할 것은?","o":["나침반의 방향","GPS의 현재 위치","당시의 풍속","당시의 선속"],"a":1,"e":"GPS를 통해 현재 위치를 확인하고 항로 복귀를 위한 조치를 취해야 한다.","c":"항해·해도","t":"new","x":"항로를 벗어났다고 판단되면 먼저 지금 내가 어디에 있는지를 확정해야 합니다. 현재 위치를 모르면 복귀 침로도, 주변 위험물과의 거리도 계산할 수 없기 때문입니다. GPS로 위치를 확인한 뒤 해도에 옮겨 안전한 복귀 경로를 정하는 것이 순서입니다. 풍속이나 선속은 그다음 단계에서 이동 시간과 편류를 계산할 때 쓰는 값입니다."},{"i":212,"q":"바람이 강하게 불 때 요트가 전복되지 않도록 돛을 줄이는 작업을 무엇이라 하는가?","o":["태킹(Tacking)","자이빙(Gybing)","리핑(Reefing)","러핑(Luffing)"],"a":2,"e":"리핑(reefing)은 강풍 시 돛의 면적을 줄여 요트의 안전성을 확보하는 작업이다.","c":"범주·조종","t":"new","x":"리핑은 바람이 강할 때 돛의 면적을 줄여 배가 지나치게 기울거나 뒤집히지 않게 하는 작업입니다. 돛을 리프 포인트까지 내려 접고 그로밋에 리프 로프를 꿰어 묶습니다. 태킹과 자이빙은 방향을 바꾸는 조작, 러핑은 선수를 풍상으로 올리는 조작이라 목적이 다릅니다. 리핑은 늦기 전에 미리 하는 것이 원칙입니다."},{"i":213,"q":"견시보고를 할 때 편리하게 사용되며 자선의 선수를 0°로 하여 시계방향으로 360°까지 나타내는 방위는?","o":["상대방위","진방위","시침방위","나침방위"],"a":0,"e":"선수방향을 000°로 하여 시계방향으로 360°까지 측정한 것을 상대방위라 한다. 그러나 때로는 선수방위를 000°로 하여 좌우현쪽으로 각각 180° 또는 90°까지 측정하는데 주로 견시보고를 할 때 아주 편리하게 사용된다.","c":"항해·해도","x":"상대방위는 자기 배의 선수를 000도로 놓고 시계 방향으로 360도까지 재는 방위로 견시 보고에 편리합니다. '우현 30도 방향에 물표'처럼 배를 기준으로 말하면 조타 중에도 곧바로 알아들을 수 있기 때문입니다. 진방위는 진북, 나침방위는 나북을 기준으로 하므로 기준선이 다르다는 점에서 구분됩니다."},{"i":214,"q":"요트가 범주 중 충돌을 피하기 위한 요령으로 옳지 않은 것은?","o":["두 요트가 서로 다른 방향에서 바람을 받는 경우, 좌현에서 바람을 받는 요트가 피항한다.","두 요트가 같은 방향에서 바람을 받으며 오버랩 된 경우, 풍상 쪽 요트가 피항한다.","두 요트가 각각 풍상과 풍하로 만나는 경우, 풍상 쪽으로 향하는 요트가 피항한다.","범주 중인 요트와 동력선이 마주 보고 항해할 경우, 요트가 피항한다."],"a":3,"e":"범주 중인 요트와 동력선이 마주보고 항해할 경우, 동력선이 피항해야 하며, 요트는 우선권을 갖는다.","c":"범주·조종","t":"new","x":"범주 중인 요트와 동력선이 마주 보고 만나면 동력선이 피해야 합니다. 동력선은 기관으로 방향과 속도를 자유롭게 바꿀 수 있는 반면 범선은 바람에 의존하기 때문입니다. 요트끼리 만났을 때는 좌현에서 바람을 받는 배가 피하고, 오버랩 상태에서는 풍상 쪽 배가 피하며, 풍상으로 향하는 배가 풍하로 가는 배에 진로를 내줍니다."},{"i":215,"q":"편차(Variation)은 어디에서 찾아볼 수 있는가?","o":["등대표","자차표","해도의 나침도 중앙","해도 표제"],"a":2,"e":"편차는 해도의 나침도 중앙에 기재되어 있다.","c":"항해·해도","x":"편차는 진북과 자북이 이루는 각으로 장소와 연도에 따라 달라지며, 해도의 나침도 중앙에 그 해역의 편차와 연차(매년 변화량)가 적혀 있습니다. 그래서 오래된 해도를 쓸 때는 연차를 반영해 보정해야 합니다. 자차는 선체의 철재 때문에 생기는 오차로 배마다 다르며 자차표에서 찾는다는 점과 구분해 두세요."},{"i":216,"q":"요트에서 식품을 보관할 때 가장 중요한 환경 조건은?","o":["고온 다습","저온 건조","직사광선","밀폐된 공간"],"a":1,"e":"저온 건조한 환경은 식품 부패를 방지하는데 가장 적합하다.","c":"항해·해도","t":"new","x":"식품 부패는 미생물이 번식하며 일어나는데, 미생물은 따뜻하고 습한 곳에서 빠르게 늘어납니다. 따라서 온도를 낮추고 습기를 없앤 저온 건조 환경이 보관에 가장 유리합니다. 밀폐만 해 두고 온도가 높으면 오히려 내부에 습기가 차 부패가 빨라지고, 직사광선은 온도를 올려 변질을 촉진합니다. 요트에서는 선실 하부의 서늘한 공간을 활용합니다."},{"i":217,"q":"요트의 항법에 대한 설명으로 옳지 않은 것은?","o":["지문항법은 지형물을 이용해 요트의 위치를 실시간 파악하고 항해하는 것이다.","천문항법은 나침의 방위에 평균속도를 계산하여 해도에서 위치를 파악하는 방법이다.","전파항법은 GPS에 내장된 전자해도에 표시되는 위치를 이용하는 방법으로 GPS를 정확히 이해하고 사용해야 한다.","교차방위법은 명확한 물표를 2~3개 이상 선정하고 그 물표를 지나는 교차점을 선위로 정하는 방법이다."],"a":1,"e":"천문항법은 천체의 방위와 수평선 상의 고도를 육분의로 측정하고 천측력 표로 계산하여 요트의 위치를 확인","c":"항해·해도","t":"new","x":"천문항법은 육분의로 천체의 고도와 방위를 재고 천측력으로 계산해 위치를 구하는 방법입니다. 나침의 방위와 평균 속도로 위치를 추정하는 것은 추측항법의 설명이므로 보기 2가 틀렸습니다. 지문항법은 지형물로 위치를 확인하고, 전파항법은 GPS 등 전파 장비를 쓰며, 교차방위법은 물표 두세 개의 방위선 교점을 선위로 삼는 방법입니다."},{"i":218,"q":"통항이 곤란한 좁은 수로 등에 설치하며, 중시선 효과에 의해 선박을 안전항로로 인도하는 항로표지는?","o":["등부표","도등","부등","임시등"],"a":1,"e":"","c":"항해·해도","x":"도등은 좁은 수로처럼 통항이 곤란한 곳에서 앞뒤 높이를 달리해 두 개의 등을 설치한 표지입니다. 두 등이 하나로 겹쳐 보이는 선(중시선) 위를 따라가면 안전한 항로를 지나게 됩니다. 등부표는 해상에 띄운 부표, 지향등은 특정 방향만 다른 색으로 비추는 등이라 방식이 다릅니다. '중시선'이라는 단어가 나오면 도등입니다."},{"i":219,"q":"요트가 바람을 받아 진행할 때 풍상으로 가장 효율적인 각도는?","o":["0°","45°","90°","135°"],"a":1,"e":"항해하는 요트의 방향과 바람의 방향이 직각을 이루는 45°는 요트가 바람을 받아 가장 효율적으로 항해할 수 있는 각도","c":"범주·조종","t":"new","x":"요트는 바람을 정면으로 받고는 나아갈 수 없어 풍축을 기준으로 좌우 약 45도가 풍상으로 갈 수 있는 한계 각도입니다. 이보다 더 바람 쪽으로 올리면 노고존에 들어가 돛이 펄럭이고, 너무 벌리면 목적지까지 거리가 늘어납니다. 그래서 45도 안팎을 유지하며 태킹을 반복하는 것이 풍상 항해의 기본입니다."},{"i":220,"q":"해도에 기입된 선위(선박의 위치)에 꼭 기록하여야 할 사항은?","o":["관측시간","속력","침로","거리"],"a":0,"e":"해도에 선박의 위치를 구한 후 반드시 관측시간을 기입해야 한다.","c":"항해·해도","x":"선위는 그 시각의 위치일 뿐이므로 관측시간을 함께 적지 않으면 나중에 아무 의미가 없습니다. 시간을 적어 두어야 다음 선위와 비교해 실제 속력과 침로, 조류의 영향을 계산하고 추측위치를 낼 수 있습니다. 그래서 해도에 선위를 기입할 때는 반드시 관측시간을 병기하는 것이 원칙이며, 속력이나 침로는 항해일지에 기록합니다."},{"i":221,"q":"요트에서 식품을 냉장 보관할 때 가장 적절한 온도는?","o":["0℃ 이하","1~4℃","5~10℃","10℃ 이상"],"a":1,"e":"1~4℃는 식품 부패를 최소화하며, 냉장 보관에 적합한 온도 범위이다.","c":"안전·응급","t":"new","x":"냉장 보관의 표준 온도대는 1~4도입니다. 이 범위에서는 대부분의 부패균 번식이 크게 느려지면서도 식품이 얼지 않아 조직이 상하지 않습니다. 0도 이하로 내려가면 냉동이 되어 해동 시 품질이 떨어지고, 5도를 넘어가면 세균 증식이 빨라집니다. 요트의 냉장 설비는 전력 사정에 따라 온도가 흔들리기 쉬우므로 주기적으로 확인해야 합니다."},{"i":222,"q":"레이더로 측정할 수 없는 것은?","o":["거리","풍속","방위","위치"],"a":1,"e":"","c":"항해·해도","x":"레이더는 전파를 쏘아 물표에 반사되어 돌아오는 시간으로 거리를, 안테나가 향한 방향으로 방위를 알아냅니다. 거리와 방위를 알면 자기 위치도 구할 수 있습니다. 그러나 바람은 전파를 반사하지 않으므로 풍속은 레이더로 측정할 수 없고, 풍향풍속계로 따로 재야 합니다. 레이더가 '무엇을 알려 주는 장비인가'를 묻는 기본 문제입니다."},{"i":223,"q":"레이더의 허상 중 간접반사에 의한 거짓상의 요인은?","o":["측엽","대형선","거울면","연돌, 마스트"],"a":3,"e":"스캐너에서 발사된 전파가 굴뚝이나 마스트 등의 선체 구조물에 부딪히고 반사하여 스캐너에 돌아올 때 생긴다.","c":"안전·응급","x":"간접반사는 스캐너에서 나간 전파가 굴뚝이나 마스트 같은 자기 배의 구조물에 부딪혀 반사된 뒤 물표에 갔다 돌아올 때 생기는 거짓상입니다. 그래서 원인은 연돌과 마스트 같은 선체 구조물입니다. 측엽은 사이드로브에 의한 거짓상, 거울면은 매끈한 면에서의 반사, 대형선은 다중반사의 원인이므로 서로 구분해야 합니다."},{"i":224,"q":"(\n① ), (\n② )에 들어갈 내용으로 가장 옳게 짝지어진 것은? “요트 항해장비 중에서 대지속력은 (\n① ),대수속력은 (\n② )를 이용하여 확인할 수 있다.”","o":["① 항법 컴퓨터 ② 경사계","① GPS ② 풍향풍속계","① GPS ② 수차 회전수","① 레이다 ② 경사계"],"a":2,"e":"","c":"항해·해도","x":"대지속력은 지면(해저)을 기준으로 실제로 이동한 속력이므로 위성으로 위치 변화를 재는 GPS로 확인합니다. 대수속력은 물을 기준으로 한 속력이라 물살에 돌아가는 수차(임펠러)의 회전수를 재는 선속계로 확인합니다. 조류가 있으면 두 값이 달라지고, 그 차이가 바로 조류의 영향입니다. GPS는 대지, 수차는 대수로 짝지어 외우세요."},{"i":225,"q":"정규 해도가 간행되기 이전에 임시조치로 간행되는 해도로서, 해도 앞에 “P\"라는 기호가 붙여진 해도는?","o":["개정판 해도","잡용 해도","잠정판 해도","신판 해도"],"a":2,"e":"해도의 종류 1) 항해도 2) 잡용 해도 3) 수로특수도 4) Loran 해도 5) Decca 해도 6) 잠정판 해도 7) 전자 해도로 구분된다. 잠정판 해도(Provisional chart)는 정규 해도가 간행되기 이전에 임시조치로 간행된 해도를 말한다. 해도의 번호 앞에 (P)라는 약자를 붙여서 구별","c":"항해·해도","x":"잠정판 해도는 정규 해도가 나오기 전에 임시로 발행하는 해도로 도면 앞에 P(Provisional) 기호가 붙습니다. 측량 자료가 완전하지 않을 수 있으므로 사용할 때 주의가 필요합니다. 신판은 새로 만든 해도, 개판은 원판을 새로 만들어 발행한 것, 재판은 원판을 조금 손질해 다시 찍은 것이라 각각 성격이 다릅니다."},{"i":226,"q":"IALA 해상부표식에 대한 설명으로 가장 옳지 않은 것은?","o":["우리나라는 미국, 일본, 필리핀 등과 함께 B방식을 채택하고 있다.","B방식에서 좌현표지는 홍색이며 가항수역은 오른쪽이다.","측방표지는 항해자가 항, 강, 하구, 기타 수로에 접근할 때 취하는 일반적인 방향을 기준으로 한다.","우현표지의 위치는 항로의 오른쪽 한계에 있고 암초, 침선 등 장애물이 표지보다 오른쪽에 존재한다."],"a":1,"e":"IALA 해상부표식은 좌현측이 홍색인 측방식과 방위식을 병용하는 A방식과 우현측 홍색인 측방식과 방위식을 병용하는 B방식으로 구분되며, 우리나라는 B방식을 채택하고 있다.","c":"항해·해도","x":"우리나라가 채택한 B방식에서 좌현표지는 녹색이고 그 오른쪽이 가항수역입니다. 따라서 '좌현표지는 홍색'이라고 적은 보기가 틀렸습니다. B방식은 미국·일본·필리핀 등과 같으며 우현표지가 홍색입니다. 측방표지의 좌우는 항이나 하구에 접근할 때, 즉 입항 방향을 기준으로 정한다는 점도 함께 기억해야 합니다."},{"i":227,"q":"요트의 접안 요령에 대한 설명으로 옳지 않은 것은?","o":["크루(Crew)은 계류장에 들어가기 전에 스키퍼(Skipper)에게 입항 준비를 지시한다.","크루(Crew)은 선체 보호를 위해 요트가 계류장에 닿는 정확한 위치에 펜더를 설치하고 계류줄을 잡고 대기한다.","스키퍼(Skipper)는 요트와 계류장의 각도를 30~40도가 확보되면 속도를 줄인 후 미속으로 접안 한다.","스키퍼(Skipper)는 계류장에 미속으로 접안시키고 크루(Crew)은 계류줄을 정확하게 클리트에 고정한다."],"a":0,"e":"스키퍼(Skipper)는 계류장에 들어가기 전에 크루(Crew)에게 입항 준비 지시, 승조원은 펜더를 선체 보호위치에 설치, 요트가 계류장과 30~40도 정도 확보되면 미속으로 접안한다. 승조원은 선수미 계류줄을 클리트에 고정한다.","c":"범주·조종","t":"new","x":"입항 준비 지시는 배 전체를 지휘하는 스키퍼가 크루에게 내리는 것이지 그 반대가 아닙니다. 따라서 크루가 스키퍼에게 지시한다는 서술이 틀렸습니다. 정상적인 순서는 스키퍼의 지시 → 크루의 펜더 설치와 계류줄 준비 → 계류장과 30~40도 각도에서 감속 후 미속 접안 → 계류줄을 클리트에 고정입니다."},{"i":228,"q":"다음은 무엇을 설명하는 것인가? 협수로를 통과할 때, 출·입항할 때에는 선위측정을 자주하거나 예정 침로를 유지하기가 어려운 경우가 많다. 이런 장소에 접근할 때에는 미리 해도를 보고 뚜렷한 물표의 방위, 거리, 수평 협각 등에 의해 항로 부근에 있는 위험물을 피하기 위한 위험예방선을 그어야 한다.","o":["이안거리","경계선","피험선","안전선"],"a":2,"e":"","c":"항해·해도","x":"피험선은 협수로 통과나 출입항처럼 선위를 자주 구하기 어려운 곳에서, 위험물에 다가가지 않도록 미리 해도 위에 그어 두는 위험예방선입니다. 뚜렷한 물표의 방위선, 일정 거리의 원, 수평협각 등을 이용해 긋습니다. 이안거리는 해안에서 떨어진 거리, 경계선은 일정 수심을 잇는 등심선을 뜻하므로 개념이 다릅니다."},{"i":229,"q":"GMDSS란?","o":["전세계 해상조난 및 안전통신 제도","연안조난통신 제도","통항분리제도","해상교통분석 제도"],"a":0,"e":"","c":"통신","x":"GMDSS는 Global Maritime Distress and Safety System, 즉 전 세계 해상조난 및 안전 통신 제도입니다. 조난 선박이 어느 해역에 있든 위성과 지상 무선망을 통해 자동으로 조난 경보가 전달되도록 만든 국제 체계입니다. DSC, EPIRB, SART, NAVTEX 같은 장비들이 모두 이 제도 안에서 역할을 나눠 맡고 있다는 점까지 연결해 두면 통신 문제 전체가 정리됩니다."},{"i":230,"q":"초단파(VHF) 채널 중에서 긴급통신 채널은?","o":["채널 10","채널 12","채널 16","채널 20"],"a":2,"e":"","c":"통신","x":"VHF 채널 16(156.8MHz)은 조난·긴급·안전 통신과 호출에 쓰도록 국제적으로 지정된 채널입니다. 항해 중에는 이 채널을 계속 청취하다가 조난 호출이 있으면 응답하고, 일반 교신은 다른 작업 채널로 옮겨서 합니다. 채널 16을 잡담으로 점유하면 안 된다는 원칙도 함께 출제되니 '16은 비워 둔다'로 기억하세요."},{"i":231,"q":"무선전화에 의한 조난신호는?","o":["SECURITY","SOS","PAN-PAN","MAYDAY"],"a":3,"e":"","c":"통신","x":"무선전화로 보내는 조난신호는 MAYDAY이며 세 번 반복해 송신합니다. PAN-PAN은 조난보다 한 단계 낮은 긴급신호, SECURITE(시큐리테)는 항행 안전에 관한 안전신호입니다. SOS는 무선전신(모스부호)에서 쓰던 조난신호라 무선전화 신호가 아닙니다. 조난-긴급-안전을 MAYDAY-PAN PAN-SECURITE 순서로 외워 두세요."},{"i":232,"q":"기류에 의한 조난신호는?","o":["AB기","NC기","SO기","HG기"],"a":1,"e":"","c":"통신","x":"국제신호기로 조난을 표시할 때는 N기와 C기를 위아래로 함께 게양합니다. 이 NC기 조합이 '본선은 조난 중이며 즉시 원조가 필요하다'는 뜻입니다. 다른 보기의 조합은 실제 조난신호로 쓰이지 않습니다. 기류신호 외에 낙하산 신호, 발연부 신호, 팔을 벌려 위아래로 흔드는 동작도 모두 인정되는 조난신호라는 점을 함께 알아 두세요."},{"i":233,"q":"선체가 공기와 물의 경계면에서 운동할 때 발생하는 저항은?","o":["공기저항","마찰저항","조와저항","조파저항"],"a":3,"e":"조파저항은 파도를 만드는 저항이다.","c":"요트·의장","x":"조파저항은 선체가 공기와 물의 경계면, 즉 수면에서 움직이며 파도를 만들어 낼 때 그 파도를 만드는 데 에너지를 빼앗기며 생기는 저항입니다. 속력이 빨라질수록 급격히 커져 고속 항해의 한계를 만듭니다. 마찰저항은 선체 표면과 물의 마찰, 조와저항은 선미 뒤에 생기는 소용돌이, 공기저항은 수면 위 구조물이 받는 저항이라 원인이 다릅니다."},{"i":234,"q":"항해 중 예상 침로와 실제 침로가 다를 경우 가장 먼저 확인해야 할 요소는?","o":["나침반 오차","GPS 수신 상태","바람의 방향","조류의 세기"],"a":3,"e":"조류는 침로에 직접적인 영향을 주며, 예상과 실제 침로 차이를 유발할 수 있다.","c":"항해·해도","t":"new","x":"예상 침로와 실제 항적이 어긋나는 가장 흔한 원인은 조류입니다. 조류는 배 전체를 물과 함께 옆으로 밀어내기 때문에, 나침반이 정확해도 실제 지나온 자취는 옆으로 치우칩니다. 특히 협수로나 조차가 큰 해역에서 영향이 큽니다. 조류의 방향과 세기를 확인해 침로를 미리 수정하는 것을 유압차 수정이라고 합니다."},{"i":235,"q":"레이더 스캐너(scanner)를 회전시키는 주된 이유는?","o":["모든 방향의 물표를 영상으로 나타내기 위해","발사 전파의 지향성을 높이기 위해","반사 전파의 수신감도를 좋게 하기 위해","레이더 전파의 물체 반사를 돕기 위해"],"a":0,"e":"","c":"항해·해도","x":"레이더 안테나(스캐너)는 아주 좁은 폭의 전파를 한 방향으로 쏩니다. 그래서 안테나를 계속 회전시켜야 배 주위 360도 전 방향의 물표를 차례로 훑어 화면에 그려 낼 수 있습니다. 지향성을 높이거나 수신감도를 좋게 하는 것은 안테나의 형상과 회로가 담당하는 일이지 회전의 목적이 아닙니다. '회전=전 방향 탐지'로 이해하면 됩니다."},{"i":236,"q":"선박의 항해와 인명의 안전에 위급한 상황이 발생한 경우, 특히 언어적 장애가 있을 때 기타 신호 방법과 수단을 규정하고 있는 특수서지는?","o":["등대표","조석표","천측력","국제신호서"],"a":3,"e":"국제신호서는 각종 통신수단으로 선박, 항공기 또는 육상과의 통신에 사용하는 통신코드가 수록되어 있다.","c":"항해·해도","x":"국제신호서는 언어가 통하지 않는 선박 사이에서도 뜻을 주고받을 수 있도록 기류·발광·음향·무선 신호의 규칙과 코드를 정리해 둔 특수 수로서지입니다. 조난이나 인명 위급 상황에서 쓰는 신호도 여기에 규정되어 있습니다. 등대표는 등화 정보, 조석표는 조석 시각, 천측력은 천문항법 계산 자료를 담은 책이라 목적이 다릅니다."},{"i":237,"q":"두 물표 간의 거리가 10해리이고, 항주하는데 소요된 시간은 30분이었다. 외력의 영향이 없다면 이 배의 속력은?","o":["5노트","10노트","15노트","20노트"],"a":3,"e":"10해리 ÷ 0.5시간 = 20노트","c":"항해·해도","x":"속력은 거리를 시간으로 나눈 값이며, 30분은 0.5시간입니다. 따라서 10해리 ÷ 0.5시간 = 20노트가 됩니다. 노트는 1시간에 몇 해리를 가는가를 나타내는 단위이므로 분 단위 시간은 반드시 시간으로 바꿔 계산해야 합니다. 거리·속력·시간 중 두 값을 주고 나머지를 묻는 문제는 숫자만 바뀌어 반복 출제됩니다."},{"i":238,"q":"로프결색법 중 링이나 말뚝에 줄을 고정시킬 때 사용하며 주로 지브세일에 조종줄을 연결할 때 사용 하는 방법은?","o":["리프노트","시트밴드","바우라인","9자매듭"],"a":2,"e":"","c":"요트·의장","x":"바우라인은 로프 끝에 조여들지 않는 고리를 만들어 링이나 말뚝에 걸어 고정하는 매듭으로, 지브(집) 세일에 시트를 연결할 때 흔히 씁니다. 하중을 받아도 고리가 좁아지지 않고, 힘을 뺀 뒤에는 쉽게 풀리는 것이 장점입니다. 리프노트는 돛을 줄여 묶을 때, 9자매듭은 로프 끝이 빠지지 않게 할 때 쓰므로 용도가 다릅니다."},{"i":239,"q":"풍상에서 요트가 바람을 받아 항해할 때 가장 안정적인 방향 전환 방법은?","o":["러닝(Running)","태킹(Tacking)","자이빙(Gybing)","리핑(Reefing)"],"a":1,"e":"태킹은 바람을 측면에서 받아 안정적으로 항해할 수 있는 범주 방식이다.","c":"범주·조종","t":"new","x":"풍상으로 나아가는 중에 방향을 바꿀 때는 태킹이 안정적입니다. 선수가 바람을 가로지르는 동안 돛이 힘을 잃었다가 반대편에서 다시 차오르므로 붐이 천천히 넘어가기 때문입니다. 반대로 자이빙은 뒤에서 바람을 받은 상태로 붐이 급격히 반대편으로 넘어가 사람과 장비가 다칠 위험이 커, 강풍에서는 특히 조심해야 합니다."},{"i":240,"q":"콕크 핏(Cockpit)에 대한 다음의 설명 중 가장 옳은 것을 고르시오.","o":["코크 핏은 요트의 돛대 앞쪽 갑판머리를 뜻한다.","코크 핏으로 고이는 물은 배수구가 없어 배수가 곤란하다.","요트는 콕크 핏에서 휠 또는 키(Tiller)에 의해서 조종된다.","코크 핏은 요트 갑판에서 가장 위험한 장소 중 하나이다."],"a":2,"e":"‘코크 핏’은 휠(Wheel) 또는 키(Tiller)에 의해 조종되며, 요트에서 가장 중요한 활동공간이며, 갑판에서 가장 안전한 공간이다. 특히 ‘코크 핏’으로 고이는 물은 큰 배수구를 통해 스스로 배수된다.","c":"요트·의장","x":"콕핏은 휠이나 틸러로 배를 조종하는 공간이자 항해 중 승선자가 가장 오래 머무는 활동의 중심입니다. 갑판보다 낮게 파여 있어 몸이 안쪽에 들어가 있으므로 오히려 가장 안전한 공간이며, 파도나 비로 물이 고이면 큰 배수구로 스스로 빠지도록 설계되어 있습니다. 돛대 앞쪽 갑판은 포어덱이라 부릅니다."},{"i":241,"q":"메인세일을 리핑(Reefing)하였을 때 클루(Clew)의 위치와 붐(Boom)과의 가장 이상적인 각도는?","o":["15˚","30˚","45˚","90˚"],"a":2,"e":"‘리핑’이란 강풍에 요트를 안정시키기 위해 돛의 면적을 줄이는 것이다.","c":"요트·의장","x":"리핑으로 돛을 줄인 뒤에는 클루가 붐과 약 45도를 이루도록 당겨 고정하는 것이 이상적입니다. 이 각도가 되어야 줄어든 돛의 리치와 풋에 장력이 고르게 걸려 돛 모양이 유지되고, 주름이 잡혀 힘이 한쪽으로 몰리는 일을 막을 수 있습니다. 각도가 지나치게 크거나 작으면 돛이 늘어지거나 천이 상하게 됩니다."},{"i":242,"q":"선박에서 주로 사용되는 자기 컴퍼스는?","o":["건식","액체식","기계식","진동식"],"a":1,"e":"","c":"항해·해도","x":"선박에서 실제로 쓰는 자기 컴퍼스는 카드를 액체에 담근 액체식입니다. 파도와 진동이 끊이지 않는 해상에서 카드의 흔들림을 빠르게 가라앉혀야 방위를 읽을 수 있기 때문입니다. 건식은 진동에 취약해 육상 계기 등 제한적으로만 쓰입니다. 액체식은 안정성이 좋은 대신 건식보다 예민함이 떨어진다는 점이 함께 출제됩니다."},{"i":243,"q":"범주에 대한 설명이다. ( )안의 알맞은 단어로 묶은 것은? 바람 쪽으로 요트가 돌아가는 것을 ( )이라 하고, 반대로 바람으로부터 멀어지면 ( )라고 한다.","o":["① 러핑(Luffing) ② 리웨이(Leeway)","① 러핑(Luffing) ② 베어링 어웨이(Bearing away)","① 런닝(Running) ② 리웨이(Leeway)","① 런닝(Running) ② 베어링 어웨이(Bearing away)"],"a":1,"e":"","c":"범주·조종","x":"러핑은 선수를 바람 쪽(풍상)으로 올리는 조작이고, 베어링 어웨이는 반대로 바람에서 멀어지도록 선수를 풍하로 내리는 조작입니다. 러핑을 계속하면 돛이 펄럭이는 노고존에 들어가고, 베어링 어웨이를 계속하면 러닝 자세가 됩니다. 리웨이는 배가 옆으로 밀리는 횡류, 러닝은 뒤에서 바람을 받는 범주 상태라 조작 용어가 아닙니다."},{"i":244,"q":"다음 중 요트에서 식품을 장기 보관할 때 가장 적절한 방법은?","o":["진공 포장","냉동 보관","실온 보관","유리병 저장"],"a":0,"e":"진공 포장은 산소를 차단하여 부패를 늦추고 장기 보관에 적합하다.","c":"범주·조종","t":"new","x":"진공 포장은 산소를 제거해 산화와 호기성 세균의 번식을 억제하므로, 냉장 설비가 넉넉하지 않은 요트에서 장기 보관에 가장 유리합니다. 부피도 줄어 좁은 수납 공간에 유리합니다. 냉동은 전력이 계속 필요하고, 실온 보관은 부패가 빠르며, 유리병은 흔들리는 배에서 깨질 위험이 있습니다."},{"i":245,"q":"위험물이 많은 연안을 항해하거나 조종 성능에 제한을 받는 상태에서 항해할 때 선정해야 하는 가장 적합한 항로는?","o":["해안선과 평행한 항로","우회항로","추천항로","이안항로"],"a":1,"e":"다소 우회하더라도 안전한 항로인 우회항로를 이용한다.","c":"범주·조종","x":"위험물이 많은 연안이나 조종 성능에 제약이 있는 상태에서는 거리가 늘더라도 위험 요소에서 멀리 떨어지는 우회항로를 택합니다. 항해에서는 최단 거리보다 여유 수심과 피항 공간을 확보하는 쪽이 우선이기 때문입니다. 추천항로는 생소한 해역에서 따르는 표준 항로, 이안항로는 해안에서 일정 거리를 두는 항로라 상황이 다릅니다."},{"i":246,"q":"선박에서 사용하는 해묘(sea anchor)의 용도로 가장 옳은 것은?","o":["좁은 수로에서 회두시 사용","부두에서 이안시 이용","충돌 시 충돌완화에 이용","표류시 풍랑을 선수로부터 받기 위하여 사용"],"a":3,"e":"","c":"범주·조종","x":"해묘(시 앵커)는 물속에 펼쳐 저항을 만드는 낙하산 모양의 장비로, 바닥에 박히는 닻과 달리 표류 중인 배의 자세를 잡아 줍니다. 선수에서 흘려 두면 배가 풍랑을 선수로 받도록 유지되어 옆으로 누워 전복될 위험이 줄고 표류 속도도 늦춰집니다. 황천 조선이나 기관 고장 시 대응 장비로 함께 출제됩니다."},{"i":247,"q":"요트 항해 중 침로를 변경할 때 가장 적절한 절차는?","o":["주변 선박을 확인 후 급격히 변경한다.","주변 선박을 확인 후 천천히 변경한다.","돛을 모두 접고 급격히 변경한다.","속도를 높여 작은 각도로 변경한다."],"a":1,"e":"침로 변경 시 주변 선박을 확인하고 천천히 안전하게 조종한다.","c":"요트·의장","t":"new","x":"침로 변경은 주위 선박을 확인한 뒤 충분히 여유를 두고 천천히 해야 합니다. 급격한 변침은 상대 선박이 내 의도를 읽지 못하게 만들어 오히려 충돌 위험을 키우고, 요트에서는 돛의 힘이 급변해 배가 크게 기울 수 있습니다. 해상교통안전법도 피항 동작은 상대가 알아볼 수 있을 만큼 뚜렷하게, 그러나 여유 있게 하도록 정하고 있습니다."},{"i":248,"q":"요트 항해 중 바람의 방향이 갑자기 바뀔 때 가장 먼저 해야 할 조치는?","o":["침로를 유지한다.","돛을 조정한다.","속도를 높인다.","키를 고정한다."],"a":1,"e":"바람 방향 변화 시 돛을 조정하여 안정적인 범주를 유지해야 한다.","c":"범주·조종","t":"new","x":"바람의 방향이 갑자기 바뀌면 돛이 받는 각도가 어긋나 추진력이 사라지거나 반대로 과도한 힘이 걸립니다. 그래서 가장 먼저 시트를 당기거나 풀어 돛의 트림을 새 풍향에 맞춰야 합니다. 텔테일을 보며 조정하면 정확합니다. 조정 없이 침로만 유지하면 돛이 펄럭이거나 급격히 기울어 조종이 어려워집니다."},{"i":249,"q":"황천 범주 시 설명으로 옳지 않은 것은?","o":["현측으로 파도를 받는 경우 선체에 큰 동요 또는 위험이 따를 수 있으므로 파도 정면 방향의 약 70도 각도로 운항한다.","바람이 너무 세계 불거나 요트에 부하가 많이 걸릴 때 메인 세일의 면적을 줄이는 리핑(Reefing)을 한다.","요트의 표류를 막고 선수가 맞바람을 받게하기 위하여 씨앵커(Sea Anchor)를 활용한다.","파도와 바람이 거센 경우 신속하게 돛을 접고, 기관을 이용하여 선미로 바람을 받으며 신속히 항으로 이동한다."],"a":3,"e":"바람이 거센 경우 선미 쪽에서 바람을 받으며 신속히 이동하는 것은 위험하다.","c":"기관·전기","t":"new","x":"선미로 바람과 파도를 받으며 달리면 뒤에서 밀려온 파도에 선미가 들리면서 배가 파도 방향으로 휘둘리는 브로칭이 일어나기 쉽고, 심하면 전복으로 이어집니다. 그래서 거센 상황에서 '신속히 항으로 이동하겠다'며 선미로 바람을 받는 것은 위험합니다. 파도를 뱃머리 쪽 비스듬한 각도로 받으며 속력을 줄이고, 리핑과 씨앵커로 자세를 유지하는 것이 원칙입니다."},{"i":250,"q":"선박을 임의로 좌주 시키고자 하는 경우 가장 적당하지 않은 곳은?","o":["암석이 없는 경사가 급한 해안","굴곡이 없고 지반이 딱딱한 해안","강한 조류나 너울이 없고 외해로 노출되어 있지 않은 해안","조수간만의 차가 큰 해안"],"a":0,"e":"임의 좌주의 적합한 장소는 암석이 없는 경사가 완만한 해안이 좋다. 또한 굴곡이 없고 지반이 딱딱하며 강한 조류나 너울이 없고 외해로 노출되어 있지 않는 해안이 좋다. 그리고 간만의 차가 커야 간조 시 선체의 손상부를 수리하기 좋다.","c":"요트·의장","x":"임의좌주에 적당한 곳은 경사가 완만하고 굴곡이 없으며 지반이 단단한 해안입니다. 경사가 급하면 선체가 안정되게 얹히지 못하고 미끄러지거나 옆으로 넘어질 수 있어 부적당합니다. 또 강한 조류나 너울이 없고 외해에 노출되지 않아야 하며, 조차가 커야 간조 때 드러난 선체의 손상부를 수리할 수 있습니다."},{"i":251,"q":"2포인트(점)는 몇 도인가?","o":["11° 15’","22° 30’","33° 45’","45°"],"a":1,"e":"360°는 32포인트이다.","c":"요트·의장","x":"나침반의 눈금을 32등분한 것이 포인트이며, 360도를 32로 나누면 1포인트는 11도 15분입니다. 따라서 2포인트는 그 두 배인 22도 30분입니다. 4포인트가 45도, 8포인트가 90도(정횡)라는 값도 함께 외워 두면 계산 없이 바로 답할 수 있습니다. 옛 항해 용어이지만 각도 환산 문제로 꾸준히 출제됩니다."},{"i":252,"q":"해도의 나침도 중앙에 있는 Var. 6°W에서 Var. 은 무엇을 의미하는가?","o":["자차","조류","편차","유향"],"a":2,"e":"진북(진자오선)과 자북(자기자오선)이 일치하지 않아 생긴 교각을 편차(Variation)라고 하며, 장소와 시간의 경과에 따라 변하게 된다.","c":"항해·해도","x":"Var.는 Variation, 곧 편차의 약자로 진북과 자북이 이루는 각을 뜻합니다. Var. 6°W는 자북이 진북보다 서쪽으로 6도 치우쳐 있다는 의미입니다. 편차는 장소와 연도에 따라 변하므로 나침도에는 기준 연도와 연간 변화량이 함께 적혀 있습니다. 자차는 배마다 다른 값이라 해도가 아니라 자차표에서 찾습니다."},{"i":253,"q":"생소한 해역을 처음 항행 시 가장 적합한 항로는?","o":["해안선과 평행한 항로","우회항로","추천항로","이안항로"],"a":2,"e":"생소한 해역을 항행할 때에는 특별한 이유가 없는 한 추천항로를 따르도록 한다.","c":"항해·해도","x":"추천항로는 수로 당국이 안전을 확인해 해도에 표시해 둔 항로입니다. 생소한 해역에서는 수심과 장애물, 조류의 성질을 알기 어려우므로 특별한 사정이 없는 한 이 항로를 따르는 것이 가장 안전합니다. 우회항로는 위험물을 피하려 일부러 돌아가는 항로, 이안항로는 해안에서 일정 거리를 유지하는 항로라 선택 상황이 다릅니다."},{"i":254,"q":"항해 중 침로를 결정할 때 가장 먼저 고려해야 할 요소는?","o":["바람의 방향","조류의 흐름","목적지의 위치","선원의 피로도"],"a":2,"e":"침로는 목적지를 기준으로 설정되며, 이후 바람과 조류를 고려한다.","c":"항해·해도","t":"new","x":"침로는 결국 '어디로 갈 것인가'에서 출발하므로 목적지의 위치를 먼저 정하고, 그 방향을 해도 위에 그은 다음에 바람과 조류의 영향을 반영해 실제 조타할 침로를 보정합니다. 순서를 뒤집어 바람에 끌려 침로를 정하면 목적지에서 점점 멀어지게 됩니다. 계획 침로를 긋고 편류를 수정하는 것이 항해계획의 기본 절차입니다."},{"i":255,"q":"90°식 방위표시법에서 N 60°W는 360° 방위표시법으로는 몇 도인가?","o":["220°","240°","300°","320°"],"a":2,"e":"90°식은 북과 남을 기준으로 하여 동서로 각각 90°까지 측정한다.","c":"항해·해도","x":"90도식 방위표시는 북이나 남을 기준으로 동서 방향으로 얼마나 벌어졌는지를 나타냅니다. N60°W는 북에서 서쪽으로 60도 돌아간 방향이므로, 북을 000도로 잡고 시계방향으로 재는 360도식으로는 360 − 60 = 300도가 됩니다. S45°E라면 180 − 45 = 135도가 되는 식이라, 기준이 북인지 남인지, 동인지 서인지만 확인하면 됩니다."},{"i":256,"q":"다음은 어떤 등화를 설명하는 것인가? 풍랑이나 조류 때문에 등부표를 설치하기 어려운 위험한 지점으로부터 가까운 곳에 등대가 있는 경우 그 등대에 강력한 투광기를 설치하여 그 위험구역을 유색등으로 표시하는 등화","o":["도등","지향등","임시등","조사등"],"a":3,"e":"","c":"항해·해도","x":"조사등은 등부표를 설치하기 어려운 위험 지점 가까이의 등대에 강력한 투광기를 달아, 그 위험구역을 유색등으로 비춰 표시하는 등화입니다. 위험한 곳 자체를 빛으로 지목해 준다는 점이 특징입니다. 도등은 항로를 유도하고, 지향등은 안전한 통과 방향만 다른 색으로 보여 주며, 임시등은 필요할 때 한시적으로 설치하는 등이라 목적이 다릅니다."},{"i":257,"q":"세일링 크루저에서 바우맨(bowman)의 역할 중 가장 부적당한 것은?","o":["마스터(mast)보다 앞 선두의 일 전반을 담당","견시","집 세일 시트(Jib Sail Sheet)의 당김","집(jib)의 스커트"],"a":2,"e":"‘바우맨’이란 요트의 제일 앞 좌석에 앉은 조수를 말하며, 집 세일 시트의 조절은 ‘크루’(crew)의 역할이다.","c":"범주·조종","x":"바우맨은 마스트보다 앞쪽, 곧 선수부에서 이루어지는 일을 맡습니다. 스피니커 폴을 다루고, 집 세일이 물에 빨려 들어가지 않게 걷어 올리는 스커트 작업을 하며, 전방 견시를 담당합니다. 반면 집 세일 시트를 당기고 늦추는 트림 작업은 콕핏 쪽 크루의 역할이라 바우맨의 임무로 보기 어렵습니다."},{"i":258,"q":"보기의 ( ) 안에 적합한 용어를 고르시오. 킬(Keel)의 두 가지 목적은 ( )에 저항하기 위한 목적과 요트의 안전성을 제공하기 위함이다.","o":["리웨이(Leeway)","메인 세일(Main sail)","맞바람(Head wind)","순풍(Sailing down wind)"],"a":0,"e":"‘킬’의 목적 두 가지는 조류에 의해 밀리는 힘(Leeway)에 저항하고 요트의 안전성을 제공하기 위함이며, ‘키(Rudder)’의 기본적인 역할은 요트의 조종과 리웨이 현상에 저항하는 킬을 돕는 것이다.","c":"요트·의장","x":"킬의 목적은 두 가지입니다. 하나는 바람에 밀려 옆으로 흘러가는 리웨이에 저항해 배가 옆으로 밀리지 않게 하는 것이고, 다른 하나는 무게로 무게중심을 낮춰 복원성을 확보하는 것입니다. 러더는 방향을 바꾸는 동시에 이 횡류 저항을 보조합니다. 킬이 없으면 요트는 앞으로 나아가지 못하고 옆으로만 밀립니다."},{"i":259,"q":"섬광등에 대한 설명으로 가장 옳은 것은?","o":["빛을 비추는 시간이 꺼져 있는 시간보다 길다.","꺼지지 않고 일정한 광력으로 비추는 등이다.","빛을 비추는 시간이 꺼져 있는 시간보다 짧다.","2가지 색을 교대로 비추는 등이다."],"a":2,"e":"한 주기 동안 한 번 섬광을 내는 것으로 빛을 비추는 순간이 꺼져 있는 순간보다 짧다. 우리나라 등대의 대부분을 차지하고 있다.","c":"항해·해도","x":"섬광등은 한 주기 동안 빛나는 시간이 꺼져 있는 시간보다 짧은 등입니다. 짧게 번쩍이고 오래 쉬는 형태라 주변의 다른 불빛과 잘 구별되며, 우리나라 등대의 대부분이 이 방식을 씁니다. 반대로 켜져 있는 시간이 더 긴 것은 명암등, 꺼지지 않는 것은 부동등, 두 색을 번갈아 내는 것은 호광등입니다."},{"i":260,"q":"항로, 암초, 항행 금지 구역 등을 표시하는 지점에 고정 설치하여 선박의 좌초를 예방하고, 항로의 안내를 위하여 설치하는 표지는?","o":["등대","등주","등부표","등표"],"a":3,"e":"","c":"항해·해도","x":"등표는 암초나 항행 금지 구역처럼 위험한 지점에 고정 구조물로 세워 좌초를 막고 항로를 안내하는 표지입니다. 등부표는 물에 띄워 닻으로 붙잡아 두므로 조류에 따라 다소 움직이고, 등대는 육상이나 섬에 세운 대형 구조물, 등주는 기둥 형태의 소형 표지입니다. '고정 설치'와 '위험 지점'이라는 표현이 등표의 단서입니다."},{"i":261,"q":"크루저 요트에서 태풍용 세일에 대한 다음의 설명으로 가장 옳지 않은 것은?","o":["태풍용 세일은 통상적인 세일보다 더 크고 단단하다.","태풍용 세일은 보강재와 솔기 박음질이 추가된 무거운 범포로 제조된다","작은 악천후용 세일인 트라이 세일은 메인 세일의 자리에 설치한다.","작은 태풍용 세일인 소톰짚은 트라이세일 앞쪽에 설치한다."],"a":0,"e":"통상적인 세일보다 더 작다.","c":"요트·의장","x":"태풍용 세일은 강풍에서 배를 통제하기 위한 돛이므로 통상적인 세일보다 훨씬 작게 만듭니다. 대신 강한 힘을 견디도록 두꺼운 범포에 보강재를 넣고 솔기를 여러 번 박습니다. 메인세일 자리에 다는 작은 악천후용 돛이 트라이 세일이고, 그 앞쪽에 다는 작은 헤드세일이 스톰 집입니다. '크고 단단하다'는 표현에서 크다는 부분이 틀렸습니다."},{"i":262,"q":"닻줄의 2절(2 shackle)의 길이는?","o":["18m","25m","36m","50m"],"a":3,"e":"1 shackle은 25m이다.","c":"요트·의장","x":"닻줄의 길이는 절(shackle) 단위로 세며 1절은 25미터입니다. 따라서 2절은 50미터가 됩니다. 투묘할 때 필요한 닻줄 길이를 수심의 3~5배로 계산한 뒤, 실제로 몇 절을 내어 줄지 환산하는 데 쓰이는 값입니다. 25미터라는 기준만 정확히 기억하면 절 수를 바꿔 출제해도 바로 계산할 수 있습니다."},{"i":263,"q":"다음 보기의 각도로 알맞은 것은? 태킹(tacking)에서 요트가 풍축을 중심으로 달릴 수 있는 각도는 ‘풍상향의 각도 약 ( )’이다.","o":["45도","60도","90도","120도"],"a":0,"e":"","c":"범주·조종","x":"요트는 바람을 정면으로 받고는 나아갈 수 없어, 풍축을 기준으로 좌우 약 45도 안쪽은 돛이 펄럭이는 노고존(데드존)이 됩니다. 따라서 풍상으로 갈 때는 약 45도 각도를 유지하며 태킹을 반복해 지그재그로 올라갑니다. 이 45도가 요트 범주의 기본 수치이며, 노고존의 범위(약 90도)와 함께 출제됩니다."},{"i":264,"q":"‘본선에 의료지원을 바람’을 나타내는 국제신호기는?","o":["O기","B기","A기","W기"],"a":3,"e":"","c":"기상·해양","x":"국제신호기 W기는 '본선은 의료 지원을 필요로 한다'는 뜻입니다. 한 글자만 걸어도 뜻이 통하는 단독기 신호로, 조난까지는 아니지만 인명 관련 도움을 요청할 때 씁니다. O기는 사람이 물에 빠졌음, B기는 위험물 하역 중, A기는 잠수부가 있으니 저속으로 통과하라는 뜻이므로 각각 구분해 외워야 합니다."},{"i":265,"q":"레이더의 성능으로 등거리에 인접한 두 물표가 지시기 화면상에 두 개의 점으로 분리 표시되기 위한 최소한의 방위차를 무엇이라 하는가?","o":["거리분해능","방위분해능","최소탐지거리","최대탐지거리"],"a":1,"e":"","c":"항해·해도","x":"방위분해능은 같은 거리에 있는 두 물표를 화면에서 별개의 점으로 구분해 내는 최소한의 방위차를 말하며, 안테나가 쏘는 전파 빔의 폭이 좁을수록 좋아집니다. 반면 같은 방위에 앞뒤로 놓인 두 물표를 구분하는 능력은 거리분해능이고, 이는 펄스 폭이 짧을수록 좋아집니다. '방위=빔 폭, 거리=펄스 폭'으로 짝지으면 헷갈리지 않습니다."},{"i":266,"q":"북반구 기준 태풍의 중심에서 벗어나기 위한 다음의 설명 중 잘못된 설명을 고르시오.","o":["풍향이 우전(R)하면 요트는 우측(R) 위험반원에 위치한다.","풍향이 좌전(L)하면 요트는 우측(L) 가항반원에 위치한다.","바람을 향해 서서 정면을 0도로 보고 오른팔이 112도 쪽으로 가리키는 방향에 태풍의 중심이 있다.","요트가 위험사분원에 있다면 포트택으로 크로즈호올로 달아난다."],"a":3,"e":"(RRR법칙) 풍향이 우전(R), 선박은 우측(R)반원, 바람을 우현(R)선수로 받으며 태풍중심에서 멀어진다. (LLS법칙) 풍향이 좌전(L), 선박은 좌측(L)반원, 바람을 우현선미(S)로 받으며 피한다. 요트가 풍향이 우전(R)하는 위험사 분원(R)에 있다면 스타보드택(R)으로 크로즈호올로 달아난다.","c":"기상·해양","x":"위험반원에 있을 때는 바람을 우현 선수로 받으며 스타보드 택으로 클로스홀드 항해를 해서 태풍 중심에서 멀어져야 합니다. 포트택으로 달아나면 오히려 진로 앞쪽으로 끌려들 수 있습니다. 북반구에서 풍향이 시계방향으로 바뀌면 위험반원(RRR), 반시계방향이면 가항반원(LLS)이라는 판정법과 함께 기억해야 합니다."},{"i":267,"q":"요트가 바람을 거슬러 올라가는 풍상범주의 원리를 적용한 것은?","o":["베르누이의 정리","뉴튼의 제3법칙","카오스 이론","토리첼리의 법칙"],"a":0,"e":"‘베르누이의 정리’란 유체의 유속과 압력의 관계를 수량적으로 나타낸 법칙으로 유체의 속력이 증가하면 압력이 낮아지고 반대로 감소하면 압력이 높아진다.","c":"범주·조종","x":"요트가 바람을 거슬러 올라갈 수 있는 것은 돛이 날개처럼 작동하기 때문입니다. 볼록한 풍하면을 지나는 공기는 속도가 빨라져 압력이 낮아지고, 그 압력차가 돛을 풍하 쪽으로 빨아들이는 양력을 만듭니다. 이 유속과 압력의 관계를 설명하는 것이 베르누이의 정리입니다. 킬이 옆으로 밀리는 성분을 막아 주어 전진력만 남게 됩니다."},{"i":268,"q":"레이더의 거짓상 중에, 레이더 전파가 자선과 물표의 사이를 2회 이상 왕복하여서, 하나의 영상이 화면상에 여러 개로 나타나는 것을 무엇이라 하는가?","o":["다중반사","간접반사","거울면반사","사이드로브"],"a":0,"e":"","c":"항해·해도","x":"다중반사는 전파가 자기 배와 물표 사이를 두 번 이상 왕복하면서, 같은 물표가 같은 방위의 일정 간격으로 여러 개 늘어서 보이는 거짓상입니다. 가까이 있는 큰 배와 나란히 있을 때 잘 생깁니다. 간접반사는 마스트 같은 구조물에 부딪혀 생기고, 사이드로브는 주 빔 옆으로 새는 전파 때문에 생기므로 발생 원리가 다릅니다."},{"i":269,"q":"스피니커 클루(Spinnaker clew) 대한 설명으로 가장 옳은 것은?","o":["스피니커 폴(Spinnaker pole)의 끝에 고정되는 부분이다.","핼려드(Halyard)에 매달려 있는 부분이다.","시트(Sheet)로만 묶여 있는 부분이다.","붐(Boom)의 아웃트 홀(Out haul)에 묶여 있는 부분이다."],"a":2,"e":"","c":"요트·의장","x":"스피니커는 폴로 지지하는 쪽 아래 모서리(택)를 스피니커 폴 끝에 고정하고, 위 꼭짓점(헤드)은 핼야드에 매답니다. 나머지 한쪽 아래 모서리인 클루는 폴에 고정하지 않고 시트만으로 잡아 당겨 조절합니다. 그래서 클루는 '시트로만 묶여 있는 부분'이 됩니다. 세 꼭짓점의 연결 방식을 그림으로 그려 보면 확실히 구분됩니다."},{"i":270,"q":"임의좌주(임시좌주, Beaching)를 위해 적당한 해안을 선정할 때 유의사항으로 가장 옳은 것은?","o":["해저가 모래나 자갈로 구성된 곳은 피한다.","경사가 완만하고 육지로 둘러싸인 곳을 선택한다","임의좌주 후 자력 이초를 고려하여 강한 조류가 있는 곳을 선택한다.","임의좌주 후 자력 이초에 도움을 줄 수 있도록 갯벌로 된 곳을 선택한다."],"a":1,"e":"임의 좌주에 적당한 해안은, 해저가 모래나 자갈로 구성되어 있는 곳이 좋다.","c":"기상·해양","x":"임의좌주는 침수 등으로 배를 잃을 위험이 있을 때 일부러 얕은 곳에 올려 침몰을 막는 조치입니다. 그러려면 파도와 조류의 영향이 적어야 하므로 경사가 완만하고 육지로 둘러싸여 잔잔한 곳을 고릅니다. 저질은 모래나 자갈이 좋고, 연한 펄은 선체가 박혀 스스로 빠져나오기 어려워 피합니다. 강한 조류가 있는 곳도 선체 손상 위험이 커 부적합합니다."},{"i":271,"q":"항행 중인 선박이 해저로 발사한 음파와 반사되어 수신한 음파는 주파수차가 생기고 이것은 선박의 속도에 비례한다는 원리를 이용한 항해계기는 무엇인가?","o":["측심의","시진의","도플러 선속계","전자식 선속계"],"a":2,"e":"","c":"항해·해도","x":"도플러 선속계는 해저로 초음파를 쏘고 되돌아온 음파의 주파수 변화(도플러 효과)를 재는 장비입니다. 주파수 차이가 배의 속도에 비례한다는 원리를 이용하며, 해저를 기준으로 삼으므로 대지속력을 얻을 수 있습니다. 측심의는 수심을 재는 장비이고, 전자식 선속계는 물의 흐름으로 유도되는 전압을 이용하므로 원리가 다릅니다."},{"i":272,"q":"윤활유(엔진오일, 기어오일 등)에 해수가 혼합되었을 때의 색깔은?","o":["적색","회색","검정색","푸른색"],"a":1,"e":"","c":"기관·전기","x":"윤활유에 해수가 섞이면 기름과 물이 유화되어 우유를 탄 듯한 회백색으로 변하고 점도가 떨어집니다. 오일 게이지나 드레인에서 이런 색이 보이면 냉각수 계통이나 오일쿨러에서 물이 새어 들어온 것이므로 즉시 운전을 멈추고 원인을 찾아야 합니다. 그대로 돌리면 유막이 깨져 베어링이 손상됩니다."},{"i":273,"q":"레이더의 최소탐지거리에 영향을 주는 요소가 아닌 것은?","o":["펄스의 길이","해면 반사파","수직 빔폭","스캐너 회전율"],"a":3,"e":"스캐너 회전율은 최대탐지거리와 관계있다. 안테나의 회전이 느릴수록 탐지거리는 향상된다.","c":"항해·해도","x":"최소탐지거리는 바로 곁의 물표를 얼마나 가까이서 볼 수 있는가로, 송신 펄스의 길이, 해면 반사파로 인한 화면 중심부의 잡음, 수직 빔폭 같은 요소에 좌우됩니다. 반면 스캐너 회전율은 화면 갱신 속도와 최대탐지거리에 관계되는 요소라 최소탐지거리와는 관련이 없습니다. 펄스가 짧을수록 최소탐지거리가 좋아진다는 점도 함께 기억하세요."},{"i":274,"q":"맞바람을 받으며 태킹(Tacking)을 반복하면서 지그재그로 범주하는 상태는?","o":["Reefing","Sailing","Beating","Luffing"],"a":2,"e":"","c":"범주·조종","x":"비팅(beating)은 맞바람 속에서 태킹을 반복하며 지그재그로 풍상까지 거슬러 올라가는 범주 상태를 말합니다. 요트가 바람을 정면으로는 갈 수 없기 때문에 생기는 항해 방식입니다. 리핑은 돛을 줄이는 작업, 러핑은 선수를 풍상으로 올리는 조작이라 각각 다른 개념입니다. 범주 상태 이름(비팅·리칭·러닝)을 바람 각도와 함께 정리해 두세요."},{"i":275,"q":"바람의 방향에 대해서 요트를 90도 방향으로 전진시키는 상태는?","o":["윈드 어빔(wind abeam)","윈드워드(windward)","웨더헬름(weather helm)","웨더사이드(weather side)"],"a":0,"e":"","c":"기상·해양","x":"윈드 어빔은 바람을 정횡, 즉 배의 옆구리 90도 방향에서 받으며 나아가는 상태입니다. 이 각도에서는 추진력이 크고 속도도 잘 나와 범주가 안정적입니다. 윈드워드는 바람이 불어오는 쪽을 가리키는 위치 용어, 웨더헬름은 선수가 풍상으로 밀리려는 성질, 웨더사이드는 풍상 쪽 현을 뜻하므로 범주 상태를 나타내는 말이 아닙니다."},{"i":276,"q":"장거리 요트항해 시 1일 1인당 식수기준은?","o":["약 0.5리터","약 1.0리터","약 1.8리터","약 2.8리터"],"a":2,"e":"","c":"기상·해양","t":"chg","x":"장거리 항해에서는 사람이 하루에 마셔야 할 물을 1인당 약 1.8리터로 잡아 식수를 준비합니다. 여기에 조리용과 예비분을 더해 항해 일수를 곱해 실을 물의 양을 계산합니다. 바닷물은 염분 때문에 마시면 오히려 탈수가 심해지므로 절대 대체할 수 없고, 조난에 대비해 별도의 비상 식수를 나눠 보관하는 것이 원칙입니다."},{"i":277,"q":"무어링라인(mooring line) 중 요트의 선수에서 좌우로 묶어 결박하는 것은?","o":["bow line","stern line","spring line","heaving line"],"a":0,"e":"","c":"기상·해양","x":"바우라인(선수줄)은 선수에서 부두 쪽으로 내어 좌우로 묶는 계류줄로, 배의 앞부분이 밀려나지 않게 잡아 줍니다. 스턴라인은 선미를 잡는 줄, 스프링라인은 앞뒤 방향으로 비스듬히 걸어 배가 전후로 움직이는 것을 막는 줄입니다. 히빙라인은 굵은 계류줄을 건네기 위해 먼저 던지는 가는 줄이라 성격이 다릅니다."},{"i":278,"q":"계류설비 중 계선줄을 고정하는 기둥이 2개인 것은?","o":["비트","볼라드","클리트","캡스턴"],"a":1,"e":"","c":"범주·조종","x":"볼라드는 계선줄을 걸도록 부두에 세운 기둥으로, 기둥이 두 개 나란히 선 형태를 말합니다. 비트는 기둥이 하나인 형태이고, 클리트는 양쪽으로 뿔이 난 작은 밧줄걸이, 캡스턴은 줄을 감아 당기는 회전 기계라 기능이 다릅니다. 기둥 개수(비트 1개, 볼라드 2개)로 구분하는 문제가 반복 출제됩니다."},{"i":279,"q":"로프 결색법 중 ‘비트나 볼라드에 로프를 묶을 때’ 사용하는 방법은?","o":["클러브","스퀘어","피셔맨","바우라인"],"a":0,"e":"스퀘어는 ‘2개의 굵기가 같은 로프를 연결’, 피셔맨은 ‘앵커에 로프를 묶을 때’, 바우라인은 ‘올가미가 조여 지지 않게 고정매듭을 사용할 때’의 방법이다.","c":"범주·조종","x":"클러브 히치(클러브)는 기둥에 두 번 감아 스스로 물리게 하는 매듭으로, 비트나 볼라드에 로프를 빠르게 묶을 때 씁니다. 스퀘어는 굵기가 같은 두 로프를 잇는 매듭, 피셔맨은 앵커에 로프를 묶는 매듭, 바우라인은 조여들지 않는 고리를 만드는 매듭이라 각각 쓰임이 다릅니다. 용도별로 짝지어 외우는 것이 효율적입니다."},{"i":280,"q":"겉보기 풍향의 변화를 감지하여 타자루를 조작하는 요트의 자동 조종장치는 무엇인가?","o":["자동조타장치(Auto pilot)","풍향날개(Wind vane)","수차선속계(Log)","나침반(Compass)"],"a":1,"e":"요트가 바람을 받는 방향에 풍향날개를 고정시키고, 겉보기 바람이 변했을 때 그 풍향 차이를 감지하여 원래의 겉보기 바람에 알맞게 자동으로 침로를 변경하는 장치","c":"범주·조종","x":"풍향날개(윈드 베인)는 겉보기 바람의 방향에 맞춰 고정해 두면, 바람 방향이 달라졌을 때 그 차이를 감지해 타자루를 움직여 원래의 바람 각도를 유지하도록 침로를 자동으로 수정하는 장치입니다. 전기를 거의 쓰지 않아 장거리 항해에 유리합니다. 오토파일럿이 나침반 침로를 기준으로 삼는 것과 달리, 풍향을 기준으로 삼는다는 점이 차이입니다."},{"i":281,"q":"요트가 바람을 정면으로 받을 때 범주가 불가능한 각도는?","o":["25°","50°","65°","90°"],"a":0,"e":"일반적으로 바람이 불어오는 방향을 0도로 볼 때 0도에서부터 약 45도 ‘크로스홀드’까지를 노고존에 해당 하며 범주가 불가능하다. 약 45도(크로스 홀드), 약 60도(크로스 리치), 90도(빔리치)는 범주가 가능하다.","c":"범주·조종","t":"new","x":"바람이 불어오는 방향을 0도로 볼 때 좌우 약 45도 안쪽은 돛이 힘을 받지 못하고 펄럭이는 노고존이라 범주가 불가능합니다. 따라서 25도는 범주할 수 없는 각도입니다. 약 45도가 클로스홀드, 약 60도가 클로스리치, 90도가 빔리치로 모두 범주가 가능합니다. 45도라는 경계선을 기준으로 판단하면 됩니다."},{"i":282,"q":"스피니커를 전개할 때 딥 폴 자이브(Deep pole gybe) 설명으로 가장 옳은 것은?","o":["풍하쪽의 스핀폴(Spin pole)을 반대쪽으로 신속히 전개하는 것","풍상쪽의 스핀폴을 풍하 쪽으로 전개하는 것","Mast쪽의 스핀폴을 높이 올려 반대쪽 폴의 끝을 포스테이(Forestay) 아래로 기어들게 하는 것","포스테이쪽의 스핀폴을 높이 올려 반대쪽 줄의 끝을 마스트 아래쪽으로 기어들게 하는 것"],"a":2,"e":"‘딥 폴 자이브’(dip pole gybe)’는 폴의 끝을 낮추어서 반대편 포스테이를 비키는 방식의 자이브","c":"범주·조종","x":"딥 폴 자이브는 스피니커 폴의 안쪽 끝을 마스트에서 높이 올리고 바깥쪽 끝은 낮춰, 그 끝이 포어스테이 아래를 지나 반대편으로 넘어가게 하는 자이빙 방식입니다. 폴을 떼어 내지 않고 방향만 바꿀 수 있어 큰 요트에서 널리 쓰입니다. 폴 끝이 지나갈 공간을 만들기 위해 높이를 조절한다는 점이 핵심입니다."},{"i":283,"q":"선박이 파도를 선미로부터 받으며 항주할 때, 선체 중앙이 파도의 마루나 파도의 오르막 파면에 위치하면 급격한 선수 동요에 의해 선체는 파도와 평행하게 놓여 위험에 처하는 수가 있다. 이러한 현상을 무엇이라고 하는가?","o":["레이싱","슬래밍","브로칭","러칭"],"a":2,"e":"브로칭 시 선박은 선미파를 받지 않도록 침로를 유지하고, 속력을 감소하여 조종해야 한다.","c":"요트·의장","x":"브로칭은 파도를 선미에서 받으며 달릴 때, 파도의 마루나 오르막 면에 선체가 놓이면서 선수가 급격히 돌아 배가 파도와 나란히 눕는 현상입니다. 이 상태에서 다음 파도를 옆구리로 받으면 전복으로 이어질 수 있습니다. 예방하려면 속력을 줄이고 파도를 정선미로 받지 않도록 침로를 비스듬히 유지해야 합니다."},{"i":284,"q":"요트의 범주 중 풍압의 중심(CE)을 바르게 설명한 것은?","o":["풍축을 중심으로 정확하게 바람이 45˚ 집 세일에 받는 상태","런닝 상태로 범주 후 바람 방향이 바뀌는 상태","돛 전체에 받는 바람 총 합력의 중심점","클로스 홀드(close hauled) 상태에서 풍축을 중심으로 바람이 바뀌는 상태"],"a":2,"e":"보통 한 장의 삼각돛에서는 각 변의 중심에서 다른 꼭지점까지 이은 교차점이 풍압중심(CE, center of effect)이 된다.","c":"범주·조종","x":"풍압중심(CE)은 돛 전체가 받는 바람의 힘을 하나로 모았을 때 그 합력이 작용하는 점입니다. 삼각돛에서는 각 변의 중점과 마주 보는 꼭짓점을 이은 선들이 만나는 점으로 잡습니다. 이 점이 물속 횡저항중심(CLR)보다 뒤에 있으면 웨더헬름, 앞에 있으면 리헬름이 생기므로 배의 조타 균형을 이해하는 기준이 됩니다."},{"i":285,"q":"세일링 요트의 범주 용어에 대한 설명으로 가장 옳은 것은?","o":["Port side는 요트가 계류장에 맞닿아 계류하는 현측을 말한다.","Starboard tack은 우현에서 바람을 받아 좌현에 세일이 펴진 상태이다.","Starboard side는 좌현에서 바람을 받아 우현에 세일이 펴진 상태이다.","요트의 선수를 Stern, 선미를 Bow라고 부른다."],"a":1,"e":"요트의 선수(Bow), 선미(Stern), 우현 현측(Starbord side), 좌현 현측(Port side)로 부르고, Starborad Tack 또는 Port Tack은 범주 중 바람을 받는 현측에 따라 Tack이 결정된다.","c":"범주·조종","x":"스타보드 택은 우현에서 바람을 받는 상태로, 이때 돛은 반대쪽인 좌현으로 펼쳐집니다. 즉 택의 이름은 돛이 있는 쪽이 아니라 바람을 받는 쪽으로 정합니다. 선수는 바우, 선미는 스턴, 좌현은 포트사이드, 우현은 스타보드사이드입니다. 두 배가 만났을 때 스타보드 택이 우선한다는 규칙과 함께 기억해 두세요."},{"i":286,"q":"요트가 2시간 동안 18해리를 달리는 속력은?","o":["2노트","4노트","6노트","9노트"],"a":3,"e":"","c":"항해·해도","x":"속력(노트)은 1시간에 몇 해리를 가는가를 뜻하므로, 이동 거리를 걸린 시간으로 나누면 됩니다. 18해리를 2시간에 갔다면 18 ÷ 2 = 9, 즉 9노트입니다. 1노트는 1시간에 1해리(약 1,852m)를 가는 속력이라는 정의만 알고 있으면 숫자만 바꿔 나와도 바로 계산할 수 있습니다."},{"i":287,"q":"우리나라에서 항내로 진입 시 왼쪽 방파제 끝에 세운 등대의 등색은?","o":["녹색","홍색","백색","황색"],"a":0,"e":"우리나라가 채택하고 있는 국제해상부표방식은 B방식으로 좌현부표와 등화의 색이 녹색이다.","c":"항해·해도","x":"우리나라는 국제해상부표식 B지역이므로 입항 기준으로 좌현표지가 녹색, 우현표지가 홍색입니다. 따라서 항내로 들어갈 때 왼쪽 방파제 끝에 세운 등대의 등색은 녹색입니다. 색을 기억할 때는 '들어갈 때 왼쪽이 녹색'이라는 한 문장으로 정리하고, A지역은 색이 반대라는 점을 덧붙여 두면 됩니다."},{"i":288,"q":"야간에 인천항 입항 중 전방에 홍색 부표가 보였다. 올바른 항행법은?","o":["부표의 왼편으로 간다.","부표의 오른편으로 간다.","부표만 안전하게 피해간다.","부표의 정중앙으로 간다."],"a":0,"e":"우리나라가 채택하고 있는 국제해상부표방식은 B방식으로, 홍색은 우현부표로 부표의 좌측으로 항행한다.","c":"항해·해도","x":"홍색 부표는 B지역인 우리나라에서 우현표지이므로, 입항할 때 그 부표를 오른쪽에 두고 지나가야 합니다. 즉 배는 부표의 왼편으로 항행합니다. 반대로 녹색 좌현표지는 왼쪽에 두고 지나갑니다. 부표를 어느 쪽에 두는가와 배가 어느 편으로 가는가가 반대로 표현된다는 점 때문에 헷갈리기 쉬우니 그림으로 정리해 두세요."},{"i":289,"q":"부표의 위치가 항로 좌측 한계에 있고, 이 부표의 우측에 가항수역이 있다는 것을 의미하는 측방표지는?","o":["우현 표지","좌현 표지","우항로 우선 표지","좌항로 우선 표지"],"a":1,"e":"","c":"항해·해도","x":"좌현표지는 부표 자체가 항로의 왼쪽 한계에 놓여 있고, 그 오른쪽이 배가 지나갈 수 있는 가항수역임을 알려 줍니다. 우리나라가 속한 B지역에서는 입항 기준으로 좌현표지가 녹색, 우현표지가 홍색입니다. 항로 우선 표지는 항로가 갈라지는 곳에서 주된 항로가 어느 쪽인지 알려 주는 표지라 역할이 다릅니다."},{"i":290,"q":"‘풍상 항해’에 대한 보기의 설명 중 올바른 것으로만 짝지어진 것은?\n① (빔리치) 세일의 트림을 유지하면 가장 빠른 속도를 얻는다.\n② (빔리치) 러프나 텔테일을 보면서 양 세일은 늦추면 브로드리치에서 빔리치로 전환된다.\n③ (클로스리치) 클로스리치에서는 항상 풍상으로의 힘을 받는다.\n④ (데드 런) 좌우에 롤링이 느껴지고 정 앞으로 바람을 받는 자세이다. .\n⑤ (클로스 홀드) 속도가 느려지거나 노 세일존으로 너무 올라가면 지브세일이 펄럭인다.","o":["①, ③, ⑤","②, ③, ⑤","③, ④, ⑤","②, ④, ⑤"],"a":0,"e":"②는 풍하 항해 시의 빔리치 설명이며 양 세일을 늦추면 빔리치에서 브로드리치로 전환된다.\n④도 풍하 항해 시 해당하는 데드 런으로, 정 앞이 아닌 정 뒤로 바람을 받는 자세이다.","c":"범주·조종","x":"풍상 항해에 해당하는 것은 빔리치에서 트림을 유지해 최고 속도를 얻는다는 ①, 클로스리치에서 항상 풍상으로 힘을 받는다는 ③, 클로스홀드에서 너무 올라가면 지브가 펄럭인다는 ⑤입니다. ②는 양 세일을 늦추면 빔리치에서 브로드리치로 가는 풍하 항해 설명이고, ④의 데드 런도 정 뒤에서 바람을 받는 풍하 자세라 풍상 항해가 아닙니다."},{"i":291,"q":"‘풍하 항해’에 대한 보기의 설명 중 올바른 것으로만 짝지어진 것은?\n① (빔리치) 러프나 텔테일을 보면서 양 세일은 당기면 빔리치에서 브로드리치로 전환된다.\n② (트레이닝 런) 돛을 가능한 멀리 풀어주면 브로드리치에서 트레이닝 런으로 바뀐다.\n③ (트레이닝 런) 돛을 너무 풀면 메인 세일이 슈라우드에 부딪히기 때문에 너무 풀면 안 된다.\n④ (트레이닝 런) 돛을 너무 풀더라도 메인 세일과 달리 지브 세일은 제한이 없다.\n⑤ (데드 런) 스키퍼는 풍하로 선원은 풍상의 위치에 자리한다..","o":["①, ②, ③","②, ③, ④","③, ④, ⑤","①, ②, ⑤"],"a":1,"e":"①은 양 세일을 늦추면 빔리치에서 브로드리치로 전환된다.\n⑤는 좌우에 롤링이 느껴지고 정 뒤로 바람을 받는 자세인 ‘데드 런’으로, 스키퍼는 풍상, 선원은 풍하의 위치에 자리한다.","c":"범주·조종","x":"풍하 항해에 해당하는 것은 ②③④입니다. ①은 방향이 반대로 적혀 있어, 양 세일을 당기는 것이 아니라 늦춰야 빔리치에서 브로드리치로 전환됩니다. ⑤의 데드 런은 정 뒤로 바람을 받는 자세이고 이때는 스키퍼가 풍상, 선원이 풍하에 앉아 좌우 균형을 잡습니다. 풍하에서는 돛을 최대한 벌려 바람을 받는다는 원칙으로 판단하면 됩니다."},{"i":292,"q":"포항항에 입항하려 한다. 포항항의 항로표지, 항로의 상황 등 제반사항을 참고하기 위하여 사용하는 수로서지는?","o":["수로도지","조석표","등대표","항로지"],"a":3,"e":"항로지(sailing direction)에는 주요 항만의 항계, 항로, 도선 구간, 검역 사항 등에 관한 내용이 수록되어 있다.","c":"항해·해도","x":"항로지는 특정 항만과 연안의 항계, 항로, 항로표지 상황, 도선 구역, 검역과 입출항 절차 등을 글로 정리해 둔 수로서지입니다. 해도가 보여 주지 못하는 현지 사정을 담고 있어 처음 가는 항구에 들어갈 때 반드시 확인합니다. 등대표는 등화 제원, 조석표는 조석 시각, 수로도지는 해도류 전반을 가리키는 말이라 성격이 다릅니다."},{"i":293,"q":"요트를 현측으로 접안하고자 한다. 진입각도로서 가장 적당한 것은?","o":["계류장과 평행하게","약 20˚~30˚","약 45˚~60˚","직각"],"a":1,"e":"진입각도는 접안하고자 하는 현측과 요트의 선수미 방향이 약 20~30도 정도로 한다.","c":"범주·조종","x":"현측 접안은 계류장과 선수미 방향이 약 20~30도를 이루도록 비스듬히 접근한 뒤, 충분히 감속해 미속으로 붙이는 것이 기본입니다. 각도가 너무 작으면 옆에서 밀리는 힘에 대응하기 어렵고, 너무 크면 선수가 계류장에 부딪힐 위험이 커집니다. 접근 전에 펜더를 정확한 위치에 걸고 계류줄을 준비해 두어야 합니다."},{"i":294,"q":"요트가 범주(세일링)하고 있는 상태는?","o":["시버(shiver) 상태","데드쉽(dead ship) 상태","런닝(running) 상태","노고존(no go zone) 상태"],"a":2,"e":"‘런닝’이란 뒤에서 바람을 받아 범주하는 상태를 말한다.","c":"범주·조종","x":"런닝은 뒤에서 바람을 받으며 돛을 활짝 펴고 달리는 범주 상태입니다. 즉 배가 실제로 세일링을 하고 있는 상태에 해당합니다. 시버는 돛이 힘을 받지 못하고 펄럭이는 상태, 노고존은 바람을 정면으로 받아 나아갈 수 없는 각도 범위, 데드십은 추진력과 조종력을 잃은 상태라 모두 범주 중이라고 볼 수 없습니다."},{"i":295,"q":"대체로 1°마다 점장 되어 있고 장거리 항해계획에 사용되며 원양의 수심, 외방 등대가 기재되어 있는 것은?","o":["항양도","항해도","해안도","총도"],"a":0,"e":"","c":"항해·해도","x":"항양도는 대략 1도마다 점장된 축척이 작은 해도로, 원양의 수심과 먼바다에서도 보이는 주요 등대가 실려 있어 장거리 항해계획을 세울 때 씁니다. 총도는 그보다 더 넓은 지역을 한 장에 담고, 항해도는 육지를 바라보며 항해할 때, 해안도는 연안 항해와 출입항에 쓰는 더 큰 축척의 해도입니다. 축척 순서로 묶어 외우면 됩니다."},{"i":296,"q":"요트가 풍축을 중심으로 풍상으로 거슬러 올라갈 때 필요한 힘은?","o":["풍압","양력","웨더헬름(Weather helm)","리헬름(Lee helm)"],"a":1,"e":"","c":"범주·조종","x":"풍상으로 거슬러 올라갈 때는 돛이 날개처럼 작동해 생기는 양력이 배를 끌어당깁니다. 바람이 돛의 볼록한 면을 지나며 압력이 낮아져 생기는 힘이며, 이 양력을 분해한 성분 중 하나가 전진력이 됩니다. 뒤에서 미는 풍압은 풍하로 달릴 때 주된 힘이라 풍상 범주와는 다릅니다. 웨더헬름과 리헬름은 조타 성질이지 추진력이 아닙니다."},{"i":297,"q":"방위측정기구로 볼 수 없는 것은?","o":["육분의","방위경","방위환","방위반"],"a":0,"e":"육분의(Sextant)는 두 점 사이의 각도를 정밀하게 측정하는 광학기계이며, 천체의 고도나 두 목표의 협각을 측정하는데 사용한다.","c":"항해·해도","x":"방위측정기구는 물표가 어느 방향에 있는지를 재는 도구로 방위경, 방위환, 방위반이 여기에 속합니다. 반면 육분의는 수평선과 천체 사이의 고도나 두 물표 사이의 협각을 재는 광학기기라 각도 측정기이지 방위측정기가 아닙니다. 무엇을 기준으로 무엇을 재는 도구인가로 구분하면 됩니다."},{"i":298,"q":"선수흘수와 선미흘수의 차이를 무엇이라 하는가?","o":["트림","만재흘수선","건현","평균흘수"],"a":0,"e":"","c":"범주·조종","x":"트림은 선수흘수와 선미흘수의 차이를 말하며, 선미가 더 잠기면 선미트림, 선수가 더 잠기면 선수트림이라고 합니다. 트림 상태는 조종성과 속도에 직접 영향을 주므로 승선 인원과 짐의 배치로 조절합니다. 건현은 만재흘수선에서 갑판까지의 높이, 평균흘수는 선수·선미 흘수의 평균이므로 구분해 두세요."},{"i":299,"q":"다음은 무엇을 설명하는 것인가? 요트의 돛이 바람을 받으면 활모양의 단면을 이루는데 그 깊이를 말하는 것이다. 항해 중 바람이 강할수록 작게 하고, 미풍시에는 크게 해야 요트의 추진력을 효과적으로 얻을 수 있다.","o":["캠버(Camber)","트림(Trim)","힐(Heel)","드래프트(draft)"],"a":0,"e":"메인 세일의 추진력을 가장 크게 하기 위해서는 돛의 형태와 위치 및 캠버를 적절히 조절하여야 한다.","c":"범주·조종","x":"캠버는 돛이 바람을 받아 활 모양으로 부풀었을 때 그 깊이를 말합니다. 캠버가 깊으면 큰 힘을 내지만 항력도 커지므로 미풍에서 유리하고, 바람이 강할 때는 아웃홀과 커닝햄, 백스테이로 캠버를 얕게 만들어 힘을 줄이고 안정성을 확보합니다. 트림은 앞뒤 경사, 힐은 좌우 경사를 뜻하는 말이라 대상이 다릅니다."},{"i":300,"q":"해묘(스톰앵커)에 대한 설명으로 가장 옳지 않은 것은?","o":["요트에 해묘 설치 시 선미에 설치하여 파도를 뒤에서 받으며 표류한다.","기상 악화 상태에서 기관 고장 시 전복을 방지하기 위한 목적으로 사용된다.","거친 해상의 구명정과 구명뗏목에서는 표류 중 표류속도를 줄이기 위한 기능을 한다.","해묘는 수중에서 끌림으로서 파랑 방향에 대하여 일정한 선체 방향을 유지하는 기능을 한다."],"a":0,"e":"해묘는 해저에 내리는 닻이 아니라 수중에 투하하는 천 등의 재질로 된 장치로 표류를 억제하는 용도와 기상 악화 시 표류 선박의 전복을 방지하기 위한 목적으로, 선수 방향을 파랑이 오는 방향으로 향하도록 선수에 설치하여 선체 횡 방향에 파랑을 맞아 전복되는 것을 방지한다.","c":"기관·전기","x":"해묘는 반드시 선수 쪽에서 흘려야 합니다. 선수가 파도와 바람이 오는 방향을 향하도록 붙잡아 주어야 배가 옆으로 눕는 것을 막고 표류 속도도 늦출 수 있기 때문입니다. 선미에 설치해 파도를 뒤에서 받으면 브로칭과 침수 위험이 커집니다. 기관 고장 시의 전복 방지, 구명뗏목의 표류 억제도 해묘의 주요 용도입니다."},{"i":301,"q":"범주방법과 바람이 불어오는 방향을 기준으로 한 방향각 연결이 가장 옳지 않은 것은?","o":["크로스 홀드 - 30 ~ 40°","크로스 리치 - 50 ~ 80°","빔 리치 - 80 ~ 120°","브로드 리치 - 120 ~ 150°"],"a":0,"e":"전통 선박들은 바람이 불어오는 정 방향에서 약 60° 정도의 노고존이 형성되었으나 근래는 35~45° 정도의 노고존을 형성하고 있다.","c":"범주·조종","x":"클로스 홀드는 바람이 불어오는 방향으로부터 약 45도 안팎으로 가장 바짝 붙여 올라가는 범주 상태입니다. 30~40도는 노고존에 가까워 돛이 힘을 받지 못하므로 연결이 잘못되었습니다. 이어서 클로스 리치 50~80도, 빔 리치 80~120도, 브로드 리치 120~150도, 러닝 150~180도로 이어진다고 각도표를 통째로 정리해 두면 편합니다."},{"i":302,"q":"투묘 시 닻줄의 길이는 수심의 몇 배가 좋은가?","o":["3 ~ 5배","7 ~ 8배","1 ~ 2배","10배 이상"],"a":0,"e":"","c":"범주·조종","x":"닻이 바닥을 제대로 물려면 닻줄이 바닥과 되도록 평행하게 당겨져야 합니다. 그래서 투묘 시 닻줄은 수심의 3~5배 정도를 내어 주는 것을 기본으로 하며, 바람이 세거나 조류가 강하면 더 길게 늘립니다. 너무 짧게 내면 닻줄이 위로 들려 닻이 끌리게 됩니다. 수심과 조석에 따른 여유까지 계산해야 한다는 점도 함께 기억하세요."},{"i":303,"q":"범주에 사용되는 연결용 도구에 대한 다음의 설명 중 바른 것을 고르시오.","o":["행크(Hank) - 세일의 러프를 마스트나 포어스테이에 연결하는 스프링 장치가 없는 고리","스냅 훅(Snap hook) - 스프링 없이 고정된 형태의 고리","펠리컨 훅(Pelican hook) - 흰지가 없는 훅으로 링이 달린 빗장쇠에 의해 잠그는 장치","초크(Chock) - 닻줄이나 계류줄의 방향을 유도하고 선체 훼손을 막기 위해 갑판에 고정된 부착물"],"a":3,"e":"‘행크’와 ‘스냅 훅’은 스프링 장치가 있는 고리이며, ‘펠리컨 훅’은 힌지(Hinge)가 달린 훅이다. ‘초크’는 줄을 유도하는 장치인 도삭기(導索器)의 영문 명칭이다.","c":"범주·조종","x":"초크는 계류줄이나 닻줄이 지나가는 방향을 잡아 주고 선체 모서리에 쓸려 상하는 것을 막기 위해 갑판에 고정해 둔 도삭기입니다. 행크와 스냅 훅은 스프링이 달린 고리라 '스프링이 없다'는 설명이 틀렸고, 펠리컨 훅은 힌지가 달려 한 번에 풀 수 있는 훅이라 '힌지가 없다'는 설명도 틀렸습니다."},{"i":304,"q":"강풍에 요트를 안정시키기 위해 돛의 면적을 줄이는 것을 무엇이라 하는가?","o":["레이크(Rake)","풀핏(Pulpit)","프리벤터(Preventer)","리핑(Reefing)"],"a":3,"e":"","c":"요트·의장","x":"리핑은 강풍에서 돛의 면적을 줄여 배가 과도하게 기울지 않게 하는 작업입니다. 리프 포인트까지 돛을 내려 접고 그로밋에 리프 로프를 꿰어 묶어 고정합니다. 바람이 세지면 속도를 위해서가 아니라 안정과 조종성을 위해 일찍 줄이는 것이 원칙입니다. 레이크는 돛대의 기울기, 풀핏은 선수 난간, 프리벤터는 붐의 급회전을 막는 줄입니다."},{"i":305,"q":"창조류에서 낙조류로 바뀔 때 물의 수평운동이 일시 정지하는 현상은?","o":["조석","게류","와류","정조"],"a":1,"e":"","c":"기상·해양","x":"게류는 창조류에서 낙조류로(또는 그 반대로) 바뀌는 순간 물의 수평 방향 흐름이 잠시 멈추는 현상입니다. 조류가 약해지는 이 시간대는 좁은 수로 통과에 유리합니다. 정조는 고조나 저조 때 해면의 오르내림, 즉 수직 운동이 멈추는 현상이라 대상이 다릅니다. '수평은 게류, 수직은 정조'로 구분하면 헷갈리지 않습니다."},{"i":306,"q":"요트가 정지된 상태에서 느끼는 바람을 무엇이라 하는가?","o":["하늬바람","참바람","뵌바람","정지바람"],"a":1,"e":"","c":"기상·해양","x":"참바람(진풍)은 요트가 정지한 상태에서 느끼는 실제 바람으로, 자연이 만들어 낸 바람 그 자체입니다. 배가 달리기 시작하면 여기에 배의 속도로 생긴 맞바람이 더해져 뵌바람(겉보기 바람)이 되고, 돛은 항상 이 뵌바람을 기준으로 트림합니다. 참바람·뵌바람·주행풍의 관계를 삼각형으로 그려 이해해 두면 관련 문제가 쉬워집니다."},{"i":307,"q":"요트가 풍상 범주 시 뵌바람과 참바람의 세기는 어떠한가?","o":["뵌바람이 더 세다.","참바람이 더 세다.","세기가 같다.","바람이 없다."],"a":0,"e":"풍상 범주 시 뵌바람은 참바람 보다 더 세게, 풍하 범주 시 더 약하게 느껴진다.","c":"범주·조종","x":"뵌바람(겉보기 바람)은 참바람에 배가 달리면서 생기는 맞바람이 합쳐진 것입니다. 풍상으로 올라갈 때는 배가 바람 쪽으로 나아가므로 두 바람이 더해져 뵌바람이 참바람보다 세게 느껴집니다. 반대로 풍하로 달릴 때는 서로 상쇄되어 약해집니다. 돛은 언제나 뵌바람을 기준으로 트림해야 한다는 점이 실전에서의 핵심입니다."},{"i":308,"q":"각 크루(Crew) 별 역할과 책임으로 가장 옳지 않은 것은?","o":["스키퍼(Skipper) - 정장으로 불리며 선상에서의 최고 책임자","네비게이터(Navigator) - 항해 시 본선의 위치를 알아내고 이후의 코스 판단","바우맨(Bow man) - 마스트보다 앞쪽 갑판에서 작업 담당","헬름즈맨(Helmsman) - 경기의 세밀한 형세에서의 판단을 담당"],"a":3,"e":"전술가(Tactician)은 테이킹이나 자이빙의 시기를 결정하거나 상대 요트의 움직임을 점검하는 등 경기의 세밀한 형세에서의 전술적 판단을 담당한다.","c":"범주·조종","x":"헬름즈맨은 키를 잡고 배를 직접 조종하며 침로와 속도를 유지하는 역할입니다. 경기의 형세를 읽고 태킹이나 자이빙 시점을 정하거나 상대 요트의 움직임을 판단하는 것은 전술가(택티션)의 몫이므로 설명이 뒤바뀌었습니다. 스키퍼는 선상 최고 책임자, 네비게이터는 위치와 코스 판단, 바우맨은 마스트 앞쪽 작업을 맡습니다."},{"i":309,"q":"세일(돛)이 바람을 받는 각도를 확인 및 조정하기 위해 돛에 부착되는 적색과 녹색의 리본을 무엇이라 하는가?","o":["텔 테일(Tell tail)","배튼(Batten)","아웃 하울(Out haul)","피그 테일(Pig tail)"],"a":0,"e":"","c":"요트·의장","x":"텔테일은 돛의 앞뒤에 붙이는 가벼운 실이나 리본으로, 보통 풍상측에 적색, 풍하측에 녹색을 붙여 좌우를 구분합니다. 양쪽이 나란히 뒤로 흐르면 바람을 받는 각도가 알맞은 상태이고, 한쪽이 펄럭이면 시트를 당기거나 풀어 트림을 고쳐야 합니다. 배튼은 돛을 펴 주는 판, 아웃홀은 풋을 당기는 장치라 역할이 다릅니다."},{"i":310,"q":"세일 요트의 범주에 영향을 미치는 기본적인 요소로 알맞게 짝지어진 것은?","o":["조력과 동력","항력과 양력","항력과 동력","조력과 양력"],"a":1,"e":"","c":"범주·조종","x":"돛과 선체에 작용하는 힘은 크게 항력과 양력으로 나뉩니다. 양력은 흐름에 수직으로 생겨 배를 앞으로 끌어 주는 힘의 근원이고, 항력은 흐름 방향으로 생겨 진행을 방해합니다. 범주는 결국 양력을 키우고 항력을 줄이는 조절이며, 돛뿐 아니라 킬과 러더도 물속에서 같은 원리로 작동합니다. 조력이나 동력은 범주의 기본 요소가 아닙니다."},{"i":311,"q":"집(jip)을 이용한 속도변환의 방법으로 가장 간단한 것은?","o":["시트(sheet) 조정","포스테이(fore stay) 장력 조절","리드(lead) 위치 변경","백스테이(back stay) 당김"],"a":0,"e":"시트는 돛을 조절하는 줄이다.","c":"요트·의장","x":"집 세일로 속도를 조절하는 가장 간단한 방법은 시트를 당기거나 풀어 돛의 각도를 바꾸는 것입니다. 손 하나로 즉시 조절할 수 있고 효과도 바로 나타납니다. 포스테이 장력이나 백스테이 조절, 리드 위치 변경은 돛의 형상 자체를 다듬는 세밀한 조정이라 시간이 걸리고 항해 중 수시로 바꾸기 어렵습니다."},{"i":312,"q":"풍상코스에서 풍하코스로 방향을 바꾸는 것을 나타내는 말로 적당한 것은?","o":["러핑(Luffing)","베어링 어웨이(Bearing away)","태킹(Tacking)","리웨이(Leeway)"],"a":1,"e":"‘베어링 어웨이’는 ‘러핑’과 반대로 요트를 풍하측으로 방향을 전환하는 기술이다.","c":"범주·조종","x":"베어링 어웨이는 선수를 바람에서 멀어지는 풍하 쪽으로 내리는 조작입니다. 이때 키는 풍상 쪽으로 당기고 시트는 풀어 돛을 벌려 주어야 합니다. 반대로 풍상으로 올리는 것이 러핑입니다. 태킹과 자이빙은 바람을 가로질러 택을 바꾸는 조작이고, 리웨이는 옆으로 밀리는 현상이라 코스 변경 용어가 아닙니다."},{"i":313,"q":"세일면적이 크고 풍하 바람에서 최대의 스피드를 낼 수 있는 장점을 가지고 있지만 조종이 까다로운 돛(Sail)은?","o":["스피네이커(Spinnaker)","집 세일(Jib sail)","메인 세일(Main sail)","스테이 세일(Stay sail)"],"a":0,"e":"스피네이커(Spinnaker)는 세일면적이 크고 풍하 바람에서 최대의 스피드를 낼 수 있는 장점을 가지고 있지만 조종이 까다로워 크루와 스키퍼의 호흡이 잘 맞아야 범장 할 수 있는 특징이 있다.","c":"범주·조종","x":"스피네이커는 풍하로 달릴 때 쓰는 커다란 풍선 모양의 돛으로, 면적이 커서 최고 속도를 낼 수 있습니다. 다만 폴과 핼야드, 시트, 가이를 동시에 다뤄야 하고 바람이 조금만 어긋나도 무너지듯 접히기 때문에 스키퍼와 크루의 호흡이 맞아야 전개할 수 있습니다. 그래서 조종이 까다로운 돛으로 분류됩니다."},{"i":314,"q":"요트 메인세일의 부분 명칭에 대한 다음의 설명 중 바르지 못한 것은?","o":["뱅(Vang) - 붐과 마스트를 연결하는 로프와 도르레, 또는 봉으로 구성","트레블러(Traveler) - 메인 시트리더를 슬라이딩 시키는 장치이다.","클루(Crew) - 헬리어드가 연결되는 돛의 상단 쪽 모서리","택(Tack) - 돛의 아래 러프와 풋이 만나는 모서리"],"a":2,"e":"클루는 돛의 자유연 쪽 아래의 모서리 부분으로 붐의 끝단과 연결","c":"요트·의장","x":"클루는 돛의 자유연 쪽 아래 모서리로 붐 끝단과 연결되는 부분입니다. 핼야드가 연결되는 위쪽 꼭짓점은 헤드이므로 보기 3의 설명이 잘못되었습니다. 뱅(붐뱅)은 붐이 들리는 것을 눌러 주는 장치, 트레블러는 메인시트의 위치를 좌우로 옮기는 레일, 택은 러프와 풋이 만나는 아래 앞 모서리라는 나머지 설명은 옳습니다."},{"i":315,"q":"원거리 황천 황해 시 범주요령이 아닌 것은?","o":["풍압","양력","리헬름(Leehelm)","리웨이(Leeway)"],"a":0,"e":"풍압(leeway)이란 배가 바람이 불어가는 쪽으로 밀리는 것을 말한다.","c":"범주·조종","x":"풍압(리웨이)은 배가 바람에 밀려 옆으로 흘러가는 '현상'이지, 항해자가 선택해서 쓰는 범주 요령이 아닙니다. 반면 양력을 이용해 나아가고, 리헬름과 웨더헬름 같은 조타 성질을 조절해 배의 균형을 잡는 것은 실제 범주 기술에 해당합니다. 현상과 기술을 섞어 놓은 보기에서 '현상'을 골라내는 문제입니다."},{"i":316,"q":"요트 지브세일(Jib Sail)의 부분 명칭에 대한 설명으로 가장 옳은 것은?","o":["헤드 스테이(Head stay) - 맞파도인 선수 쪽에서의 파도","리치(Leech) - 세일의 헤드에서 택까지의 전변","풋(Foot) - 세일에서 갑판과 평행한 아랫변","지브 시트(Jib sheet) - 지브세일 돛의 전체 면"],"a":2,"e":"헤드 스테이는 돛대를 지지하는 선수 쪽의 와이어, 리치는 세일의 헤드(Head)에서 클루(Crew)까지의 후변 으로, ‘풋(세일의 아랫변)’과 ‘헤드 스테이’가 만나는 모서리를 ‘택’이라고 하며, ‘풋’과 ‘리치’가 만나는 모서 리를 ‘크루’라고 한다. ‘지브 시트’는 ‘지브세일’을 조절하기 위해 사용하는 줄을 말한다.","c":"요트·의장","x":"풋은 세일의 아랫변으로 갑판과 나란한 변입니다. 리치는 헤드에서 클루까지 이어지는 뒤쪽 변이지 헤드에서 택까지가 아니며, 헤드스테이는 선수에서 마스트를 잡아 주는 와이어이지 파도를 뜻하는 말이 아닙니다. 지브 시트는 돛을 당기는 줄이라 돛의 면을 가리키지 않습니다. 변과 꼭짓점, 삭구를 구분하는 문제입니다."},{"i":317,"q":"요트 외부 명칭에 대한 다음의 설명 중 가장 옳지 않은 것을 고르시오.","o":["코밍(Coaming) - 코크핏 주위의 테두리","스윔 래더(Swim ladder) - 선수 정면에 연결된 사다리","내저릿츠(Nazeretts) - 코크핏 둘레의 물품 보관함","토레일(Toerail) - 갑판 가장자리에 설치된 1인치 이하의 낮은 레일"],"a":1,"e":"‘스윔 레더’는 선미 끝단인 트램섬(Transome)에 연결된 사다리","c":"요트·의장","x":"스윔 래더는 물에 들어가거나 물에서 올라올 때 쓰는 사다리로 선미 끝단인 트랜섬에 설치합니다. 선수 정면에 달려 있다는 설명은 틀립니다. 코밍은 코크핏 주위의 테두리로 물이 들어오는 것을 막고, 토레일은 갑판 가장자리의 낮은 레일로 발이 미끄러지지 않게 하며, 내저릿츠는 코크핏 둘레의 보관함입니다."},{"i":318,"q":"요트의 선수가 풍상과 풍하 쪽으로 치우치려는 힘을 각각 무엇이라 하는가?","o":["웨더 헬름 - 리 헬름","시버 - 웨더 헬름","레이팅 - 리 헬름","리 헬름 - 웨더 헬름"],"a":0,"e":"","c":"범주·조종","x":"웨더헬름은 선수가 풍상 쪽으로 올라가려는 성질로, 키를 풍하로 조금 눌러 주어야 직진합니다. 리헬름은 반대로 선수가 풍하로 떨어지려는 성질입니다. 약간의 웨더헬름은 돌풍이 왔을 때 배가 스스로 바람 쪽으로 향해 힘을 흘리므로 안전하다고 보아 오히려 바람직하게 여깁니다. 돛의 전후 균형(밸런스)으로 조절합니다."},{"i":319,"q":"요트가 운항한 수면 위 자취를 무엇이라 하는가?","o":["항적","항로","항해","항행"],"a":0,"e":"","c":"범주·조종","x":"항적은 배가 실제로 지나간 자취, 즉 지나온 경로를 뜻합니다. 항로는 배가 다니도록 정해 둔 길, 항행은 배를 운항하는 행위, 항해는 바다를 건너는 일 전반을 가리키므로 뜻이 서로 다릅니다. GPS 화면에 남는 지나온 선이 항적이라고 생각하면 구분이 쉽습니다."},{"i":320,"q":"크루저 세일링 요트의 경우 복잡한 마스트 상부 구조가 틀어지거나 꼬일 수 있는데 이러한 작업에 가장 필요한 것은 무엇인가?","o":["안전벨트(Safety Belt)","하네스(Harness)","스키퍼 벨트(Skipper Belt)","보슨 체어(Bosun’s chair)"],"a":3,"e":"","c":"안전·응급","x":"보슨 체어는 사람을 앉힌 채 핼야드로 마스트 꼭대기까지 끌어올릴 수 있는 작업용 의자입니다. 상부 삭구가 꼬이거나 등화·풍향계를 손봐야 할 때 이 장비로 올라가 작업합니다. 안전벨트와 하네스는 갑판에서 몸을 라이프라인에 연결해 추락을 막는 장비라 목적이 다릅니다. 마스트 상부 작업이라는 조건이 보슨 체어의 단서입니다."},{"i":321,"q":"국제해상부표식(IALA SYSTEM)에서 우리나라는 무슨 지역인가?","o":["A지역","B지역","C지역","D지역"],"a":1,"e":"","c":"항해·해도","x":"국제해상부표식(IALA)은 세계를 A지역과 B지역으로 나누며, 우리나라는 미국·일본 등과 같은 B지역에 속합니다. B지역에서는 입항 기준으로 우현표지가 홍색, 좌현표지가 녹색입니다. A지역은 색이 정반대이므로 외국에서 항해할 때 주의해야 합니다. 우리나라 표지 색을 묻는 문제와 함께 반드시 세트로 나옵니다."},{"i":322,"q":"항행통보 항 번호 뒤에 표시한 “P”는 무엇을 뜻하는 것인가?","o":["긴급고시","예고고시","일시 관계고시","참고고시"],"a":1,"e":"","c":"항해·해도","x":"항행통보의 항 번호 뒤에 붙는 P는 Preliminary의 약자로 예고고시를 뜻합니다. 앞으로 시행될 변경 사항을 미리 알리는 것이라 확정된 내용이 아닐 수 있습니다. 이런 정보로 만든 해도에도 P가 붙어 임시로 발행된 것임을 나타냅니다. 항행통보는 해도와 수로서지를 최신 상태로 고치는 근거가 된다는 점도 함께 기억하세요."},{"i":323,"q":"해도의 원판이 마멸되거나 현재 사용 중인 해도의 부족을 충족시킬 목적으로 원판을 약간 수정하여 다시 발행하는 것을 무엇이라 하는가?","o":["개판","소개정","보도","재판"],"a":3,"e":"","c":"요트·의장","x":"재판은 원판이 닳거나 해도 재고가 부족할 때 원판을 조금 손질해 다시 찍어 내는 것으로, 해도의 내용 자체가 크게 달라지지는 않습니다. 이에 비해 개판은 측량 결과 등을 반영해 원판을 새로 만들어 발행하는 것이라 판 번호가 바뀝니다. 소개정은 항행통보에 따라 사용자가 직접 해도를 고쳐 넣는 작업입니다."},{"i":324,"q":"요트 항해에서 항해 속도와 다섯 가지 주요 원칙에 대한 보기의 설명 중 올바른 것만 짝지어진 것은?\n① (세일트림) 세일이 바람에 떨리면 그것이 멈출 때까지 조종줄을 풀어준다.\n② (센터보드 위치) 바람쪽 으로 가까이 항해하면 할수록 센터보드를 올려야 한다.\n③ (요트 균형) 바람 세기나 코스가 변하면 승무원들은 요트의 균형을 위해 자리를 이동해야 한다.\n④ (요트 트림) 약한 바람일 때 선수가 약간 내려가고, 강한 바람일 때 그 반대이다.\n⑤ (좋은 항해 코스) 가장 빠른 루트로 항해하는 목적을 위해 항상 코스는 일직선이어야 한다.","o":["①, ⑤","②, ④","③, ④","②, ⑤"],"a":2,"e":"(세일트림) 세일이 바람에 떨리면 조종줄을 당긴다. (센터보드 위치) 바람 쪽으로 향하면 센터보드를 더 밑으로 내 려야한다. (좋은 항해 코스) 풍상으로 항해할 때는 지그재그 코스로 항해해야 하며, 항상 일직선일 필요는 없다.","c":"범주·조종","x":"세일이 바람에 떨리면 시트를 당겨 돛을 조여야 하며 풀면 더 펄럭입니다. 또 풍상으로 향할수록 옆으로 밀리는 힘이 커지므로 센터보드를 더 깊이 내려야 합니다. 두 서술은 방향이 반대로 적혀 있어 틀렸고, 풍상 항해에서는 지그재그 코스를 택한다는 원칙 등 나머지가 옳습니다. 트림과 센터보드의 조작 방향을 반대로 바꿔 놓는 유형입니다."},{"i":325,"q":"항해 시 변침 목표물로서 부적당한 것은?","o":["등대","부유물","입표","산꼭대기"],"a":1,"e":"부유물은 위치가 이동되기 때문에 부적당하다.","c":"항해·해도","x":"변침 목표물은 그 위치가 변하지 않아야 침로를 바꾸는 기준이 될 수 있습니다. 등대, 입표, 산꼭대기처럼 고정되어 있고 멀리서도 뚜렷하게 보이는 물표가 적합합니다. 반면 부유물은 조류와 바람에 따라 움직이므로 기준으로 삼으면 침로 자체가 틀어집니다. 같은 이유로 정박 중인 다른 선박도 변침 목표로 쓰지 않습니다."},{"i":326,"q":"닻의 꼬임에 관한 용어 중 반 바퀴 꼬인 것은?","o":["cross","elbow","round turn","round turn and elbow"],"a":0,"e":"elbow(한 바퀴), round turn(한 바퀴 반), round turn and elbow(두 바퀴)","c":"항해·해도","x":"쌍묘박에서 두 닻줄이 서로 꼬인 정도를 부르는 이름이 정해져 있습니다. 반 바퀴 꼬이면 크로스, 한 바퀴면 엘보, 한 바퀴 반이면 라운드 턴, 두 바퀴면 라운드 턴 앤드 엘보입니다. 조류와 바람으로 배가 계속 돌면 꼬임이 늘어나 닻줄이 손상되므로, 꼬임 정도를 확인해 풀어 주어야 합니다."},{"i":327,"q":"조타명령에서 미드 십(mid ship)이란?","o":["키를 중앙으로 유지하라","좌현 최대각으로 조타하라","우현 최대각으로 조타하라","현재 침로를 유지하라"],"a":0,"e":"","c":"범주·조종","x":"미드십(mid ship)은 '키를 중앙으로 두라'는 조타 명령으로, 타각을 0도로 되돌려 배가 더 이상 돌지 않게 하는 조작입니다. 좌우 최대 타각은 하드 포트, 하드 스타보드라 하고, 현재 침로를 그대로 유지하라는 명령은 스테디 또는 코스 애즈 쉬 고즈입니다. 명령어와 실제 동작을 짝지어 외워 두면 됩니다."},{"i":328,"q":"등대의 등질에 대한 설명 중, 등색이나 광력이 바뀌지 않고 일정하게 계속 빛을 내는 등을 무엇이라 하는가?","o":["부동등","명암등","섬광등","호광등"],"a":0,"e":"","c":"항해·해도","x":"부동등(F)은 등색과 광력이 변하지 않고 일정하게 계속 빛을 내는 등입니다. 명암등은 밝은 시간이 어두운 시간보다 길게 켜졌다 꺼졌다 하고, 섬광등은 반대로 빛나는 시간이 짧으며, 호광등은 두 가지 색을 번갈아 보여 줍니다. 등질은 해도에 F, Oc, Fl, Al 같은 약어로 적히므로 약어와 함께 외우는 것이 효율적입니다."},{"i":329,"q":"범주 방향에 따른 범주 방법을 나열하였다. 풍상에서부터 풍하쪽 순서대로 바르게 나열한 것은?","o":["빔 리치(Beam reach) - 브로드 리치(Broad reach) - 클로스 리치(Close reach)","쿼터링 런(Quartering run) - 빔 리치(Beam reach) - 클로스 홀드(Close hauled)","클로스 리치(Close reach) - 클로스 홀드(Close hauled) - 런닝(Running)","클로스 홀드(Close hauled) - 브로드 리치(Broad reach) - 쿼터링 런(Quartering run)"],"a":3,"e":"'close hauled' → 'close reach' → 'beam reach' → 'broad reach' → 'quartering run' → 'running’","c":"범주·조종","x":"범주 방법은 바람을 받는 각도에 따라 풍상에서 풍하 순으로 클로스 홀드, 클로스 리치, 빔 리치, 브로드 리치, 쿼터링 런, 러닝으로 이어집니다. 따라서 클로스 홀드 → 브로드 리치 → 쿼터링 런이 올바른 순서입니다. 이름에 '클로스'가 들어가면 바람에 가깝고 '런'이 들어가면 바람을 등진다고 이해하면 순서를 세우기 쉽습니다."},{"i":330,"q":"섬광등으로 8초에 1회 빛을 발하며, 등고 20미터, 광달거리는 12마일의 등대는 해도에 어떻게 기재되나?","o":["Occ. 8sec 20M 12m","Fl. 8sec 20m 12M","F. 8sec 20m 12m","Al. 8sec 20M 12m"],"a":1,"e":"","c":"항해·해도","x":"해도에는 등질·주기·등고·광달거리 순으로 적습니다. 섬광등은 Fl, 8초에 1회이므로 8sec, 등고는 소문자 m(미터)로 20m, 광달거리는 대문자 M(해리)으로 12M입니다. 그래서 Fl. 8sec 20m 12M이 됩니다. 등고의 m과 거리의 M을 바꿔 놓거나 Occ(명암등), Al(호광등)로 등질을 바꾼 보기가 함정입니다."},{"i":331,"q":"요트 항해의 기본적 기술인 주요 범주 방향에 대한 설명 중 옳은 것은?","o":["바람쪽으로 요트가 돌아가는 것은 베어링 어웨이","바람으로부터 요트가 멀어지는 것은 러핑","모든 항해 방향에서 빔리치보다 바람이 부는 방향으로 가까이 항해하는 것이 업윈드(Upwind) 코스","모든 항해 방향에서 빔리치보다 바람 방향으로부터 멀어져서 항해하는 것은 리워드(Leeward) 코스"],"a":2,"e":"바람쪽으로 요트가 돌아가는 것을 러핑(Luffing)이라 하고 반대로 바람으로부터 멀어지면 베어링 어웨이(Bearing away), 모든 항해 방향에서 빔리치보다 바람방향으로부터 멀어져서 항해하는 것이 다운윈드(Downwind)","c":"범주·조종","x":"업윈드 코스는 빔리치보다 바람 쪽에 가깝게 항해하는 모든 방향을 말하고, 그보다 바람에서 멀어지는 방향은 다운윈드 코스입니다. 그래서 보기 3이 옳습니다. 바람 쪽으로 도는 것은 러핑, 바람에서 멀어지는 것은 베어링 어웨이이므로 1번과 2번은 용어가 뒤바뀌었고, 4번은 다운윈드를 리워드로 잘못 적었습니다."},{"i":332,"q":"풍상 또는 풍하로 코스를 변경하기 위한 보기의 설명으로 올바른 것으로만 짝지어진 것은? 풍상 코스로 변경하려면 (\n① ) 하며, 이때 스키퍼는 키를 (\n② )고 메인 세일의 조종줄을 (\n③ )","o":["① 러핑 ② 밀어내 ③ 당긴다.","① 베어링어웨이 ② 당기고 ③ 느슨하게 해준다.","① 러핑 ② 당기고 ③ 느슨하게 해준다.","① 베어링어웨이 ② 밀어내 ③ 당긴다."],"a":0,"e":"","c":"범주·조종","x":"풍상 코스로 올리는 조작이 러핑입니다. 선수를 바람 쪽으로 돌리려면 키를 풍하 쪽으로 밀어내야 하고, 바람을 받는 각도가 좁아지므로 메인세일의 시트는 안쪽으로 당겨 돛을 조여야 합니다. 반대로 베어링 어웨이 때는 키를 당기고 시트를 풀어 줍니다. '올릴 땐 당기고, 내릴 땐 풀어 준다'가 세일 트림의 기본 원칙입니다."},{"i":333,"q":"풍상 또는 풍하로 코스 변경을 위한 보기의 설명에 해당하는 것은? 표면바람은 속도가 빨라지고 배의 기울기가 커지므로 승무원은 요트가 균형을 잡을 수 있도록 자리를 옮기면 요트는 최고속도로 항해할 수 있다.","o":["풍하코스로 변경하는 베어링어웨이","풍하코스로 변경하는 러핑","풍상코스로 변경하는 베어링어웨이","풍상코스로 변경하는 러핑"],"a":3,"e":"풍상 코스로 변경하는 러프에서, 요트가 바람쪽으로 회전하면 표면바람은 속도가 빨라지고 배의 기울기가 커진다. 따라서 승무원은 요트가 균형을 잡을 수 있도록 자리를 옮기면 최고의 속도로 항해할 수 있다.","c":"범주·조종","x":"러핑으로 풍상 코스로 올리면 배가 바람 쪽으로 향하면서 겉보기 바람의 속도가 빨라지고 그만큼 옆으로 넘어뜨리는 힘도 커져 기울기가 심해집니다. 그래서 승무원이 풍상 뱃전으로 자리를 옮겨 균형을 잡아 주면 최고 속도로 달릴 수 있습니다. 반대로 베어링 어웨이에서는 겉보기 바람이 줄고 기울기도 작아집니다."},{"i":334,"q":"풍상 또는 풍하로 코스 변경을 위한 보기의 설명에 해당하는 것은? 표면바람은 속도가 떨어지고 배의 기울기는 감소하므로 승무원은 자리를 양쪽 현으로 이동한다.","o":["풍하코스로 변경하는 베어링어웨이","풍하코스로 변경하는 러핑","풍상코스로 변경하는 베어링어웨이","풍상코스로 변경하는 러핑"],"a":0,"e":"","c":"범주·조종","x":"베어링 어웨이는 선수를 바람에서 멀어지는 풍하 쪽으로 내리는 조작입니다. 배가 바람과 같은 방향으로 달리게 되므로 돛이 실제로 받는 겉보기 바람의 속도가 줄고, 옆으로 넘어뜨리는 힘도 약해져 선체 기울기가 감소합니다. 그래서 풍상 쪽에 몰려 있던 승무원이 좌우 현으로 나뉘어 이동해 균형을 잡습니다. 반대로 러핑을 하면 기울기가 커져 승무원이 풍상 현으로 몰립니다."},{"i":335,"q":"선박에 있는 자기 컴퍼스로 침로를 유지하였다면 어떤 침로가 되는가?","o":["진침로","자침로","나침로","시침로"],"a":2,"e":"나북(나침의 남북선)과 선수미선의 교각이 나침로이다.","c":"항해·해도","x":"선박의 자기 컴퍼스는 자차와 편차가 모두 포함된 나북을 기준으로 지시하므로, 그대로 읽어 유지한 침로는 나침로가 됩니다. 여기에 자차를 수정하면 자침로, 편차까지 수정하면 진침로가 됩니다. 나침로 → 자침로 → 진침로로 이어지는 수정 순서를 기억해 두면 침로 환산 계산 문제도 함께 해결됩니다."},{"i":336,"q":"지구상의 모든 자오선과 같은 각도로 만나는 곡선은?","o":["항정선","동서거","위치선","방위선"],"a":0,"e":"","c":"항해·해도","x":"항정선은 지구 위의 모든 자오선과 같은 각도로 만나는 곡선으로, 나침반의 침로를 일정하게 유지하며 항해할 때 그려지는 항로입니다. 메르카토르 해도에서는 직선으로 나타나기 때문에 실무에서 침로를 긋는 기준이 됩니다. 최단 거리인 대권항로와 대비되는 개념이며, 동서거는 동서 방향으로 이동한 거리, 위치선은 선위를 구할 때 쓰는 선이라 뜻이 다릅니다."},{"i":337,"q":"요트가 측면에서 바람을 받아 달리는 상태는?","o":["어빔(Abeam)","자이빙(Gybing)","태킹(Tacking)","런닝(Running)"],"a":0,"e":"","c":"범주·조종","x":"어빔은 바람을 배의 옆면(정횡)에서 받으며 달리는 상태를 말합니다. 돛에 걸리는 힘이 커 속도가 잘 나오는 범주 상태입니다. 태킹과 자이빙은 방향을 바꾸는 '조작'이고, 런닝은 뒤에서 바람을 받는 '상태'이므로 각각 구분해야 합니다. 바람을 받는 각도에 따라 클로스홀드-클로스리치-빔리치(어빔)-브로드리치-런닝으로 이어진다는 순서를 함께 기억하세요."},{"i":338,"q":"요트 장기 항해 중 위생에 관한 설명으로 가장 옳지 않은 것은?","o":["‘바라쿠다’와 같은 식중독 위험이 있는 생선은 피한다.","변기 청소 시 화공약품 세제보다 식초 사용이 호스 등 보호에 더 좋다","변기가 잘 안 내려갈 때, 펌프가 뻑뻑할 때 윤활유를 부어주면 좋다.","청수가 넉넉하지 않을 경우 해수에 잘 녹는 세제로 몸을 씻고, 마른 수건으로 염분을 닦는다."],"a":2,"e":"변기 배출 불량 시 식용유를 부어주면 오링(O-Ring)을 매끄럽게 해주어 좋다.","c":"기관·전기","x":"변기가 잘 내려가지 않거나 펌프가 뻑뻑할 때는 윤활유가 아니라 식용유를 조금 부어 오링을 매끄럽게 해 주는 것이 좋습니다. 광물성 윤활유는 고무 부품을 부풀리거나 삭게 만들기 때문입니다. 시가테라 독이 있을 수 있는 바라쿠다류를 피하고, 세제 대신 식초로 청소하며, 청수가 부족하면 해수용 세제로 씻고 염분을 닦아 내는 것은 옳은 요령입니다."},{"i":339,"q":"감염병과 침입 경로의 연결이 가장 옳지 않은 것은?","o":["피부 계통 - 헤르페스","태반 - 매독","호흡기 계통 - AIDS","소화기 계통 - 장티푸스"],"a":2,"e":"병원체의 침입은 병원소의 탈출과 같이 소화기 계통(장티푸스), 호흡기 계통(감기), 비뇨기 계통(AIDS), 피부 계통(헤르페스), 태반(매독)을 통해 감염된다. 그 경로를 차단하면 감염되는 것을 막을 수 있다.","c":"안전·응급","x":"AIDS를 일으키는 HIV는 공기로 전파되지 않고 혈액이나 성접촉 등 체액을 통해 옮습니다. 따라서 호흡기 계통으로 연결한 것이 잘못이며, 호흡기 계통의 예로는 감기나 결핵이 적절합니다. 장티푸스는 소화기, 헤르페스는 피부, 매독은 태반을 통한 감염이 가능하다는 나머지 연결은 옳습니다. 감염 경로를 알면 차단 방법도 정해집니다."},{"i":340,"q":"선박을 임의로 좌주시키고자 한다. 피해야 할 저질은?","o":["자갈","모래","펄 모래","연한 펄"],"a":3,"e":"나중에 좌주한 곳에서 빠져나오기 위해서는 연한 펄은 가급적 피하는 것이 좋다.","c":"안전·응급","x":"임의좌주에서 가장 중요한 것은 나중에 스스로 빠져나올 수 있는가입니다. 연한 펄은 선체가 깊이 박혀 흡착되듯 붙잡히기 때문에 자력 이초가 매우 어려워 피해야 합니다. 반면 모래나 자갈, 단단한 펄모래는 선체를 고르게 받쳐 주고 이초도 비교적 쉽습니다. 저질 선택이 곧 구조 난이도를 결정한다는 점이 핵심입니다."},{"i":341,"q":"해도상 수심의 기준면은 무엇인가?","o":["평균수면","기본수준면","약최고고조면","저조면"],"a":1,"e":"","c":"항해·해도","x":"우리나라 해도의 수심은 기본수준면(약최저저조면)을 기준으로 표시합니다. 연중 해면이 그보다 더 낮아지는 일이 거의 없는 면을 잡아, 실제 수심이 해도값보다 얕아지는 위험을 줄이려는 것입니다. 조석표의 조고도 이 면을 기준으로 하며, 반대로 등대나 다리의 높이는 약최고고조면을 기준으로 잰다는 점을 함께 정리해 두세요."},{"i":342,"q":"야간항해나 황천 시 추락 등에 대비하여 착용하는 장비로 가장 옳은 것은?","o":["구명부환","라이프라인","하네스","계류색"],"a":2,"e":"","c":"안전·응급","x":"하네스는 상체에 착용해 안전줄(테더)로 배의 라이프라인이나 조피 포인트에 몸을 묶어 두는 장비입니다. 야간이나 황천처럼 갑판에서 미끄러지기 쉬운 상황에서 아예 배 밖으로 떨어지지 않게 막아 주는 것이 목적입니다. 구명부환은 이미 물에 빠진 사람을 향해 던지는 장비이고, 라이프라인은 하네스를 걸어 두는 줄 자체이므로 착용 장비가 아닙니다."},{"i":343,"q":"‘MPH 게이지’로 무엇을 확인할 수 있는가?","o":["연료량","오일","속도","압력"],"a":2,"e":"MPH는 Mile Per Hour(시간당 마일수) 이다.","c":"기관·전기","x":"MPH는 Miles Per Hour, 즉 시간당 마일수를 뜻하므로 MPH 게이지는 속도를 나타내는 계기입니다. 연료량은 연료 게이지, 유압은 오일 프레셔 게이지, 엔진 회전수는 타코미터로 따로 확인합니다. 참고로 해상에서는 보통 노트(시간당 해리)를 쓰므로, MPH로 표시된 값은 노트와 다르다는 점도 알아 두면 좋습니다."},{"i":344,"q":"관측자 중심으로 천체고도를 측정하여 현재의 선박의 위치를 구하는 항해계기는?","o":["육분의","로란","데카","레이다"],"a":0,"e":"","c":"항해·해도","x":"육분의는 수평선과 천체 사이의 각도, 즉 천체고도를 관측자 중심으로 측정하는 계기입니다. 이 고도와 관측 시각을 계산하면 위치선을 얻어 선위를 구할 수 있어, 전파항법이 없던 시절부터 쓰인 천문항법의 기본 도구입니다. 로란과 데카는 전파를 이용한 항법 장치, 레이더는 물표까지의 거리와 방위를 재는 장비라 원리가 전혀 다릅니다."},{"i":345,"q":"중시선을 이용하는 경우로 옳지 않은 것은?","o":["선위의 측정","조시의 계산","컴퍼스 오차의 측정","좁은 수로 통과시의 피험선"],"a":1,"e":"중시선은 선위 측정, 협소도 통과시 피험선, 컴파스 오차의 측정 등에 사용","c":"항해·해도","x":"중시선은 두 물표가 일직선으로 겹쳐 보이는 선으로, 그 선 위에 배가 있다는 사실을 알려 줍니다. 그래서 선위 측정, 좁은 수로 통과 시의 피험선, 컴퍼스 오차 측정에 쓰입니다. 반면 조시(고조·저조 시각) 계산은 조석표와 천문 자료로 하는 일이라 중시선과는 관계가 없습니다. 중시선의 세 가지 용도를 묶어 외우면 됩니다."},{"i":346,"q":"수상레저안전법 수상의 정의 중 내수면에 해당되지 않는 것은?","o":["늪","바다의 수류","댐","기수의 수류"],"a":1,"e":"내수면은 하천, 댐, 호수, 늪, 저수지, 그 밖의 인공으로 조성된 담수나 기수의 수류","c":"수상레저안전법","x":"수상레저안전법에서 '수상'은 해수면과 내수면을 합한 개념입니다. 내수면은 하천, 댐, 호수, 늪, 저수지처럼 육지 안에 있는 물과 인공으로 조성된 담수 또는 기수의 수류를 말합니다. 바다의 수류는 해수면에 속하므로 내수면에 해당하지 않습니다. 해수면인지 내수면인지에 따라 관할 기관이 갈리므로 정의를 정확히 알아야 합니다."},{"i":347,"q":"수상레저사업 등록의 유효기간으로 맞는 것은?","o":["5년","10년","15년","20년"],"a":1,"e":"수상레저안전법 제38조(사업등록의 유효기간 등)","c":"수상레저안전법","x":"수상레저사업 등록의 유효기간은 10년입니다. 기간이 끝난 뒤에도 사업을 계속하려면 갱신 절차를 밟아야 합니다. 사업 등록은 해수면은 해양경찰서장, 내수면은 시장·군수·구청장에게 한다는 점, 등록 결격사유와 등록 취소 사유가 별도로 정해져 있다는 점까지 함께 정리해 두면 관련 문제를 한 묶음으로 처리할 수 있습니다."},{"i":348,"q":"수상레저안전관리 기본계획에 대한 설명으로 가장 옳지 않은 것은?","o":["해양경찰청장은 5년마다 수상레저안전관리 기본계획을 수립ㆍ시행하여야 한다.","해양경찰청장은 필요한 경우에는 관계 중앙행정기관의 장 또는 지방자치단체의 장에게 관련 자료의 제출을 요청할 수 있다.","시ㆍ도지사 또는 해양경찰서장은 기본계획을 바탕으로 매 2년 수상레저안전관리 시행계획을 수립ㆍ 시행하여야 한다.","해양경찰청장은 시행계획의 수립ㆍ시행에 관하여 필요한 지도ㆍ감독을 할 수 있다."],"a":2,"e":"수상레저안전법(제4조) 시ㆍ도지사 또는 해양경찰서장은 기본계획을 바탕으로 해양수산부령으로 정하는 바에 따라 매년 수상레저안전관리 시행계획을 수립ㆍ시행하여야 한다.","c":"수상레저안전법","x":"기본계획은 해양경찰청장이 5년마다 세우는 장기 계획이고, 이를 바탕으로 시·도지사나 해양경찰서장이 세우는 시행계획은 매년 수립·시행해야 합니다. 따라서 '매 2년'이라고 적은 보기가 틀렸습니다. 장기 계획은 여러 해 단위, 집행 계획은 해마다라는 일반적인 행정계획 구조로 이해하면 기억하기 쉽습니다."},{"i":349,"q":"면허시험에 대한 설명으로 옳지 않은 것은?","o":["면허시험은 필기시험과 실기시험으로 구분하여 실시한다.","요트조종면허는 필기시험 70점 이상, 실기시험 60점 이상 받은 사람을 합격자로 한다.","면허시험의 필기시험 시행일을 기준으로 조종면허 결격사유(제7조 제1항)에 해당하는 사람은 면허 시험에 응시할 수 없다.","면허시험의 과목과 방법 등에 필요한 사항은 대통령령으로 정한다"],"a":2,"e":"면허시험의 실기시험 시행일을 기준으로 결격사유에 해당하는 사람은 면허시험에 응시할 수 없다.","c":"수상레저안전법","x":"결격사유 판단의 기준 시점은 필기시험일이 아니라 실기시험 시행일입니다. 실제로 기구를 조종하는 시험을 치르는 시점에 결격사유가 없어야 한다는 취지입니다. 면허시험을 필기와 실기로 나누어 실시하고, 요트조종면허는 필기 70점·실기 60점 이상이 합격이며, 과목과 방법은 대통령령으로 정한다는 나머지 설명은 옳습니다."},{"i":350,"q":"요트조종면허 실기시험에 사용하는 세일링요트 규격기준으로 옳지 않은 것은?","o":["길이 10미터","최대출력 15마력 이상","6인승 이상일 것","최대속도는 30노트 이상"],"a":3,"e":"","c":"수상레저안전법","x":"요트조종면허 실기시험용 세일링요트는 길이, 승선정원, 보조기관 출력 같은 기준을 갖추도록 정해져 있습니다. 그러나 요트는 돛으로 범주하는 배라 고속 성능을 요구하지 않으므로 '최대속도 30노트 이상' 같은 속도 기준은 두지 않습니다. 시험이 세일링 조작 능력을 보는 것이라는 성격을 생각하면 속도 요건이 어울리지 않는다는 점을 알 수 있습니다."},{"i":351,"q":"조종면허 실기시험에 대한 설명으로 옳지 않은 것은?","o":["실기시험의 채점기준과 운항코스는 해양수산부령으로 정한다.","요트조종면허의 실기시험은 100점을 만점으로 하되, 60점 이상 받은 사람을 합격자로 한다.","중간점수의 합계가 합격기준에 미달함이 명백 시에도 과제를 전부 마친 후 실격 처리한다.","수상레저기구 1대당 시험관 2명을 탑승시켜야 한다."],"a":2,"e":"수상레저안전법 시행령 제9조(실기시험의 방법 등), 수상레저안전법 시행규칙 제7조(실기시험의 채점기준 등)","c":"수상레저안전법","x":"실기시험 중 중간점수 합계가 합격기준에 미달함이 명백해지면 그 시점에 실격으로 처리합니다. 남은 과제를 모두 마치게 할 실익이 없고 안전상 위험만 늘기 때문입니다. 따라서 '과제를 전부 마친 후 실격 처리한다'는 서술이 틀렸습니다. 요트 실기는 100점 만점에 60점 이상 합격이고, 기구 1대당 시험관 2명이 탑승합니다."},{"i":352,"q":"요트조종면허 필기시험 과목 중 법규 과목의 범위로 옳지 않은 것은?","o":["수상레저기구의 등록 및 검사에 관한 법률","선박의 입항 및 출항 등에 관한 법률","선박법","전파법"],"a":2,"e":"수상레저안전법 시행령 별표2(필기시험 과목)","c":"수상레저안전법","x":"요트조종면허 필기시험의 법규 과목 범위에는 수상레저안전법, 수상레저기구의 등록 및 검사에 관한 법률, 해상교통안전법, 선박의 입항 및 출항 등에 관한 법률, 해양환경관리법, 전파법 관련 내용이 들어갑니다. 선박법은 선박의 국적과 등기·등록을 다루는 법으로 조종면허 시험 범위에 포함되지 않습니다."},{"i":353,"q":"요트조종면허 실기시험 채점기준으로 옳지 않은 것은?","o":["구명조끼 착용 불량","항내 기주 10노트 초과","2회 이상 이안 불량","지정 침로 ±5° 초과"],"a":1,"e":"항내 기주 5노트 초과(수상레저안전법 시행규칙 별표 1 실기시험의 채점기준 등)","c":"수상레저안전법","t":"new","x":"실기시험 채점기준에서 항내 기주 속력은 5노트를 초과하면 감점 대상입니다. 항내는 다른 배와 계류 시설이 밀집한 곳이라 저속 운항이 원칙이기 때문입니다. 따라서 '10노트 초과'로 적힌 보기가 기준과 다릅니다. 구명조끼 착용 불량, 2회 이상 이안 불량, 지정 침로 ±5도 초과는 모두 실제 채점 항목입니다."},{"i":354,"q":"등록대상 동력수상레저기구의 변경등록과 관련된 설명이다. 옳지 않은 것은?","o":["소유자의 이름 또는 법인의 명칭에 변경이 있는 때에 변경등록을 하여야 한다.","매매·증여 등에 따른 소유권의 변경이 있는 때에 변경등록을 하여야 한다.","구조·장치를 변경하였을 경우 변경등록을 하여야 한다.","구조·장치를 변경하였을 경우 등록기관(지방자치단체)의 변경승인이 필요하다."],"a":3,"e":"수상레저기구의 등록 및 검사에 관한 법률 시행령 제7조(변경등록의 신청 등) 구조·장치를 변경하였을 경우 시장·군수·구청장에게 변경등록을 신청해야 한다.","c":"수상레저안전법","x":"구조나 장치를 변경했을 때는 시장·군수·구청장에게 변경등록을 신청하는 것이지, 별도의 '변경승인'을 받는 절차가 있는 것이 아닙니다. 신고·등록 체계와 승인 체계를 섞어 놓은 보기라 틀립니다. 소유자 이름이나 법인 명칭의 변경, 매매·증여에 따른 소유권 변경, 구조·장치 변경이 모두 변경등록 사유라는 나머지 설명은 옳습니다."},{"i":355,"q":"행정처분 기준 중 1차 위반으로 조종면허 효력이 정지되는 경우로 옳지 않은 것은?","o":["과실로 사람에게 3주 미만의 치료가 필요하다고 의사가 진단한 상해를 입힌 경우","면허증을 다른 사람에게 빌려주어 조종하게 한 경우","약물의 영향으로 인하여 정상적으로 조종하지 못할 염려가 있는 상태에서 동력수상레저기구를 조종한 경우","고의 또는 과실로 사람을 죽게 한 경우"],"a":0,"e":"과실로 사람에게 3주 미만의 치료가 필요하다고 의사가 진단한 상해를 입히거나 다른 사람에게 중대한 재산상 손해를 입힌 경우 경고 1차 행정처분 대상이다.(수상레저안전법 시행규칙 별표 6)","c":"수상레저안전법","x":"과실로 3주 미만의 치료를 요하는 상해를 입히거나 중대한 재산상 손해를 입힌 경우는 1차 위반 시 경고 처분에 그칩니다. 반면 면허증 대여, 약물의 영향으로 정상 조종이 어려운 상태에서의 조종, 고의나 과실로 사람을 죽게 한 경우는 1차부터 효력정지 이상의 처분을 받습니다. 처분 단계는 결과의 중대성에 따라 나뉜다고 이해하면 됩니다."},{"i":356,"q":"행정처분 기준 중 1차 위반으로 조종면허 취소가 되는 경우로 옳지 않은 것은?","o":["거짓이나 그 밖의 부정한 방법으로 조종면허를 받은 경우","조종면허 효력 정지 기간에 조종을 한 경우","면허증을 다른 사람에게 빌려주어 조종하게 한 경우","동력수상레저기구를 사용하여 범죄행위를 한 경우"],"a":2,"e":"면허증을 다른 사람에게 빌려주어 조종하게 한 경우 1차 위반 조치는 효력정지 사항(수상레저안전법 시행 규칙 별표6(조종면허의 취소 및 효력 정지의 세부 기준)","c":"수상레저안전법","t":"new","x":"면허증을 빌려주어 조종하게 한 경우는 1차 위반이면 효력정지 처분 대상이지 곧바로 취소되지는 않습니다. 반면 거짓이나 부정한 방법으로 면허를 받은 경우, 효력정지 기간 중 조종한 경우, 기구를 사용해 범죄행위를 한 경우는 1차 위반으로도 면허가 취소됩니다. 어떤 위반이 곧바로 취소로 이어지는지 목록으로 정리해 두세요."},{"i":357,"q":"다음은 원거리 수상레저활동 관련 설명이다. 옳지 않은 것은?","o":["원거리 수상레저활동의 신고는 출발항으로부터 10해리 이상 떨어진 곳에서 활동할 경우 신고하여야 한다.","선박안전조업규칙에 의한 신고를 별도로 한 경우에는 원거리 수상레저활동 신고의무의 예외로 본다.","원거리 수상레저활동은 해양경찰관서 또는 경찰관서에 신고한다.","신고방법은 방문, 인터넷, 팩스, 전화 모두 가능하다."],"a":3,"e":"원거리 수상레저활동을 하려는 사람은 ‘원거리 수상레저활동 신고서’를 해양경찰관서나 경찰관서에 제출 (팩스나 정보통신망을 이용한 전자문서의 제출을 포함한다)해야 한다.(수상레저안전법 시행규칙 제26조)","c":"수상레저안전법","x":"원거리 수상레저활동 신고서는 방문 제출 외에 팩스나 정보통신망을 이용한 전자문서로도 낼 수 있습니다. 다만 전화로 구두 신고하는 방법은 규정되어 있지 않으므로 '전화 모두 가능하다'는 서술이 틀립니다. 출발항에서 10해리 이상 떨어진 활동이 대상이고, 선박안전 조업규칙에 따른 출입항 신고를 한 경우에는 예외가 인정됩니다."},{"i":358,"q":"외국인이 국제경기대회에서 수상레저기구를 조종하는 경우 다음 조종면허의 특례 기준에 해당하지 않는 것은?","o":["국제경기대회 개최일 10일 전부터 국제경기대회 종료시까지 조종할 수 있다.","외국인의 조종면허 특례에 관한 사항은 해양수산부령으로 정한다.","조종지역은 국내 수역에 한정한다.","2개국 이상이 참여하는 국제경기대회에 한정한다."],"a":0,"e":"수상레저안전법 시행규칙 제3조(외국인에 대한 조종면허의 특례)","c":"수상레저안전법","x":"외국인의 조종면허 특례는 2개국 이상이 참여하는 국제경기대회에 한해, 국내 수역에서만, 정해진 기간 동안 조종할 수 있도록 허용하는 제도이며 세부 사항은 해양수산부령으로 정합니다. 보기에 적힌 '개최일 10일 전부터'는 규정에 정해진 기간과 달라 옳지 않습니다. 특례는 범위와 기간을 좁게 정한다는 성격을 기억하면 됩니다."},{"i":359,"q":"야간 수상레저활동을 하려는 사람이 갖추어야 할 운항장비에 해당하지 않는 것은?","o":["항해등, 나침반","야간 조난신호장비, 통신기기","자기발연신호, 발연부신호","소화기, 구명부환"],"a":2,"e":"","c":"수상레저안전법","x":"야간 운항장비는 어두운 바다에서 배의 위치를 알리고 방향을 잡으며 연락을 취하기 위한 장비들로, 항해등·나침반·야간 조난신호장비·통신기기·전등·구명튜브·소화기·자기점화등 등이 해당합니다. 자기발연신호와 발연부신호는 연기로 위치를 알리는 주간용 조난신호 장비여서 야간 운항장비 목록에 들어가지 않습니다. '어두울 때 쓸모가 있는가'를 기준으로 판단하면 됩니다."},{"i":360,"q":"수상레저기구의 변경등록신청을 해야 할 사항이 아닌 것은?","o":["매매, 증여, 상속 등으로 인한 소유권의 변경 사항","동력수상레저기구 명칭의 변경 사항","동력수상레저기구 용도의 변경 사항","동력수상레저기구의 등록사항 중 시장·군수·구청장이 정하여 고시하는 사항"],"a":3,"e":"동력수상레저기구의 등록사항 중 해양경찰청장이 정하여 고시하는 사항이 변경등록신청 사항에 해당함. (수상레저기구의 등록 및 검사에 관한 법률 시행령 제7조)","c":"수상레저안전법","t":"new","x":"변경등록 신청 사항 중 마지막 항목은 '해양경찰청장이 정하여 고시하는 사항'입니다. 등록 사무는 시장·군수·구청장이 처리하지만, 무엇을 변경 사항으로 볼지 기준을 정해 고시하는 권한은 해양경찰청장에게 있기 때문입니다. 집행 기관과 기준 설정 기관을 바꿔 놓은 보기이므로 두 역할을 구분해 기억해야 합니다."},{"i":361,"q":"안전교육 위탁기관으로 지정받으려는 기관 또는 단체의 장이 제출해야 하는 서류 중 옳지 않은 것은?","o":["정관","지정받으려는 기관 또는 단체의 장 사업자등록증","인적기준·시설기준 및 장비기준을 갖추었음을 증명하는 서류와 시설기준에 관한 도면","수상안전 교육내용이 포함된 교육 실시계획서"],"a":1,"e":"수상레저안전법 시행규칙 제14조(안전교육 위탁기관의 지정신청 등)","c":"수상레저안전법","x":"안전교육 위탁기관 지정 신청에는 그 기관이 교육을 제대로 수행할 수 있는지를 보여 주는 서류가 필요합니다. 정관, 인력·시설·장비 기준을 갖추었다는 증명 서류와 시설 도면, 교육 실시계획서가 그것입니다. 기관장 개인의 사업자등록증은 교육 수행 능력을 증명하는 자료가 아니어서 제출 서류에 들어가지 않습니다."},{"i":362,"q":"수상레저기구 등록번호판의 부착위치로 옳은 것은?","o":["옆면","옆면과 뒷면","뒷면","앞면과 뒷면"],"a":1,"e":"수상레저기구의 등록 및 검사에 관한 법률 시행규칙 제9조(등록번호판의 부착)","c":"수상레저안전법","x":"등록번호판은 다른 배나 단속 기관이 어느 방향에서도 확인할 수 있어야 하므로 옆면과 뒷면에 부착합니다. 자동차 번호판이 앞뒤에 붙는 것과 달리, 해상에서는 옆에서 마주치는 경우가 많다는 점이 반영된 규정입니다. 번호판을 가리거나 알아보기 어렵게 하는 행위도 금지된다는 점을 함께 알아 두세요."},{"i":363,"q":"조종면허를 취소하거나 효력을 정지하여야 하는 경우로서 옳지 않은 것은?","o":["부정한 방법으로 면허를 받은 때","수상레저사업이 취소된 때","술에 취한 상태에서 조종을 한 때","조종면허를 이용하여 범죄행위를 한 때"],"a":1,"e":"수상레저안전법 제17조(조종면허의 취소·정지)","c":"수상레저안전법","x":"조종면허의 취소나 정지는 면허 취득과 조종 행위에 관한 잘못을 대상으로 합니다. 부정한 방법으로 면허를 받은 경우, 술에 취해 조종한 경우, 면허를 이용해 범죄행위를 한 경우가 그것입니다. 반면 수상레저사업 등록이 취소된 것은 사업자에 대한 행정처분이므로, 그 자체가 조종면허를 취소·정지할 사유가 되지는 않습니다."},{"i":364,"q":"동력수상레저기구의 등록에 관한 설명으로 옳지 않은 것은?","o":["동력수상레저기구 취득한 날부터 3개월 이내 등록신청을 해야 한다.","등록신청 사항이 거짓이 있는 경우 등록신청을 거부할 수 있다.","동력수상레저기구가 신규검사 기준에 맞지 아니한 경우 등록신청을 거부할 수 있다.","등록의 요건 및 신청 절차 등에 관하여 필요한 사항은 대통령령으로 정한다."],"a":0,"e":"동력수상레지기구 취득한 날부터 1개월 이내 등록신청을 해야한다(수상레저기구의 등록 및 검사에 관한법률 제2조)","c":"수상레저안전법","t":"new","x":"등록대상 동력수상레저기구는 취득한 날부터 1개월 이내에 등록을 신청해야 합니다. 3개월이라고 적은 보기가 틀렸습니다. 등록 신청 내용에 거짓이 있거나 신규검사 기준에 맞지 않으면 등록을 거부할 수 있고, 등록의 요건과 절차는 대통령령으로 정한다는 나머지 설명은 옳습니다. 등록 1개월, 변경등록 30일이라는 기한을 함께 외워 두세요."},{"i":365,"q":"수상레저안전법상 조종면허에 대한 설명으로 가장 옳지 않은 것은?","o":["동력수상레저기구를 조종하는 사람은 면허시험에 합격한 후 동력수상레저기구 조종면허를 받아야 한다.","동력수상레저기구는 추진기관의 최대 출력이 5마력 이상인 것을 말한다.","수상레저사업자와 종사자 중 1명 이상은 제1급 조종면허증을 소지하여야 한다.","20톤 이상 모터보트 조종자는 제1급 조종면허 이상 취득 하여야 조종이 가능하다."],"a":3,"e":"동력수상레저기구 조종면허는 추진기관 최대 출력이 5마력 이상의 동력수상레저 기구로 규정하고 있고, 제2급 조종면허도 조종이 가능하다.","c":"수상레저안전법","x":"총톤수 20톤 이상의 모터보트는 수상레저기구가 아니라 선박 관련 법령의 적용을 받으므로, 제1급 조종면허를 취득해야 조종할 수 있다는 설명 자체가 성립하지 않습니다. 조종면허가 필요한 기준은 추진기관 최대출력 5마력 이상이며, 제2급 조종면허로도 조종할 수 있는 기구가 많습니다. 면허 등급과 톤수를 섞어 놓은 보기입니다."},{"i":366,"q":"등록대상 동력수상레저구의 보험 가입에 대한 설명으로 가장 옳지 않은 것은?","o":["등록 대상 동력수상레저기구의 소유자는 소유한 날로부터 2개월 이내 보험이나 공제에 가입하여야 한다.","수상레저사업자는 종사자와 이용자의 피해를 보전하기 위하여 보험등에 가입하여야 한다.","수상레저사업자는 보험등의 가입에 관한 정보를 종사자 및 이용자에게 알려야 한다.","해양경찰서장은 보험등의 가입과 관련한 조사ㆍ관리를 위하여 보험회사에 필요한 자료 또는 정보의 제공을 요청할 수 있다."],"a":0,"e":"등록 대상 동력수상레저기구의 소유자는 동력수상레저기구의 사용으로 다른 사람이 사망하거나 부상한 경우에 피해자에 대한 보상을 위하여 소유한 날로부터 1개월 이내에 대통령령으로 정하는 바에 따라 보험이나 공제에 가입하여야 한다.","c":"수상레저안전법","x":"등록대상 동력수상레저기구의 소유자는 소유한 날부터 1개월 이내에 보험이나 공제에 가입해야 합니다. 2개월이라고 적은 보기가 틀렸습니다. 사고 피해자에 대한 보상을 담보하기 위한 의무이며, 등록 신청 기한과 같은 1개월이라는 점을 함께 기억하면 좋습니다. 사업자의 보험 가입 의무와 정보 고지 의무는 별도로 규정되어 있습니다."},{"i":367,"q":"면허시험 면제교육기관, 시험대행기관 종사자 교육을 받아야 하는 대상자가 아닌 것은?","o":["면제교육기관의 강사","안전교육 위탁기관의 강사","시험대행기관의 시험관","면제교육기관의 안전요원"],"a":3,"e":"종사자 교육 대상에서 면제교육기관의 안전요원은 해당이 안됨(수상레저안전법 시행규칙 제22조)","c":"수상레저안전법","t":"new","x":"종사자 교육은 교육이나 시험 업무를 직접 수행하며 수준을 유지해야 하는 사람을 대상으로 합니다. 면제교육기관과 안전교육 위탁기관의 강사, 시험대행기관의 시험관과 책임운영자가 그것입니다. 면제교육기관의 안전요원은 현장 안전을 보조하는 인력이라 이 정기 교육 대상에 포함되지 않습니다."},{"i":368,"q":"등록대상 동력수상레저기구 안전검사 대행자의 업무를 전부 또는 일부의 정지를 명할 수 있는 경우가 아닌 것은?","o":["거짓이나 그 밖의 부정한 방법으로 지정을 받은 경우","고의 또는 중대한 과실로 사실과 다르게 안전검사를 한 경우","업무와 관련하여 부정한 금품을 수수한 경우","검사 관련 기술인력, 시설, 장비 등의 기준에 미치지 못하게 된 경우"],"a":0,"e":"거짓이나 그 밖의 부정한 방법으로 지정을 받은 경우에는 그 지정을 취소하여야 한다","c":"수상레저안전법","x":"거짓이나 부정한 방법으로 지정을 받은 경우는 지정 자체가 처음부터 잘못된 것이므로 업무 정지가 아니라 지정을 취소해야 합니다. 반면 고의나 중대한 과실로 사실과 다르게 검사한 경우, 부정한 금품을 수수한 경우, 기술인력·시설·장비 기준에 미달하게 된 경우는 사안에 따라 업무의 전부나 일부를 정지시킬 수 있는 사유입니다."},{"i":369,"q":"수상레저사업자가 영업구역 안에서 금지사항으로 볼 수 없는 것은?","o":["영업구역을 벗어나 영업하는 행위","보호자를 동반한 14세 미만자를 수상레저기구에 태우는 행위","수상레저기구에 정원을 초과하여 태우는 행위","수상레저기구 안으로 주류를 반입토록 하는 행위"],"a":1,"e":"수상레저안전법 제44조(사업자의 안전점검 등 조치) 14세 미만자 보호자 동반 시 탑승 가능","c":"수상레저안전법","x":"14세 미만인 사람도 보호자를 동반하면 수상레저기구에 태울 수 있으므로 금지 행위가 아닙니다. 반면 영업구역을 벗어난 영업, 정원 초과 탑승, 기구 안으로 주류를 반입하게 하는 행위는
