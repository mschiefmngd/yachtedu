은 경우, 등록번호판을 부착하지 않고 운항한 경우는 100만원 이하의 과태료 대상입니다. 검사 자체를 받지 않은 것이 필증 미부착보다 무겁게 다뤄집니다."},{"i":557,"q":"수상레저기구등록법상 50만원 이하의 과태료에 해당하지 않는 것은?","o":["고의 또는 중대한 과실로 사실과 다르게 안전검사를 한 자","동력수상레저기구 변경사항 있는데도 변경등록을 하지 아니한 자","동력수상레저기구 등록번호판을 부착하지 아니한 자","시험운항허가를 받고 기간 만료 후 시험 운항허가증을 반납하지 아니한 자"],"a":0,"e":"고의 또는 중대한 과실로 사실과 다르게 안전검사를 한자는 100만원 이하의 과태료 부과 대상(수상레저기구 등록법 제32조_과태료)","c":"수상레저안전법","t":"new","x":"고의나 중대한 과실로 사실과 다르게 안전검사를 한 경우는 검사 제도의 신뢰를 무너뜨리는 행위라 100만원 이하의 과태료 대상입니다. 반면 변경등록을 하지 않은 경우, 등록번호판을 부착하지 않은 경우, 시험운항허가증을 기간 만료 후 반납하지 않은 경우는 50만원 이하의 과태료 대상입니다."},{"i":558,"q":"동력수상레저기구 검사대행자가 갖추어야할 주요 장비가 아닌 것은?","o":["추진기관 검사장치","선체 두께 측정장비","길이 측정기","구조장비 보관함 및 선반"],"a":3,"e":"구조장비 보관함 및 선반은 검사 대행자 주요장비에 속하지 않는다(수상레저기구등록법 시행령 별표 2)","c":"수상레저안전법","t":"new","x":"검사대행자의 주요 장비는 기구의 상태를 직접 측정하고 확인하는 데 쓰는 것들로, 추진기관 검사장치, 선체 두께 측정장비, 길이 측정기 등이 해당합니다. 구조장비 보관함과 선반은 물건을 정리해 두는 집기라 검사 능력과 직접 관련이 없어 주요 장비 목록에 들어가지 않습니다."},{"i":559,"q":"해양경찰서장이 야간 수상레저활동 시간을 조정해야 하는 범위로 옳은 것은?","o":["해지기 전 30분부터 23시까지","해진 후부터 24시까지","해진 후 30분부터 23시까지","해진 후 30분부터 24시까지"],"a":3,"e":"","c":"수상레저안전법","x":"야간 수상레저활동은 원칙적으로 해가 진 후 30분부터 해가 뜨기 전 30분까지 금지되며, 해양경찰서장은 이 가운데 해진 후 30분부터 24시까지의 범위에서 지역 여건에 맞게 활동 시간을 조정할 수 있습니다. 즉 조정할 수 있는 폭 자체가 정해져 있어 그 밖의 시간대까지 임의로 허용할 수는 없습니다. 시각을 23시나 다른 값으로 바꾼 보기가 함정입니다."},{"i":560,"q":"국내에서 건조되는 12미터 미만의 모터보트 또는 세일링요트의 안전검사 시 제출해야되는 도면이 아닌 것은?","o":["일반배치도","강재배치도","중앙횡단면도","기관실전체장치도"],"a":3,"e":"기관실정체장치도는 12미터 이상의 모터보트 또는 세일링요트 안전검사 시 제출해야되는 도면이다 (수상레저기구의 등록 및 검사에 관한 법률 시행규칙_별표 4)","c":"수상레저안전법","t":"new","x":"국내에서 건조되는 12미터 미만의 모터보트나 세일링요트는 일반배치도, 강재배치도, 중앙횡단면도 등을 제출합니다. 기관실 전체 장치도는 12미터 이상 기구의 안전검사에서 요구되는 도면이라 해당하지 않습니다. 12미터를 경계로 제출 도면이 늘어난다는 구조를 이해하면 국내·수입 문항을 함께 정리할 수 있습니다."},{"i":561,"q":"선박의 입항 및 출항에 관한 법률상 용어의 정의가 옳은 것은 모두 몇 개인가?\n① “정박(碇泊)”이란 선박이 해상에서 닻을 바다 밑바닥에 내려놓고 운항을 멈추는 것\n② “정류(停留)”란 선박이 해상에서 일시적으로 운항을 멈추는 것\n③ “계류(繫流)”란 선박이 운항을 중지하고 정박하거나 계류하는 것\n④ “계선(繫船)”이란 선박을 다른 시설에 붙들어 매어 놓는 것","o":["1개","2개","3개","4개"],"a":1,"e":"③ 계류(繫流) : 선박을 다른 시설에 붙들어 매어 놓는 것,\n④ 계선(繫船) : 선박이 운항을 중지하고 정박하거나 계류하는 것","c":"해사법규","t":"chg","x":"옳은 것은 ①과 ④, 두 개입니다. 정박은 닻을 내려 운항을 멈추는 것, 계선은 선박을 다른 시설에 붙들어 매어 놓는 것이 맞습니다. 반면 ②의 정류는 해상에서 일시적으로 운항을 멈추는 것이고, ③의 계류는 다른 시설에 매어 두는 것이므로 두 정의가 서로 뒤바뀌어 있습니다. 개정본에서 답이 1개에서 2개로 바뀐 문항이라 특히 주의해야 합니다."},{"i":562,"q":"무역항의 항로에 정박할 수 없는 경우는?","o":["도선선이 입항 선박들을 위해 대기 중인 경우","해양수산부장관의 허가를 얻어 공사 중인 경우","조타기 고장으로 선박 조종이 불가능한 경우","인명구조에 종사하는 경우"],"a":0,"e":"선박의 입항 및 출항 등에 관한 법률 제11조(항로에서의 정박 등 금지)","c":"해사법규","x":"항로는 배들이 드나드는 통로이므로 원칙적으로 정박이 금지되고, 예외는 어쩔 수 없는 상황으로 한정됩니다. 해양수산부장관의 허가를 받은 공사, 조타기 고장 등으로 조종이 불가능한 경우, 인명 구조에 종사하는 경우가 그것입니다. 도선선이 입항 선박을 기다리는 것은 업무상의 대기일 뿐 부득이한 사정이 아니므로 항로에 정박할 수 없습니다."},{"i":563,"q":"선박의 입항 및 출항 등에 관한 법률상 우선피항선이 아닌 것은?","o":["주로 노와 삿대로 운전하는 선박","예선","예인선이 결합되어 운항하는 압항부선","총톤수 20톤 미만의 선박"],"a":2,"e":"선박의 입항 및 출항 등에 관한 법률 제2조(정의)","c":"해사법규","x":"우선피항선은 스스로 조종이 자유롭지 못하거나 규모가 작아 다른 배의 진로를 피해야 하는 선박으로, 노와 삿대로 움직이는 배, 예선, 총톤수 20톤 미만의 선박 등이 해당합니다. 반면 압항부선이 결합되어 하나처럼 운항하는 형태는 상당한 크기와 추진력을 갖춰 우선피항선으로 보지 않습니다."},{"i":564,"q":"선박의 입항 및 출항 등에 관한 법률상 화재 시 경보방법으로 옳은 것은?","o":["기적이나 사이렌을 단음(1초) 5회","기적이나 사이렌을 장음(4 ~ 6초) 5회","기적이나 사이렌을 단음(1초) 3회, 장음(4 ~ 6초) 3회","기적이나 사이렌을 단음(1초) 4회, 장음(4 ~ 6초) 4회"],"a":1,"e":"선박의 입항 및 출항 등에 관한 법률 시행규칙 제29조(화재 시 경보방법)","c":"해사법규","x":"무역항의 수상구역 등에서 화재가 발생하면 기적이나 사이렌으로 장음(4~6초)을 5회 울려 알립니다. 짧고 여러 번 울리는 신호는 조종신호나 경고신호와 혼동될 수 있으므로, 길게 다섯 번이라는 뚜렷한 형태로 정해 둔 것입니다. 장음의 길이(4~6초)와 횟수(5회)를 함께 기억하세요."},{"i":565,"q":"선박의 입항 및 출항 등에 관한 법률에 의한 무역항을 가장 올바르게 설명한 것은 무엇인가?","o":["유람선이 상시 출입할 수 있는 항","외국적 선박이 상시 출입할 수 있는 항","내국적 선박이 상시 출입할 수 있는 항","국민경제와 공공의 이해에 밀접한 관계가 있고, 주로 외항선이 입항․출항하는 항만"],"a":3,"e":"선박의 입항 및 출항 등에 관한 법률 제2조(정의) 제1호","c":"해사법규","x":"무역항은 국민경제와 공공의 이해에 밀접한 관계가 있고 주로 외항선이 드나드는 항만을 말합니다. 단순히 외국적 선박이나 유람선이 드나든다는 사실만으로 정해지는 것이 아니라, 국가 경제에서 차지하는 역할과 외항 운송 기능을 기준으로 지정됩니다. 이 정의가 선박의 입항 및 출항 등에 관한 법률 전체의 적용 범위를 정합니다."},{"i":566,"q":"선박의 입항 및 출항 등에 관한 법률상 모든 선박은 항로를 항행하는 위험물운송선박(급유선은 제외 한다) 또는 ( )의 진로를 방해하지 않아야 한다. ( ) 안에 들어갈 알맞은 말은?","o":["조종불능선","흘수제약선","조종제한선","어로에 종사하고 있는 선박"],"a":1,"e":"선박의 입항 및 출항 등에 관한 법률 제12조(항로에서의 항법) 제1항 제5호","c":"해사법규","x":"항로에서는 위험물운송선박(급유선 제외)과 흘수제약선의 진로를 방해해서는 안 됩니다. 위험물운송선은 사고가 나면 피해가 크고, 흘수제약선은 수심 때문에 항로를 벗어나면 좌초 위험이 있어 스스로 피할 여지가 거의 없기 때문입니다. '피할 수 없는 배를 방해하지 않는다'는 원칙으로 이해하면 됩니다."},{"i":567,"q":"선박의 입항 및 출항 등에 관한 법률상 항로에서의 항법이 아닌 것은?","o":["항로에서 다른 선박과 나란히 항행하지 아니할 것","다른 선박과 마주칠 우려가 있는 경우에는 왼쪽으로 항행할 것","다른 선박을 추월하지 아니할 것","범선은 항로에서 지그재그 항행하지 아니할 것"],"a":1,"e":"항로에서 다른 선박과 마주칠 우려가 있는 경우에는 오른쪽으로 항행할 것","c":"해사법규","x":"항로에서 다른 선박과 마주칠 우려가 있으면 오른쪽으로 항행해야 합니다. 서로 우현 쪽으로 비켜 좌현끼리 지나가게 하는 국제적인 원칙과 같습니다. 따라서 왼쪽으로 항행한다는 보기가 틀렸습니다. 항로에서 나란히 항행하지 않을 것, 추월하지 않을 것, 범선은 지그재그로 항행하지 않을 것은 모두 옳은 규정입니다."},{"i":568,"q":"누구든지 무역항의 수상구역등이나 무역항의 수상구역 밖 ( ) 이내의 수면에 선박의 안전운항을 해칠 우려가 있는 흙ㆍ돌ㆍ나무ㆍ어구(漁具) 등 폐기물을 버려서는 아니 된다. ( ) 안에 들어갈 알맞은 것은?","o":["10해리","5해리","10㎞","5㎞"],"a":2,"e":"선박의 입항 및 출항 등에 관한 법률 제38조(폐기물의 투기 금지 등) 제1항","c":"해사법규","x":"무역항의 수상구역 등과 그 밖으로 10킬로미터 이내의 수면에는 선박 안전운항을 해칠 우려가 있는 흙·돌·나무·어구 등 폐기물을 버릴 수 없습니다. 항만 주변에 가라앉은 물체는 좌초와 프로펠러 손상을 일으키기 때문입니다. 단위가 해리가 아니라 킬로미터라는 점, 숫자가 10이라는 점을 함께 기억하세요."},{"i":569,"q":"선박의 입항 및 출항 등에 관한 법률상 항로에서의 항법으로 옳은 것은?","o":["다른 선박과 나란히 항행하지 않아야 한다.","범선은 항로에서 지그재그로 항행하여야 한다.","우선피항선의 진로를 방해하지 않아야 한다.","다른 선박과 마주칠 우려가 있는 경우에는 왼쪽으로 항행한다."],"a":0,"e":"무역항이 항로 내에서 범선은 지그재그로 항해하지 않아야 하며, 다른 선박과 나란히 항행해서도 안된다. 우선피항선은 항로를 따라 항행하는 선박의 진로를 방해해서는 안된다. 서로 마주칠 우려가 있는 경우에는 오른쪽으로 항행해야 한다.","c":"해사법규","t":"new","x":"항로에서는 다른 선박과 나란히 항행해서는 안 됩니다. 폭이 제한된 항로에서 두 배가 나란히 가면 다른 배가 지날 공간이 사라지기 때문입니다. 범선은 지그재그 항행이 금지되고, 우선피항선이 오히려 다른 배의 진로를 방해하지 않아야 하며, 마주칠 우려가 있으면 오른쪽으로 항행해야 하므로 나머지 보기는 모두 반대로 적혀 있습니다."},{"i":570,"q":"선박의 입항 및 출항 등에 관한 법률상 방파제부근에서의 항법설명 중 괄호안에 알맞은 것을 고르시오 무역항의 수상구역등에 입항하는 선박이 방파제 입구 등에서 출항하는 선박과 마주칠 우려가 있는 경우에는 방파제 ( )에서 ( )하는 선박의 진로를 피하여야 한다.","o":["밖, 출항","안, 출항","밖, 입항","안, 입항"],"a":0,"e":"선박의 입항 및 출항 등에 관한 법률 제13조(방파제 부근에서의 항법)","c":"해사법규","x":"방파제 입구는 폭이 좁아 두 배가 동시에 지날 수 없으므로, 들어오는 배가 방파제 바깥에서 기다리며 나가는 배의 진로를 피해야 합니다. 나가는 배는 이미 좁은 입구에 들어서 있어 되돌아 나갈 여유가 없기 때문입니다. '출항선 우선'이라는 원칙 한 줄로 기억하면 방파제 부근 항법 문제는 모두 해결됩니다."},{"i":571,"q":"선박의 입항 및 출항 등에 관한 법률상 무역항의 수상구역 등에서 예인선은 한꺼번에 몇 척 이상의 피예인선을 끌어서는 안 되는가?","o":["2척","3척","5척","제한 없음"],"a":1,"e":"무역항의 수상구역에서 예인선은 한꺼번에 3척 이상의 피예인선을 끌어서는 아니 된다.","c":"해사법규","t":"new","x":"무역항의 수상구역에서 예인선은 한꺼번에 3척 이상의 피예인선을 끌 수 없습니다. 끌리는 배가 많아질수록 예인선열이 길어지고 회두가 어려워져 좁은 항내에서 위험하기 때문입니다. 예인선 선수부터 피예인선 선미까지의 길이를 200미터 이내로 제한하는 규정과 함께 묶어 기억하면 좋습니다."},{"i":572,"q":"선박의 입항 및 출항에 관한 법률상 항법을 설명한 것이다. ( ) 안에 들어갈 알맞은 말은? 선박이 무역항의 수상구역등에서 해안으로 길게 뻗어 나온 육지 부분, 부두, 방파제 등 인공 시설의 튀어나온 부분 또는 정박 중인 선박을 (\n㉠ ) 뱃전에 두고 항행할 때에는 부두등에 접근하여 항행하고, 부두등을 (\n㉡ ) 뱃전에 두고 항행할 때에는 멀리 떨어져서 항행하여야 한다.","o":["㉠ 오른쪽 ㉡ 오른쪽","㉠ 오른쪽 ㉡ 왼쪽","㉠ 왼쪽 ㉡ 오른쪽","㉠ 왼쪽 ㉡ 왼쪽"],"a":1,"e":"선박의 입항 및 출항 등에 관한 법률 제14조(부두 등 부근에서의 항법)","c":"해사법규","x":"부두나 방파제, 정박 중인 선박 같은 장애물을 오른쪽 뱃전에 두고 지날 때는 가까이 붙어서, 왼쪽 뱃전에 두고 지날 때는 멀리 떨어져서 항행합니다. 서로 마주 오는 배가 각각 이 원칙을 지키면 자연스럽게 우측통행이 되어 부딪히지 않기 때문입니다. 우측통행 원칙에서 파생된 규정이라고 이해하면 외우기 쉽습니다."},{"i":573,"q":"부두․잔교․선거의 부근 수역이나 계류장 입구 부근 수역에 정박할 수 있는 경우가 아닌 것은?","o":["해양사고를 피하기 위한 경우","선박의 고장이나 그 밖의 사유로 선박을 조정할 수 없는 경우","인명을 구조하거나 급박한 위험이 있는 선박을 구조하는 경우","어로 작업 중인 경우"],"a":3,"e":"해양사고를 피하는 경우, 선박 고장으로 선박을 조종할 수 없는 경우, 인명이나 선박 구조를 위한 경우, 허 가를 받은 공사 등 부득이한 경우가 아니면 입구 부근에 정박해서는 아니 된다. 정박한 선박은 언제든지 닻 을 올려 운항할 수 있는 상태를 유지해야 한다.","c":"해사법규","t":"new","x":"부두나 잔교, 선거 부근 수역과 계류장 입구 부근 수역은 다른 배가 접안하고 드나드는 통로이므로 원칙적으로 정박이 금지됩니다. 예외는 해양사고를 피하려는 경우, 고장 등으로 조종할 수 없는 경우, 인명이나 선박을 구조하는 경우, 허가받은 공사 등 부득이한 경우입니다. 어로 작업은 이런 긴급성이 없어 예외가 아닙니다."},{"i":574,"q":"무역항의 항로에서 원칙적으로 추월이 금지된다. 다만, 추월이 가능한 경우가 있다.이 경우에 해당 되지 않는 것은?","o":["추월하려는 선박을 눈으로 볼 수 있을 때","안전하게 추월할 수 있다고 판단될 때","추월선이 피추월선의 속도보다 빠를","기적신호를 통해 추월에 대한 피추월선의 동의가 있었을 때"],"a":2,"e":"무역항의 수상구역 등의 항로에서 원칙적으로 추월이 금지되나, 피추월선을 눈으로 볼 수 있고, 안전하게 추월할 수 있다고 판단되는 경우, 기적신호를 통해 피추월선의 동의를 얻은 후에 추월할 수 있다.","c":"해사법규","t":"new","x":"항로에서 추월이 예외적으로 허용되려면 피추월선을 눈으로 볼 수 있고, 안전하게 추월할 수 있다고 판단되며, 기적신호로 피추월선의 동의를 얻어야 합니다. 단순히 추월선이 더 빠르다는 사정은 안전을 담보하지 못하므로 허용 요건이 아닙니다. 세 가지 요건을 모두 갖춰야 한다는 점이 핵심입니다."},{"i":575,"q":"선박의 입항 및 출항에 관한 법률상 ‘선박을 눈으로 볼 수 있다’는 의미는?","o":["레이더 화면상에서 확인할 수 있다.","상대 선박이 장애물이 없는 곳에 있다.","상대 선박을 서로 눈으로 볼 수 있다.","한쪽 선박에서만 상대 선박을 볼 수 있다."],"a":2,"e":"’선박을 눈으로 볼 수 있다‘는 의미는 맨 눈으로 상대 선박을 서로 볼 수 있다는 의미이다. 즉, 추월선이 피 추월선을 볼 수 있고, 피추월선도 추월선을 맨 눈으로 볼 수 있는 상태를 의미한다. 한쪽에서만 볼 수 있는 경우, 레이더 화면상만 보는 것은 해당되지 않는다.","c":"해사법규","t":"new","x":"'선박을 눈으로 볼 수 있다'는 것은 레이더 화면이 아니라 맨눈으로, 그것도 양쪽이 서로를 볼 수 있는 상태를 뜻합니다. 한쪽만 상대를 보는 상황에서는 신호와 동의가 오갈 수 없기 때문입니다. 이 정의는 항로에서의 추월 허용 요건과 직접 연결되므로 함께 이해해 두어야 합니다."},{"i":576,"q":"선박의 입항 및 출항 등에 관한 법률상 정박이 가능한 곳은?","o":["방파제 외측","부두 ․ 잔교 ․ 안벽 ․ 돌핀 및 선거 부근의 수역","하천 ․ 운하 및 그 밖의 좁은 수로","계류장 입구의 부근 수역 [출처] 무역항의 수상구역 등에서 “부두, 잔교, 안벽, 계선 부표, 돌핀 및 선거의 부근 수역, 하천․운하 및 그 밖의 좁은 수로와 계류장 입구의 부근 수역”에서는 정박할 수 없다. 방파제 외측은 정박 금지 수역에 해당되지 않는다."],"a":0,"e":"","c":"해사법규","t":"new","x":"무역항의 수상구역 등에서 정박이 금지되는 곳은 다른 배가 접안하거나 통항해야 하는 좁고 중요한 수역입니다. 부두·잔교·안벽·계선부표·돌핀·선거의 부근 수역, 하천과 운하 등 좁은 수로, 계류장 입구 부근 수역이 그것입니다. 방파제 바깥쪽은 이 목록에 없으므로 정박할 수 있습니다. 금지 장소를 통째로 외우고 나머지는 가능하다고 보면 됩니다."},{"i":577,"q":"선박의 입항 및 출항 등에 관한 법률상 예인선의 항법 설명 중 ( ) 안에 알맞은 것은? 1. 예인선의 선수로부터 피예인선의 선미까지의 길이는 (\n㉠ )미터를 초과하지 아니할 것. 다만, 다른 선박의 출입을 보조하는 경우에는 그러하지 아니하다. 2. 예인선은 한꺼번에 (\n㉡ )척 이상의 피예인선을 끌지 아니할 것","o":["㉠ 100미터 ㉡ 2척","㉠ 100미터 ㉡ 3척","㉠ 200미터 ㉡ 2척","㉠ 200미터 ㉡ 3척"],"a":3,"e":"선박의 입항 및 출항 등에 관한 법률 제9조(예인선 등의 항법)","c":"해사법규","x":"예인선이 무역항 안에서 끌 때는 예인선 선수부터 피예인선 선미까지의 길이가 200미터를 넘지 않아야 하고, 한 번에 3척 이상을 끌 수 없습니다. 예인선열이 길고 많아질수록 회두가 어려워 좁은 항내에서 위험해지기 때문입니다. 다만 다른 선박의 출입을 보조하는 경우에는 길이 제한의 예외가 인정됩니다."},{"i":578,"q":"선박의 입항 및 출항에 관한 법률상 선박 출입 신고 면제 대상 선박이 아닌 것은?","o":["관공선, 군함","급유선","도선선","예선"],"a":1,"e":"① 관공선, 군함, 해양경찰함정 등 공공의 목적으로 운영하는 선박,\n② 도선선, 예선 등 선박의 출입을 지원 하는 선박은 공공목적이나 항만 운영의 효율성을 위해 출입 신고가 면제된다.","c":"해사법규","t":"new","x":"출입신고가 면제되는 것은 공공 목적으로 운영되는 선박(관공선, 군함, 해양경찰함정 등)과 도선선·예선처럼 다른 배의 출입을 지원하는 선박입니다. 급유선은 항만에서 상업적으로 연료를 공급하는 배라 면제 대상에 포함되지 않습니다. 공공성과 항만 운영 지원이라는 두 기준으로 판단하면 됩니다."},{"i":579,"q":"선박의 입항 및 출항에 관한 법률상 선박의 출입 통로로 이용하기 위하여 지정·고시한 수로를 무엇 이라 하는가?","o":["좁은수로","침로","지정로","항로"],"a":3,"e":"","c":"해사법규","t":"chg","x":"선박의 입항 및 출항 등에 관한 법률에서 '항로'는 선박의 출입 통로로 이용하기 위해 지정·고시한 수로를 말합니다. 즉 자연 지형이 아니라 행정청이 정해 공표한 길이라는 점이 핵심입니다. 좁은수로는 지형적으로 폭이 좁은 곳을 가리키는 해상교통안전법의 개념이고, 침로는 배가 향하는 방향이라 뜻이 다릅니다. 항로에서는 정박·어로·추월이 제한됩니다."},{"i":580,"q":"무역항의 수상구역 등이나 수상구역 부근에서 선박의 항행을 방해하는 장애물을 발견한 경우 그 장애물을 소유자 또는 점유자에게 제거를 명할 수 있는 자는?","o":["해양수산부장관","경찰서장","시장·군수·구청장","동장"],"a":0,"e":"선박의 입항 및 출항 등에 관한 법률 제40조(장애물의 제거) 제1항","c":"해사법규","x":"무역항의 수상구역 등이나 그 부근에서 선박 항행을 방해하는 장애물을 발견하면, 항만을 관리하는 해양수산부장관이 그 소유자나 점유자에게 제거를 명할 수 있습니다. 항만 시설과 항로의 관리 권한이 해양수산부에 있기 때문입니다. 안전 단속은 해양경찰, 시설과 항로 관리는 해양수산부라는 구분으로 기억하세요."},{"i":581,"q":"무역항의 수상구역 등이나 수상구역 부근에서 공사 또는 작업을 하려는 자는 누구의 허가를 받아야 하나?","o":["해양수산부장관","해양경찰청장","해양경찰서장","시장·군수·구청장"],"a":0,"e":"선박의 입항 및 출항 등에 관한 법률 제41조(공사 등의 허가)","c":"해사법규","x":"무역항의 수상구역 등이나 그 부근에서 공사나 작업을 하려면 해양수산부장관의 허가를 받아야 합니다. 공사로 항로가 좁아지거나 부유물이 생기면 선박 통항에 직접 영향을 주기 때문에 항만 관리 주체가 미리 통제하는 것입니다. 앞의 장애물 제거 명령과 같은 계통의 권한이므로 함께 묶어 정리해 두면 좋습니다."},{"i":582,"q":"무역항의 수상구역 등에서 선박교통에 방해가 될 우려가 있는 행위가 아닌 것은?","o":["어로행위","강력한 불빛","공사 또는 작업","어구의 이동"],"a":3,"e":"선박의 입항 및 출항 등에 관한 법률 제41조(공사 등의 허가), 제44조(어로의 제한), 제45조(등화의 제한)","c":"해사법규","x":"어구를 이동시키는 행위 자체는 선박 교통을 방해하는 행위로 규정되어 있지 않습니다. 반면 항로에서의 어로행위, 항해에 지장을 주는 강력한 불빛, 허가 없는 공사나 작업은 통항을 직접 방해하므로 제한 또는 허가의 대상입니다. 무엇이 항로를 막거나 시야를 해치는가를 기준으로 판단하면 됩니다."},{"i":583,"q":"선박의 입항 및 출항 등에 관한 법률상 무역항의 수상구역 등에서 선박 항행 최고속력을 지정할 것을 요청할 수 있는 자는?","o":["시장","도지사","해양수산부장관","해양경찰청장"],"a":3,"e":"","c":"해사법규","t":"chg","x":"무역항의 수상구역 등에서 선박이 지나치게 빨리 달려 위험하다고 판단되면, 해상 안전과 치안을 담당하는 해양경찰청장이 해양수산부장관에게 항행 최고속력을 지정하도록 요청할 수 있습니다. 즉 요청은 해양경찰청장, 지정·고시는 해양수산부장관이 맡는 구조입니다. 두 기관의 역할을 서로 바꿔 놓는 방식으로 출제되니 '요청과 지정'을 나눠 기억하세요."},{"i":584,"q":"해상교통안전법상 선박의 항행안전을 확보하기 위하여 한쪽 방향으로만 항행할 수 있도록 되어 있는 일정한 범위의 수역은 무엇인가?","o":["분리선","연안 통로대","항로지정제도","통항로"],"a":3,"e":"해상교통안전법 제2조(정의)","c":"해사법규","x":"통항로는 선박이 한쪽 방향으로만 항행하도록 정해 둔 일정한 범위의 수역입니다. 마주 오는 배와 부딪히지 않도록 흐름을 갈라 놓은 것으로, 통항분리수역을 구성하는 핵심 요소입니다. 분리선이나 분리대는 반대 방향의 통항로를 갈라놓는 경계이고, 연안통항대는 통항분리수역 육지 쪽의 수역, 항로지정제도는 항로와 속력 등을 정하는 제도입니다."},{"i":585,"q":"선박의 입항 및 출항 등에 관한 법률상 선박은 무역항의 수상구역 등의 장소에는 정박하거나 정류하지 못한다. 이에 대해 예외적으로 무역항 수상구역 등에서 선박이 정박하거나 정류할 수 있는 사유로 옳지 않은 것은?","o":["해양사고를 피하기 위한 경우","허가를 받은 공사 또는 작업에 사용하는 경우","인명을 구조하거나 급박한 위험이 있는 선박을 구조하는 경우","무역항을 효율적으로 운영하기 위하여 필요하다고 판단되는 경우"],"a":3,"e":"선박의 입항 및 출항 등에 관한 법률 제6조(정박의 제한 및 방법 등) 제2항","c":"해사법규","x":"무역항 수상구역 등에서 정박이나 정류가 예외적으로 허용되는 경우는 해양사고를 피하려는 때, 허가받은 공사나 작업에 사용할 때, 인명이나 급박한 위험에 처한 선박을 구조할 때처럼 긴급하거나 허가를 받은 상황입니다. '무역항을 효율적으로 운영하기 위해 필요하다고 판단되는 경우'는 주관적인 사유라 예외로 규정되어 있지 않습니다."},{"i":586,"q":"무역항을 출항한 선박이 피난, 수리 또는 그 밖의 사유로 출항 후 ( )시간 이내에 귀항하는 경우에는 관리청에 서면 또는 전자적 방법으로 출입 신고서를 제출할 수 있다. ( )에 들어갈 말은?","o":["12시간","24시간","36시간","48시간"],"a":0,"e":"무역항을 출항한 선박이 12시간 이내에 귀항하는 경우는 관리청에 서면 또는 전자적 방법으로 출입 신고서 를 제출할 수 있다.","c":"해사법규","t":"chg","x":"무역항을 출항한 선박이 피난이나 수리 등의 사유로 12시간 이내에 되돌아오는 경우에는 서면이나 전자적 방법으로 출입 신고서를 제출할 수 있습니다. 짧은 시간 안의 귀항은 사실상 같은 항차로 보아 절차를 간소화한 것입니다. 12시간이라는 숫자를 24·36·48시간으로 바꿔 놓는 방식으로 출제됩니다."},{"i":587,"q":"선박의 입항 및 출항 등에 관한 법률상 무역항의 수상구역 등에 계선하려는 자가 신고하여야 하는 선박의 총톤수로 옳은 것은?","o":["10톤","20톤","30톤","40톤"],"a":1,"e":"선박의 입항 및 출항 등에 관한 법률 제7조(선박의 계선 신고 등) 제1항","c":"해사법규","x":"무역항의 수상구역 등에 계선하려는 총톤수 20톤 이상의 선박은 관리청에 신고해야 합니다. 오랫동안 묶어 두는 배는 항만 공간을 차지하고 비상시 이동이 어려워 관리 대상이 되기 때문입니다. 20톤이라는 기준은 우선피항선 판단 기준과 같은 숫자이므로 함께 묶어 외우면 기억에 남습니다."},{"i":588,"q":"선박의 입항 및 출항 등에 관한 법률상 무역항의 수상구역 밖 몇 km까지 폐기물의 투기가 금지되어 있는가?","o":["3km","5km","7km","10km"],"a":3,"e":"무역항의 수상구역 등이나 무역항의 수상구역 밖 10km 이내의 수면에 선박의 안전운항을 저해 할 수 있는 흙, 돌, 나무, 어구 등 폐기물을 버려서는 아니 된다.","c":"해사법규","t":"new","x":"무역항의 수상구역 등과 그 밖으로 10킬로미터 이내의 수면에는 선박 안전운항을 해칠 수 있는 흙·돌·나무·어구 등 폐기물을 버릴 수 없습니다. 항만 주변에 가라앉은 물체는 좌초와 추진기 손상을 일으키기 때문입니다. 거리 기준이 해리가 아니라 킬로미터이고 숫자가 10이라는 점을 함께 기억하세요."},{"i":589,"q":"선박의 입항 및 출항 등에 관한 법률상 수로의 보전을 설명한 내용이다. 옳지 않은 것은 모두 몇 개 인가?\n㉠ 누구든지 무역항의 수상구역 등이나 무역항의 수상구역 밖 5km 이내의 수면에 선박의 안전운항을 해칠 우려가 있는 흙·돌·나무·어구(漁具) 등 폐기물을 버려서는 아니 된다.\n㉡ 관리청은 무역항의 수상구역 등이나 무역항의 수상구역 부근에서 선박의 항행을 방해하거나 방해할 우려가 있는 물건을 발견한 경우에는 그 장애물의 소유자 또는 점유자에게 제거를 명할 수 있다. ㉢ 무역항의 수상구역 등이나 무역항의 수상구역 부근에서 해양수산부령으로 정하는 공사 또는 작업을 하려는 자는 관리청에 신고하여야 한다. ㉣ 무역항의 수상구역 등에서 선박경기 등 대통령령으로 정하는 행사를 하려는 자는 관리청의 허가를 받아야 한다. ㉤ 누구든지 무역항의 수상구역 등에서 선박교통에 방해가 될 우려가 있는 장소 또는 항로에서는 어로(어구 등의 설치를 제외한다)를 하여서는 아니 된다.","o":["1개","2개","3개","4개"],"a":2,"e":"선박의 입항 및 출항 등에 관한 법률 제38조, 제40조, 제41조, 제42조, 제44조","c":"해사법규","x":"수로의 보전 조항들은 폐기물 투기 금지 구역이 무역항 수상구역 밖 10킬로미터 이내라는 점, 장애물 제거 명령과 공사 허가의 권한이 해양수산부장관에게 있다는 점 등을 정하고 있습니다. 보기에서 거리 기준이나 권한 기관을 바꿔 놓은 서술이 세 개여서 옳지 않은 것은 3개입니다. 각 조항의 숫자와 주체를 정확히 대조해야 하는 문항입니다."},{"i":590,"q":"선박의 입항 및 출항 등에 관한 법률상 우선피항선에 해당되지 않는 것은?","o":["부선","총톤수 20톤인 선박","예선","주로 노와 삿대로 운전하는 선박"],"a":1,"e":"부선, 주로 노와 삿대로 운전하는 선박, 예선, 항만 운송 관련 사업에 등록된 선박(분뇨,폐기물운반선, 급유선, 어획물운반선 등)은 우선피항선에 해당된다.","c":"해사법규","t":"new","x":"우선피항선은 부선, 예선, 주로 노와 삿대로 운전하는 선박, 항만운송 관련 사업에 등록된 급유선·폐기물운반선 등, 그리고 총톤수 20톤 미만의 선박입니다. 따라서 총톤수가 정확히 20톤인 선박은 '20톤 미만'에 해당하지 않아 우선피항선이 아닙니다. 미만과 이상의 경계를 노린 문제이므로 조사를 정확히 읽어야 합니다."},{"i":591,"q":"해상교통안전법상 용어 정의와 관련하여 ( ) 안에 들어갈 알맞은 말은? 거대선(巨大船)이란 길이 (\n㉠ ) 이상의 선박을 말하고, 고속여객선이란 시속 (\n㉡ ) 이상으로 항행하는 여객선을 말한다.","o":["㉠ 100m ㉡ 10노트","㉠ 100m ㉡ 15노트","㉠ 200m ㉡ 10노트","㉠ 200m ㉡ 15노트"],"a":3,"e":"해상교통안전법 제2조(정의) 제5호, 제6호","c":"해사법규","x":"해상교통안전법에서 거대선은 길이 200미터 이상의 선박을, 고속여객선은 시속 15노트 이상으로 항행하는 여객선을 말합니다. 크기와 속력이 커질수록 정지거리와 회두 반경이 길어져 별도의 관리가 필요하기 때문에 정의를 따로 두고 있습니다. 200미터와 15노트라는 두 숫자를 짝지어 기억하세요."},{"i":592,"q":"해상교통안전법상 용어의 정의에 대한 설명이다. 옳은 것은 모두 몇 개인가?\n㉠ 통항로란 통항분리수역의 육지 쪽 경계선과 해안 사이의 수역\n㉡ 항로지정제도란 선박이 통항하는 항로, 속력 및 그 밖에 선박 운항에 관한 사항을 지정하는 제도 ㉢ 연안통항대란 서로 다른 방향으로 진행하는 통항로를 나누는 선 또는 일정한 폭의 수역 ㉣ 통항분리제도란 선박의 충돌을 방지하기 위하여 통항로를 설정하거나 그 밖의 적절한 방법 으로 한쪽 방향으로만 항행할 수 있도록 항로를 분리하는 제도","o":["1개","2개","3개","4개"],"a":1,"e":"㉠ 통항로란 선박의 항행안전을 확보하기 위하여 한쪽 방향으로만 항행할 수 있도록 되어 있는 일정한 범위의 수역 ㉢ 연안통항대란 통항분리수역의 육지 쪽 경계선과 해안 사이의 수역","c":"해사법규","x":"옳은 것은 두 개입니다. 항로지정제도는 선박이 통항하는 항로와 속력 등을 지정하는 제도가 맞습니다. 반면 통항로는 한쪽 방향으로만 항행하도록 정한 수역이고, 통항분리수역의 육지 쪽 경계선과 해안 사이의 수역은 연안통항대이므로 두 정의가 서로 뒤바뀌어 있습니다. 용어를 맞바꿔 놓는 전형적인 유형입니다."},{"i":593,"q":"해상교통안전법상 교통안전특정해역이 아닌 곳은?","o":["부산구역","울산구역","여수구역","군산구역"],"a":3,"e":"교통안전특정해역이란 해양수산부장관이 “해상교통량이 많은 해역, 거대선, 위험물운반선, 고속여객선 등의 통항이 잦은 해역”과 같이 대형 해양사고의 발생 우려가 있는 해역을 교통안전특정해역으로 설정된 곳으로, 인천구역, 부산구역, 울산구역, 포항구역, 여수구역 총 5곳이 있다.","c":"해사법규","t":"new","x":"교통안전특정해역은 해상교통량이 많고 거대선·위험물운반선·고속여객선의 통항이 잦아 대형 사고 우려가 큰 해역으로 지정합니다. 인천, 부산, 울산, 포항, 여수 구역이 여기에 해당하며 군산은 지정되어 있지 않습니다. 대형 산업항이 밀집한 해역이라는 성격으로 이해하면 목록을 기억하기 쉽습니다."},{"i":594,"q":"어느 선박이 좁은 수로 등의 굽은 부분에서 장음 1회의 기적신호를 들었을 때 조치사항으로 가장 적절한 것은?(단, 이 선박은 상대 선박을 눈으로 볼 수 없는 상태이다.)","o":["투묘하고 대기한다.","속력을 올려 빨리 지나간다.","응답신호를 울려서는 안된다.","장음 1회에 대한 응답신호를 울리고 특별한 주의와 경계를 한다."],"a":3,"e":"장음 1회에 대한 응답신호로 장음 1회를 울려야 하며, 특별한 주의와 경계를 해야 한다.","c":"해사법규","t":"new","x":"굽은 부분에서 장음 1회를 들었다면 보이지 않는 곳에 다른 배가 접근하고 있다는 뜻이므로, 같은 장음 1회로 응답해 자기 존재를 알리고 특별한 주의와 경계를 유지해야 합니다. 응답하지 않으면 상대가 이쪽을 모르고 진입하게 되고, 속력을 올려 통과하려는 것은 더 위험합니다. 신호는 반드시 주고받아야 의미가 있습니다."},{"i":595,"q":"해상교통안전법상 안전한 속력을 결정할 때 고려하여야 할 요소에 해당되지 않는 것은?","o":["선박 교통 상황","선장의 면허 등급","자선의 조종성능","시계 상태"],"a":1,"e":"안전한 속력을 결정할 때 고려 요소(시계 상태, 해상교통량의 밀도, 선박의 정지거리 및 선회성능, 야간 항해에 지장을 주는 불빛의 유무, 바람․조류 등의 기상 상태, 선박의 흘수 및 수심, 레이더 특성 등)","c":"해사법규","t":"new","x":"안전한 속력은 지금 이 순간 충돌을 피할 수 있는가를 기준으로 정해지므로, 시계 상태, 해상교통량, 정지거리와 선회 성능, 야간의 불빛, 바람과 조류, 흘수와 수심, 레이더 성능 같은 요소를 고려합니다. 반면 선장의 면허 등급은 사람의 자격일 뿐 그 순간 배가 멈출 수 있는 거리와는 관계가 없어 고려 요소가 아닙니다."},{"i":596,"q":"선박의 입항 입항 및 출항 등에 관한 법률상 출입 신고가 제외되는 선박이 아닌 것은?","o":["총톤수 10톤 어선","해양사고 구조에 사용되는 선박","국내항 간을 운항하는 모터보트","항만의 효율성을 위하여 해양수산부령으로 정하는 선박"],"a":0,"e":"선박의 입항 및 출항 등에 관한 법률 제4조(출입신고)","c":"해사법규","x":"출입신고가 면제되는 것은 해양사고 구조에 사용되는 선박, 국내항 간을 운항하는 모터보트, 그 밖에 항만 운영의 효율을 위해 해양수산부령으로 정한 선박 등입니다. 총톤수 10톤인 어선은 이 면제 목록에 해당하지 않으므로 출입신고를 해야 합니다. 면제 대상은 긴급성이나 소형·단거리 운항이라는 성격을 가진다는 점으로 접근하면 됩니다."},{"i":597,"q":"항행 중인 동력선이 서로 상대의 시계 안에 있는 경우, 기관을 후진하고 있는 경우의 기적신호는?","o":["장음 1회","단음 1회","단음 2회","단음 3회"],"a":3,"e":"해상교통안전법 제99조(조종신호와 경고신호) 제1항","c":"해사법규","x":"조종신호는 자기 배가 무엇을 하려는지 상대에게 알리는 신호입니다. 오른쪽으로 돌 때는 단음 1회, 왼쪽으로 돌 때는 단음 2회, 기관을 후진할 때는 단음 3회를 울립니다. 후진은 상대가 예측하기 가장 어려운 동작이라 신호 횟수가 가장 많다고 이해하면 순서를 기억하기 쉽습니다."},{"i":598,"q":"해상교통안전법에서 정하고 있는 해양레저활동 금지구역에서의 제한되는 레저행위로 옳지 않은 것은?","o":["「수상레저안전법」에 따른 수상레저활동","「수중레저활동의 안전 및 활성화 등에 관한 법률」에 따른 수중레저활동","「마리나항만의 조성 및 관리 등에 관한 법률」에 따른 마리나선박을 이용한 유람, 스포츠 또는 여가 행위","「낚시관리 및 육성법」에 따른 고기잡이, 관광 또는 그 밖의 유락 행위"],"a":3,"e":"갑, 을, 병 외에 「유선 및 도선 사업법」 제2조제1호에 따른 유선사업에 사용되는 선박을 이용한 고기잡이, 관광 또는 그 밖의 유락(遊樂) 행위(해상교통안전법 시행령 제14조_해상교통장애행위)","c":"해사법규","x":"해양레저활동 금지구역에서 제한되는 행위는 수상레저활동, 수중레저활동, 마리나선박을 이용한 유람·스포츠·여가 행위, 그리고 유선사업 선박을 이용한 고기잡이나 관광 등입니다. 낚시관리 및 육성법에 따른 고기잡이는 이 목록에 들어 있지 않아 답이 됩니다. 어떤 법에 따른 행위가 열거되어 있는지를 대조하는 문제입니다."},{"i":599,"q":"선박의 왼쪽에 설치하는 현등의 색깔은 무엇인가?","o":["녹색","적색","황색","백색"],"a":1,"e":"해상교통안전법 제86조(등화의 종류)","c":"해사법규","x":"현등은 배의 진행 방향을 알려 주는 등화로, 좌현에는 적색, 우현에는 녹색을 답니다. 상대 배의 적색 등이 보이면 그 배의 왼쪽을 보고 있는 것이므로 내가 그 배의 우현 쪽에서 접근하고 있다는 뜻이 됩니다. 좌현 적색, 우현 녹색은 등화 문제의 기본이므로 반드시 정확히 외워야 합니다."},{"i":600,"q":"선박의 음향신호 중 장음은 어느 정도 계속되는 소리를 말하는가?","o":["1초","2 ~ 3초","3 ~ 4초","4 ~ 6초"],"a":3,"e":"해상교통안전법 제97조(기적의 종류)","c":"해사법규","x":"음향신호에서 단음은 약 1초, 장음은 4초에서 6초까지 계속되는 소리를 말합니다. 두 신호의 길이를 명확히 구분해 두어야 조종신호와 경고신호, 제한시계 신호를 정확히 주고받을 수 있습니다. 화재 경보의 장음 5회처럼 다른 규정에서도 이 정의가 그대로 쓰입니다."},{"i":601,"q":"해상교통안전법상 좁은 수로 등에서 항법으로 옳지 않은 것은?","o":["좁은 수로나 항로를 따라 항행하는 선박은 항행의 안전을 고려하여 될 수 있으면 좁은 수로 등의 오른편 끝 쪽에서 항행하여야 한다.","길이 20미터 미만의 선박이나 범선은 좁은 수로 등의 안쪽에서만 안전하게 항행할 수 있는 다른 선박의 통행을 방해하여서는 아니 된다.","좁은 수로에서는 앞지르기를 할 수 없다.","부득이하다고 인정되는 경우가 아니면 좁은 수로 내에서 정박하여서는 아니 된다."],"a":2,"e":"좁은 수로에서 ‘앞지르기 당하는 선박(피추월선)’이 눈에 보이고, 안전하게 통과할 수 있다고 판단될 때에는 앞지르기를 할 수 있다. 이때, 추월선은 피추월선에게 앞지르기 하겠다는 의사를 알리는 기적신호를 울려야 하며, 피추월선의 동의를 얻은 후에 앞지르기를 할 수 있다.","c":"해사법규","t":"new","x":"좁은 수로에서도 피추월선을 눈으로 볼 수 있고 안전하게 통과할 수 있다고 판단되며 기적신호로 동의를 얻으면 앞지르기가 가능합니다. 따라서 '앞지르기를 할 수 없다'는 단정이 틀렸습니다. 오른편 끝 쪽으로 항행할 것, 길이 20미터 미만의 선박이나 범선이 다른 배의 통항을 방해하지 않을 것, 부득이한 경우가 아니면 정박하지 않을 것은 옳습니다."},{"i":602,"q":"상대보트의 추월신호에 대하여 동의할 때의 자선의 음향 신호는?","o":["장음 - 단음 - 단음","장음 - 장음 - 단음","단음 - 장음 - 장음 - 단음","장음 - 단음 - 장음 - 단음"],"a":3,"e":"해상안전교통법 제99조(조종신호와 경고신호)","c":"해사법규","x":"좁은 수로 등에서 앞지르기를 하려는 배가 신호를 보내면, 앞선 배가 동의할 때는 장음 1회·단음 1회·장음 1회·단음 1회의 순서로 울려 응답합니다. 길고 짧은 소리를 번갈아 내어 다른 신호와 확실히 구별되도록 정한 것입니다. 추월 요청 신호와 동의 신호를 짝지어 외워 두면 헷갈리지 않습니다."},{"i":603,"q":"해상교통안전법상 안전관리체계에 대한 인증심사의 종류로 옳지 않은 것은?","o":["최초인증심사","갱신인증심사","중간인증심사","특별인증심사"],"a":3,"e":"해상교통안전법 제49조(인증심사)","c":"해사법규","x":"안전관리체계 인증심사는 처음 받는 최초인증심사, 유효기간이 끝날 때 받는 갱신인증심사, 그 사이에 유지 여부를 확인하는 중간인증심사, 그리고 필요할 때 임시로 실시하는 심사로 구성됩니다. '특별인증심사'라는 종류는 규정되어 있지 않아 답이 됩니다. 심사의 시점별 역할로 나누어 기억하면 됩니다."},{"i":604,"q":"해상교통안전법상 자선의 정횡 앞쪽에 있는 다른 선박에서 무중신호를 듣게 된 경우에 취해야 할 조치로 옳지 않은 것은?","o":["대각도로 좌현 전타한다.","타효 가능한 속력으로 감속한다.","필요에 따라 자기 선박의 진행을 완전히 멈추어야 한다.","충돌할 위험성이 사라질 때까지 주의하여 항행하여야 한다."],"a":0,"e":"제한된 시계 상태에서 “자선의 양쪽 현의 정회 앞쪽에서 다른 선박에서 무중신호를 듣는 경우나 다른 선박과 매우 근접한 것을 피할 수 없는 경우”에는 최소한의 속력으로 감속하고 필요하면 정지, 필요에 따라 투묘도 고려하여 위험이 사라질 때까지 주의하여 항행하여야 한다.","c":"해사법규","t":"new","x":"제한시계에서 정횡 앞쪽의 다른 배로부터 무중신호를 들으면, 타효를 유지할 수 있는 최소한의 속력까지 줄이고 필요하면 완전히 정지해 위험이 사라질 때까지 주의해 항행해야 합니다. 보이지 않는 상대의 위치를 정확히 알 수 없는 상태에서 대각도로 좌현 전타하면 오히려 상대의 진로로 뛰어들 수 있어 금물입니다."},{"i":605,"q":"해상교통안전법상 해상교통의 장애가 되는 스쿠버 다이빙, 윈드서핑 등 대통령령으로 정하는 행위를 하여서는 아니 되는 수역을 정하여 고시하여야 하는 자는?","o":["해양경찰청장","해양수산부장관","해양경찰서장","시·도지사"],"a":2,"e":"해상교통안전법 제33조(항로 등의 보전) 제3항, 시행령 제14조(해상교통장애행위)","c":"해사법규","x":"스쿠버 다이빙이나 윈드서핑처럼 해상교통에 지장을 주는 행위를 금지하는 수역은 관할 해양경찰서장이 정해 고시합니다. 현장의 통항 상황과 활동 실태를 가장 잘 아는 기관이 지정하도록 한 것입니다. 항로 지정이나 보호수역 관리처럼 큰 틀의 권한은 해양수산부장관에게 있다는 점과 구분해 기억하세요."},{"i":606,"q":"해상교통안전법상 연안통항대를 따라 항행할 수 있는 선박이 아닌 것은?","o":["범선","어로에 종사하고 있는 선박","고속 여객선","길이 20m 미만의 선박"],"a":2,"e":"연안통항대로 항행할 수 있는 선박은 “길이 20m 미만 선박, 범선, 어로에 종사하고 있는 선박, 인접한 항구에 출입하는 선박, 연안통항대 있는 해양시설 또는 도선사의 승하선 장소에 출입하는 선박, 급박한 위험을 피하기 위한 선박”이다.","c":"해사법규","t":"new","x":"연안통항대는 통항로를 이용하기 어려운 작은 배들을 위한 공간이므로, 길이 20미터 미만의 선박, 범선, 어로에 종사하는 선박, 인접 항구에 드나드는 선박 등이 이용할 수 있습니다. 고속여객선은 크고 빠른 배라 원칙적으로 통항로를 따라야 하며 연안통항대를 이용할 수 있는 선박에 포함되지 않습니다."},{"i":607,"q":"해상에서 발생한 조난선박 통보의 내용 중 필수 정보에 해당하지 않는 것은?","o":["선종 또는 선명","기관의 종류 및 마력","조난위치","침로와 속력"],"a":1,"e":"","c":"해사법규","x":"조난 통보에는 구조대가 즉시 움직이는 데 필요한 정보가 들어가야 합니다. 어떤 배인지(선종·선명), 어디에 있는지(조난 위치), 어떤 상태로 움직이고 있는지(침로와 속력), 무슨 조난을 당했고 어떤 도움이 필요한지, 몇 명이 타고 있는지가 그것입니다. 기관의 종류나 마력은 구조 활동에 직접 쓰이지 않는 제원 정보라 필수 항목이 아닙니다."},{"i":608,"q":"해상교통안전법상 통항분리수역 항행 시 준수사항이다. 옳은 것으로만 묶인 것은?\n① 통항로 안에서는 정하여진 진행방향으로 항행할 것\n② 통항로 부근 연안해역 안전을 위해 분리선이나 분리대에 될 수 있으면 붙어서 항행할 것\n③ 통항로의 출입 시에는 출입구를 통할 것\n④ 부득이 통항로의 옆쪽으로 출입하는 경우, 그 통항로 진행방향에 대하여 직각으로 출입할 것","o":["①, ②","①, ③","②, ③","③, ④"],"a":1,"e":"","c":"해사법규","x":"통항분리수역에서는 통항로 안에서 정해진 진행 방향으로만 항행해야 하고, 드나들 때는 원칙적으로 통항로의 출입구를 이용해야 합니다. 반면 분리선이나 분리대에는 될 수 있으면 접근하지 말아야 하며, 부득이 옆쪽으로 드나들 때는 직각이 아니라 진행 방향에 대해 될 수 있으면 작은 각도로 출입해야 합니다. 그래서 ①과 ③만 옳습니다."},{"i":609,"q":"해상교통여건 등을 고려하여 지정 고시하는 수역에서 모터보트 등을 이용 해양 레저활동을 하고자 할 때 허가권자는?","o":["해양수산부장관","해양경찰청장","지방해양수산청장","해양경찰서장"],"a":3,"e":"해상교통안전법 제33조(항로 등의 보전), 시행령 제15조(해양레저활동의 허가)","c":"해사법규","x":"해상교통 여건을 고려해 지정·고시한 수역에서 모터보트 등으로 해양레저활동을 하려면 관할 해양경찰서장의 허가를 받아야 합니다. 현장에서 해상 안전과 통항을 관리하는 기관이 해양경찰이기 때문입니다. 항로 지정이나 항만 관리는 해양수산부, 현장 활동 허가와 단속은 해양경찰이라는 역할 분담으로 정리해 두세요."},{"i":610,"q":"해상교통안전법상 통항분리수역에서의 항행방법에 대한 설명이다. 옳지 않은 것은?","o":["선박은 연안통항대에 인접한 통항분리수역의 통항로를 안전하게 통과할 수 있는 경우에는 연안통항대를 따라 항행하여서는 아니 된다.","길이 20미터 미만의 선박, 범선 등은 연안통항대를 따라 항행할 수 있다.","통항분리수역에서 어로에 종사하고 있는 선박은 통항로를 따라 항행하는 다른 선박의 항행을 방해 하여서는 아니 된다.","통항분리수역 안에서 항행 안전을 유지하기 위한 작업을 하는 선박(조종성능제한 없음)은 통항분리 수역의 출입구 부근에 정박할 수 있다."],"a":3,"e":"","c":"해사법규","x":"통항분리수역의 출입구 부근은 배들이 몰려 드나드는 곳이라 정박이 금지됩니다. 다만 항행 안전을 유지하기 위한 작업이나 해저 전선 부설처럼 부득이한 경우에 한해 예외가 인정되는데, 이때는 그 작업으로 조종 성능이 제한되는 선박이어야 합니다. 보기에서 조종성능 제한이 없다고 못 박았으므로 정박할 수 없습니다. 나머지 세 보기는 규정 그대로입니다."},{"i":611,"q":"해상교통안전법상 선박의 등화에 대한 설명이다. 옳지 않은 것은?","o":["전주등이란 360도에 걸치는 수평의 호를 비추는 등화(섬광등은 제외)","예선등이란 선미등과 같은 특성을 가진 흰색 등","섬광등이란 360도에 걸치는 수평의 호를 비추는 등화로서 일정한 간격으로 1분에 120회 이상 섬광을 발하는 등","선미등이란 135도에 걸치는 수평의 호를 비추는 흰색 등으로서 그 불빛이 정선미 방향으로부터 양쪽 현의 67.5도까지 비출 수 있도록 선미 부분 가까이에 설치된 등"],"a":1,"e":"해상교통안전법 제86조(등화의 종류)","c":"해사법규","x":"예선등은 선미등과 같은 특성을 가지되 색이 황색인 등화입니다. 다른 배를 끌고 있다는 사실을 뒤따르는 배에 알리기 위해 일부러 흰색과 구별되는 색을 쓰는 것이므로, 흰색이라고 적은 보기가 틀렸습니다. 전주등은 360도를 비추는 등, 섬광등은 1분에 120회 이상 규칙적으로 빛나는 등, 선미등은 정선미 방향 좌우 67.5도씩 합계 135도를 비추는 흰색 등입니다."},{"i":612,"q":"해상교통안전법상 통항 우선권에 대한 설명이다. 옳은 것은?(다른 예외적인 사항은 고려하지 않는다)","o":["항행 중인 동력선 〈 어로에 종사하고 있는 선박 〈 범선 〈 흘수제약선 〈 조종불능선","항행 중인 동력선 〈 범선 〈 어로에 종사하고 있는 선박 〈 조종불능선 〈 흘수제약선","항행 중인 동력선 〈 범선 〈 어로에 종사하고 있는 선박 〈 흘수제약선 〈 조종불능선","항해 중인 동력선 〈 어로에 종사하고 있는 선박 〈 범선 〈 조종불능선 〈 흘수제약선"],"a":2,"e":"해상교통안전법 제83조(선박 사이의 책무)","c":"해사법규","x":"피항 순서는 조종의 자유가 적은 배일수록 우선합니다. 항행 중인 동력선이 가장 많이 피해야 하고, 그다음이 범선, 어로에 종사하는 선박, 흘수제약선이며, 조종불능선이 가장 우선합니다. 스스로 움직일 수 있는 정도가 작아질수록 앞자리로 간다고 이해하면 순서를 외우지 않고도 배열할 수 있습니다."},{"i":613,"q":"해상교통안전법상 가항수역의 수심 및 폭과 선박의 흘수와의 관계에 비추어 볼 때 진로에서 벗어날 수 있는 능력이 매우 제한되어 있는 동력선은?","o":["조종불능선","조종제한선","범선","흘수제약선"],"a":3,"e":"","c":"해사법규","x":"흘수제약선은 수심과 항로 폭에 비해 흘수가 깊어 진로를 벗어나기가 매우 어려운 동력선을 말합니다. 배 자체는 멀쩡하지만 얕은 수심 때문에 마음대로 피할 수 없는 상태입니다. 조종불능선은 고장 등으로 조종이 불가능한 배, 조종제한선은 준설이나 예인 같은 작업 성격 때문에 조종이 제한되는 배라 원인이 다릅니다. 원인을 기준으로 세 용어를 구분하세요."},{"i":614,"q":"해상교통안전법상 서로시계 내에 있는 2척의 동력선의 마주치는 상태에서의 항법이다. 옳지 않은 것은?","o":["2척의 동력선이 마주치거나 거의 마주치게 되어 충돌의 위험이 있을 때에는 각 동력선은 서로 다른 선박의 좌현 쪽을 지나갈 수 있도록 침로를 우현 쪽으로 변경하여야 한다.","야간에 2개의 상대 선박의 양쪽 현등을 볼 수 있는 경우 마주치는 상태에 있는 경우이다.","주간에 2척의 선박의 마스트가 선수에서 선미까지 일직선이 되거나 거의 일직선이 되는 경우 마주 치는 상태에 있는 경우이다.","선박은 마주치는 상태에 있는지가 분명하지 아니한 경우에는 정확한 정보 판단을 위해 침로와 속력을 유지하여야 한다."],"a":3,"e":"선박은 마주치는 상태에 있는지가 분명하지 아니한 경우에는 마주치는 상태에 있다고 보고 필요한 조치를 취하여야 한다.(해상교통안전법 제79조_마주치는 상태)","c":"해사법규","t":"chg","x":"마주치는 상태인지 분명하지 않을 때는 마주치는 상태에 있다고 보고 필요한 조치를 취해야 합니다. 애매한 상황에서 침로와 속력을 그대로 유지하면 대응이 늦어지기 때문입니다. 서로 상대의 좌현 쪽을 지나도록 우현 변침할 것, 양쪽 현등이 모두 보이면 마주치는 상태로 볼 것, 마스트가 일직선으로 겹쳐 보이면 마주치는 상태로 볼 것은 옳습니다."},{"i":615,"q":"선박이 통항하는 항로, 속력 및 그 밖에 선박 운항에 관한 사항을 지정하는 제도를 무엇이라 하는가?","o":["선박교통관제","항로지정제도","연안통항대","분리선"],"a":1,"e":"해상교통안전법 제2조(정의)","c":"해사법규","x":"항로지정제도는 선박이 통항할 항로와 속력, 그 밖의 운항 사항을 정해 두는 제도로, 통항이 복잡한 해역에서 사고를 줄이기 위해 씁니다. 선박교통관제는 관제소가 실시간으로 배와 교신하며 통항을 관리하는 제도, 연안통항대와 분리선은 통항분리수역을 구성하는 요소이므로 개념의 층위가 다릅니다."},{"i":616,"q":"해상교통안전법에서 말하는 선박의 폭을 나타낸 설명은?","o":["선박 길이의 종방향 외판의 외면으로부터 반대쪽 외판의 외면 사이의 최대 수평거리","선박 길이의 횡방향 외판의 내면으로부터 반대쪽 외판의 내면 사이의 최대 수평거리","선박 길이의 횡방향 외판의 외면으로부터 반대쪽 외판의 외면 사이의 최대 수평거리","선박 길이의 횡방향 외판의 외면으로부터 반대쪽 외판의 외면 사이의 최대 수직거리"],"a":2,"e":"해상교통안전법 제2조(정의)","c":"해사법규","x":"선박의 폭은 횡방향으로, 즉 배를 가로지르는 방향으로 한쪽 외판의 바깥면에서 반대쪽 외판의 바깥면까지의 최대 수평거리를 말합니다. 안쪽 면이 아니라 바깥면 기준이고, 수직이 아니라 수평 거리라는 두 가지를 모두 만족해야 합니다. 보기들이 내면·외면, 수평·수직을 하나씩 바꿔 놓았으므로 두 조건을 함께 확인해야 합니다."},{"i":617,"q":"통항분리수역의 육지 쪽 경계선과 해안 사이의 수역을 무엇이라 하는가?","o":["통항분리제도","분리선","연안통항대","항로지정제도"],"a":2,"e":"해상교통안전법 제2조(정의) 제27호","c":"해사법규","x":"연안통항대는 통항분리수역의 육지 쪽 경계선과 해안 사이에 있는 수역입니다. 길이 20미터 미만의 선박이나 범선처럼 작은 배가 큰 배들의 통항로를 피해 연안을 따라 항행할 수 있도록 마련해 둔 공간입니다. 다만 통항로를 안전하게 통과할 수 있는 배는 연안통항대를 이용해서는 안 된다는 제한이 함께 붙습니다."},{"i":618,"q":"해상교통안전법상 앞지르기 항법에 대한 설명이다. 옳지 않은 것은?","o":["선박은 스스로 다른 선박을 앞지르기하고 있는지 분명하지 아니한 경우에는 앞지르기 하는 배로 보고 필요한 조치를 취하여야 한다.","다른 선박의 양쪽 현의 정횡으로부터 22.5도를 넘는 뒤쪽에서 그 선박을 앞지르는 선박은 앞지르기 하는 배로 보고 필요한 조치를 취하여야 한다.","야간에는 앞 선박의 선미등만 볼 수 있고 어느 쪽의 현등도 볼 수 없는 경우, 뒤 선박은 앞지르기 하는 배로 보고 필요한 조치를 취하여야 한다.","추월하면서 2척 선박 사이의 방위 변화가 생겨 앞 선박의 양쪽 정횡으로부터 22.5도 이내가 되는 경우 추월상황은 종료된다."],"a":3,"e":"","c":"해사법규","x":"앞지르기는 뒤 선박이 앞 선박을 완전히 앞질러 충분히 벗어날 때까지 계속되며, 그 사이 두 배의 방위가 달라져도 추월 상황이 끝나지 않습니다. 만약 방위 변화만으로 지위가 바뀐다면 추월선이 도중에 횡단선으로 둔갑해 책임을 벗게 되므로, 법은 이를 막고 있습니다. 나머지 보기는 정횡 뒤 22.5도 기준, 선미등만 보이는 야간 판단 등 규정 그대로입니다."},{"i":619,"q":"해상교통안전법상 (항행 중이나 정박 중에 있지 않은) 도선선이 표시해야 하는 등화로서 옳은 것은? (다른 예외적인 사정은 고려하지 않는다.)","o":["마스트의 꼭대기나 그 부근에 수직선 위아래쪽에 흰색 전주등 각 1개","마스트의 꼭대기나 그 부근에 수직선 위아래쪽에 붉은색 전주등 각 1개","마스트의 꼭대기나 그 부근에 수직선 위쪽에는 흰색 전주등, 아래쪽에는 붉은색 전주등 각 1개","마스트의 꼭대기나 그 부근에 수직선 위쪽에는 붉은색 전주등, 아래쪽에는 흰색 전주등 각 1개"],"a":2,"e":"해상교통안전법 제94조(도선선) 제1항, 제2항","c":"해사법규","x":"도선 업무에 종사하는 선박은 마스트 꼭대기나 그 부근에 수직으로 위쪽에는 흰색, 아래쪽에는 붉은색 전주등을 각 1개씩 표시합니다. 위가 흰색이라는 순서를 기억하는 것이 핵심이며, 항행 중일 때는 여기에 현등과 선미등을, 정박 중일 때는 정박등을 함께 표시합니다. 색 순서를 뒤집어 놓은 보기가 늘 함께 나옵니다."},{"i":620,"q":"해상교통안전법상 선박은 다른 선박과의 충돌을 피하기 위하여 적절하고 효과적인 동작을 취하거나 당시의 상황에 알맞은 거리에서 선박을 멈출 수 있도록 항상 안전한 속력으로 항행하여야 한다. 안전한 속력을 결정할 때 고려해야 할 사항이라고 할 수 없는 것은?","o":["해상교통량의 밀도","레이더의 특성 및 성능","선박의 운항가능 거리","바람·해면 및 조류의 상태와 항행장애물의 근접상태"],"a":2,"e":"해상교통안전법 제71조(안전한 속력) 제2항 제1호부터 제9호","c":"해사법규","x":"안전한 속력을 정할 때는 시계 상태, 해상교통량의 밀도, 정지거리와 선회 성능, 야간의 배경 광량, 바람·해면·조류의 상태와 항행장애물의 근접 상태, 흘수와 수심의 관계, 레이더의 특성과 성능 등을 고려합니다. 모두 지금 이 순간의 충돌 위험과 직결되는 요소입니다. 반면 선박이 얼마나 멀리 갈 수 있는지를 뜻하는 운항가능 거리는 항속 능력의 문제라 고려 사항이 아닙니다."},{"i":621,"q":"해상교통안전법 제83조(선박 사이의 책무)에 의할 때, 가장 우선적인 피항의무가 있는 선박은?","o":["항행 중인 동력","범선","수상항공기","수면에서 항행 중인 수면비행선박"],"a":2,"e":"","c":"해사법규","x":"수상항공기는 물 위에서 움직임이 자유롭지 못하고 다른 선박의 항법을 따르기 어려우므로, 모든 선박으로부터 충분히 떨어져 항행하고 스스로 피해야 할 의무를 집니다. 즉 보기 중 피항 부담이 가장 큽니다. 일반적인 피항 순서는 조종불능선·조종제한선, 흘수제약선, 어로 종사선, 범선, 동력선 순으로 뒤로 갈수록 피해야 하며, 수상항공기와 수면비행선박이 그 뒤에 놓입니다."},{"i":622,"q":"제한된 시계에서의 항법에 대한 설명이다. 옳지 않은 것은 몇 개인가?\n① 제한된 시계에서의 항법은 시계가 제한된 수역 또는 그 부근을 항행하고 있는 선박이 서로 시계 안에 있지 아니한 경우에 적용한다.\n② 모든 선박은 시계가 제한된 그 당시의 사정과 조건에 적합한 안전한 속력으로 항행하여야 한다.\n③ 레이더만으로 다른 선박이 있는 것을 탐지한 선박은 해당 선박과 얼마나 가까이 있는지 또는 충돌할 위험이 있는지를 판단하여야 한다.\n④ 피항동작이 침로를 변경하는 것만으로 이루어질 경우에는 다른 선박이 자기 선박의 양쪽 현의 정횡 앞쪽에 있는 경우 좌현 쪽으로 침로를 변경하는 행위는 피하여야 한다.","o":["없음","1개","2개","3개"],"a":0,"e":"","c":"해사법규","x":"네 가지 서술이 모두 규정과 일치합니다. 제한시계 항법은 서로 시계 안에 있지 않은 상태에 적용되고, 모든 선박은 그 상황에 맞는 안전한 속력으로 항행해야 하며, 레이더로만 다른 배를 탐지한 경우 접근 상태와 충돌 위험을 판단해야 합니다. 또 침로 변경만으로 피할 때는 정횡 앞쪽에 있는 배에 대해 좌현 변침을 피해야 합니다. 그래서 옳지 않은 것은 없습니다."},{"i":623,"q":"유지선이라 함은 서로 시계내에서 ( )을 유지하는 선박을 말한다. ( )에 알맞은 말은?","o":["항해 속력","일정한 타각","침로와 속력","일정한 간격"],"a":2,"e":"통상적으로 유지선이라 함은 횡단상태에서 침로와 속력을 유지하여야 하는 선박을 말한다.","c":"해사법규","t":"new","x":"유지선은 횡단 상태 등에서 상대가 피해 주기를 기다리며 자기 침로와 속력을 그대로 유지해야 하는 선박입니다. 서로 예측 가능한 상태를 만들어야 피항선이 안전하게 피할 수 있기 때문입니다. 다만 상대가 적절한 동작을 하지 않아 충돌을 피할 수 없다고 판단되면 유지선도 스스로 피항 동작을 취해야 합니다."},{"i":624,"q":"항행 중인 동력선이 표시해야 하는 등화에 대한 설명이다. 가장 옳지 않은 것은?","o":["항행 중인 동력선은 마스트등, 현등, 선미등을 표시하여야 한다.","수면에 떠 있는 상태로 항행 중인 선박은 마스트등, 현등, 선미등에 덧붙여 홍색의 섬광등 1개를 표시 하여야 한다.","길이 12미터 미만의 동력선은 흰색 전주등 1개와 현등 1쌍을 표시할 수 있다.","길이 7미터 미만이고 최대속력이 7노트 미만인 동력선은 흰색 전주등 1개만을 표시할 수도 있다."],"a":1,"e":"","c":"해사법규","x":"수면비행선박이 마스트등·현등·선미등에 더해 고광도 홍색 섬광등을 표시해야 하는 때는 이륙하거나 착륙하는 중, 또는 수면에 근접해 비행하는 중일 때입니다. 단순히 수면에 떠서 항행 중일 때는 일반 동력선과 같은 등화만 표시하므로 이 보기가 틀립니다. 길이 12미터 미만과 7미터 미만 소형선의 간소화 규정은 나머지 보기 그대로입니다."},{"i":625,"q":"항행장애물을 발생시킨 선박의 선장, 선박소유자 등이 보고해야 하는 사항이 아닌 것은?","o":["선박의 명세에 관한 사항","화물소유자의 성명 및 주소","항행장애물의 위치에 관한 사항","항행장애물의 크기에 관한 사항"],"a":1,"e":"해상교통안전법 제24조(항행장애물의 보고)","c":"해사법규","x":"항행장애물을 발생시킨 선박의 선장이나 선박소유자는 그 장애물의 위치와 크기, 종류, 선박의 명세 등 제거와 항행 안전 확보에 필요한 사항을 보고해야 합니다. 화물 소유자의 성명과 주소는 손해 배상 관계에서 문제될 수는 있어도 항행 안전을 확보하는 데 필요한 정보가 아니어서 보고 사항에 들어가지 않습니다."},{"i":626,"q":"항행 중인 범선 등이 표시해야 하는 등화에 대한 설명이다. ( )안에 들어갈 알맞은 말은? 1. 항행 중인 범선은 (\n① ), (\n② )을 표시하여야 한다. 2. 항행 중인 길이 20미터 미만의 범선은 (\n① ),(\n② )를 대신하여 마스트의 꼭대기나 그 부근의 가장 잘 보이는 곳에 (\n③ )를 표시할 수 있다.","o":["① 마스트등 1개 ② 현등 1쌍 ③ 삼색등 1개","① 마스트등 1개 ② 선미등 1개 ③ 양현등 1개","① 현등 1쌍 ② 선미등 1개 ③ 삼색등 1개","① 전주등 1개 ② 현등 1쌍 ③ 삼색등 1개"],"a":2,"e":"","c":"해사법규","x":"항행 중인 범선은 좌우를 알리는 현등 1쌍과 뒤를 알리는 선미등 1개를 표시합니다. 동력선이 아니므로 마스트등은 달지 않는다는 점이 핵심입니다. 다만 길이 20미터 미만의 범선은 이 두 가지를 대신해 마스트 꼭대기 부근에 삼색등 1개를 표시할 수 있습니다. 소형 요트에서 삼색등을 쓰는 근거가 바로 이 조항입니다."},{"i":627,"q":"빈칸에 알맞은 숫자는 무엇인가? 누구든지 수역 등 또는 수역 등의 밖으로부터 ( )킬로미터 이내의 수역에서 선박 등을 이용하여 수역 등이나 항로를 점거하거나 차단하는 행위를 함으로써 선박 통항을 방해하여서는 아니 된다.","o":["5","10","2","12"],"a":1,"e":"해상교통안전법 제34조(수역등 및 항로의 안전 확보) 제1항","c":"해사법규","x":"수역 등이나 그 밖으로 10킬로미터 이내의 수역에서 선박 등을 이용해 수역이나 항로를 점거하거나 차단해 통항을 방해해서는 안 됩니다. 해상 시위나 집단 계류로 항로가 막히면 대형 선박이 피할 곳이 없어 대형 사고로 이어지기 때문입니다. 거리 기준이 해리가 아니라 10킬로미터라는 점을 기억하세요."},{"i":628,"q":"해상교통안전법에서 말하는 술에 취한 상태의 혈중알코올농도 기준은 얼마인가?","o":["0.05퍼센트 이상","0.03퍼센트 이상","0.07퍼센트 이상","0.02퍼센트 이상"],"a":1,"e":"해상교통안전법 제39조(술에 취한 상태에서의 조타기 조작 등 금지) 제5항","c":"해사법규","x":"해상교통안전법에서 술에 취한 상태의 기준은 혈중알코올농도 0.03퍼센트 이상입니다. 수상레저안전법도 이 기준을 준용하므로 수상레저기구 조종에도 같은 수치가 적용됩니다. 도로교통법의 기준과 같은 숫자라 함께 기억하기 쉬우며, 이 농도 이상이면 조종 자체가 금지되고 적발 시 면허 취소 사유가 됩니다."},{"i":629,"q":"선박은 다른 선박과의 충돌을 피하기 위해 적절하고 효과적인 동작을 취하거나 당시의 상황에 알맞은 거리에서 선박을 멈출 수 있도록 어떠한 속력으로 항행하여야 하나?","o":["안전한 속력","최소속력","최대속력","편안한 속력"],"a":0,"e":"해상교통안전법 제71조(안전한 속력) 제1항","c":"해사법규","x":"해상교통안전법은 모든 선박에 대해 충돌을 피할 동작을 제때 취할 수 있고, 그 상황에 알맞은 거리에서 배를 멈출 수 있는 속력, 곧 안전한 속력으로 항행하도록 정하고 있습니다. 절대적인 숫자가 아니라 시계, 교통량, 정지거리, 조류, 수심 같은 그때의 조건에 따라 달라지는 상대적 개념입니다. 시계가 나쁘거나 좁은 수역일수록 안전한 속력은 더 느려집니다."},{"i":630,"q":"해상교통안전법상 항행 중인 동력선이 서로 상대의 시계 안에 있는 경우 그 침로를 변경하거나 그 기관을 후진하여 사용할 때의 기적신호로 옳은 것은? (1) 침로를 오른쪽으로 변경하고 있는 경우 : (\n㉠ ) (2) 침로를 왼쪽으로 변경하고 있는 경우 : (\n㉡ ) (3) 기관을 후진하고 있는 경우 : ( ㉢ )","o":["㉠ 단음 1회 ㉡ 단음 2회 ㉢ 단음 3회","㉠ 단음 2회 ㉡ 단음 1회 ㉢ 단음 3회","㉠ 단음 1회 ㉡ 단음 2회 ㉢ 장음 3회","㉠ 단음 2회 ㉡ 단음 1회 ㉢ 장음 3회"],"a":0,"e":"해상교통안전법 제99조(조종신호와 경고신호) 제1항 제1호부터 제3호","c":"해사법규","x":"조종신호는 자기 배의 동작을 소리로 알리는 것입니다. 오른쪽 변침은 단음 1회, 왼쪽 변침은 단음 2회, 기관 후진은 단음 3회입니다. 모두 짧은 소리이며 횟수로만 구분한다는 점이 핵심입니다. 상대의 의도를 알 수 없을 때 울리는 의문신호는 단음 5회 이상이라는 점까지 함께 묶어 외우면 신호 문제를 한 번에 정리할 수 있습니다."},{"i":631,"q":"해상교통안전법상 항로표지, 해저전선 또는 해저파이프라인의 부설·보수·인양 작업을 하는 선박을 무엇이라고 하는가?","o":["조종제한선","조종불능선","흘수제약선","위험화물운반선"],"a":0,"e":"해상교통안전법 제2조(정의)","c":"해사법규","t":"chg","x":"조종제한선은 작업의 성격 때문에 다른 배에 진로를 내주기 어려운 배로, 항로표지나 해저전선·해저파이프라인의 부설·보수·인양 작업을 하는 선박이 대표적입니다. 준설, 측량, 보급, 항공기 이착함 작업선도 여기에 들어갑니다. 조종불능선은 고장 등으로 조종 자체가 불가능한 배, 흘수제약선은 수심 때문에 진로를 벗어나기 어려운 배라 원인이 다릅니다."},{"i":632,"q":"해상교통안전법상 서로 상대의 시계 안에 있는 선박이 접근하고 있을 경우에는 하나의 선박이 다른 선박의 의도 또는 동작을 이해할 수 없거나 다른 선박이 충돌을 피하기 위하여 충분한 동작을 취하고 있는지 분명하지 아니한 때의 신호(의문신호)의 방법으로 옳은 것은?","o":["단음 1회, 장음 1회의 순서로 재빨리 울려 그 사실을 표시하여야 한다.","장음 1회, 단음 1회의 순서로 재빨리 울려 그 사실을 표시하여야 한다.","단음을 5회 이상 재빨리 울려 그 사실을 표시하여야 한다.","장음을 5회 이상 재빨리 울려 그 사실을 표시하여야 한다."],"a":2,"e":"해상교통안전법 제99조(조종신호와 경고신호)","c":"해사법규","x":"상대의 의도나 동작을 이해할 수 없거나 충돌을 피할 충분한 동작을 하고 있는지 분명하지 않을 때는 단음을 5회 이상 재빨리 울립니다. 짧은 소리를 연달아 내어 '지금 상황이 위험하다'는 경고를 확실히 전달하려는 것이며, 의문신호 또는 경고신호라고 부릅니다. 변침 신호(단음 1~3회)와 횟수로 구분된다는 점이 핵심입니다."},{"i":633,"q":"해상교통안전법상 음향신호설비와 관련하여, 다음 설명 중 ( ) 안의 숫자의 합은? 길이 ( )미터 이상의 선박은 기적 1개를, 길이 ( )미터 이상의 선박은 기적 1개 및 호종 1개를 갖추어 두어야 하며, 길이 ( )미터 이상의 선박은 이에 덧붙여 호종과 혼동되지 아니하는 음조와 소리를 가진 징을 갖추어 두어야 한다.","o":["82","132","170","232"],"a":1,"e":"","c":"해사법규","x":"음향신호설비는 배 길이에 따라 단계적으로 요구됩니다. 길이 12미터 이상이면 기적 1개, 20미터 이상이면 기적 1개와 호종 1개, 100미터 이상이면 여기에 호종과 구별되는 음조의 징까지 갖춰야 합니다. 따라서 괄호 안 숫자의 합은 12 + 20 + 100 = 132입니다. 숫자 자체를 묻는 문제이므로 12·20·100이라는 단계만 정확히 외우면 됩니다."},{"i":634,"q":"해상교통안전법상 다음은 항행 중인 예인선이 표시해야 하는 등화와 형상물을 설명한 것이다. ( ) 안에 들어갈 알맞은 말은?(다른 예외적인 사정은 고려하지 않는다) 예인선열의 길이가 (\n㉠ )를 초과하면 가장 잘 보이는 곳에 (\n㉡ )의 형상물 1개를 표시하여야 한다.","o":["㉠ 100m ㉡ 마름모꼴","㉠ 200m ㉡ 마름모꼴","㉠ 100m ㉡ 원통형","㉠ 200m ㉡ 원통형"],"a":1,"e":"해상교통안전법 제89조(항행 중인 예인선) 제1항 제5호","c":"해사법규","x":"예인선열의 길이가 200미터를 넘으면 가장 잘 보이는 곳에 마름모꼴 형상물 1개를 표시해야 합니다. 뒤따르는 배에 '이 배 뒤로 긴 예인 물체가 딸려 있으니 사이로 지나가지 말라'고 알리는 표시입니다. 200미터라는 기준과 마름모꼴이라는 형상을 한 쌍으로 기억하고, 등화 규정(200미터 미만이면 마스트등 2개)과 함께 정리하세요."},{"i":635,"q":"동력선은 제한된 시계 안에 있는 경우 ( )을/를 즉시 조작할 수 있도록 준비하고 있어야 한다. ( ) 안에 알맞은 말은?","o":["통신","타기","기관","신호기"],"a":2,"e":"해상교통안전법 제84조(제한된 시계에서 선박의 항법) 제2항","c":"해사법규","x":"시계가 제한된 수역에서는 언제 갑자기 배가 나타날지 모르므로, 동력선은 기관을 즉시 조작할 수 있도록 준비해 두어야 합니다. 곧바로 후진이나 정지를 걸 수 있어야 충돌을 피할 수 있기 때문입니다. 여기에 더해 안전한 속력 유지, 철저한 경계, 무중신호 취명이 함께 요구된다는 점도 묶어 기억해 두세요."},{"i":636,"q":"해상교통안전법에서 규정하고 있는 등화와 형상물이 적용되는 날씨는?","o":["모든 날씨","안개주의보 이상","풍랑주의보","야간"],"a":0,"e":"해상교통안전법 제76조(적용) 제1항","c":"해사법규","x":"등화와 형상물에 관한 규정은 날씨와 관계없이 모든 날씨에서 적용됩니다. 등화는 해가 진 뒤부터 뜨기 전까지 표시하고, 시계가 나쁠 때는 낮에도 표시해야 하며, 형상물은 낮에 표시합니다. 즉 '안개니까 꺼도 된다', '낮이니 필요 없다'는 식의 예외가 없다는 것이 이 조항의 요지입니다."},{"i":637,"q":"해상교통안전법상 선박의 등화(현등)의 설명 중 ( ) 안에 알맞은 것을 고르시오 현등이란 정선수 방향에서 양쪽 현으로 각각 112.5도에 걸치는 수평의 호를 비추는 등화로서 그 불빛이 정선수 방향에서 좌현 정횡으로부터 뒤쪽 22.5도까지 비출 수 있도록 좌현에 설치된 (\n㉠ ) 등과 그 불빛이 정선수 방향에서 우현 정횡으로부터 뒤쪽 22.5도까지 비출 수 있도록 우현에 설치된 (\n㉡ )등","o":["㉠ 붉은색 ㉡ 녹색","㉠ 녹색 ㉡ 붉은색","㉠ 붉은색 ㉡ 황색","㉠ 녹색 ㉡ 붉은색"],"a":0,"e":"해상교통안전법 제86조(등화의 종류)","c":"해사법규","x":"현등은 정선수 방향에서 양쪽 현으로 각각 112.5도를 비추는 등화로, 좌현에는 붉은색, 우현에는 녹색을 답니다. 두 등을 합치면 앞쪽 225도를 덮고, 뒤쪽 135도는 선미등이 담당해 전체 360도가 채워집니다. 상대 배의 붉은 등만 보이면 그 배의 좌현을 보고 있다는 뜻이므로 접근 상태를 판단하는 근거가 됩니다."},{"i":638,"q":"선수와 선미의 중심선상에 설치된 붉은색과 녹색의 두 부분으로 된 등화로서 그 붉은색과 녹색 부분이 각각 현등의 붉은색 등 및 녹색 등과 같은 특성을 가진 등은 무엇인가?","o":["예선등","섬광등","양색등","삼색등"],"a":2,"e":"해상교통안전법 제86조(등화의 종류)","c":"해사법규","x":"양색등은 선수미 중심선상에 설치해 붉은색과 녹색 두 부분이 각각 좌현등·우현등과 같은 특성을 갖도록 만든 등화입니다. 좌우에 따로 현등을 달기 어려운 소형선에서 현등 1쌍을 대신해 씁니다. 삼색등은 여기에 선미등까지 하나로 합친 것으로 길이 20미터 미만의 범선이 마스트 꼭대기에 쓸 수 있고, 예선등은 황색 등이라 서로 구분됩니다."},{"i":639,"q":"예인선열의 길이가 200미터 미만인 항행 중인 예인선이 표시해야 할 마스트등은 몇 개인가?","o":["2개","3개","1개","4개"],"a":0,"e":"해상교통안전법 제89조(항행 중인 예인선)","c":"해사법규","x":"예인선은 예인선열의 길이에 따라 마스트등의 수가 달라집니다. 예인선열 길이가 200미터 미만이면 마스트등 2개를, 200미터를 초과하면 3개를 수직으로 표시합니다. 등의 개수로 뒤에 딸린 물체의 길이를 짐작하게 하려는 것입니다. 200미터를 기준으로 등화는 2개와 3개, 형상물은 마름모꼴 표시 여부가 갈린다고 정리하세요."},{"i":640,"q":"50미터 미만의 동력선이 표시하여야 하는 등화는?","o":["마스트등 1개, 현등 1쌍","마스트등 2개, 현등 1쌍","마스트등 1개, 선미등 1개","마스트등 1개, 현등 1쌍, 선미등 1개"],"a":3,"e":"해상교통안전법 제88조(항행 중인 동력선) 제1항","c":"해사법규","x":"항행 중인 동력선은 마스트등, 현등 1쌍, 선미등을 표시합니다. 길이 50미터 미만이면 뒤쪽 마스트등을 생략할 수 있어 마스트등 1개, 현등 1쌍, 선미등 1개가 됩니다. 50미터 이상이면 마스트등을 앞뒤로 2개 표시해 배의 길이와 진행 방향을 더 뚜렷하게 알립니다. 50미터라는 기준으로 마스트등 수가 갈린다고 기억하세요."},{"i":641,"q":"끌려가고 있는 선박이나 물체가 표시하여야 하는 등화는?","o":["현등 1쌍","현등 1쌍, 마스트등 1개","현등 1쌍, 선미등 1개","현등 1쌍, 예인등 1개"],"a":2,"e":"해상교통안전법 제89조(항행 중인 예인선)","c":"해사법규","x":"끌려가는 선박이나 물체는 스스로 추진하지 않으므로 마스트등이나 예선등을 달지 않고, 현등 1쌍과 선미등 1개만 표시합니다. 앞에서 끄는 예인선이 마스트등과 예선등으로 예인 중임을 알리고, 뒤에 끌려가는 쪽은 자기 위치와 폭만 알리는 구조입니다. 예선등(황색)은 끄는 배가 표시한다는 점과 구분해야 합니다."},{"i":642,"q":"항행 중인 범선은 현등과 선미등에 덧붙여 마스트 꼭대기나 그 부근에 전주등 2개를 수직으로 표시할 수 있다. 이 전주등의 각각의 색깔은?","o":["위: 적색, 아래: 녹색","위: 황색, 아래: 백색","위: 적색, 아래: 백색","위: 녹색, 아래: 적색"],"a":0,"e":"마스트 꼭대기에 전주등 2개를 수직으로 표시하고 위쪽 등화는 붉은색(적색), 아래쪽 등화는 녹색이어야 한다.","c":"해사법규","t":"chg","x":"항행 중인 범선은 현등과 선미등에 더해 마스트 꼭대기 부근에 전주등 2개를 수직으로 표시할 수 있으며, 위쪽이 붉은색, 아래쪽이 녹색입니다. 범선임을 멀리서도 알리기 위한 선택적 등화입니다. 색 순서를 뒤집어 놓은 보기가 함께 나오므로 '위 적색, 아래 녹색'을 그대로 외워야 합니다."},{"i":643,"q":"트롤망어로에 종사하는 선박이 항행에 관계없이 수직선에 표시하여야 하는 등화의 색깔은 무엇인가?","o":["위 : 붉은색, 아래 : 녹색","위 : 녹색, 아래 : 흰색","위 : 녹색, 아래 : 붉은색","위 : 흰색, 아래 : 붉은색"],"a":1,"e":"해상교통안전법 제91조(어선)","c":"해사법규","x":"트롤망 어로에 종사하는 선박은 위에 녹색, 아래에 흰색 전주등을 수직으로 표시합니다. 트롤 이외의 어로에 종사하는 선박은 위가 붉은색, 아래가 흰색이므로 위쪽 색으로 두 가지를 구분합니다. 그물을 끌고 있어 급히 피할 수 없다는 사실을 알리는 표시이며, 어선의 등화는 색 순서를 정확히 외워야 하는 대표적인 항목입니다."},{"i":644,"q":"조종불능선이 수직으로 표시하여야 하는 전주등의 색깔은 무엇인가?","o":["위 : 붉은색, 아래 : 붉은색","위 : 붉은색, 아래 : 흰색","위 : 녹색, 아래 : 붉은색","위 : 흰색, 아래 : 황색"],"a":0,"e":"해상교통안전법 제92조(조종불능선과 조종제한선) 제1항","c":"해사법규","x":"조종불능선은 붉은색 전주등 2개를 수직으로 표시합니다. 붉은색은 위험과 통제 불능을 뜻하며, 낮에는 둥근꼴 형상물 2개를 같은 방식으로 표시합니다. 조종제한선은 위·아래가 붉은색이고 가운데가 흰색인 전주등 3개를 수직으로 다는 점과 비교해 두면 헷갈리지 않습니다. 두 배 모두 다른 선박이 피해 주어야 합니다."},{"i":645,"q":"해상교통안전법상 선박의 등화의 종류 중 선수와 선미의 중심선상에 설치되어 225도에 걸치는 수평의 호(弧)를 비추되, 그 불빛이 정선수 방향에서 양쪽 현의 정횡 으로부터 뒤쪽 22.5도까지 비출 수 있는 흰색 등은 무엇인가?","o":["현등","마스트등","선미등","전주등"],"a":1,"e":"해상교통안전법 제86조(등화의 종류)","c":"해사법규","x":"마스트등은 선수미 중심선상에 설치해 정선수 방향을 중심으로 225도를 비추는 흰색 등으로, 양쪽 현 정횡에서 뒤쪽으로 22.5도까지 도달합니다. 이 각도는 현등 두 개를 합친 범위와 같아, 앞에서 보면 마스트등과 현등이 함께 보이고 뒤에서는 선미등만 보이게 됩니다. 각도(225도)와 색(흰색)이 문제의 판단 기준입니다."},{"i":646,"q":"흘수제약선이 표시하여야 하는 형상물은 어떤 것인가?","o":["마름모꼴 1개","원형 1개","원통형 1개","원뿔형 1개"],"a":2,"e":"해상교통안전법 제93조(흘수제약선)","c":"해사법규","x":"흘수제약선은 원통형 형상물 1개를 표시합니다. 수심 때문에 진로를 벗어나기 어려우니 다른 배가 방해하지 말라는 표시이며, 등화로는 붉은색 전주등 3개를 수직으로 답니다. 형상물은 조종불능선이 둥근꼴 2개, 예인선열 200미터 초과가 마름모꼴, 정박선이 둥근꼴 1개이므로 모양별로 묶어 정리해 두면 좋습니다."},{"i":647,"q":"해상교통안전법상 보호수역에 해양수산부장관의 허가를 받지 아니하고 입역할 수 있는 사유가 아닌 것은?","o":["선박 조종이 불가능한 경우","인명을 구조하는 경우","위험이 있는 선박을 구조하는 경우","해양사고를 예방하기 위한 경우"],"a":3,"e":"해양사고를 피하기 위하여 부득이한 사유가 있는 경우","c":"해사법규","x":"보호수역에 허가 없이 들어갈 수 있는 것은 배의 조종이 불가능하게 된 경우, 인명이나 위험에 처한 선박을 구조하는 경우, 그리고 해양사고를 피하기 위해 부득이한 경우처럼 긴박한 상황입니다. 반면 '해양사고를 예방하기 위해'라는 표현은 지금 닥친 위험이 아니라 일반적인 목적이어서 예외 사유로 인정되지 않습니다."},{"i":648,"q":"얹혀 있는 선박이 정박선이 표시하여야 하는 등화에 덧붙여 가장 잘 보이는 곳에 표시하여야 하는 등화는 무엇인가?","o":["수직으로 붉은색의 전주등 1개","수직으로 붉은색의 전주등 2개","수평으로 붉은색의 전주등 2개","수직으로 황색의 전주등 2개"],"a":1,"e":"해상교통안전법 제95조(정박선과 얹혀 있는 선박) 제4항제1호","c":"해사법규","x":"얹혀 있는 선박, 즉 좌초한 배는 정박선의 등화에 더해 붉은색 전주등 2개를 수직으로 표시합니다. 조종불능선과 같은 색·개수를 써서 '스스로 움직일 수 없는 상태'임을 알리는 것이며, 낮에는 둥근꼴 형상물 3개를 수직으로 표시합니다. 정박선은 흰색 전주등을 표시한다는 점과 구별해서 기억하세요."},{"i":649,"q":"선박의 음향신호 중 단음은 어느 정도 길이의 고동소리를 말하는가?","o":["1초 정도","2~3초 정도","2초 정도","3초 정도"],"a":0,"e":"해상교통안전법 제97조(기적의 종류) 제1호","c":"해사법규","x":"음향신호에서 단음은 약 1초 정도 계속되는 짧은 소리를 말합니다. 장음은 4초에서 6초까지입니다. 이 두 정의를 정확히 알아야 단음 1~3회의 조종신호, 단음 5회 이상의 경고신호, 장음 1회의 굽은 부분 신호, 장음 5회의 화재 경보를 서로 구분해 판단할 수 있습니다."},{"i":650,"q":"선박이 좁은 수로 등에서 서로 상대의 시계 안에 있는 경우 다른 선박의 우현 쪽으로 추월할 때 기적 신호는 무엇인가?","o":["장음 1회, 단음 1회","장음 1회, 단음 2회","장음 2회, 단음 1회","장음 2회, 단음 2회"],"a":2,"e":"해상교통안전법 제99조(조종신호와 경고신호) 제4항","c":"해사법규","x":"좁은 수로 등에서 앞지르려는 배는 어느 쪽으로 지나갈지를 소리로 미리 알립니다. 우현 쪽으로 추월할 때는 장음 2회에 이어 단음 1회, 좌현 쪽으로 추월할 때는 장음 2회에 단음 2회를 울립니다. 장음 2회로 '추월하겠다'는 뜻을, 이어지는 단음 횟수로 방향을 나타낸다고 이해하면 외우기 쉽습니다."},{"i":651,"q":"좁은 수로 등의 굽은 부분이나 장애물 때문에 다른 선박을 볼 수 없는 수역에 접근하는 선박이 울려야 하는 기적신호는?","o":["장음 2회","장음 3회","장음 1회","단음 7회"],"a":2,"e":"해상교통안전법 제99조(조종신호와 경고신호) 제6항","c":"해사법규","x":"좁은 수로의 굽은 부분이나 장애물 때문에 반대편이 보이지 않는 수역에 접근할 때는 장음 1회를 울려 자기 존재를 알립니다. 그 소리를 들은 반대편 배도 장음 1회로 응답해 서로의 접근을 확인합니다. 보이지 않는 상대에게 먼저 알린다는 취지이며, 제한시계에서의 무중신호(2분 이내 간격 장음 1회)와는 상황이 다르므로 구분해야 합니다."},{"i":652,"q":"시계가 제한된 수역이나 그 부근에 있는 항행 중인 동력선이 대수속력이 있는 경우 울려야 하는 기적신호는?","o":["2분을 넘지 않는 간격으로 장음 1회","2분을 넘지 않는 간격으로 장음 2회","3분을 넘지 않는 간격으로 장음 1회","3분을 넘지 않는 간격으로 장음 2회"],"a":0,"e":"해상교통안전법 제100조(제한된 시계 안에서의 음향신호) 제1항제1호","c":"해사법규","x":"시계가 제한된 수역에서 항행 중인 동력선이 물에 대해 움직이고 있다면, 2분을 넘지 않는 간격으로 장음 1회를 울려야 합니다. 반대로 항행 중이지만 대수속력이 없으면 2분을 넘지 않는 간격으로 장음 2회를 연달아 울립니다. '움직이면 1회, 멈춰 있으면 2회'로 정리하면 무중신호 문제를 빠르게 풀 수 있습니다."},{"i":653,"q":"해상교통안전법상 해양경찰청 소속 경찰공무원이 선박 운항자에 대하여 반드시 술에 취하였는지를 측정하여야 하는 경우는?","o":["해양사고가 발생한 경우","술에 취한 상태에서 도선을 하였다고 인정할 만한 충분한 이유가 있는 경우","다른 선박의 안전운항을 해치거나 해칠 우려가 있는 등 해상교통의 안전과 위험방지를 위하여 필요 하다고 인정되는 경우","술에 취한 상태에서 조타기를 조작하거나 조작할 것을 지시하였다고 인정할 만한 충분한 이유가 있는 경우"],"a":0,"e":"해상교통안전법 제39조(술에 취한 상태에서의 조타기 조작 등 금지) 제2항 제1호부터 제3호","c":"해사법규","x":"해양사고가 발생한 경우에는 음주 여부를 반드시 측정하도록 정하고 있습니다. 사고 원인 규명과 책임 판단에 직결되기 때문입니다. 반면 음주 상태로 조타기를 조작했다고 인정할 만한 이유가 있는 경우 등은 측정할 수 있는 재량 사유입니다. '반드시'와 '할 수 있다'를 구분해 읽는 것이 이 문제의 핵심입니다."},{"i":654,"q":"해상교통안전법상 조종제한선에 해당하는 선박을 모두 고르시오.\n㉠ 항해 중 보급, 사람의 이송 또는 화물을 옮기는 작업\n㉡ 준설측량 또는 수중 작업 중인 선박 ㉢ 항로표지, 해저전선을 싣고 이동 중인 선박 ㉣ 기뢰를 실은 선박","o":["㉠, ㉢","㉠, ㉡","㉠, ㉡, ㉢","㉠, ㉡, ㉣"],"a":1,"e":"조종제한선은 선박의 조종성능을 제한하는 작업에 종사하고 있어 다른 선박을 피할 수 없는 선박이다. 항로표지, 해저전선을 싣고 이동 중인 선박, 기뢰를 실은 선박은 조종성능에 제한을 받지 않는다.","c":"해사법규","t":"new","x":"조종제한선은 작업의 성격 때문에 다른 배를 피할 수 없는 선박입니다. 항해 중 보급이나 사람·화물을 옮기는 작업, 준설·측량·수중 작업이 그런 예입니다. 반면 항로표지나 해저전선을 단순히 싣고 이동하는 중이라면 조종 성능에 제한을 받지 않으므로 조종제한선이 아닙니다. '작업 중인가, 운반 중인가'로 갈립니다."},{"i":655,"q":"해상교통안전법상 제한시계 안에서의 일반적인 항법으로 옳지 않은 것은?","o":["경계를 철저히 하여야 한다.","무중신호를 울려야 한다.","안전한 속력으로 운항하여야 한다.","주간에는 항해등을 소등하여야 한다."],"a":3,"e":"낮 시간은 물론, 시계가 제한된 경우에도 등화를 표시하여야 한다.","c":"해사법규","t":"new","x":"등화는 낮이라도 시계가 제한된 경우에는 표시해야 합니다. 안개 속에서 등화를 끄면 상대 배가 이쪽을 발견할 수단이 사라지기 때문입니다. 따라서 '주간에는 항해등을 소등한다'는 서술이 틀렸습니다. 제한시계에서는 철저한 경계, 안전한 속력 유지, 무중신호 취명, 기관 즉시 조작 준비가 함께 요구됩니다."},{"i":656,"q":"해상교통안전법상 누구든지 보호수역에 입역(入域)하기 위하여 누구의 허가를 받아야 하는가?","o":["해양경찰청장","도지사","시장","해양수산부장관"],"a":3,"e":"누구든지 보호수역에 입역(入域)하기 위하여는 해양수산부장관의 허가를 받아야 하며, 해양수산부장관은 해 양시설의 안전 확보에 지장이 없다고 인정하거나 공익상 필요하다고 인정하는 경우 보호수역의 입역을 허가 할 수 있다.","c":"해사법규","x":"보호수역에 들어가려면 해양수산부장관의 허가를 받아야 합니다. 보호수역은 해양시설의 안전을 위해 설정한 구역이고, 그 시설과 수역의 관리 권한이 해양수산부에 있기 때문입니다. 다만 조종이 불가능한 경우나 인명·선박 구조, 해양사고를 피하기 위한 부득이한 경우에는 허가 없이 들어갈 수 있습니다."},{"i":657,"q":"해양환경관리법의 적용을 받지 않는 선박은?","o":["입항 중인 외국적 크루즈요트","인천 외항에서 작업 중인 모래채취선","한강에서 유람 중인 모터보트","해수욕장에서 운항 중인 모터보트"],"a":2,"e":"해양환경관리법 제3조(적용범위)","c":"해양환경관리법","x":"해양환경관리법은 해양, 즉 바다를 대상으로 하는 법이므로 하천이나 호수 같은 내수면에서의 활동에는 적용되지 않습니다. 한강에서 유람 중인 모터보트가 그런 경우입니다. 반면 입항 중인 외국적 요트, 인천 외항의 모래채취선, 해수욕장에서 운항하는 모터보트는 모두 해역에서의 활동이라 적용을 받습니다. '어디에 있는가'가 판단 기준입니다."},{"i":658,"q":"다음 중 선저폐수의 배출 요건으로 가장 옳은 것은?","o":["유수 분리 장치를 통해 배출","항내 정박 시 배출","유분 농도 15ppm 이하로 배출 후 기록유지","4노트 이상으로 야간항해 중 배출"],"a":2,"e":"선저폐수는 해양환경관리법, 동법 시행규칙에서 규정하는 바와 같이 항해 중 기름여과장치를 통해 유분 농도 15ppm이하로 정화하여 배출하며, 기록을 유지해야 한다.","c":"해양환경관리법","t":"new","x":"선저폐수는 기관실 바닥에 고인 기름 섞인 물이므로 그대로 버릴 수 없고, 기름여과장치를 통해 유분 농도를 15ppm 이하로 낮춘 뒤 항해 중에 배출하며 그 사실을 기록으로 남겨야 합니다. 정박 중이나 정지 상태의 배출, 15ppm을 넘는 배출은 모두 위반입니다. 15ppm과 '항해 중', '기록 유지' 세 가지가 요건입니다."},{"i":659,"q":"해양환경관리법 제정 목적으로 옳지 않은 것은?","o":["선박, 해양시설, 해양공간 등 해양오염물질을 발생시키는 발생원을 관리함","기름 및 유해액체물질 등 해양오염물질의 배출을 규제함","해양오염을 예방, 개선, 대응, 복원하는 데 필요한 사항을 정함","하천·호소(湖沼) 등 공공수역의 물 환경을 적정하게 관리·보전함"],"a":3,"e":"해양환경관리법 제1조(목적)","c":"해양환경관리법","x":"해양환경관리법은 선박과 해양시설 등 오염원을 관리하고, 기름과 유해액체물질 등의 배출을 규제하며, 해양오염을 예방·개선·대응·복원하는 데 필요한 사항을 정하는 것을 목적으로 합니다. 반면 하천이나 호소 같은 공공수역의 물환경 관리는 물환경보전법이 맡는 영역이라 이 법의 목적에 들어가지 않습니다. 바다인지 육상 수역인지로 갈립니다."},{"i":660,"q":"해양환경관리법에서 정의하는 “폐기물”에 해당하는 것은?","o":["분뇨","포장유해물질","폐유","폐산"],"a":0,"e":"","c":"해양환경관리법","x":"해양환경관리법에서 폐기물은 해양에 배출되면 해양환경에 해로운 결과를 미치는 물질 가운데 기름·유해액체물질·포장유해물질을 제외한 것을 말합니다. 분뇨와 음식찌꺼기 등이 여기에 들어갑니다. 폐유와 폐산은 기름이나 유해액체물질 계열로 따로 분류되고, 포장유해물질은 정의에서 명시적으로 제외되어 있습니다. 오염물질을 네 갈래로 나눠 정리해 두면 됩니다."},{"i":661,"q":"해양환경관리법에서 정의하는 “기름”으로 옳지 않은 것은?","o":["원유","폐유","석유가스","선저폐수"],"a":2,"e":"해양환경관리법 제2조(정의) 제5호. 기체상태의 석유 가스는 기름에 해당되지 않음.","c":"해양환경관리법","x":"해양환경관리법에서 기름은 원유와 석유제품, 폐유, 그리고 이들을 함유한 혼합물과 선저폐수 등 액체 상태의 것을 말합니다. 기체 상태인 석유가스는 물 위에 퍼져 오염을 일으키는 성질이 아니므로 기름의 정의에서 제외됩니다. 오염물질을 기름·유해액체물질·포장유해물질·폐기물로 나누는 큰 틀과 함께 정리해 두세요."},{"i":662,"q":"다음 중 요트에 설치된 기름여과장치를 정기적으로 점검해야 하는 이유로 가장 옳은 것은?","o":["요트의 항해 속도를 높이기 위해서","기름여과장치의 내구성을 높이기 위해서","요트 엔진의 연료 효율을 개선하기 위해서","기름 성분이 15ppm 이하로 유지되는지 확인하기 위해서"],"a":3,"e":"정기적인 기름여과장치의 점검을 통해 법적 배출 요건(15ppm 이하)을 충족하도록 하는 것이 필요함","c":"해양환경관리법","t":"new","x":"기름여과장치는 선저폐수의 유분 농도를 법적 기준인 15ppm 이하로 낮추기 위한 설비입니다. 필터가 막히거나 성능이 떨어지면 기준을 넘는 물이 그대로 배출되어 오염과 처벌로 이어지므로, 실제로 15ppm 이하가 유지되는지 정기적으로 점검해야 합니다. 연료 효율이나 속도와는 관계가 없는 환경 설비입니다."},{"i":663,"q":"유해액체물질의 분류 중 해양에 배출되는 경우 해양자원 또는 인간의 건강에 경미한 위해를 끼치는 것으로서 해양배출을 일부 제한하여야 하는 유해액체물질은?","o":["X류 물질","Y류 물질","Z류 물질","잠정평가물질"],"a":2,"e":"선박오염방지규칙 제3조(유해액체물질의 분류) 제1항. X물질(심각한 위해), Y물질(위해), Z물질(경미한 위해)","c":"해양환경관리법","x":"유해액체물질은 해양과 인체에 미치는 위해의 정도에 따라 X류(심각한 위해), Y류(위해), Z류(경미한 위해)로 나뉘고, 아직 평가되지 않은 것은 잠정평가물질로 분류합니다. 경미한 위해를 끼쳐 배출을 일부 제한하는 것이 Z류입니다. X에서 Z로 갈수록 규제가 완화된다는 순서만 기억하면 됩니다."},{"i":664,"q":"다음 중 과태료 처분 항목으로 가장 옳은 것은?","o":["해양시설에서 기름을 배출한 자","해양오염영향조사의 결과를 거짓으로 통보한 자","선박에서 유해액체물질을 배출한 자","해양시설에서 포장유해물질을 배출한 자"],"a":1,"e":"을은 과태료 부과 대상이다.","c":"해양환경관리법","t":"new","x":"기름이나 유해액체물질, 포장유해물질을 실제로 배출한 행위는 해양을 직접 오염시키는 것이라 징역이나 벌금 같은 형벌의 대상입니다. 반면 해양오염영향조사 결과를 거짓으로 통보한 것은 행정 절차상의 의무 위반이라 과태료로 다룹니다. 오염을 일으켰는가, 절차를 어겼는가로 형벌과 과태료가 갈린다고 이해하면 됩니다."},{"i":665,"q":"다음 중 선박 또는 요트에서 발생한 플라스틱류 처리 방법으로 가장 옳은 것은?","o":["소량 발생 시 해상에 배출","대량 발생 시 부두 또는 항내 배출하여 적치","소각로가 없는 경우 잘게 잘라 해상에 배출","발생한 플라스틱류 전량을 수용시설에 인계하여 배출"],"a":3,"e":"선박 또는 요트에서 발생한 플라스틱을 포함하여 모든 플라스틱의 해상 배출은 금지되어 있다.","c":"해양환경관리법","t":"new","x":"플라스틱은 바다에서 분해되지 않고 미세플라스틱으로 남아 생태계에 축적되므로, 양이 많든 적든 잘게 자르든 해상 배출이 전면 금지되어 있습니다. 따라서 발생한 플라스틱은 전량 육상의 수용시설에 인계해야 합니다. 부두나 항내에 그냥 쌓아 두는 것도 적법한 처리가 아니라는 점을 함께 기억하세요."},{"i":666,"q":"분쇄되거나 연마되지 않은 음식찌꺼기를 해양에 배출할 수 있는 해역으로 옳은 것은?","o":["영해기선으로부터 3해리 이상","영해기선으로부터 3해리 이내","영해기선으로부터 12해리 이상","영해기선으로부터 12해리 이내"],"a":2,"e":"","c":"해양환경관리법","x":"음식찌꺼기는 잘게 부수면 바다에서 빨리 흩어지므로 더 가까운 해역에서도 배출할 수 있지만, 분쇄하거나 연마하지 않은 상태로는 오래 남아 오염 우려가 크기 때문에 영해기선으로부터 12해리 이상 떨어진 해역에서만 배출할 수 있습니다. 분쇄한 경우의 기준 거리보다 더 멀다는 관계로 기억하면 숫자를 바꿔 놓은 보기에 걸리지 않습니다."},{"i":667,"q":"분뇨처리장치를 설치한 선박이 분뇨를 배출할 수 없는 해역으로 옳은 것은?","o":["영해기선으로부터 3해리 이내 해역","수산자원 보호구역과 보호수면","영해기선으로부터 12해리 넘는 해역","출항하여 육지로부터 10해리 떨어진 해역"],"a":1,"e":"국토의 계획 및 이용에 관한 법률(수산자원 보호구역), 수산자원관리법(보호수면, 수산자원관리수면)에서는 분뇨 배출이 금지된다.","c":"해양환경관리법","x":"수산자원 보호구역이나 보호수면, 수산자원관리수면은 어류의 산란과 성장을 보호하는 곳이라 처리장치를 거친 분뇨라도 배출할 수 없습니다. 반면 처리장치를 갖춘 선박은 정해진 요건에 따라 일정 거리 밖 해역에 배출할 수 있습니다. 거리 기준보다 '어디가 금지 구역인가'를 먼저 확인하는 것이 요령입니다."},{"i":668,"q":"수상레저기구(요트)에서 항해 중 발생한 선저폐수 처리 방법 중 옳은 것은?","o":["대부분이 물이므로 펌프를 이용하여 해상에 배출한다.","기름여과장치를 통해 항해 중 배출한다.","배출액 중의 기름 성분이 0.015퍼센트(150ppm)이면 된다.","기관을 멈추고, 해상에 정지한 상태로 배출한다."],"a":1,"e":"기름오염방지설비를 작동하여 0.0015퍼센트(15ppm) 이하로 항해 중에 배출해야 한다.","c":"해양환경관리법","x":"선저폐수는 기름여과장치를 작동시켜 유분 농도를 15ppm(0.0015퍼센트) 이하로 낮춘 상태로, 항해 중에 배출해야 합니다. 대부분이 물이라는 이유로 그냥 펌프로 퍼내거나, 정지 상태에서 배출하거나, 150ppm을 기준으로 삼는 것은 모두 위반입니다. 퍼센트와 ppm의 자릿수를 바꿔 놓는 보기에 특히 주의해야 합니다."},{"i":669,"q":"총톤수 20톤 미만의 수상레저기구(요트)에서 항해 중 발생한 플라스틱, 비닐 등 폐기물의 처리 방법 중 옳은 것은?","o":["비닐봉투에 모았다가 정박 시 부두에 내려놓는다.","항해 중 잘게 잘라 해상에 조금씩 버린다.","분리수거하여 육상에 폐기물처리업자에게 인계한다.","종이봉투에 모았다가 영해기선 3해리 밖에서 버린다."],"a":2,"e":"총톤수 20톤 미만의 소형선박에서 발생한 폐기물은 폐기물처리업자에게 수거·처리 할 수 있다.","c":"해양환경관리법","x":"총톤수 20톤 미만의 소형선박에서 나온 폐기물은 분리수거해 육상의 폐기물처리업자에게 인계할 수 있습니다. 부두에 그냥 내려놓거나 잘게 잘라 바다에 버리는 것은 적법한 처리가 아닙니다. 요트에서는 항해 중 쓰레기를 모아 두었다가 입항 후 정해진 경로로 넘기는 것이 원칙이라고 기억하면 됩니다."},{"i":670,"q":"요트 항해 중 발생한 폐유의 처리 방법으로 가장 옳은 것은?","o":["항해 중 기름여과장치를 통해 15ppm 이하로 배출","항해 종료 후 항내에서 야간에 서서히 배출","항해 종료 후 입항하여 해양환경공단에 인계","항해 중 소량씩 나누어 배출"],"a":2,"e":"요트에서 발생하는 폐유는 유수분리기와 같이 선저폐수의 유분 농도를 15ppm 이하로 처리하여 배출할 수 있는 오염물질이 아니므로, 항해를 마치고 입항하여 해양환경공단 또는 지정 처리업자에게 인계하여 처리 하여야 한다.","c":"해양환경관리법","t":"new","x":"폐유는 여과 장치로 걸러 배출할 수 있는 선저폐수와 달리 그 자체가 기름이므로 해상 배출이 전면 금지됩니다. 따라서 폐유저장용기에 모아 두었다가 입항 후 해양환경공단이나 지정 처리업자에게 인계해야 합니다. 항내에서 야간에 조금씩 흘려보내는 것은 명백한 위반이며 무거운 벌칙 대상입니다."},{"i":671,"q":"선박 내 거주구역에서 발생하는 중수를 해상에 배출할 수 있는 해역으로 옳은 것은?","o":["국토의 계획 및 이용에 관한 법률에 따른 수산자원보호구역","처리장치를 거친 경우로 영해기선 밖 3해리 이상 해역","수산자원관리법에 따른 보호수면 및 수산자원관리수면","농수산물 품질관리법에 따른 지정해역 및 주변해역"],"a":1,"e":"중수 배출 조건: 처리장치를 거치 경우(영해 기선 3해리 이상, 분쇄살균 처리된 경우(영해기선 12해리 이상), 항내, 내수, 특정해역은 배출 금지 구역임.","c":"해양환경관리법","t":"chg","x":"중수(거주구역에서 나오는 세면·주방 배수 등)는 처리장치를 거친 경우 영해기선 밖 3해리 이상 해역에, 분쇄·살균 처리된 경우에는 12해리 이상 해역에 배출할 수 있습니다. 반면 항내와 내수, 수산자원보호구역·보호수면·지정해역 등 특정 해역은 배출 금지 구역입니다. 거리 요건과 금지 구역을 함께 확인해야 합니다."},{"i":672,"q":"다음 중 요트 또는 해양시설 등에서 발생하는 폐기물을 제외한 오염물질을 해양에 배출할 수 있는 경우로 가장 옳지 않은 것은?","o":["안전 확보나 인명구조를 위해 부득이한 경우","손상 등으로 인하여 부득이한 경우","해양수산부령으로 정하는 처리 기준을 충족하기 위해 부득이한 경우","오염 피해를 최소화하는 과정에서 부득이한 경우"],"a":2,"e":"불가피한 상황과 오염 피해를 최소화하는 과정에서 부득이하게 오명물질이 배출되는 경우는 예외적으로 배출을 허용하고 있다.","c":"해양환경관리법","t":"new","x":"오염물질 배출이 예외적으로 허용되는 것은 사람과 배의 안전이 걸린 불가피한 상황입니다. 안전 확보나 인명 구조를 위해 부득이한 경우, 선박 손상 등으로 부득이한 경우, 오염 피해를 최소화하는 과정에서 부득이하게 배출되는 경우가 그것입니다. 처리 기준을 맞추기 위해서라는 이유는 불가피성이 없어 예외로 인정되지 않습니다."},{"i":673,"q":"다음 중 분뇨 저장탱크를 설치한 요트에서 마쇄․소독하지 않은 분뇨를 배출하고자 할 때 필요한 절차로 가장 옳은 것은?","o":["지방해양수산청장의 별도 승인 없이 배출 가능하다.","지방해양경찰청장의 별도 승인 없이 배출 가능하다.","지방해양경찰청장에게 배출률 승인을 받아야 한다.","지방해양수산청장에게 배출률 승인을 받아야 한다."],"a":3,"e":"분뇨 저장탱크를 설치한 요트에서 매쇄 하지 않았거나 소독하지 않은 분뇨를 배출하 위해서는 배출률(선박의 흘수 및 속력에 따른 시간당 폐기물 배출량)을 지방해양수산청장에게 승인받아야 하며, 승인된 범위 내에서만 배출 가능","c":"해양환경관리법","t":"new","x":"마쇄하거나 소독하지 않은 분뇨는 그대로 배출하면 오염이 크기 때문에, 선박의 흘수와 속력에 따른 시간당 배출량, 즉 배출률을 지방해양수산청장에게 승인받아야 배출할 수 있습니다. 승인 없이 임의로 배출할 수 없고, 승인 기관이 해양경찰이 아니라 지방해양수산청이라는 점이 이 문제의 핵심입니다."},{"i":674,"q":"다음 중 생물체에 파괴 작용을 하는 성분이 포함된 유해방오도료로 가장 옳은 것은?","o":["디우론을 포함한 도료","수용성 친환경 도료","무기질 방청제","일반 합성수지 페인트"],"a":0,"e":"유해방오도료는 해양수산부령이 정하는 것으로 생물체에 파괴 작용을 하는 성분이 포함된 도료를 의미하며 「선박에서의 오염방지에 관한 규칙」제5조에 명시되어 있다.","c":"해양환경관리법","t":"new","x":"유해방오도료는 선체에 생물이 달라붙는 것을 막기 위해 쓰지만 생물체에 파괴 작용을 하는 성분이 든 도료를 말하며, 디우론 같은 물질을 포함한 도료가 여기에 해당합니다. 이런 도료는 해양생물에 광범위한 영향을 주므로 사용이 규제됩니다. 수용성 친환경 도료나 일반 페인트, 무기질 방청제는 규제 대상이 아닙니다."},{"i":675,"q":"요트의 항해 중에 발생한 생활쓰레기를 처리하는 방법으로 옳은 것은?","o":["항해가 끝난 후 입항하여 부두에 내려놓는다.","쓰레기의 양이 적을 바다에 버린다.","항해가 끝난 후 입항하여 해양환경공단에 연락하여 수거처리 한다.","항해가 끝난 후 입항하여 인근 해양경찰서에 처리를 요청한다."],"a":2,"e":"선박에서 발생한 오염물질은 오염물질 저장시설 운영자에게 처리하여야 한다.","c":"해양환경관리법","x":"선박에서 생긴 생활쓰레기는 바다에 버릴 수 없고, 입항한 뒤 오염물질 저장시설 운영자인 해양환경공단 등에 연락해 수거·처리해야 합니다. 양이 적다고 바다에 버리는 것은 명백한 위반이고, 부두에 그냥 내려놓는 것도 적법한 처리가 아닙니다. 해양경찰서는 단속과 신고 접수 기관이지 폐기물 처리 기관이 아니라는 점도 함께 기억하세요."},{"i":676,"q":"요트 운항 중 인근 선박의 기름 유출을 목격했을 때 취할 조치로 가장 옳은 것은?","o":["SNS에 게시하여 많은 관심을 유도한다.","현장에서 자체 방제 후 계속 항해한다.","선박명, 기상 상태 등을 관할 해양경찰청장에게 신고한다.","무시하고 항해를 계속한다."],"a":2,"e":"해양에 오염물질이 배출되거나 배출될 우려가 있다고 예상되는 경우에는 관할 해양경찰청장 또는 해양경찰서장에게 신고할 의무가 있다.","c":"해양환경관리법","t":"new","x":"기름 유출을 목격하면 선박명, 위치, 유출 상황, 기상 상태 등을 확인해 관할 해양경찰에 신고해야 합니다. 초기 신고가 빠를수록 방제 범위가 줄어들기 때문이며, 신고는 목격자의 의무이기도 합니다. 혼자 방제를 시도하거나 SNS에 올리는 것으로 대신하는 것은 대응 시간을 놓치게 만드는 잘못된 행동입니다."},{"i":677,"q":"다음 중 최대 승선정원이 16명 미만인 요트에서 분뇨처리 방법으로 가장 옳은 것은?","o":["분뇨를 항해 중 3해리 밖에서 배출한다.","분뇨를 수용시설로 직접 반출한다.","분뇨를 해상에서 마쇄 후 배출한다.","분뇨 전용 탱크에 저장 후 12해리 밖에서 배출한다."],"a":1,"e":"요트의 최대 승선정원이 16명 미만인 경우에는 요트 안에서 발생하는 분뇨를 저장 및 처리하기 위한 설비를 설치하지 아니할 수 있다.","c":"해양환경관리법","t":"new","x":"최대 승선정원이 16명 미만인 요트는 분뇨를 저장·처리하는 설비를 갖추지 않을 수 있습니다. 대신 발생한 분뇨는 바다에 버리지 않고 육상의 수용시설로 직접 반출해야 합니다. 정원 16명이라는 기준을 경계로 설비 설치 의무가 갈린다는 점, 설비가 없다고 해상 배출이 허용되는 것은 아니라는 점을 함께 기억하세요."},{"i":678,"q":"다음 중 요트 내에 기본적으로 비치해야 하는 오염물질 방제․방지 자재 또는 장비로 가장 옳은 것은?","o":["유흡착재 등 방제 자재","생물정화제제","유해액체물질 배출지침서","대형 유처리제 저장탱크"],"a":0,"e":"요트는 대형 방제설비 의무가 없으나, 기름 등 오염물질 유출 시 즉시 대응 가능한 유흡착재 등의 기본 방제 자재는 비치하는 것이 필요하며, 이를 통해 적극적인 초기 대응이 가능하고 확산 피해를 제한할 수 있다.","c":"해양환경관리법","t":"new","x":"요트에는 대형 방제설비를 갖출 의무가 없지만, 연료를 넣거나 기관을 다룰 때 소량의 기름이 새는 일이 잦으므로 유흡착재 같은 기본 방제 자재는 비치해 두어야 합니다. 유출 즉시 흡착해 확산을 막으면 피해와 비용을 크게 줄일 수 있습니다. 생물정화제제나 대형 저장탱크는 소형 요트에 요구되는 장비가 아닙니다."},{"i":679,"q":"요트의 항해 중에 인근 선박에서 기름을 해상에 배출하는 장면을 목격하였다. 이에 대한 설명으로 옳지 않은 것은?","o":["선박의 이름과 위치를 확인하여 VTS에 연락한다.","신고할 경우 해코지를 당할 수 있으므로 무시한다.","신고할 경우 오염물질의 수량에 따라 신고포상금을 받을 수 있다.","해양환경보호를 위해 해당 장면을 촬영하여 119에 신고한다."],"a":1,"e":"범죄의 신고의 경우, 신고자의 익명을 철저히 보장하여 해코지 당할 우려가 없으며, 목격자는 신고의 의무가 있다.","c":"해양환경관리법","x":"해양오염 행위를 목격하면 신고할 의무가 있고, 신고자의 신원은 철저히 보호되므로 보복을 걱정해 침묵하는 것은 옳지 않습니다. 선박명과 위치를 확인해 VTS나 해양경찰에 알리고, 증거가 될 장면을 촬영해 두면 도움이 됩니다. 오염물질의 수량에 따라 신고포상금이 지급될 수 있다는 점도 함께 알아 두세요."},{"i":680,"q":"분뇨를 외부배출관 설치 없이 수용시설로 배출할 수 있는 선박에 해당하지 않는 것은?","o":["시추선 및 플랫폼","선박의 길이가 24미터 미만인 선박","수상레저기구","최대승선인원이 16명 미만인 선박"],"a":3,"e":"갑,을,병의 경우 외부배출관을 사용하지 않고 분뇨를 수용시설로 배출할 수 있는 경우에는 외부배출관을 설치하지 아니할 수 있다.(선박오염방지규칙 제14조_분뇨오염방지설비의 대상 선박·종류 및 설치기준)","c":"해양환경관리법","t":"chg","x":"외부배출관 없이 분뇨를 수용시설로 배출할 수 있어 설치를 면제받는 것은 시추선과 플랫폼, 길이 24미터 미만의 선박, 수상레저기구입니다. 최대승선인원 16명 미만이라는 기준은 분뇨 저장·처리 설비 자체를 갖추지 않아도 되는 경우에 적용되는 것이라, 외부배출관 면제 대상 목록과는 구분해야 합니다."},{"i":681,"q":"다음 중 요트에서 사용하는 연료유의 황 함유량 기준으로 가장 옳은 것은?","o":["배출 규제 해역 0.1% 이하, 그 외 해역 0.5% 이하","모든 해역에서 1.0% 이하","배출 규제 해역 0.2% 이하, 그 외 해역은 0.8% 이하","모든 해역에서 0.05% 이하"],"a":0,"e":"요트 연료유의 황 함유량은 배출 규제 해역에서 0.1% 이하, 그 외 해역의 경우에 경유는 0.5% 이하이나, 법 제3조제1항제1호 및 제2호에 따른 영해 및 배타적 경제수역 안에서만 항해하는 선박의 경우에는 0.05% 이하이고, 중유는 0.5% 이하로 제한된다.","c":"해양환경관리법","t":"new","x":"연료유의 황 함유량 기준은 배출규제해역에서 0.1퍼센트 이하, 그 밖의 해역에서 0.5퍼센트 이하입니다. 황이 많이 든 연료를 태우면 황산화물이 배출되어 대기오염과 산성비를 일으키기 때문에 국제적으로 강화된 기준입니다. 0.1과 0.5라는 두 숫자를 해역과 짝지어 외우면 관련 문제를 모두 처리할 수 있습니다."},{"i":682,"q":"평소 요트 등 수상레저기구를 운항하며 해양환경에 대한 관심이 많아졌다. 해양환경 보전을 위한 실천 사항으로 옳지 않은 것은?","o":["해양경찰에서 운영하는 명예해양환경감시원에 가입한다.","수상레저기구에서 발생하는 쓰레기를 적법하게 관리 및 처리 한다.","요트 관리 중에 실수로 기름이 해상에 유출될 경우 신고하지 않아도 된다.","선박 내 오염방지 설비를 주기적으로 점검한다."],"a":2,"e":"본인의 선박에서 오염물질이 유출되더라도 해양오염신고는 반드시 해야 한다.","c":"해양환경관리법","x":"기름이 해상에 유출되면 양이 적더라도 반드시 신고해야 합니다. 초기 신고가 늦어질수록 확산 범위가 넓어져 방제 비용과 피해가 커지기 때문이며, 신고 의무는 배출자 본인에게도 그대로 적용됩니다. 명예해양환경감시원 참여, 쓰레기의 적법한 처리, 오염방지 설비의 주기적 점검은 모두 바람직한 실천 사항입니다."},{"i":683,"q":"요트의 항해 중에 발생한 폐유를 선박에 비치한 폐유저장용기에 저장하였다. 폐유의 처리 방법이 옳은 것은?","o":["항해가 끝난 후 입항하여 부두에 내려놓는다.","폐유의 양이 적으므로 모았다가 부두에 한 번에 내려놓는다.","항해가 끝난 후 입항하여 해양환경공단에 연락하여 수거처리 한다.","항해가 끝난 후 입항하여 인근 해양경찰서에 처리를 요청한다."],"a":2,"e":"선박에서 발생한 오염물질은 오염물질 저장시설 운영자에게 처리하여야 한다.","c":"해양환경관리법","x":"폐유는 기름 성분이 있는 오염물질이므로 반드시 폐유저장용기에 모아 두었다가, 입항 후 해양환경공단 등 오염물질 저장시설 운영자에게 연락해 수거·처리해야 합니다. 양이 적다고 모아 두었다가 부두에 내려놓거나 임의로 처리하면 위반입니다. 생활쓰레기와 폐유 모두 '전문 처리 시설로 넘긴다'는 원칙이 같습니다."},{"i":684,"q":"선박에서 발생하는 오염물질로 오염물질저장시설의 설치·운영자, 유창청소업자, 폐기물처리업자에게 수거·처리하게 하여야 하는 물질로 옳지 않은 것은?","o":["기름, 유해액체물질, 포장유해물질의 화물잔류물","포장유해물질과 그 포장용기","합성로프, 합성어망, 플라스틱으로 만들어진 쓰레기봉투를 포함한 모든 플라스틱제품","기름여과장치를 통과한 선박 기관실 선저폐수"],"a":3,"e":"기름여과장치를 통과한 기름성분 15ppm 이하의 선저폐수는 해상에 배출 가능하다.","c":"해양환경관리법","x":"기름여과장치를 통과해 유분 농도가 15ppm 이하가 된 선저폐수는 항해 중 해상에 배출할 수 있으므로, 반드시 수거·처리업자에게 넘겨야 하는 물질이 아닙니다. 반면 기름과 유해액체물질·포장유해물질의 화물잔류물, 포장유해물질과 그 용기, 합성로프와 어망을 비롯한 모든 플라스틱 제품은 육상으로 인계해 처리해야 합니다."},{"i":685,"q":"영해기선으로부터 3해리 이상의 해역에 버릴 수 있는 음식찌꺼기의 크기는?","o":["25㎜ 이하","25㎜ 이상","50㎜ 이하","50㎜ 이상"],"a":0,"e":"선박오염방지규칙 제8조(선박에서 발생하는 폐기물의 배출방법 등) 제2호","c":"해양환경관리법","x":"음식찌꺼기는 25밀리미터 이하로 분쇄하거나 갈았을 때 영해기선으로부터 3해리 이상의 해역에 배출할 수 있습니다. 잘게 부수면 바다에서 빨리 분해되고 흩어지기 때문입니다. 분쇄하지 않은 상태라면 12해리 이상 떨어져야 하므로, 25밀리미터·3해리와 미분쇄·12해리를 한 쌍씩 묶어 기억하면 됩니다."},{"i":686,"q":"다음 중 총톤수 12톤인 요트를 폐선 처리하고자 할 때 취할 조치로 가장 옳은 것은?","o":["시장․군수․구청장에게 말소등록 신청서 제출 후 항내에서 야간에 침수시켜 처리한다.","시장․군수․구청장에게 말소등록 신청서 제출 후 건조한 조선소로 이동하여 해체한다.","시장․군수․구청장에게 말소등록 신청서 제출 후 지정된 절차에 따라 육상에서 해체한다.","시장․군수․구청장에게 말소등록 신청서를 제출 후 항해 중 바다에 침몰시켜 처리한다."],"a":2,"e":"요트는 「수상레저기구의 등록 및 검사에 관한 법률」제10조(말소등록)에 따라 등록증 및 등록번호판을 반납 하고 시장․군수․구청장에게 말소등록을 신청하여야 한다. 통상 말소 등록이 완료된 후 요트 또는 소형선박 등을 전문으로 해체하는 업체 또는 조선소에서 해체한다.","c":"해양환경관리법","t":"new","x":"요트를 폐선하려면 먼저 등록증과 등록번호판을 반납하고 시장·군수·구청장에게 말소등록을 신청한 뒤, 지정된 절차에 따라 육상에서 해체해야 합니다. 해체 과정에서 기름과 폐기물이 나오기 때문에 관리되는 육상 시설에서 처리해야 하며, 바다에 침몰시키거나 항내에 가라앉히는 것은 중대한 위반입니다."},{"i":687,"q":"해양에서의 대기오염방지 규제에 대한 설명으로 옳지 않은 것은?","o":["대기오염물질의 배출을 특별히 규제하는 조치가 필요한 해역을 “배출규제해역”이라 한다.","대기오염방지를 위해 선박 연료유의 황함유량 기준을 배출규제해역은 0.1퍼센트(무게), 그 밖의 해역은 0.5퍼센트(무게)로 정하였다.","선박의 소유자는 대기오염물질의 배출을 방지하거나 감축하기 위한 “대기오염방지설비”를 설치해야 한다.","선박의 항해 시간이 1시간 미만의 경우 연료유 황 함유량 기준을 지키지 않아도 된다."],"a":3,"e":"해양환경관리법 제41조","c":"해양환경관리법","x":"연료유의 황 함유량 기준은 항해 시간과 관계없이 지켜야 합니다. 짧게 운항한다고 해서 배출되는 황산화물이 사라지는 것이 아니기 때문에 시간에 따른 예외를 두지 않습니다. 배출규제해역 0.1퍼센트, 그 밖의 해역 0.5퍼센트라는 기준과 대기오염방지설비 설치 의무는 모두 옳은 설명입니다."},{"i":688,"q":"선박에서 오염물질이 배출된 경우 선박의 선장, 원인 행위를 한 사람을 “방제의무자”라고 하는데, 방제의무자의 조치사항으로 옳지 않은 것은?","o":["선박의 안전을 위해 오염물질의 추가 배출","배출된 오염물질의 확산방지 및 제거","배출된 오염물질의 수거 및 처리","오염물질의 배출방지"],"a":0,"e":"방제의무자로써 오염물질을 추가로 해양에 배출하는 행위는 적절한 조치사항으로 볼 수 없다.","c":"해양환경관리법","x":"방제의무자는 배출된 오염물질의 확산을 막고, 제거하며, 수거·처리하고, 추가 배출을 방지해야 합니다. 즉 모든 조치가 오염을 줄이는 방향이어야 합니다. 선박의 안전을 이유로 오염물질을 더 배출하는 것은 방제 의무의 취지와 정반대이므로 적절한 조치가 될 수 없습니다."},{"i":689,"q":"대변소가 설치된 승선정원 16명 이상인 수상레저기구에서의 분뇨처리 방법이 적절하지 않은 것은?","o":["분뇨저장탱크를 설치하여 정박 시 육상으로 반출한다.","분뇨를 수용시설로 배출이 가능하여 외부배출관은 설치하지 않았다.","선박이 4노트 이상 항해 중 분뇨마쇄소독장치를 통해 영해기선 3해리 이상의 해역에서 배출한다.","분뇨저장탱크에 보관하여 정박 후 야간에 서서히 항내 배출한다."],"a":3,"e":"분뇨저장탱크에 보관된 분뇨는 항만구역에 배출할 수 없다.","c":"해양환경관리법","t":"chg","x":"분뇨저장탱크에 모아 둔 분뇨는 항만구역에 배출할 수 없습니다. 야간에 천천히 흘려보내더라도 마찬가지로 위반이며, 정박 후 육상 수용시설로 반출해야 합니다. 항해 중 4노트 이상으로 이동하면서 분뇨마쇄소독장치를 거쳐 영해기선 3해리 이상 해역에 배출하는 것은 허용되는 방법이므로 조건을 함께 기억해 두세요."},{"i":690,"q":"다음 중 요트 이용자가 해양환경 보전을 위해 참여할 수 있는 활동으로 가장 옳은 것은?","o":["해양환경감시원","소유 요트 또는 타 선박의 기름 유출시 자체 방제 활동","명예해양환경감시원","요트 항해 중 해상 부유물 수거 활동"],"a":2,"e":"해양수산부장관 또는 해양경찰청장은 해양환경관리를 위한 활동을 성실하게 수행하고 있는 사람을 명예해 양환경감시원으로 위촉할 수 있다.","c":"해양환경관리법","t":"new","x":"명예해양환경감시원은 해양수산부장관이나 해양경찰청장이 해양환경 관리 활동을 성실히 수행하는 사람을 위촉하는 제도로, 일반 요트 이용자도 참여할 수 있습니다. 해양환경감시원은 공무원 등으로 구성되는 직책이라 일반인이 참여하는 활동이 아니고, 기름 유출 시 자체 방제는 신고와 전문 방제가 우선이라 권장되지 않습니다."},{"i":691,"q":"다음 중 「해양환경관리법」을 위반하여 선박 또는 해양시설로부터 기름․유해액체물질․포장유해물질을 배출한 자에게 부과되는 벌칙으로 가장 옳은 것은?","o":["7년 이하의 징역 또는 7천만원 이하의 벌금","5년 이하의 징역 또는 5천만원 이하의 벌금","3년 이하의 징역 또는 3천만원 이하의 벌금","1년 이하의 징역 또는 1천만원 이하의 벌금"],"a":1,"e":"해양환경관리법 제126조(벌칙)","c":"해양환경관리법","t":"chg","x":"기름·유해액체물질·포장유해물질을 배출한 자에게는 5년 이하의 징역 또는 5천만원 이하의 벌금이 부과됩니다. 해양오염 행위 가운데 가장 무거운 축에 속하는 벌칙입니다. 개정본에서 보기의 배열이 7년·5년·3년·1년 순으로 바뀌었으므로, 예전 문제은행으로 답의 위치만 외웠다면 틀리기 쉬운 문항입니다."},{"i":692,"q":"선박, 항공기 등이 중대하고 급박한 위험에 처해, 즉시 구조를 요청하는 경우에 행하는 통신은?","o":["조난통신","긴급통신","안전통신","비상통신"],"a":0,"e":"- 조난통신: 선박, 항공기 등이 중대하고 급박한 위험에 처해, 즉시 구조를 요청하는 경우에 행하는 통신 - 긴급통신: 선박, 항공기 등이 중대하고 급박한 위험에 처할 경우, 기타 긴급한 사태가 발생했을 경우에 행하는 통신 - 안전통신: 선박, 항공기 등의 항행에 대한 중대한 위험을 예방하기 위하여 행하는 통신 - 비상통신: 지진․태풍․홍수․해일․화재 등의 경우에 인명의 구조, 재해의 구호, 질서유지를 위한 무선통신","c":"통신","t":"new","x":"조난통신은 선박이나 항공기가 중대하고 급박한 위험에 처해 즉시 구조를 요청할 때 하는 통신으로, 모든 통신 가운데 최우선 순위를 가집니다. 긴급통신은 위험에 처할 우려가 있거나 긴급한 사태가 생겼을 때, 안전통신은 항행 안전에 관한 중대한 위험을 예방하기 위해, 비상통신은 지진·태풍 등 재해 시의 구조와 질서 유지를 위해 사용합니다."},{"i":693,"q":"조난호출에 응답한 선박이 송신하여야 하는 사항과 관계 없는 것은?","o":["구조에 필요한 사항","자국의 위치","조난선박을 향하여 진행하는 속도","자국의 선박 책임자 성명"],"a":3,"e":"무선국 운용 등에 관한 규정 제45조(조난통보에 대한 응답)","c":"통신","t":"chg","x":"조난 호출에 응답하는 선박은 구조에 필요한 사항, 자기 배의 위치, 조난선박을 향해 가는 속도 등 구조 활동에 직접 필요한 정보를 송신합니다. 선박 책임자의 성명은 구조 시점에 필요한 정보가 아니어서 송신 사항에 들어가지 않습니다. 개정본에서 정답이 바뀐 문항이므로 예전 문제은행으로 공부했다면 특히 주의해야 합니다."},{"i":694,"q":"선박국 및 해안국 등 집단호출을 식별하기 위하여 사용되는 부호로서, 9개 숫자로 구성된 것을 무엇 이라 하는가?","o":["디지털 선택 호출장치(DSC)","해상이동업무 식별부호(MMSI)","협대역 직접인쇄 전신(NBDP)","호출부호(Call sign)"],"a":1,"e":"선박국, 선박 지구국, 해안국, 해안 지구국을 식별하기 위하여 일부 무선망을 통하여 사용되는 9개의 숫자로 된 부호. 국가 또는 지역을 나타내는 해상 이동 식별 숫자(MID: Maritime Identification Digit) 3개와 나머지 선박국, 해안국 등을 표시하는 숫자로 구성된다.","c":"통신","t":"new","x":"MMSI는 해상이동업무 식별부호로, 선박국과 해안국 등을 식별하기 위해 사용하는 9자리 숫자입니다. 앞의 세 자리는 국가나 지역을 나타내는 해상 식별 숫자(MID)이고 나머지가 개별 국을 구분합니다. DSC 조난경보를 보낼 때 이 번호가 함께 전송되어 어느 배가 조난했는지 즉시 알 수 있습니다."},{"i":695,"q":"조난선박국이 그 선체를 포기하고자 하는 경우, 송신설비는 어떤 상태로 두는 것이 바람직한가?","o":["전파를 계속 발사하는 상태로 둔다.","파기절차에 따라 즉시 파기한다.","모든 전원을 OFF하여 감전 사고를 예방한다.","송신장치와 송신안테나의 연결을 끊는다."],"a":0,"e":"무선국의 운용 등에 관한 규정 제50조(전파의 계속발사)","c":"통신","x":"조난선박국이 선체를 포기할 때는 송신설비를 전파가 계속 발사되는 상태로 두는 것이 바람직합니다. 배를 떠난 뒤에도 그 전파를 방향탐지의 표적으로 삼아 구조 세력이 조난 위치를 찾아올 수 있기 때문입니다. 그래서 전원을 끄거나 안테나를 분리하거나 설비를 파기하는 것은 오히려 구조를 어렵게 만드는 행동입니다."},{"i":696,"q":"국제해사기구(IMO)에서 인정한 인공위성의 통신권 범위와 관계가 있는 해역은?","o":["A1 해역","A2 해역","A3 해역","A4 해역"],"a":2,"e":"A3해역: 인정된 이동식 위성서비스 통신권 범위 안의 해역으로서 A1해역과 A2해역을 제외한 해역. 여기서, 인정된 이동식 위성서비스란 국제해사기구(IMO)가 인정한 위성서비스(예, INMARSAT, Iridium 등)","c":"통신","t":"new","x":"GMDSS 해역 구분에서 A3해역은 국제해사기구가 인정한 이동식 위성서비스의 통신권 안에 드는 해역 가운데 A1과 A2를 제외한 곳입니다. A1은 VHF 해안국, A2는 MF 해안국의 통신권 안이고, A4는 위성도 닿지 않는 극지방 해역입니다. 통신 수단이 무엇인가로 해역이 나뉜다고 이해하면 순서가 정리됩니다."},{"i":697,"q":"해안국에서 항행경보 또는 중요한 기상경보를 초단파(VHF)무선전화기로 통보할 때 사용하는 무선 통신 용어는?","o":["MAYDAY","PAN PAN","SECURITE","SEELONCE MAYDAY"],"a":2,"e":"MAYDAY(조난호출), PAN PAN(긴급호출), SECURITE(안전호출 등), SEELONC MAYDAY(조난통신을 방해 하거나 방해할 우려가 있는 모든 통신의 정지를 요구할 때),","c":"통신","t":"new","x":"SECURITE(시큐리테)는 항행경보나 중요한 기상경보처럼 안전에 관한 정보를 알릴 때 사용하는 안전호출 용어입니다. MAYDAY는 조난, PAN PAN은 긴급 상황에 쓰고, SEELONCE MAYDAY는 조난통신을 방해할 수 있는 모든 통신의 중지를 요구할 때 사용합니다. 통신의 우선순위가 조난-긴급-안전 순이라는 점과 함께 기억하세요."},{"i":698,"q":"조난통신에 관한 설명으로 옳지 않은 것은?","o":["항무용 VHF 무선설비의 국제 조난 청취 주파수는 채널 16번(156.8Mhz)이다.","국제 조난 처리 절차에서 가장 먼저 해야 할 일은 조난경보(Distress Alert)를 발신하는 것이다.","디지털 선택호출(Digital Selective Calling) 기능을 사용하여 조난경보가 발신된다.","항무용 VHF 무선설비의 경우 조난경보(Distress Alert)는 채널 16번(156.8Mhz)을 사용하여 통달거리에 있는 무선국을 자동으로 호출하게 된다."],"a":3,"e":"","c":"통신","x":"DSC 조난경보는 음성 채널이 아니라 디지털 신호 전용 채널을 통해 자동으로 발신됩니다. 채널 16은 그 뒤에 이어지는 음성 조난통신과 상시 청취에 쓰이는 채널입니다. 따라서 조난경보를 채널 16으로 자동 호출한다는 서술이 틀렸습니다. 조난 시에는 먼저 DSC로 조난경보를 보내고, 이어서 채널 16에서 MAYDAY를 음성으로 송신하는 순서가 표준 절차입니다."},{"i":699,"q":"항해하는 선박에 기상 및 항행경보 등 선박의 안전항해와 관련된 해사안전정보를 제공하는 설비를 무엇이라 하는가?","o":["네비텍스수신기(NAVTEX)","디지털선택호출장 };

const day = (d) => S.days[d] || {n:0, ok:0, xp:0};
function levelOf(xp){
  let i = 0; while(i+1 < LEVELS.length && xp >= LEVELS[i+1].x) i++;
  const cur = LEVELS[i], next = LEVELS[i+1];
  return {i, cur, next, pct: next ? (xp - cur.x)/(next.x - cur.x) : 1};
}
function streak(){
  let n = 0; const d = new Date();
  if(!day(today()).n) d.setDate(d.getDate()-1);
  for(;;){ const k = d.toISOString().slice(0,10); if(day(k).n){ n++; d.setDate(d.getDate()-1); } else break; }
  return n;
}
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}
function award(id){
  if(S.badges[id]) return;
  S.badges[id] = today(); save();
  const b = BADGES.find(x => x.id === id);
  setTimeout(() => toast(b.e + " 뱃지 획득 · " + b.n), 500);
}
function addXP(n){
  const before = levelOf(S.xp).i;
  S.xp += n;
  const d = day(today()); d.xp = (d.xp||0) + n; S.days[today()] = d;
  if(levelOf(S.xp).i > before) setTimeout(() => toast(levelOf(S.xp).cur.e + " 레벨 업 · " + levelOf(S.xp).cur.n), 300);
  save();
}
function checkBadges(){
  const done = Q.filter(q => solved(q.i)).length;
  if(done >= 1) award("first");
  if(done >= 100) award("q100");
  if(done >= 300) award("q300");
  if(done >= 700) award("q700");
  const st = streak();
  if(st >= 3) award("streak3");
  if(st >= 7) award("streak7");
}
function record(id, ok){
  const s = S.stats[id] || (S.stats[id] = {c:0,w:0,l:null});
  ok ? s.c++ : s.w++; s.l = ok ? "o" : "x";
  const d = day(today()); d.n++; if(ok) d.ok++; S.days[today()] = d;
  save();
}

const WKEY = "yacht-why-all";
let WHY = {}, whyTimer = null;
async function loadWhy(){
  try{ const v = await Store.get(WKEY); if(v) WHY = JSON.parse(v); }catch(e){}
  try{

    if(r.ok){ const j = await r.json(); WHY = Object.assign({}, j, WHY); }

}
function saveWhy(){ clearTimeout(whyTimer); whyTimer = setTimeout(() => Store.set(WKEY, JSON.stringify(WHY)), 800); }
const whyCount = () => Q.filter(q => q.x || WHY[q.i]).length;

async function getWhy(q){
  if(q.x) return q.x;
  if(WHY[q.i]) return WHY[q.i];
  const prompt = "당신은 요트조종면허 필기시험 강사입니다. 아래 문제에서 정답이 왜 정답인지만 자세히 설명하세요. 오답 보기에 대한 설명은 하지 마세요.\n\n" +
    "[문제] " + q.q + "\n1. " + q.o[0] + "\n2. " + q.o[1] + "\n3. " + q.o[2] + "\n4. " + q.o[3] +
    "\n[정답] " + (q.a+1) + "번 " + q.o[q.a] + "\n[공식 해설] " + (q.e || "없음") +
    "\n\n다음을 지켜 한국어로 쓰세요.\n- 정답이 되는 이유를 개념의 정의부터 풀어서 설명하고, 근거가 되는 법조문·수치·용어가 있으면 정확히 밝힙니다.\n" +
    "- 시험에서 이 개념이 어떤 식으로 변형되어 출제되는지 한 줄 덧붙입니다.\n- 5~7문장, 400자 내외. 제목이나 머리말 없이 본문만 씁니다.";
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({model:"claude-sonnet-4-6", max_tokens:1000, messages:[{role:"user", content:prompt}]})
  });
  if(!res.ok) throw new Error("응답 오류 " + res.status);
  const data = await res.json();
  const text = (data.content || []).filter(c => c.type === "text").map(c => c.text).join("\n").trim();
  if(!text) throw new Error("빈 응답");
  WHY[q.i] = text; saveWhy();
  return text;
}
function whyBlock(q, auto){
  const box = el("<div></div>");

    box.innerHTML = '<div class="aihead"><span class="spin"></span><span>정답 해설을 만드는 중…</span></div>';

}

function pool(){
  let ids = Q.filter(q => opts.scope === "전체" || q.c === opts.scope).map(q => q.i);
  if(opts.filter === "unseen") ids = ids.filter(i => !solved(i));
  if(opts.filter === "wrong")  ids = ids.filter(i => S.stats[i] && S.stats[i].l === "x");
  if(opts.filter === "mark")   ids = ids.filter(i => S.marks[i]);
  if(opts.filter === "rev")    ids = ids.filter(i => byId[i].t);
  return opts.order === "rand" ? shuffle(ids) : ids;
}
function stars(ids){
  const done = ids.filter(solved);
  if(!done.length) return "☆☆☆";
  let c = 0, w = 0; done.forEach(i => { c += S.stats[i].c; w += S.stats[i].w; });
  const rate = c/(c+w), cover = done.length/ids.length;
  const n = (cover >= .95 && rate >= .9) ? 3 : (cover >= .6 && rate >= .75) ? 2 : (cover >= .3) ? 1 : 0;
  return "★".repeat(n) + "☆".repeat(3-n);
}

      catch(e){
        pre.fail++;
        if(pre.fail >= 3){ st.textContent = "해설을 받지 못했습니다. 인터넷 연결을 확인한 뒤 다시 눌러 주세요."; break; }
      }
      st.textContent = "받는 중 " + (i+1) + " / " + todo.length + " · 창을 열어 두세요";
      await new Promise(r => setTimeout(r, 150));
    }
    pre.running = false;
    Store.set(WKEY, JSON.stringify(WHY));
    go.textContent = "해설 미리 받아두기";
    if(!pre.fail) st.textContent = "저장 완료 · 총 " + whyCount() + "문항";
    if(tab === "log") viewLog();
  };
  go.onclick = runAll;

  card.querySelector("#dl").onclick = () => {
    const blob = new Blob([JSON.stringify(WHY)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "explanations.json";
    document.body.appendChild(a); a.click(); a.remove();
    toast("explanations.json 저장됨");
  };
  const fi = card.querySelector("#fi");
  card.querySelector("#up").onclick = () => fi.click();
  fi.onchange = () => {
    const f = fi.files && fi.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const j = JSON.parse(r.result);
        WHY = Object.assign(WHY, j); Store.set(WKEY, JSON.stringify(WHY));
        toast("해설 " + whyCount() + "문항 불러옴"); viewLog();
      }catch(e){ toast("해설 파일 형식이 아닙니다"); }
    };
    r.readAsText(f);
  };
  return card;
}

function viewLog(){
  main.innerHTML = "";
  const keys = []; const now = new Date();
  for(let i=6;i>=0;i--){ const x = new Date(now); x.setDate(now.getDate()-i); keys.push(x); }
  const vals = keys.map(k => day(k.toISOString().slice(0,10)).n);
  const max = Math.max(10, Math.max.apply(null, vals));
  const bars = keys.map((k, i) => {
    const v = vals[i];
    return '<div class="d"><i class="' + (v?"":"zero") + '" style="height:' + Math.max(4, v/max*72) + 'px"></i><span>' +
      ["일","월","화","수","목","금","토"][k.getDay()] + '</span></div>';
  }).join("");
  const t = day(today());
  main.appendChild(el('<div class="card"><h2>이번 주 학습</h2>' +
    '<p class="sub">오늘 ' + t.n + '문항 · 정답 ' + t.ok + ' · 🔥 ' + streak() + '일 연속</p>' +
    '<div class="days">' + bars + '</div></div>'));

  const rows = Object.keys(S.days).sort().reverse().slice(0,14).map(k => {
    const v = S.days[k], rate = v.n ? Math.round(v.ok/v.n*100) : 0;
    return '<div class="rev"><div class="h"><span>' + k + '</span><span>' + (v.xp||0) + ' XP</span></div>' +
      '<div class="q">' + v.n + '문항 · 정답률 ' + rate + '%</div></div>';
  }).join("");
  main.appendChild(el('<div class="card"><h2>날짜별 기록</h2>' +
    (rows ? '<div style="margin-top:6px">' + rows + '</div>' : '<p class="sub" style="margin-top:8px">아직 기록이 없습니다</p>') + '</div>'));

  const bd = el('<div class="card"><h2>뱃지</h2><p class="sub">' + Object.keys(S.badges).length + ' / ' + BADGES.length + ' 획득</p><div class="badges"></div></div>');
  const g = bd.querySelector(".badges");
  BADGES.forEach(b => g.appendChild(el('<div class="badge ' + (S.badges[b.id]?"on":"") + '"><div class="e">' + b.e + '</div><b>' + b.n + '</b><span>' + (S.badges[b.id] || b.d) + '</span></div>')));
  main.appendChild(bd);

  const goalCard = el('<div class="card tight"><p class="sub">하루 목표 문항</p><div class="chips"></div></div>');
  [10,20,30,50].forEach(n => {
    const c = el('<button class="chip" aria-pressed="' + ((S.goal||20) === n) + '">' + n + '문항</button>');
    c.onclick = () => { S.goal = n; save(); viewLog(); };
    goalCard.querySelector(".chips").appendChild(c);
  });
  main.appendChild(goalCard);

  main.appendChild(whyCard());

  const io = el('<div class="card"><h2>기록 백업</h2><p class="sub">다른 기기나 설치형 앱으로 옮길 때 사용합니다</p>' +
    '<div class="row" style="margin:12px 0"><button class="btn ghost sm" id="ex">내보내기</button><button class="btn ghost sm" id="im">가져오기</button></div>' +
    '<textarea id="ta" rows="3" placeholder="내보내기를 누르면 여기에 기록이 나옵니다. 옮길 때는 붙여넣고 가져오기를 누르세요."></textarea></div>');
  io.querySelector("#ex").onclick = () => { io.querySelector("#ta").value = JSON.stringify(S); toast("기록을 복사해 두세요"); };
  io.querySelector("#im").onclick = () => {
    try{ S = Object.assign(S, JSON.parse(io.querySelector("#ta").value)); save(); toast("기록을 가져왔습니다"); render(); }
    catch(e){ toast("형식이 올바르지 않습니다"); }
  };
  main.appendChild(io);

  const reset = el('<button class="btn ghost sm" style="margin:4px 0 24px">모든 기록 지우기</button>');
  reset.onclick = () => { if(!confirm("진도·오답·뱃지·XP가 모두 지워집니다. 계속할까요?")) return;
    S = {stats:{},marks:{},exams:[],cursor:{},days:{},xp:0,badges:{},goal:20,bestCombo:0}; save(); go("home"); };
  main.appendChild(reset);
}

function start(ids, mode, o){
  o = o || {};
  if(!ids.length) return;
  let at = o.at || 0;
  if(o.resume && S.cursor[o.resume] && !o.at) at = Math.min(S.cursor[o.resume], ids.length-1);
  sess = { ids:ids, mode:mode, at:at, ans:{}, done:false, key:o.resume||null, combo:0,
           left: (mode === "exam" && examTimed) ? EXAM_MIN*60 : null };
  quitBtn.hidden = false;
  if(sess.left) startClock();
  render();
}
function startClock(){ stopClock(); clockId = setInterval(() => {
  if(!sess || sess.done) return stopClock();
  sess.left--;
  const c = document.getElementById("clock");
  if(c){ c.textContent = fmtTime(Math.max(0, sess.left)); c.classList.toggle("warn", sess.left <= 300); }
  if(sess.left <= 0){ stopClock(); grade(true); }
}, 1000); }
function stopClock(){ if(clockId) clearInterval(clockId); clockId = null; }
function revTag(q){
  if(q.t === "new") return '<span class="tag new">’26 신규</span>';
  if(q.t === "chg") return '<span class="tag chg">’26 변경</span>';
  return "";
}
function viewSession(){
  const q = byId[sess.ids[sess.at]], picked = sess.ans[q.i];
  const reveal = sess.mode === "study" && picked !== undefined;
  main.innerHTML = "";
  main.appendChild(el('<div class="sbar"><div class="line"><span>' + (sess.at+1) + ' / ' + sess.ids.length + '</span>' +
    (sess.combo >= 2 ? '<span class="combo">🔥 ' + sess.combo + '연속</span>' : "") +
    '<span style="flex:1"></span>' +
    (sess.left !== null ? '<span class="clock" id="clock">' + fmtTime(Math.max(0, sess.left)) + '</span>' : "") +
    '<button id="bm" class="pill" style="padding:4px 11px">' + (S.marks[q.i] ? "★" : "☆") + '</button></div>' +
    '<div class="prog"><i style="width:' + ((sess.at+1)/sess.ids.length*100) + '%"></i></div></div>'));
  main.querySelector("#bm").onclick = () => { S.marks[q.i] ? delete S.marks[q.i] : S.marks[q.i] = 1; save(); viewSession(); };

  const card = el('<div class="card"><div class="qmeta"><span class="qno">' + q.i + '번</span>' +
    '<span class="tag">' + chapOf(q).e + ' ' + chapOf(q).n + '</span>' + revTag(q) + '</div>' +
    '<p class="qtext">' + esc(q.q) + '</p><div id="opts"></div><div id="fb"></div></div>');
  const ob = card.querySelector("#opts");
  q.o.forEach((text, i) => {
    let s = "";
    if(reveal) s = (i === q.a) ? "ok" : (i === picked ? "no" : "");
    else if(picked === i) s = "sel";
    const b = el('<button class="opt ' + (reveal && i === q.a ? "pop" : "") + '" data-s="' + s + '">' +
      '<span class="mk">' + (i+1) + '</span><span class="tx">' + esc(text) + '</span></button>');
    b.onclick = () => choose(i);
    ob.appendChild(b);
  });
  if(reveal){
    const ok = picked === q.a, fb = card.querySelector("#fb");
    fb.appendChild(el('<p class="verdict ' + (ok?"ok":"no") + '">' + (ok ? "정답입니다" : "아쉬워요 · 정답은 " + (q.a+1) + "번") +
      '<span class="xp">+' + (ok ? sess.lastXP : 3) + ' XP</span></p>'));
    if(q.e) fb.appendChild(el('<div class="expl">' + esc(q.e) + '</div>'));
    fb.appendChild(whyBlock(q, !ok));
  }
  main.appendChild(card);

  const nav = el('<div class="row" style="margin-bottom:22px">' +
    '<button class="btn ghost" id="prev" ' + (sess.at===0?"disabled":"") + ' style="flex:0 0 28%">이전</button>' +
    '<button class="btn" id="next">' + (sess.at === sess.ids.length-1 ? (sess.mode === "exam" ? "답안 제출" : "학습 끝내기") : "다음") + '</button></div>');
  main.appendChild(nav);
  nav.querySelector("#prev").onclick = () => { sess.at--; render(); };
  nav.querySelector("#next").onclick = () => {
    if(sess.at === sess.ids.length-1) return sess.mode === "exam" ? grade() : finishStudy();
    sess.at++; if(sess.key){ S.cursor[sess.key] = sess.at; save(); } render();
  };

  if(sess.mode === "exam"){
    const box = el('<div class="card"><h2>답안지</h2><p class="sub">' + Object.keys(sess.ans).length + ' / ' + sess.ids.length + '문항 답함</p><div class="omr"></div>' +
      '<button class="btn soft sm" id="sub" style="margin-top:14px">답안 제출하고 채점</button></div>');
    const g = box.querySelector(".omr");
    sess.ids.forEach((id, i) => {
      const b = el('<button class="' + (sess.ans[id] !== undefined ? "done" : "") + ' ' + (i === sess.at ? "cur" : "") + '">' + (i+1) + '</button>');
      b.onclick = () => { sess.at = i; render(); };
      g.appendChild(b);
    });
    box.querySelector("#sub").onclick = () => grade();
    main.appendChild(box);
  }
}
function choose(i){
  const q = byId[sess.ids[sess.at]];
  if(sess.mode !== "study"){ sess.ans[q.i] = i; viewSession(); return; }
  if(sess.ans[q.i] !== undefined) return;
  const ok = i === q.a;
  sess.ans[q.i] = i;
  record(q.i, ok);
  if(ok){
    sess.combo++;
    if(sess.combo > (S.bestCombo||0)) S.bestCombo = sess.combo;
    if(sess.combo >= 10) award("combo10");
    sess.lastXP = 10 + (sess.combo % 5 === 0 ? 5 : 0);
    addXP(sess.lastXP);
  }else{ sess.combo = 0; sess.lastXP = 3; addXP(3); }
  if(day(today()).n === (S.goal||20)){ addXP(50); toast("🎯 오늘 목표 달성 · +50 XP"); }
  checkBadges();
  viewSession();
}
function finishStudy(){
  const ids = sess.ids.filter(id => sess.ans[id] !== undefined);
  sess.summary = {n: ids.length, ok: ids.filter(id => sess.ans[id] === byId[id].a).length};
  sess.done = true;
  if(sess.key){ S.cursor[sess.key] = 0; save(); }
  render();
}
function grade(auto){
  stopClock();
  const blank = sess.ids.filter(id => sess.ans[id] === undefined).length;
  if(!auto && blank && !confirm("아직 " + blank + "문항이 비어 있습니다. 제출할까요?")) return;
  sess.ids.forEach(id => { if(sess.ans[id] !== undefined) record(id, sess.ans[id] === byId[id].a); });
  const ok = sess.ids.filter(id => sess.ans[id] === byId[id].a).length;
  const score = Math.round(ok / sess.ids.length * 100);
  S.exams.push({date: new Date().toLocaleDateString("ko-KR"), count: sess.ids.length, score: score});
  addXP(ok * 5 + (score >= PASS ? 100 : 0));
  if(score >= PASS) award("pass");
  if(score === 100 && sess.ids.length === EXAM_N) award("perfect");
  checkBadges();
  sess.done = true; sess.summary = {n: sess.ids.length, ok: ok, score: score, auto: auto};
  render();
}
function viewResult(){
  const s = sess.summary;
  main.innerHTML = "";
  if(sess.mode === "exam"){
    const pass = s.score >= PASS;
    const card = el('<div class="card score">' + (s.auto ? '<p class="sub">시간이 끝나 자동 제출되었습니다</p>' : "") +
      '<div style="font-size:40px">' + (pass ? "🎉" : "💪") + '</div>' +
      '<div class="n" id="cnt">0<span style="font-size:22px;font-weight:700">점</span></div>' +
      '<div class="st ' + (pass?"pass":"fail") + '">' + (pass ? "합격" : "불합격") + '</div>' +
      '<p class="sub" style="margin-top:12px">' + s.n + '문항 중 ' + s.ok + '문항 정답 · 합격 ' + PASS + '점</p></div>');
    main.appendChild(card);
    const cnt = card.querySelector("#cnt");
    let v = 0; const iv = setInterval(() => {
      v = Math.min(s.score, v + Math.max(1, Math.round(s.score/22)));
      cnt.innerHTML = v + '<span style="font-size:22px;font-weight:700">점</span>';
      if(v >= s.score) clearInterval(iv);
    }, 30);
  }else{
    main.appendChild(el('<div class="card score"><div style="font-size:40px">' + (s.ok === s.n && s.n ? "🏆" : "⛵") + '</div>' +
      '<div class="n">' + s.ok + '<span style="font-size:22px;font-weight:700"> / ' + s.n + '</span></div>' +
      '<p class="sub" style="margin-top:10px">이번 학습에서 맞힌 문항 · 최고 연속 ' + (S.bestCombo||0) + '회</p></div>'));
  }
  const wrong = sess.ids.filter(id => sess.ans[id] !== undefined && sess.ans[id] !== byId[id].a);
  if(wrong.length){
    const box = el('<div class="card"><h2>틀린 문항 ' + wrong.length + '개</h2><div id="wl" style="margin-top:6px"></div></div>');
    const wl = box.querySelector("#wl");
    wrong.forEach(id => {
      const q = byId[id];
      const r = el('<div class="rev"><div class="h"><span class="qno">' + q.i + '</span><span>' + chapOf(q).n + '</span></div>' +
        '<div class="q">' + esc(q.q) + '</div>' +
        '<div class="a"><s>내 답 ' + (sess.ans[id]+1) + '. ' + esc(q.o[sess.ans[id]]) + '</s><br><b>정답 ' + (q.a+1) + '. ' + esc(q.o[q.a]) + '</b></div>' +
        (q.e ? '<div class="expl" style="margin-top:8px">' + esc(q.e) + '</div>' : "") + '</div>');
      r.appendChild(whyBlock(q, false));
      wl.appendChild(r);
    });
    main.appendChild(box);
  }else main.appendChild(el('<p class="empty">틀린 문항이 없습니다. 완벽해요.</p>'));
  const row = el('<div class="row" style="margin-bottom:26px">' +
    '<button class="btn ghost" id="again" ' + (wrong.length?"":"disabled") + '>틀린 문항 다시</button>' +
    '<button class="btn" id="home">홈으로</button></div>');
  row.querySelector("#again").onclick = () => start(wrong, "study");
  row.querySelector("#home").onclick = () => go("home");
  main.appendChild(row);
}

load().then(render);
if("serviceWorker" in navigator){ window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {})); }
</script>
</body>
</html>
